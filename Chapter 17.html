s, so rate is fast."},{id:3,q:"Which explains increase in rate in presence of catalyst?",options:["(a) Catalyst increases temperature","(b) Catalyst provides alternative pathway which lowers activation energy","(c) Catalyst increases concentration","(d) Catalyst decreases kinetic energy"],correct:1,explain:"Catalyst provides an alternative pathway with lower activation energy hill. More particles can cross it, so rate increases. Catalyst remains unchanged."},{id:4,q:"Which statement is correct?",options:["(a) Collisions with energy equal to or greater than activation energy lead to reaction","(b) All collisions lead to reaction","(c) Collisions with less energy lead to reaction","(d) Orientation does not matter"],correct:0,explain:"Only effective collisions lead to products. Effective means energy ≥ activation energy and proper orientation."},{id:5,q:"When reaction proceeds ahead, how do concentrations change?",options:["(a) Both reactants and products increase","(b) Concentration of reactants decreases and products increases","(c) Both decrease","(d) No change"],correct:1,explain:"As reaction moves ahead, reactants are used up so their concentration decreases, products are formed so their concentration increases and reaches maximum at end."}],Am=[{id:"17.1",q:"What is successful collision?",a:"A collision which leads to formation of products is called successful or effective collision. For successful collision two conditions are needed: (1) Particles must have energy equal to or greater than activation energy. (2) Particles must have proper orientation. Most collisions are not successful, they just bounce back. Only small fraction is effective and causes reaction."},{id:"17.2",q:"How does increase in temperature increase rate of reaction?",a:"Increase in temperature increases rate due to collision theory: (1) Kinetic energy increases, particles move faster and more vigorously. (2) Frequency of collisions increases. (3) Number of particles having energy equal to or greater than activation energy increases. So number of effective collisions increases. For many reactions, rate becomes nearly double for every 10°C rise in temperature."},{id:"17.3",q:"Define activation energy.",a:"Activation energy is the minimum amount of energy required to start a chemical reaction. It is the energy needed to break bonds in reactant molecules and to form high energy unstable state on top of energy hill. Reactants must climb this energy hill before converting into products. If energy of particles is less than activation energy, reaction will not occur."},{id:"17.4",q:"Why does burning of sulphur proceed slower in air than in pure oxygen?",a:"Air contains only 21% oxygen. So number of oxygen particles per unit volume is less, less effective collisions, rate is slow. In pure oxygen, concentration of oxygen is 100%, many more particles per unit volume, many more effective collisions, so sulphur burns rapidly with bright flame. This proves effect of concentration on rate."},{id:"17.5",q:"Why is catalyst preferably taken in powdered form?",a:"Reactions involving solids take place on surface. Powdered form has very large surface area compared to a big piece. Larger surface area means more contact, more active sites available for reactants to adsorb and react. More effective collisions occur, catalytic action becomes better and rate increases. Finely divided catalyst works faster than lumps."},{id:"17.6",q:"Why is rate often very fast at beginning of reaction?",a:"At beginning, concentration of reactants is highest. Number of particles per unit volume is maximum, so possibility of effective collisions is maximum and rate is very fast. As reaction proceeds, reactants are consumed, concentration decreases, less particles per unit volume, fewer effective collisions, so rate slows down and finally stops when one reactant is finished."},{id:"17.7",q:"Magnesium does not react with air at room temperature but reacts very fast at high temperature giving intense white light. Explain?",a:"At room temperature, magnesium particles and oxygen particles have low kinetic energy, less than activation energy. Very few effective collisions occur, so no reaction. At high temperature, kinetic energy increases greatly, many particles now have energy greater than activation energy. Number of successful collisions increases suddenly, Mg + O2 → 2MgO occurs very fast with intense white light and heat. This is oxidation reaction."},{id:"17.8",q:"What happens to reactants after they climb energy hill?",a:"When reactants collide with enough energy, their potential energy increases as they climb the energy hill and they form a high energy unstable state called activated complex. This state is at top of hill. Then it converts into stable products, potential energy falls down. If exothermic, energy is released to surroundings. If endothermic, energy remains absorbed. Products have lower potential energy than activated complex."}],Hm=[{id:"17.1",q:"In what different ways can you increase successful collisions?",a:`Successful collisions can be increased by 5 ways using collision theory:

1. Increase concentration: More particles per unit volume in same space, more collisions, more effective collisions.

2. Increase pressure for gases: For gases, increasing pressure increases concentration, so rate doubles if pressure of reactant doubles.

3. Increase surface area of solids: Finely divide solids, make powder. More area of contact, more effective collisions.

4. Increase temperature: Kinetic energy and velocity increase, frequency of collisions increases, more particles exceed activation energy.

5. Add catalyst: Catalyst provides alternative pathway with lower activation energy hill, so more particles can cross even at low temperature. Catalyst also adsorbs reactants on its surface.

6. Increase frequency of collisions by stirring.

All these increase number of effective collisions and rate becomes faster.`},{id:"17.2",q:"Give example of reaction which proceeds with gain in mass.",a:`When magnesium is burnt in air: 2Mg + O2 → 2MgO. Mass of MgO formed is greater than mass of magnesium taken because oxygen from air is added to magnesium. In open container, apparent mass increases because gas (oxygen) is absorbed from air.

Another example is rusting of iron: iron gains mass when it forms iron oxide because oxygen adds.

But law of conservation of mass is always obeyed. In closed container, total mass remains same. Apparent change in mass is only in open container where gas escapes or enters. If gas is evolved, like CaCO3 + 2HCl → CaCl2 + CO2 + H2O, CO2 escapes and apparent mass decreases.`},{id:"17.3",q:"From where do molecules get energy to attain higher energy state?",a:`Molecules get energy from:

1. Kinetic energy: All matter is made of tiny particles moving constantly due to kinetic energy. As temperature increases, kinetic energy increases.

2. Collisions: When particles collide, kinetic energy is converted into potential energy to climb energy hill.

3. Surroundings: Heat absorbed from surroundings can provide energy, especially in endothermic reactions.

At a particular temperature, most molecules have average energy, but small fraction has more than average. Only that small fraction whose energy exceeds activation energy can climb the energy hill and form high energy activated complex.`},{id:"17.4",q:"How does V2O5 catalyst lower activation energy in 2SO2 + O2 → 2SO3?",a:`In Contact process for sulphuric acid, V2O5 (vanadium pentoxide) is used as catalyst.

V2O5 provides alternative pathway with lower activation energy. It works by adsorption: SO2 and O2 molecules adsorb on surface of V2O5 catalyst. Bonds in SO2 and O2 become weak due to attraction with catalyst surface.

Because bonds are weakened, less energy is required to break them and form activated complex. So activation energy hill becomes lower. More molecules now have enough energy to cross low hill, rate increases. After reaction, SO3 desorbs and catalyst V2O5 remains unchanged and free for next cycle.`},{id:"17.6",q:"Explain catalytic action of enzyme.",a:`Enzymes are biological catalysts. They are basically proteins present in body. They speed up specific reactions in body.

Action: Enzymes have specific shape with active sites. Active site is a pocket where reactant molecule (called substrate) fits. Steps:

1. Enzyme + substrate bind together at active site (lock and key).
2. Once bound, particular bonds in substrate become weak.
3. Activation energy is lowered, reaction takes place easily at body temperature.
4. Product is formed and dissociates from enzyme.
5. Enzyme becomes free and can bind another substrate molecule. Enzyme remains unchanged and small amount is enough.

Active sites are very specific, particular enzyme catalyzes only specific reaction. For example, enzyme based biosensors detect glucose in blood. Enzymes work best at optimum temperature and pH.`},{id:"17.7",q:"If you desire to stop a reaction going on at 60°C, what action will you take?",a:`To stop reaction at 60°C, we need to decrease number of effective collisions:

1. Cool down / lower temperature: Decrease temperature by putting reaction mixture in ice bath or refrigeration. Kinetic energy decreases, fewer particles have activation energy.

2. Remove reactants: Take away one reactant or dilute with water, concentration decreases.

3. Remove catalyst: If catalyst present, remove it or add inhibitor.

4. Increase activation energy: Not easy, but cooling does it.

5. Freeze the mixture or add chemical to consume reactants.

Simplest action is to cool down to low temperature. Rate will become very slow and almost stop.`},{id:"17.9",q:"How does catalyst lower activation energy?",a:`Catalyst lowers activation energy by providing alternative pathway:

Without catalyst, reactants need high energy to climb high energy hill.

With catalyst: Reactants adsorb on catalyst surface (for solid catalyst). Bonds are weakened due to interaction with catalyst. Alternative intermediate is formed which requires less energy. So potential energy diagram shows lower hill with catalyst than without catalyst.

Because hill is lower, many more molecules can cross it even at same temperature. Number of effective collisions increases, rate increases. Catalyst remains unchanged at end, not consumed.

Example: Platinum catalyst for H2 + ethene: both adsorb on Pt surface, bonds weakened, they react easily to form ethane.`},{id:"17.10",q:"Give two features of catalytic action of enzyme.",a:`Two main features:

1. Specificity: Each enzyme is very specific. It catalyzes only one specific reaction or one type of reaction. Because active site has specific shape, only particular substrate fits. Example: enzyme sucrase breaks only sucrose, not other sugars.

2. Works at optimum conditions: Enzymes are proteins, they work best at optimum temperature (around 37°C in human body) and optimum pH. At very high temperature, they denature. Small amount is enough, they are not consumed, and they lower activation energy greatly to speed up biological reactions. They control metabolism in body.`},{id:"D17.1",q:"Explain effect of surface area on rate of reaction.",a:`Reactions involving solids take place on surface. Rate depends on area of contact.

Larger surface area = more possibility of contact = more effective collisions = higher rate.

Finely divided solids have greater surface area than large pieces, so they react more rapidly.

Examples:
• Aluminium foil reacts slowly with warm NaOH: 2Al + 2NaOH + 6H2O → 2NaAl(OH)4 + 3H2, but aluminium powder reacts rapidly even in cold NaOH with evolution of H2 gas.
• Large piece of wood burns slowly, but small pieces or sawdust burn rapidly.
• Limestone powder reacts faster with HCl than marble chips because powder has more surface area.

According to collision theory, more surface exposes more particles to collide with other reactant, so effective collisions increase.`},{id:"D17.2",q:"Main points of collision theory.",a:`Main points of collision theory are simple:

1. Reaction takes place only when particles (atoms, molecules, ions) collide with each other.

2. Very small fraction of collisions leads to products, majority just bounce back without reaction.

3. Collisions which lead to reaction are called effective or successful collisions.

4. For effective collision, two conditions: (a) Particles must have energy equal to or greater than activation energy, (b) Proper orientation (correct direction) of collision.

5. Rate depends on number of effective collisions per second.

6. Number of effective collisions depends on 4 factors: (i) Number of particles per unit volume (concentration), (ii) Frequency of collisions, (iii) Kinetic energy of particles, (iv) Activation energy.

7. When particles collide with enough energy, they form high energy unstable state at top of energy hill, then convert to stable products and potential energy falls.

Graph: Reaction coordinate (x-axis) vs Potential energy (y-axis) shows reactants → high energy hill → products.`},{id:"D17.3",q:"Discuss factors affecting rate: (a) concentration (b) temperature.",a:`(a) Effect of concentration:

Reactants must come in contact to react. Most reactants are in same phase (liquid or gas) able to meet at molecular level and collide easily. Higher concentration means more particles per unit volume, higher chance of effective collisions, higher rate.

Example: Coal burns slowly in air (21% O2) but burns rapidly in pure oxygen (100% O2). Limestone reacts with HCl: Experiment in conical flask with limestone + HCl, CO2 collected in syringe. With 1M HCl curve is less steep, with 2M HCl curve is steeper at start, more volume of gas in same time. Graph: Time (s) on x-axis vs Volume of gas evolved (cm³) on y-axis, curve starts fast then slows as HCl decreases and stops when HCl used up. Keep variables constant: temperature, mass and size of limestone, stirring.

For gases: Rate doubles if pressure of Cl2 doubles in H2 + Cl2 reaction when H2 in excess.

(b) Effect of temperature:

Rates increase with temperature. Food cooks faster at high temp, oxidation of iron very slow at room temp but fast at high temp.

In many cases rate nearly doubles when temperature increases by 10°C. Graph: Relative rate vs temperature shows rapid increase.

According to collision theory: As temperature increases, kinetic energy, velocities and movements increase, frequency of collisions increases, more particles have energy ≥ activation energy, so number of successful collisions increases and rate becomes faster.`},{id:"D17.4",q:"How is chemical kinetics important in food industry?",a:`Chemical kinetics - study of rates and factors affecting rates - plays very important role in food industry:

1. Ripening and spoilage: Food ripening and spoilage involves chemical reactions. Rates of these reactions for different fruits and vegetables are studied to minimize losses due to spoilage.

2. Optimum harvesting time: Fruits and vegetables ripen due to enzymatic reactions which convert starches to sugars, soften tissues, develop flavour and colours. Rate of production of ethene gas during ripening is monitored to determine best time to harvest when peak quality is reached.

3. Storage and transportation: By studying rates of enzymatic reactions, oxidation and microbial growth, optimum conditions for storage and transportation are determined. For example, if fruit degrades rapidly during transportation due to high temperature, refrigeration is employed to slow rate and prevent rapid spoilage.

4. Preventing fat oxidation: Understanding kinetics of oxidation of fats helps prevent spoilage of butter and oils. Antioxidants are added, proper packaging and low temperature storage are used.

So kinetics helps farmers predict harvesting time, plan storage, reduce waste and keep food fresh longer.`},{id:"D17.5",q:"Role of enzymes in body as biological catalysts.",a:`Enzymes are biological catalysts, basically proteins, which speed up specific reactions in body without being consumed.

Role in body:

1. They have active sites with specific shape. Reactant (substrate) binds to active site.

2. Once bound, particular bonds are weakened, activation energy is lowered, reaction takes place easily at body temperature (37°C).

3. Product dissociates, enzyme becomes free to bind another substrate molecule. Enzyme remains unchanged, small amount can catalyze large amount.

4. Very specific: particular enzyme catalyzes only specific reaction. This specificity controls metabolism.

5. They control all metabolic reactions: digestion of food, respiration, making proteins, etc. Without enzymes, these reactions would be too slow to sustain life.

6. Enzyme based biosensors are used to detect glucose in blood, etc.

Example: Amylase breaks starch to sugar, protease breaks proteins.

They work at optimum temperature and pH, and are sensitive to high temperature.`}];function pa(){let[e,t]=Ge.useState("syllabus"),[n,r]=Ge.useState(!1),[l,i]=Ge.useState({}),[o,a]=Ge.useState(!1),[u,c]=Ge.useState(null),[h,v]=Ge.useState("17.1");Ge.useEffect(()=>{document.documentElement.classList.toggle("dark",n)},[n]);let m=Object.entries(l).filter(([p,k])=>nd.find((S)=>S.id===Number(p))?.correct===k).length;return x("div",{className:`min-h-screen font-sans antialiased transition-colors duration-300 ${n?"bg-[#0a0a0b] text-zinc-100":"bg-[#fcfaf8] text-zinc-900"}`,children:[y("style",{children:`
