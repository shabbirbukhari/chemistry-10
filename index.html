",key:"kqbvx6"}]]);var Jc=qe(vt(),1),Tm=Symbol.for("react.element");var _m=Object.prototype.hasOwnProperty,zm=Jc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Mm={key:!0,ref:!0,__self:!0,__source:!0};function bc(e,t,n){var r,l={},o=null,i=null;n!==void 0&&(o=""+n),t.key!==void 0&&(o=""+t.key),t.ref!==void 0&&(i=t.ref);for(r in t)_m.call(t,r)&&!Mm.hasOwnProperty(r)&&(l[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)l[r]===void 0&&(l[r]=t[r]);return{$$typeof:Tm,type:e,key:o,ref:i,props:l,_owner:zm.current}}var C=bc,E=bc;var ua=[{n:14,title:"The Atmosphere & States of Matter",subtitle:"Kinetic Theory, Evaporation, Diffusion, Phase Changes",pages:"P-1 to P-15",mcqs:[{q:"According to kinetic theory, difference in three states of matter is due to:",opts:["difference in movements of particles","difference in forces of attraction","difference in kinetic energy","both a and b"],correct:0,expl:"Book P-2: In solids particles vibrate about fixed positions, in liquids slide over each other, in gases move randomly with high KE. Difference in movement and forces both cause states, but exam key marks (a) movements as primary distinction."},{q:"Upon heating, rate of evaporation:",opts:["decreases","increases","remains constant","first increases then decreases"],correct:1,expl:"Book P-3: Maxwell distribution – higher T → more molecules have KE ≥ escape energy, vapour pressure increases, evaporation faster."},{q:"Inter-particle attractions are strongest in:",opts:["Solids","Liquids","Gases","Vapour"],correct:0,expl:"Book P-2: Solids have strongest intermolecular forces holding lattice, least in gases."},{q:"Cooling vapours directly into solid without liquid is called:",opts:["Condensation","Freezing","Evaporation","Deposition"],correct:3,expl:"Book P-9: Reverse of sublimation. Vapour→solid, e.g., frost formation, iodine vapour to crystals."},{q:"Physical state having maximum energy of particles is:",opts:["Solid","Liquid","Gaseous","All have same"],correct:2,expl:"Book P-4: KE average ∝ T, but at same T, gas has highest potential + kinetic due to broken attractions."},{q:"How does evaporation depend on force of attraction between particles?",opts:["decreases with increasing strength of force","increases with increasing strength","independent","zero at strong forces"],correct:0,expl:"Book P-5: Strong H-bonding in water lowers evaporation vs petrol weak London forces evaporates fast."},{q:"Which gas will diffuse at fastest rate among following?",opts:["SO2 (64)","CO2 (44)","H2S (34)","Cl2 (71)"],correct:2,expl:"Graham's law Book P-7: rate ∝ 1/√M. Lightest M=34 diffuses fastest. H2S > CO2 > SO2 > Cl2."},{q:"Phase changes A and B: Gas --A--> Liquid --B--> Solid. What are A and B?",opts:["Evaporation, Sublimation","Sublimation, Freezing","Condensation, Freezing","Deposition, Melting"],correct:2,expl:"Book P-9: Gas to liquid = condensation (exothermic, latent 2260 J/g), Liquid to solid = freezing (latent 334 J/g)."},{q:"A student noticed frost at 6:30 am disappearing without wetness at 8:30 am. This is due to:",opts:["Evaporation","Melting then evaporation","Sublimation of solid directly to vapour","Condensation"],correct:2,expl:"Book P-9: Frost (ice) sublimes when vapour pressure of ice = atmospheric pressure below 0°C, sun warms, solid→vapour, no liquid."}],short:[{q:"14.1 From where does the energy come when a liquid evaporates?",a:"From surroundings and liquid itself. According to Maxwell-Boltzmann distribution, some molecules at surface have KE > escape energy. They overcome intermolecular attractions and escape. Average KE of remaining liquid falls, liquid cools. It absorbs latent heat of vaporisation (2260 J/g for water) from surroundings. That is why spirit on hand feels cold, sweating cools body, earthen pitcher (matka) water stays cool."},{q:"14.2 Is condensation an endothermic or exothermic process? Explain.",a:"Exothermic. Gas → liquid: molecules lose kinetic energy, come closer, form intermolecular attractions (H-bonds). Energy released as latent heat of condensation = 2260 J/g for steam at 100°C. Hence steam burn is more severe than boiling water burn at same temperature – steam releases extra 2260 J/g on skin."},{q:"14.3 Why do naphthalene balls disappear with time?",a:"Due to sublimation. Naphthalene is volatile solid with high vapour pressure at room temperature. Its vapour pressure equals external pressure below its melting point. Solid → vapour directly without melting. Molecules escape continuously. Used as moth repellent. Same for camphor, dry ice (CO2), iodine."},{q:"14.4 Why does temperature remain constant during phase change?",a:"Heat supplied is used as latent heat to overcome intermolecular forces and break lattice, not to increase KE (½mv²). Temperature ∝ average KE. So plateau: BC at 0°C fusion = 334 J/g breaks H-bonded ice lattice, DE at 100°C vaporisation = 2260 J/g breaks all attractions. Until all solid melts / liquid boils, T constant."},{q:"14.5 Is it possible to compress a liquid like a gas?",a:"Almost no. Liquids have particles very close, little empty space (~0.3 nm gap), almost incompressible. Need ~10,000 atm to reduce volume 10%. Gases have large gaps (~10x diameter), easily compressible, follow Boyle's law V ∝ 1/P. That's why hydraulic brakes use liquid."},{q:"14.6 Can you change temperature at which water boils in lab?",a:"Yes, by changing external pressure. Boiling when vapour pressure = external pressure. Pressure cooker: 2 atm → BP ~120°C, cooks faster. At Murree: 0.9 atm → BP ~98°C. In vacuum pump: 0.1 atm → water boils at ~46°C. Adding salt: elevation of BP due to lowering vapour pressure."},{q:"14.7 In which season wet clothes take longer time to dry and why?",a:"Winter / rainy humid season. Evaporation rate ∝ (1-Humidity) × wind × area × exp(-Ea/RT). In winter: low T → less KE, high humidity → air saturated, less wind. So slow. Summer: hot, dry, windy, low humidity → fast evaporation."},{q:"14.8 When a solid is heated, what happens to its vibrating particles?",a:"Amplitude of vibration increases, KE increases, average inter-particle distance increases (thermal expansion). Intermolecular forces weaken. At melting point, amplitude large enough lattice breaks, solid → liquid."},{q:"14.9 Do solids and liquids diffuse like gases? Explain.",a:"Yes, but much slower order: gas >> liquid >> solid. Gases: perfume spreads across room in seconds, no barrier. Liquids: ink drop in water spreads in minutes, KMnO4 diffusion experiment. Solids: gold-lead block diffusion takes years to detect few mm intermixing due to very strong forces and fixed positions."},{q:"14.10 Why is dew formed in early morning?",a:"At night, earth radiates heat, temperature falls below dew point (temperature where air becomes saturated). Water vapour condenses on cold surfaces like grass, leaves forming droplets. Requires clear sky, calm wind, high humidity. Exothermic condensation releases latent heat."}],constructed:[{q:"14.1 Differentiate between evaporation and boiling.",a:"Table: Evaporation: (1) Surface phenomenon (2) Occurs at all temperatures (3) Slow, no bubbles (4) Causes cooling (5) Depends on area, temp, wind, humidity (6) No need of external heat, uses ambient. Boiling: (1) Bulk phenomenon (2) Occurs only at boiling point (3) Fast with bubbles (4) Temperature remains constant during boiling (5) Depends on external pressure (6) Requires continuous heat supply. Book P-5 Table 14.1"},{q:"14.2 How boiling is related to external pressure?",a:"Boiling occurs when vapour pressure of liquid = external atmospheric pressure. If external P ↑, more energy needed to equalize → BP ↑. Pressure cooker: 2 atm, BP 120°C, food cooks 3x faster. If external P ↓ (mountains), BP ↓: Murree 0.9 atm, BP 98°C, food takes longer, so cooker needed. Vacuum distillation uses low pressure to boil heat-sensitive compounds below decomposition."},{q:"14.3 Why does evaporation not need input energy from burner?",a:"It uses ambient thermal energy. At any T, Maxwell distribution has fraction of molecules with KE > Ea escape. No burner needed. Surroundings provide heat as latent heat, so evaporation causes cooling. If burner given, rate increases but not mandatory. Spirit, petrol evaporate at room T."},{q:"14.4 Why are heating and cooling curves same path?",a:"Phase change is reversible equilibrium process. Latent heat absorbed during melting/boiling at same temperature is released during freezing/condensation. At 1 atm, ice melts at 0°C absorbing 334 J/g, water freezes at 0°C releasing 334 J/g. So heating curve AB-BC-CD-DE-EF retraces as cooling curve FE-ED-DC-CB-BA. Purity gives sharp plateaus."},{q:"14.5 Why does ice melt when pressure is exerted? Explain skating.",a:"Ice has anomalous expansion: ice volume > water volume (H-bonded open hexagonal structure). According to Le Chatelier, increase pressure favours side with smaller volume → water. So high pressure lowers melting point of ice: at 100 atm, MP = -1°C. Skate blade: pressure ~100 atm melts thin water layer, acts as lubricant, refreezes after. Glacier movement also pressure melting."},{q:"14.6 Why do phase changes occur on heating/cooling?",a:"Balance between KE (disordering, ∝ T) vs intermolecular attractions (ordering). Heating ↑ KE, molecules overcome attractions: solid (KE < attractions) → liquid (KE ≈ attractions) → gas (KE >> attractions). Cooling ↓ KE, attractions dominate: gas → liquid → solid. Latent heats are energy needed to overcome forces."}],descriptive:[{q:"14.1 Explain difference in rates of diffusion of two gases based on kinetic theory. [7 marks]",a:"DEFINITION:\nDiffusion is the movement of gas molecules from high concentration to low concentration. Rate of diffusion means how fast a gas spreads.\n\nKINETIC THEORY BASIS (Book P-6):\n1. All gases are made of tiny particles moving randomly at high speed.\n2. Average kinetic energy (KE) = (1/2)mv2. At same temperature, all gases have same average KE.\n3. So lighter gas (small mass m) must have higher velocity v to keep KE same. Formula: v = sqrt(2KE/m).\n4. Graham's Law: Rate of diffusion is 1 divided by sqrt(density or molar mass). r1/r2 = sqrt(M2/M1) = sqrt(d2/d1)\n\nEXPLANATION WITH EXAMPLE - Activity 14.2 (Book P-7):\nTake a long glass tube. Put cotton with HCl at one end and cotton with NH3 at other end. Both gases diffuse inside.\n- NH3 molar mass = 17 g/mol (light, fast)\n- HCl molar mass = 36.5 g/mol (heavy, slow)\nWhite ring of NH4Cl forms near HCl side because NH3 travels faster and covers more distance in same time. Distance NH3 / Distance HCl = sqrt(M HCl / M NH3) = sqrt(36.5/17) = 1.46.\n\nFACTORS:\n- Mass: Lighter diffuses faster.\n- Temperature: Higher T gives higher KE, higher velocity, faster diffusion.\n- Intermolecular forces: Weak forces give faster.\n\nCONCLUSION: Difference in rate is due to difference in mass and velocity as explained by kinetic theory. This is why we smell perfume quickly, and lighter gases escape faster."},{q:"14.2 How does sublimation helpful in printing and usage of air freshener? [5 marks] Preserved wording 'air freshner'",a:"DEFINITION:\nSublimation = direct change of solid to vapour without becoming liquid on heating. Vapour to solid on cooling is called deposition. Example: iodine, ammonium chloride, dry ice, naphthalene.\n\n1. USE IN DYE-SUBLIMATION PRINTING (Book P-9):\n- Printer uses special solid dyes (CMYK).\n- On heating by print head (180-200C), solid dye sublimes into gas.\n- Gas penetrates polyester fabric or coated photo paper and then solidifies inside fiber.\n- No liquid smudging, so high quality, permanent photo prints, sharp colors.\n- Used for T-shirts, mugs, banners, ID cards.\n\n2. USE IN AIR FRESHENER (Book wording 'air freshner' kept as per book):\n- Air freshener contains volatile solid perfume compounds like naphthalene, paradichlorobenzene.\n- At room temperature these solids slowly sublime.\n- Solid changes to fragrant vapour spreads in air by diffusion, gives pleasant smell for many days.\n- No need to spray daily, works continuously.\n- Same principle: moth balls in cupboards, deodorizer blocks in bathrooms.\n\nBENEFIT: Sublimation gives slow, controlled release of vapour without liquid mess, useful for both printing and long-lasting freshness."},{q:"14.3 Draw heating curve for water and explain different regions. [7 marks]",a:"DEFINITION:\nHeating curve is a graph of temperature vs heat added at constant pressure (1 atm) when ice at -10C is heated to steam at 110C.\n\nDIAGRAM DESCRIPTION (You can draw):\nX-axis = Heat added (kJ) increases to right.\nY-axis = Temperature (C) increases upward.\nCurve has 5 parts: AB, BC, CD, DE, EF.\n\nEXPLANATION OF REGIONS (Book P-11):\n\nAB - Solid heating (-10C to 0C): Slanting line up. Ice is heated. Particles vibrate faster, kinetic energy increases, temperature rises. Heat q = m x c(ice) x ΔT. c(ice)=2.09 J/gC.\n\nBC - Melting (0C): Flat horizontal line. Ice + water both present. Temperature does NOT rise. Heat added is latent heat of fusion (334 J/g). It breaks hydrogen bonds of ice lattice. Potential energy increases, kinetic stays same.\n\nCD - Liquid heating (0C to 100C): Slanting line up. Water heated. Temperature rises from 0 to 100C. q = m x c(water) x ΔT. c(water)=4.18 J/gC.\n\nDE - Boiling (100C): Flat line at 100C. Water + steam. Latent heat of vaporization (2260 J/g) breaks all H-bonds, converts liquid to gas. Temperature constant.\n\nEF - Vapour heating (>100C): Slanting line up. Steam heated above 100C. q = m x c(steam) x ΔT. c(steam)=2.0 J/gC.\n\nKEY POINT: Slanting parts = kinetic energy increases, temperature rises. Flat parts = phase change, potential energy increases, temperature constant.\n\nAPPLICATION: This curve explains why temperature stays constant during melting and boiling."}]},{n:15,title:"Stoichiometry & Measurement",subtitle:"Moles, Avogadro, Empirical, Limiting, Yield",pages:"P-16 to P-30",mcqs:[{q:"Number of moles in 4g CH4 (M=16) is:",opts:["0.25 mol","1 mol","4 mol","16 mol"],correct:0,expl:"n = m/M =4/16=0.25 mol. Volume at STP =0.25×22.4=5.6 dm³ (≈6 dm³ book). Molecules =0.25×6.02×10²³=1.5×10²³."},{q:"Empirical formula of compound 40% C, 6.7% H, 53.3% O:",opts:["CH2O","C2H4O2","C3H6O3","All same ratio"],correct:0,expl:"C 40/12=3.33, H 6.7/1=6.7, O 53.3/16=3.33 → ratio 1:2:1 = CH2O. Molecular formula depends on molar mass."},{q:"Limiting reactant is the one which:",opts:["produces least product","is in excess","is fully consumed first","both a and c"],correct:3,expl:"Book P-24: Limiting reactant consumed first, decides amount of product."},{q:"Molarity formula:",opts:["moles/volume(L)","mass/volume","moles×volume","grams/moles"],correct:0,expl:"M = n/V(L). Book P-20."},{q:"Percentage yield = ?",opts:["actual/theoretical ×100","theoretical/actual ×100","actual×theoretical","actual+theoretical"],correct:0,expl:"Book P-27: % yield = (actual/theoretical)×100, always <100% due to side reactions."},{q:"Avogadro number of particles in 1 mole:",opts:["6.02×10²³","6.02×10²²","22.4","1×10²³"],correct:0,expl:"Book P-18 definition."},{q:"22.4 dm³ at STP contains:",opts:["1 mol gas","2 mol gas","0.5 mol","Avogadro ×2"],correct:0,expl:"Molar volume at STP."},{q:"Mass of 0.4M NaCl in 150 cm³:",opts:["3.51 g","5.85 g","2.34 g","1.5 g"],correct:0,expl:"n=0.4×0.15=0.06 mol, m=0.06×58.5=3.51 g."},{q:"Sodium % in NaHCO3 (84 g):",opts:["27.38%","23%","57%","14%"],correct:0,expl:"Na 23/84×100=27.38% Book P-22."}],short:[{q:"15.1 Define mole and Avogadro number.",a:"Mole: amount containing 6.02×10²³ entities (Avogadro number NA). Mass of 1 mole = molar mass in grams. Example 1 mol C =12 g contains NA atoms."},{q:"15.2 What is molar volume? 1 mol gas at STP occupies?",a:"22.4 dm³ at STP (0°C, 1 atm) and 24 dm³ at RTP. Derived from PV=nRT. Used to convert moles↔volume."},{q:"15.3 Differentiate empirical and molecular formula.",a:"Empirical = simplest whole ratio (CH2O). Molecular = actual atoms in molecule (C6H12O6). Molecular = n×empirical, n=Mr/Empirical mass."},{q:"15.4 Define limiting reactant with example.",a:"Reactant consumed first, limits product. Example N2+3H2→2NH3. If 12g H2 (6 mol) and 64g N2 (2.28 mol), N2 needs 6.84 mol H2 but only 6 mol present, so H2 limiting, gives 68g NH3."},{q:"15.5 What is percentage yield? Why less than 100%?",a:"% yield = actual/theoretical×100. Less due to reversible reaction, side reactions, incomplete recovery, loss during filtration."}],constructed:[{q:"15.1 Calculate moles, volume, molecules in 4g CH4.",a:"M CH4=16. n=4/16=0.25 mol. Volume STP=0.25×22.4=5.6 dm³ (book rounds 6 dm³ at 24 dm³). Molecules=0.25×6.022×10²³=1.505×10²³."},{q:"15.2 Find empirical formula of iron sulphide with 63.5% Fe.",a:"Fe 63.5%, S 36.5%. Moles Fe=63.5/55.85=1.137, S=36.5/32=1.14 ratio ~1:1 → FeS. Book P-23."},{q:"15.3 Limiting reactant: 12g H2 + 64g N2 → NH3.",a:"N2+3H2→2NH3. Moles N2=64/28=2.285, H2=12/2=6. Required H2 for N2=2.285×3=6.857 >6 so H2 limiting. NH3 moles =2/3×6=4 mol → mass=4×17=68g. N2 excess 0.285 mol =8g left."},{q:"15.4 Percentage composition of NaHCO3.",a:"M=23+1+12+48=84. %Na=23/84×100=27.38%, %H=1.19%, %C=14.28%, %O=57.14%."}],descriptive:[{q:"15.1 Solve: Mass of NaCl in 150 cm³ 0.4M, empirical/molecular problems, limiting and yield numericals [7 marks]",a:`Stepwise as per Book P-26 to P-29:
(i) NaCl: M=0.4M, V=150cm³=0.15L, n=M×V=0.06 mol, m=n×58.5=3.51g.
(ii) Empirical C 40% H 6.71% O 53.3%: C 40/12=3.33, H 6.71/1=6.71, O 53.3/16=3.33 divide by 3.33 →1:2:1 CH2O, E mass=30, M=90 given →n=90/30=3 →Molecular C3H6O3 (lactic acid).
(iii) Limiting 12g H2 64g N2 as above → H2 limiting →68g NH3.
(iv) % yield: Reaction 2AgNO3 + Mg → Mg(NO3)2 +2Ag, 305g AgNO3 → theoretical Mg(NO3)2: moles AgNO3=305/169.87=1.795 mol → Mg(NO3)2=0.8975 mol ×148.3=133.1g actual 23.7g →% yield=23.7/133.1×100=17.8% (book example gives 17.9% with different numbers).
(v) Gold purity 66.94% means 16 carat etc. Detailed equations shown with units.
Book P-28.`}]},{n:16,title:"Electrochemistry",subtitle:"Oxidation States, Cells, Electrolysis, Corrosion",pages:"P-31 to P-54",mcqs:[{q:"Oxidation number of S in H2S2O7 is:",opts:["+6","+7","+5","+4"],correct:0,expl:"H2S2O7 oleum: 2×1 +2S +7×(-2)=0 →2S=12 →S=+6."},{q:"In galvanic cell, oxidation occurs at:",opts:["Anode","Cathode","Salt bridge","Electrolyte"],correct:0,expl:"Anode oxidation, electrons flow anode→cathode."},{q:"Fuel cell efficiency is about:",opts:["70%","25%","100%","40%"],correct:0,expl:"H2-O2 fuel cell ~70% vs thermal 35%."},{q:"During electrolysis of concentrated NaCl, product at anode:",opts:["Cl2","O2","H2","Na"],correct:0,expl:"Conc. halide → halogen gas at anode, dilute → O2 from water."},{q:"Electroplating, article to be plated acts as:",opts:["Cathode","Anode","Both","None"],correct:0,expl:"Cathode (negative) where metal ions gain e- → metal coating."},{q:"Rusting of iron is:",opts:["Redox","Acid-base","Precipitation","Decomposition"],correct:0,expl:"Fe→Fe²⁺+2e- oxidation, O2+2H2O+4e-→4OH- reduction."},{q:"Formula of sodium hypochlorite:",opts:["NaClO","NaClO2","NaClO3","NaCl"],correct:0,expl:"Hypo = lowest oxidation (+1)."},{q:"In fuel cell reaction at anode:",opts:["H2→2H⁺+2e-","O2+2H2O+4e-→4OH-","2H2O→O2+4H⁺","None"],correct:0,expl:"Anode oxidation of fuel."}],short:[{q:"16.1 Define oxidation number.",a:"This long question is about mole calculations from Chapter 15 (Book P-15 to P-30). Here are the types with simple steps:\n\nA) MOLARITY NUMERICAL:\nQuestion: Find mass of NaCl needed to make 150 cm3 of 0.4M solution.\nFormula: Molarity M = moles / volume in dm3. Moles = mass / molar mass.\nSolution:\nVolume = 150 cm3 = 150/1000 = 0.15 dm3.\nMoles = M x V = 0.4 x 0.15 = 0.06 moles.\nMolar mass NaCl = 23+35.5=58.5 g/mol.\nMass = moles x molar mass = 0.06 x 58.5 = 3.51 g.\nSo weigh 3.51 g NaCl and dissolve to make 150 cm3.\n\nB) EMPIRICAL AND MOLECULAR FORMULA:\nExample: Compound has 40% C, 6.6% H, 53.3% O, molar mass 180. Find empirical and molecular formula.\nStep 1: Assume 100 g sample: 40 g C, 6.6 g H, 53.3 g O.\nStep 2: Moles: C=40/12=3.33, H=6.6/1=6.6, O=53.3/16=3.33.\nStep 3: Divide by smallest (3.33): C=1, H=2, O=1. So empirical formula = CH2O.\nStep 4: Empirical mass = 12+2+16=30. n = molecular mass / empirical mass = 180/30=6. Molecular formula = C6H12O6 (glucose).\n\nC) LIMITING REACTANT:\nExample: 4 g H2 + 32 g O2 to water. Which is limiting?\nReaction: 2H2 + O2 -> 2H2O.\nMoles H2=4/2=2, moles O2=32/32=1.\nNeed ratio H2:O2 =2:1. We have exactly 2:1, so both are fully used, no limiting. If H2 was 2 g (1 mole), then H2 limiting because need 2 moles H2 for 1 mole O2.\n\nD) PERCENTAGE YIELD:\nFormula: % yield = (actual yield / theoretical yield) x100.\nExample: Theoretical 10 g, actual 8 g -> % yield = 80%. Loss due to side reactions, handling.\n\nThese steps cover all numericals in exercise. Remember units: 1 dm3=1000 cm3, molar mass from periodic table."},{q:"16.2 What is fuel cell? Write its reactions.",a:"Galvanic cell converts chemical energy of fuel directly to electrical, 70% efficient, product H2O only. Anode: H2+2OH-→2H2O+2e- (alkaline) or H2→2H++2e-, Cathode: O2+2H2O+4e-→4OH- (alkaline) overall 2H2+O2→2H2O."},{q:"16.3 Why does concentrated halide give halogen on electrolysis?",a:"High concentration of X- increases its discharge potential vs water. At anode Cl-→½Cl2+e- (E°=-1.36V) preferred over H2O→O2 at high [Cl-]. Dilute gives O2."},{q:"16.4 Define electroplating and its conditions.",a:"Coating thin layer of expensive metal on cheap article by electrolysis. Article=cathode, metal to coat=anode, electrolyte=salt of coating metal (e.g., K[Ag(CN)2] for silver). Conditions: high current density, low T, high concentration, direct current, thorough cleaning."},{q:"16.5 Explain rusting mechanism.",a:"Electrochemical: Anode: Fe→Fe²⁺+2e-, Cathode: O2+2H2O+4e-→4OH-, Fe²⁺+2OH-→Fe(OH)2, further oxidation: 4Fe(OH)2+O2+2H2O→4Fe(OH)3 → Fe2O3·xH2O rust. Prevention: painting, oiling, galvanizing (Zn coating sacrificial), alloying stainless steel."}],constructed:[{q:"16.1 Write formulae using oxidation numbers: NaClO, CaC2O4.",a:"Na +1, ClO- hypochlorite Cl +1, overall NaClO. Ca +2, C2O4 oxalate -2 → CaC2O4 calcium oxalate."},{q:"16.2 Find oxidation numbers in Al(NO3)3, Na2S2O3.",a:"Al +3, NO3 -1 N +5. Na2S2O3: Na +1, total -2+2=0 →2S +3(-2)= -2 →2S=+4 → average +2 but two S +6 and -2 (thiosulphate structure)."},{q:"16.3 Explain electroplating of silver.",a:"Object (spoon) cathode, Ag anode, electrolyte K[Ag(CN)2] (60 g/L) + KCN. Reaction anode Ag→Ag⁺+e-, cathode Ag⁺+e-→Ag coats. Current density 0.5-1 A/dm², temperature 20-30°C. Uniform thin coating."}],descriptive:[{q:"16.1 Explain fuel cell working and electrolysis of concentrated halides and corrosion prevention [7 marks]",a:"A) GALVANIC AND FUEL CELL (Book P-66 to P-74):\nFuel cell converts chemical energy directly to electrical energy with high efficiency (70% vs 40% of thermal power plant).\n\nH2-O2 Fuel Cell:\n- Anode: H2 -> 2H+ + 2e- (oxidation)\n- Cathode: O2 + 2H2O + 4e- -> 4OH-\n- Overall: 2H2 + O2 -> 2H2O + electricity + heat.\n- Electrolyte: KOH.\n- Uses: Spacecraft, vehicles, no pollution, only water product.\n\nB) ELECTROLYSIS OF CONCENTRATED HALIDES (Book P-70):\nExample: Concentrated aqueous NaCl (brine) electrolysis.\n- In dilute NaCl, water is electrolysed. In concentrated, Cl- is more.\n- At Anode (oxidation): 2Cl- -> Cl2 + 2e- (chlorine gas produced)\n- At Cathode (reduction): 2H2O + 2e- -> H2 + 2OH- ; Na+ + OH- -> NaOH\n- Overall: 2NaCl + 2H2O -> Cl2 + H2 + 2NaOH. This is chlor-alkali industry.\n\nC) CORROSION PREVENTION (Book P-73):\nCorrosion is oxidation of metals, e.g., Fe -> Fe2O3.xH2O (rust).\nPrevention methods:\n1. Painting, oiling, greasing - blocks air and moisture.\n2. Galvanizing - coating iron with zinc. Zinc is more reactive, corrodes first (sacrificial protection).\n3. Electroplating with Cr, Ni, Sn.\n4. Alloying - stainless steel with Cr.\n5. Cathodic protection - connect iron to Mg or Zn block.\n\nAll answers are from book theory pages, simple and detailed."}]},{n:17,title:"Chemical Equilibrium & Kinetics",subtitle:"Rate, Collision Theory, Factors, Le Chatelier",pages:"P-55 to P-66",mcqs:[{q:"Rate of reaction depends on:",opts:["Temperature","Concentration","Surface area","All of these"],correct:3,expl:"Book P-56 factors."},{q:"Activation energy is minimum energy for:",opts:["Effective collision","All collisions","No collision","Decomposition"],correct:0,expl:"Ea = energy barrier for proper orientation effective collision."},{q:"Catalyst:",opts:["Increases Ea","Decreases Ea","No effect on Ea","Consumed"],correct:1,expl:"Provides alternative path lower Ea, not consumed."},{q:"Reversible reaction attains equilibrium when:",opts:["Rate f = rate r","Both stop","Only forward","Only reverse"],correct:0,expl:"Dynamic equilibrium rates equal."},{q:"Effect of surface area: powder vs lumps",opts:["Powder reacts faster","Lumps faster","Same","No effect"],correct:0,expl:"Larger area more contact more collisions per time."}],short:[{q:"17.1 State collision theory.",a:"For reaction to occur particles must collide with proper orientation and kinetic energy ≥ activation energy Ea. Only effective collisions give product."},{q:"17.2 How does surface area affect rate?",a:"Larger surface area → more exposed particles → more collisions → faster rate. Powdered CaCO3 + acid faster than marble chips. Book P-58."},{q:"17.3 What is effect of temperature on rate?",a:"T↑ → KE↑ → more molecules have Ea, collisions frequency and energy increase → rate doubles per 10°C rise approx."},{q:"17.4 Define equilibrium constant Kc.",a:"Kc = [products]^coeff / [reactants]^coeff at equilibrium, constant at given T, indicates extent."}],constructed:[{q:"17.1 Explain factors affecting rate of reaction.",a:"Concentration/pressure: ↑ conc → ↑ collisions → rate ↑. Surface area: ↑ area ↑ rate. Temperature: ↑ T ↑ rate (Ea concept). Catalyst: ↓ Ea ↑ rate. Light: photochemical."},{q:"17.2 Relate kinetics to food preservation.",a:"Ripening/spoilage rates controlled by enzymatic, microbial, oxidation reactions. Low T refrigeration ↓ rate, reduces spoilage. Ethene accelerates ripening, monitoring kinetics prevents over-ripening. Canning excludes O2 ↓ oxidation."}],descriptive:[{q:"17.1 Explain collision theory, factors affecting rate and application in food [7 marks]",a:"COLLISION THEORY (Book P-86 to P-99):\nFor a reaction to happen, molecules must:\n1. Collide with each other.\n2. Collide with proper orientation (correct side).\n3. Collide with enough energy greater than or equal to activation energy (Ea). Activation energy is minimum energy needed to break bonds and start reaction.\n\nIf energy less than Ea, molecules bounce back, no reaction.\n\nFACTORS AFFECTING RATE OF REACTION:\n\n1. Nature of reactants: Ionic compounds react faster than covalent because no bond breaking needed.\n\n2. Concentration: Higher concentration means more particles per volume, more collisions per second, faster rate. Rate proportional to [reactant]^n.\n\n3. Temperature: On increasing temperature by 10C, rate doubles. Reason: More molecules have Ea. Maxwell distribution shifts.\n\n4. Surface area: Powder reacts faster than lumps. Smaller particles have more surface exposed, more collisions.\n\n5. Catalyst: Catalyst lowers activation energy by providing alternative path, so more collisions become successful. It is not consumed. Example: MnO2 for KClO3 decomposition.\n\n6. Pressure (for gases): Higher pressure means closer particles, more collisions.\n\nAPPLICATION IN FOOD (Book P-95):\n- Low temperature in refrigerator slows enzyme and bacterial reactions, food preserved longer.\n- Cooking at high temperature speeds reactions, food cooks fast.\n- Adding preservatives like vinegar (acid) slows bacterial growth.\n- Cutting vegetables into small pieces increases surface area, cooks faster but also spoils faster.\n\nThis is complete answer from book."}]},{n:18,title:"Acids, Bases & Salts",subtitle:"Bronsted, pH, Salts, Titration",pages:"P-67 to P-74",mcqs:[{q:"pH of neutral solution is:",opts:["7","0","14","1"],correct:0,expl:"pH=-log[H+], neutral 10⁻⁷ M →7."},{q:"Acid which can donate proton is:",opts:["Bronsted acid","Lewis acid","Bronsted base","Lewis base"],correct:0,expl:"Bronsted-Lowry."},{q:"Salt of strong acid and weak base is:",opts:["Acidic","Basic","Neutral","None"],correct:0,expl:"NH4Cl acidic pH<7."},{q:"Lewis acid is:",opts:["e- pair acceptor","e- pair donor","proton donor","proton acceptor"],correct:0,expl:"BF3, AlCl3 electron deficient."}],short:[{q:"18.1 Define Bronsted acids and bases.",a:"Acid proton donor (HCl→H++Cl-), base proton acceptor (NH3+H+→NH4+). Conjugate pairs."},{q:"18.2 What is pH scale?",a:"pH=-log[H+], 0-14, <7 acidic, 7 neutral, >7 basic. pOH=-log[OH-], pH+pOH=14."},{q:"18.3 Give uses of salts.",a:"NaCl table salt, Na2CO3 washing soda, NaHCO3 baking, CuSO4 fungicide, CaSO4 plaster."}],constructed:[{q:"18.1 Differentiate between Lewis acid and base.",a:"Lewis acid e- pair acceptor (BF3, H+, AlCl3) has vacant orbital. Lewis base e- pair donor (NH3, H2O, OH-) has lone pair. Forms coordinate bond."},{q:"18.2 Explain salt hydrolysis.",a:"Salt of strong acid+weak base acidic due to cation hydrolysis NH4+ +H2O⇌NH4OH+H+. Strong base+weak acid basic: CH3COO-+H2O⇌CH3COOH+OH-. Strong+strong neutral."}],descriptive:[{q:"18.1 Explain theories of acids/bases and pH calculations [7 marks]",a:"THREE THEORIES (Book P-99 to P-115):\n\n1. ARRHENIUS THEORY (1887):\n- Acid: Gives H+ in water. Example HCl -> H+ + Cl-, H2SO4 -> 2H+ + SO4 2-.\n- Base: Gives OH- in water. Example NaOH -> Na+ + OH-, KOH -> K+ + OH-.\n- Limitation: Only in water, does not explain NH3 as base.\n\n2. BRONSTED-LOWRY THEORY:\n- Acid: Proton (H+) donor.\n- Base: Proton acceptor.\n- Example: HCl + H2O -> H3O+ + Cl- ; HCl is acid (donates H+), H2O is base (accepts).\n- NH3 + H2O -> NH4+ + OH- ; H2O is acid, NH3 is base. So NH3 explained as base.\n- Conjugate acid-base pair: Acid1/Base1 and Acid2/Base2 differ by one H+. Example HCl/Cl- is conjugate pair.\n\n3. LEWIS THEORY (Most general):\n- Acid: Electron pair acceptor (has empty orbital). Example H+, AlCl3, BF3.\n- Base: Electron pair donor (has lone pair). Example NH3, OH-, H2O.\n- Reaction: H+ + NH3 -> NH4+ ; H+ is Lewis acid, NH3 is Lewis base.\n\npH SCALE (Book P-108):\npH = -log[H+]. pOH = -log[OH-]. pH + pOH =14 at 25C.\n- pH less than 7 acidic, pH=7 neutral, pH greater than 7 basic.\n- Strong acid fully ionizes, e.g., 0.01M HCl -> [H+]=0.01 -> pH=2.\n- Calculation: [H+]=1x10^-3 -> pH=3. [OH-]=1x10^-5 -> pOH=5 -> pH=9.\n\nUSES OF SALTS: NaCl for food, Na2CO3 for washing, NaHCO3 for baking, CuSO4 as fungicide.\n\nAll from book with equations."}]},{n:19,title:"Organic Chemistry - Principles",subtitle:"Functional Groups, Isomerism, Nomenclature",pages:"P-75 to P-86",mcqs:[{q:"General formula of alkane:",opts:["CnH2n+2","CnH2n","CnH2n-2","CnHn"],correct:0,expl:"Saturated."},{q:"Functional group of alcohol:",opts:["-OH","-COOH","-CHO","-O-"],correct:0,expl:"Hydroxyl."},{q:"Isomers have same:",opts:["Molecular formula","Structural formula","Both","None"],correct:0,expl:"Different arrangement."},{q:"Tetravalency of carbon means:",opts:["4 bonds","2 bonds","3 bonds","1 bond"],correct:0,expl:"Carbon forms 4 covalent bonds."}],short:[{q:"19.1 Define catenation.",a:"Self-linking of same atoms, carbon shows extensive catenation forming long chains, branches, rings due to strong C-C bond."},{q:"19.2 What is functional group?",a:"Atom/group giving characteristic properties, e.g., OH alcohol, COOH acid, CHO aldehyde."},{q:"19.3 Define isomerism.",a:"Same molecular formula different structure arrangement → structural isomerism (chain, position, functional) and geometric."}],constructed:[{q:"19.1 Write IUPAC names of C2H5OH and CH3COOH.",a:"C2H5OH ethanol (ethan-1-ol), CH3COOH ethanoic acid."},{q:"19.2 Explain homologous series.",a:"Series with same functional group, successive members differ by CH2, similar properties, gradual change physical properties, same general formula."}],descriptive:[{q:"19.1 Explain sources, classification and importance of organic compounds [5 marks]",a:"SOURCES OF ORGANIC COMPOUNDS (Book P-115 to P-126):\nMain sources are natural and synthetic:\n1. Natural gas and petroleum - main source of alkanes, alkenes.\n2. Coal - source of aromatic compounds like benzene.\n3. Plants and animals - carbohydrates, proteins, fats.\n4. Synthesis in lab - urea first organic made from inorganic (Wohler 1828).\n\nCLASSIFICATION (Book P-118):\nOrganic compounds classified by:\n\nA) By carbon skeleton:\n- Open chain (aliphatic): Straight or branched. Example CH3-CH2-CH3 propane.\n- Closed chain (cyclic): Ring. Example cyclohexane, benzene.\n\nB) By functional group:\n- Hydrocarbons: Alkanes (C-C single), Alkenes (C=C), Alkynes (C triple bond).\n- With functional groups: Alcohol -OH, Carboxylic acid -COOH, Aldehyde -CHO, Ketone C=O, Ether C-O-C, etc.\n\nC) Homologous series: Family with same functional group, each member differs by -CH2-, similar properties. Example: Methane CH4, Ethane C2H6, Propane C3H8 are homologous series of alkanes.\n\nIMPORTANCE:\n- Fuels: Petrol, diesel, CNG.\n- Food: Carbohydrates, proteins, fats, vitamins essential for life.\n- Medicines: Paracetamol, antibiotics.\n- Polymers: Plastic, rubber, clothes (nylon, polyester).\n- Pesticides, dyes, cosmetics.\n- Life itself is based on organic chemistry (DNA, enzymes).\n\nTetravalency of carbon allows catenation (C-C bonding) making millions of compounds.\n\nAnswer from book theory simple."}]},{n:20,title:"Hydrocarbons, Fuels & Water Treatment",subtitle:"Alkanes Alkenes, Petroleum, Domestic Water",pages:"P-87 to P-99",mcqs:[{q:"Domestic water supply steps include:",opts:["Screening, coagulation, filtration, chlorination","Only filtration","Only chlorination","Distillation only"],correct:0,expl:"Book P-92 municipal treatment."},{q:"Alum used for:",opts:["Coagulation","Filtration","Disinfection","Softening"],correct:0,expl:"Al2(SO4)3 forms Al(OH)3 flocs trapping impurities."},{q:"Chlorination kills:",opts:["Bacteria","Suspended particles","Hardness","Color"],correct:0,expl:"Cl2+H2O→HOCl disinfectant."},{q:"Knocking in engines due to:",opts:["Branched alkanes","Straight chain","Aromatics","None"],correct:1,expl:"n-heptane causes knocking, octane number."}],short:[{q:"20.1 What is petroleum? Fractions?",a:"Mixture hydrocarbons, fractional distillation gives refinery gas, petrol, kerosene, diesel, lubricating oil, bitumen."},{q:"20.2 Define octane number.",a:"Measure of knocking resistance, iso-octane 100, n-heptane 0. Higher better fuel."},{q:"20.3 Why is water not fit for drinking directly?",a:"Contains suspended, pathogens, dissolved salts, must be treated to remove turbidity, microbes, odor."}],constructed:[{q:"20.1 Describe domestic water treatment plant steps.",a:"Screening removes large debris, sedimentation allows settling, coagulation alum Al2(SO4)3 → Al(OH)3 flocs coagulate colloidal particles, filtration through sand gravel carbon charcoal removes fine, chlorination Cl2 → HOCl kills bacteria, storage supply fit for drinking."},{q:"20.2 How to avoid water-borne diseases?",a:"Boiling, chlorination tablets, filtration, avoid stagnant water, proper sewage disposal, wash hands, use safe supply."}],descriptive:[{q:"20.1 Explain domestic water supply fit for drinking and fertilizers qualities [7 marks]",a:"DOMESTIC WATER TREATMENT (Book P-126 to P-133):\n\nNatural water is not fit for drinking because it has suspended particles, bacteria, dissolved salts.\n\nSteps at treatment plant to make it potable:\n\n1. Screening: Removes large floating objects (leaves, wood).\n\n2. Coagulation: Add alum [Al2(SO4)3]. Alum forms sticky Al(OH)3 flocs that trap clay and suspended particles and settle down.\n\n3. Sedimentation: Water kept in tank, heavy particles settle.\n\n4. Filtration: Passed through sand and gravel beds to remove remaining tiny particles.\n\n5. Chlorination: Add chlorine gas Cl2 or bleaching powder. Chlorine kills bacteria and germs: Cl2 + H2O -> HOCl + HCl. HOCl is disinfectant. This makes water safe.\n\n6. Fluoridation (optional): Add fluoride for teeth protection.\n\nDistribution through pipes to homes.\n\nFERTILIZERS - QUALITIES OF GOOD FERTILIZER (Book P-130):\n\nFertilizer is substance added to soil to provide nutrients N, P, K.\n\nQualities of good fertilizer:\n1. Highly soluble in water - so plant roots can absorb easily.\n2. Stable - should not decompose quickly, long lasting.\n3. Cheap and easily available.\n4. Should not be hygroscopic (should not absorb moisture from air and become sticky).\n5. Should provide high percentage of nutrients, e.g., urea has 46% nitrogen.\n6. Should not harm soil pH and should be non-toxic.\n7. Easy to handle and transport.\n\nExamples: Urea CO(NH2)2, Ammonium nitrate NH4NO3, DAP, NPK mixtures.\n\nThis is full answer from book pages."}]},{n:21,title:"Biochemistry",subtitle:"Carbohydrates, Proteins, Lipids, Enzymes",pages:"P-100 to P-115",mcqs:[{q:"Monomer of protein:",opts:["Amino acid","Glucose","Fatty acid","Nucleotide"],correct:0,expl:"NH2-CHR-COOH peptide linkage."},{q:"Enzymes are:",opts:["Proteins","Carbohydrates","Lipids","Vitamins"],correct:0,expl:"Biocatalyst proteins, specific."},{q:"Starch is polymer of:",opts:["Glucose","Fructose","Amino acid","Glycerol"],correct:0,expl:"α-glucose amylose amylopectin."},{q:"DNA contains:",opts:["Deoxyribose","Ribose","Glucose","Fructose"],correct:0,expl:"Sugar deoxyribose, bases A T G C."}],short:[{q:"21.1 Define carbohydrates classification.",a:"Polyhydroxy aldehyde/ketone: monosaccharide glucose fructose, disaccharide sucrose maltose, polysaccharide starch cellulose."},{q:"21.2 What are proteins?",a:"Polymers amino acids linked by peptide bond -CO-NH-, 20 amino acids, structure primary secondary tertiary quaternary."},{q:"21.3 Role of enzymes.",a:"Biocatalysts lower activation energy, specific, work at optimum pH T, e.g., amylase starch→maltose."}],constructed:[{q:"21.1 Differentiate DNA and RNA.",a:"DNA double helix deoxyribose A T G C stores genetic info nucleus. RNA single ribose A U G C mRNA tRNA rRNA helps protein synthesis."},{q:"21.2 Explain lipids.",a:"Esters of fatty acids+ glycerol, hydrophobic, energy storage, cell membrane, triglycerides, phospholipids bilayer."}],descriptive:[{q:"21.1 Explain carbohydrates, proteins and enzymes functions [6 marks]",a:"CARBOHYDRATES (Book P-133 to P-142):\nDefinition: Polyhydroxy aldehydes or ketones or substances that give them on hydrolysis. General formula Cn(H2O)n.\n\nClassification:\n1. Monosaccharides: Simple sugars, cannot hydrolyze further. Example glucose C6H12O6 (aldohexose), fructose (ketohexose). Sweet, soluble.\n2. Disaccharides: Two monosaccharides joined by glycosidic bond with loss of H2O. Example sucrose (glucose+fructose), maltose (glucose+glucose), lactose (glucose+galactose). Formula C12H22O11.\n3. Polysaccharides: Many monosaccharides. Example starch (storage in plants), cellulose (cell wall), glycogen (storage in liver). Insoluble, non-sweet.\n\nFunctions: Main source of energy (1 g gives 17 kJ), storage, structure of plant cell wall.\n\nPROTEINS (Book P-137):\nPolymers of amino acids linked by peptide bond -CO-NH-. Amino acid has NH2 and COOH.\n- Structure: 20 different amino acids make proteins.\n- Functions: Build muscles, enzymes, hemoglobin carries O2, antibodies fight disease, hair and nails (keratin).\n\nENZYMES (Book P-139):\n- Definition: Biocatalysts, proteins that speed up biochemical reactions without being used. Highly specific (lock and key model).\n- Example: Amylase in saliva converts starch to maltose.\n- Factors: Works best at 37C and pH 7.4. High temperature destroys them (denaturation).\n- Uses: Digestion, industrial making of alcohol, cheese.\n\nAll these are essential for life, from book theory."}]},{n:22,title:"Water – Properties & Hardness",subtitle:"Hard/Soft Water, Heavy Water, Softening Methods",pages:"P-116 to P-126",mcqs:[{q:"Temporary hardness due to:",opts:["Ca(HCO3)2 Mg(HCO3)2","CaSO4","NaCl","CaCl2"],correct:0,expl:"Bicarbonates removed by boiling."},{q:"Permanent hardness not removed by:",opts:["Boiling","Clark's","Both","Washing soda"],correct:0,expl:"Sulphates chlorides need zeolite, washing soda."},{q:"Heavy water formula:",opts:["D2O","H2O","T2O","H2O2"],correct:0,expl:"Deuterium oxide D=²H."},{q:"Water is universal solvent due to:",opts:["Polarity & H-bonding","Non-polar","High BP","Low MP"],correct:0,expl:"High dielectric constant dissolves ionic."}],short:[{q:"22.1 Define hard water.",a:"Water that does not produce lather with soap due to Ca²⁺ Mg²⁺ salts forming insoluble scum."},{q:"22.2 Types of hardness.",a:"Temporary due to bicarbonates removed by boiling. Permanent due to sulphates chlorides removed by washing soda, zeolite, ion exchange."},{q:"22.3 What is heavy water? Use?",a:"D2O, D is isotope ²H, molar mass 20, used as moderator in nuclear reactors slows neutrons, tracer studies."}],constructed:[{q:"22.1 How to remove temporary hardness? Equation.",a:"Boiling: Ca(HCO3)2 → CaCO3↓ + CO2 + H2O precipitates. Clark's method: Ca(HCO3)2 + Ca(OH)2 → 2CaCO3 +2H2O."},{q:"22.2 Explain zeolite method for permanent hardness.",a:"Zeolite Na2Al2Si2O8·xH2O ion exchanger: Ca²⁺ + Na2-zeolite → Ca-zeolite +2Na⁺. Regenerated with brine NaCl."}],descriptive:[{q:"22.1 Explain water as solvent, hardness removal and heavy water [6 marks]",a:"WATER AS UNIVERSAL SOLVENT (Book P-142 to P-153):\nWater is polar molecule: O delta-, H delta+. Due to hydrogen bonding and high dielectric constant (80), it dissolves ionic and polar substances.\n- Ionic compounds: NaCl dissolves because water surrounds Na+ and Cl- and separates them.\n- Polar compounds: Sugar, alcohol dissolve due to H-bonding.\n- Non-polar: Oil does not dissolve.\n\nHARDNESS:\nHard water does not make good lather with soap due to Ca2+ and Mg2+ ions.\nTypes:\n1. Temporary hardness: Due to Ca(HCO3)2, Mg(HCO3)2. Removed by boiling: Ca(HCO3)2 -> CaCO3 + CO2 + H2O.\n2. Permanent hardness: Due to CaSO4, CaCl2, MgSO4. Not removed by boiling. Removed by Clark method, washing soda, or ion-exchange resin (zeolite). Example: Na2Zeolite + Ca2+ -> CaZeolite + 2Na+.\n\nHEAVY WATER D2O (Book P-148):\n- Formula D2O, D is deuterium (isotope of H with one neutron).\n- Properties: Density 1.107 g/cm3 (vs 1.0 for H2O), boiling point 101.4C, freezing 3.8C.\n- Preparation: By electrolysis of water (light water electrolyzes faster, heavy remains).\n- Uses: As moderator in nuclear reactors to slow down neutrons, as tracer in research.\n\nWater is essential, its solvent power makes it important for life and industry."}]},{n:23,title:"Chemical Industries & Fertilizers",subtitle:"Solvay, Urea, Safety",pages:"P-127 to P-133",mcqs:[{q:"Solvay process makes:",opts:["Na2CO3","NaHCO3","NaOH","NaCl"],correct:0,expl:"Soda ash washing soda."},{q:"Urea contains N%:",opts:["46%","26%","18%","60%"],correct:0,expl:"CO(NH2)2 M=60, N=28 →46%."},{q:"Raw material for Solvay:",opts:["Brine, limestone, ammonia","Only NaCl","Only CaCO3","NH3 only"],correct:0,expl:"Brine NaCl, limestone CaCO3→CO2+CaO, NH3 recycled."},{q:"Fertilizer containing K:",opts:["KCl","Urea","DAP","SSP"],correct:0,expl:"Muriate of potash."}],short:[{q:"23.1 What is Solvay process? Equation.",a:"Manufacture Na2CO3: Brine + NH3 + CO2 → NaHCO3 + NH4Cl, NaHCO3 heated → Na2CO3+CO2+H2O. NH3 recovered."},{q:"23.2 Define fertilizer and types.",a:"Substance providing nutrients N P K to plants. Nitrogenous urea, phosphatic SSP, potassic KCl, mixed NPK."},{q:"23.3 Qualities of good fertilizer?",a:"Soluble, stable, cheap, high nutrient, non-toxic, easy storage, quick availability."}],constructed:[{q:"23.1 Explain urea manufacturing.",a:"2NH3+CO2 → NH2COONH4 ammonium carbamate at 200°C 200 atm, then NH2COONH4→CO(NH2)2+H2O dehydration. Prilling tower makes granules."},{q:"23.2 Functions of NPK.",a:"N: vegetative growth protein chlorophyll. P: root flowering ATP DNA. K: starch sugar disease resistance enzyme activation."}],descriptive:[{q:"23.1 Explain Solvay process, urea manufacture and avoid negative effects of fertilizers [6 marks]",a:"SOLVAY PROCESS FOR SODIUM CARBONATE (Book P-153 to P-162):\nAlso called ammonia-soda process. Raw materials: Brine (NaCl), limestone (CaCO3), ammonia (NH3).\n\nSteps:\n1. Brine purification, then NH3 passed: NaCl + NH3 + CO2 + H2O -> NaHCO3 + NH4Cl. CO2 comes from heating limestone: CaCO3 -> CaO + CO2.\n2. Filter NaHCO3 and heat: 2NaHCO3 -> Na2CO3 + CO2 + H2O. CO2 recycled.\n3. Ammonia recovery: 2NH4Cl + CaO -> CaCl2 + 2NH3 + H2O. NH3 recycled.\n\nProduct: Washing soda Na2CO3 used for glass, paper, soap.\n\nUREA MANUFACTURING (Book P-157):\n- Raw materials: NH3 and CO2.\n- Step 1: 2NH3 + CO2 -> NH2COONH4 (ammonium carbamate) at 200 atm, 200C.\n- Step 2: NH2COONH4 -> CO(NH2)2 + H2O (urea) on heating.\n- Urea contains 46% nitrogen, best fertilizer, highly soluble, white crystalline.\n\nNEGATIVE EFFECTS AND HOW TO AVOID:\n- Overuse causes water pollution (eutrophication) - nitrates go to rivers, algae grow.\n- Soil pH disturbed, kills useful bacteria.\n- How to avoid: Use in proper dose, use DAP and NPK in balanced way, apply at right time, use organic manure together, avoid applying before rain.\n\nThis is exact book theory simplified."}]},{n:24,title:"Environmental Chemistry – Pollution",subtitle:"Air, Water, Noise Pollution",pages:"P-134 to P-142",mcqs:[{q:"Primary pollutant:",opts:["SO2 directly emitted","O3 formed","PAN","H2SO4"],correct:0,expl:"Emitted directly."},{q:"Secondary pollutant:",opts:["Ozone in smog","CO","SO2","NO"],correct:0,expl:"Formed by reactions."},{q:"Acid rain pH:",opts:["<5.6","7",">7","14"],correct:0,expl:"Due to SOx NOx forming H2SO4 HNO3."},{q:"Ozone depletion by:",opts:["CFCs","O2","N2","CO2"],correct:0,expl:"Cl radical catalytic."}],short:[{q:"24.1 Define pollution and pollutants.",a:"Undesirable change in environment due to harmful substances. Pollutants cause it primary direct, secondary formed."},{q:"24.2 What is acid rain? Effects?",a:"Rain pH <5.6 due to SO2 NO2 → H2SO4 HNO3. Damages buildings (Taj Mahal), crops, aquatic life, soil."},{q:"24.3 What is greenhouse effect?",a:"CO2 CH4 trapping IR heat warming earth → global warming sea level rise. Controlled by reducing emissions."}],constructed:[{q:"24.1 Explain ozone depletion mechanism.",a:"CFCs stable reach stratosphere UV breaks CFCl3→CFCl2+Cl·, Cl·+O3→ClO+O2, ClO+O→Cl·+O2 chain destroys O3, one Cl destroys 10⁵ O3, causes skin cancer UV."},{q:"24.2 How to control air pollution?",a:"Use filters electrostatic precipitator, catalytic converters, unleaded petrol, CNG, planting trees, laws."}],descriptive:[{q:"24.1 Explain air pollutants, acid rain, ozone depletion and control [6 marks]",a:"AIR POLLUTION (Book P-162 onwards):\nPollutant is harmful substance in air. Two types:\n1. Primary pollutants: Directly emitted. Example CO, CO2, SO2, NO2, H2S, particulates.\n2. Secondary pollutants: Formed by reaction of primary in air. Example ozone O3, PAN, smog, acid rain (H2SO4).\n\nACID RAIN (Book P-165):\n- Cause: SO2 and NO2 from factories and vehicles dissolve in rain water.\n- Reactions: 2SO2 + O2 -> 2SO3; SO3 + H2O -> H2SO4. 2NO2 + H2O -> HNO3 + HNO2.\n- pH of normal rain is 5.6, acid rain pH less than 5.6 (often 4-4.5).\n- Effects: Damages buildings (Taj Mahal marble CaCO3 + H2SO4 -> CaSO4), kills aquatic life, damages crops, corrodes metals.\n- Control: Use scrubbers in factories (CaO absorbs SO2), use low-sulfur fuels, catalytic converters in vehicles.\n\nOZONE DEPLETION (Book P-167):\n- Ozone layer O3 in stratosphere (20-50 km) protects from UV rays.\n- CFCs (chlorofluorocarbons) from refrigerators and AC: CFCl3 -> Cl + CFCl2 on UV.\n- Cl + O3 -> ClO + O2; ClO + O -> Cl + O2. One Cl atom destroys 100,000 O3 molecules.\n- Effects: More UV causes skin cancer, eye cataract, damage crops.\n- Control: Ban CFCs, use HFCs, Montreal Protocol 1987.\n\nCONTROL OF AIR POLLUTION:\n1. Use filters, electrostatic precipitators.\n2. Use renewable energy (solar, wind).\n3. Plant trees (absorb CO2).\n4. Use public transport.\n\nThis is full book answer in simple English."}]},{n:25,title:"Analytical Chemistry",subtitle:"Analysis, Chromatography, Spectroscopy",pages:"P-143 to P-153",mcqs:[{q:"Qualitative analysis finds:",opts:["What present","How much","Both","None"],correct:0,expl:"Identification."},{q:"Quantitative finds:",opts:["How much","What","Color","Odor"],correct:0,expl:"Amount."},{q:"Chromatography separates based on:",opts:["Distribution between phases","Boiling point","Density","Mass"],correct:0,expl:"Adsorption partition."},{q:"Rf value formula:",opts:["Distance solute / solvent","Solvent/solute","Solute×solvent","None"],correct:0,expl:"Retardation factor."}],short:[{q:"25.1 Define analytical chemistry.",a:"Branch dealing with identification and quantification of substances, qualitative and quantitative."},{q:"25.2 What is chromatography?",a:"Separation technique based on differential distribution between stationary and mobile phase. Types paper, column, TLC."},{q:"25.3 Define spectroscopy.",a:"Study of interaction electromagnetic radiation with matter, IR, UV-Vis, atomic absorption."}],constructed:[{q:"25.1 Explain paper chromatography steps.",a:"Stationary water on paper, mobile organic solvent. Spot mixture, solvent rises capillary, components travel different Rf based on solubility, spots detected iodine, Rf = distance component / distance solvent."},{q:"25.2 Importance of analytical chemistry.",a:"Quality control industries, medical diagnosis blood urine analysis, environmental monitoring, forensic."}],descriptive:[{q:"25.1 Explain qualitative quantitative analysis and chromatography with Rf [6 marks]",a:"ANALYTICAL CHEMISTRY (Book):\nBranch that deals with analysis - finding what is present and how much.\n\n1. QUALITATIVE ANALYSIS: Finds what elements or ions are present, not amount.\n- Example: Test for Cl- with AgNO3 gives white precipitate AgCl. Test for Cu2+ gives blue color with NH3. Flame test, etc.\n- Used to identify unknown salt.\n\n2. QUANTITATIVE ANALYSIS: Finds how much (amount, percentage) is present.\n- Types: Volumetric (titration), gravimetric (weighing precipitate), instrumental (spectroscopy).\n- Example: Find % of NaCl in mixture by titration with AgNO3.\n\nCHROMATOGRAPHY (Book):\nTechnique to separate mixture into components based on different partition between stationary and mobile phases.\n\nPAPER CHROMATOGRAPHY STEPS:\n1. Take Whatman filter paper, draw baseline with pencil 2 cm above bottom.\n2. Put a drop of mixture (ink, amino acids) on baseline.\n3. Place paper in jar with solvent (mobile phase) - e.g., water+ethanol. Solvent should be below baseline.\n4. Solvent rises by capillary action, carries components at different speeds based on solubility and adsorption.\n5. Components appear as spots at different heights.\n6. Dry and spray with locating agent (ninhydrin for amino acids).\n\nRf VALUE:\nRf = distance travelled by solute / distance travelled by solvent.\n- Example: Solvent travels 10 cm, compound travels 4 cm: Rf=0.4.\n- Rf is characteristic for each compound in given solvent, helps identification. Rf between 0 and 1.\n\nUSES: Separate dyes, check purity, identify drugs.\n\nSimple detailed from book."}]},{n:26,title:"Synthetic Polymers & Modern Materials",subtitle:"PET Formation, Recycling, Pollution",pages:"P-154 to P-162",mcqs:[{q:"Monomers of PET are:",opts:["Terephthalic acid + ethylene glycol","Ethylene only","Styrene only","Vinyl chloride"],correct:0,expl:"HOOC-C6H4-COOH + HO-CH2-CH2-OH → PET ester linkage."},{q:"PET formation is:",opts:["Condensation polymerization","Addition","Both","None"],correct:0,expl:"Esterification releasing H2O."},{q:"Recycling of PET includes:",opts:["Mechanical and chemical","Only burning","Only dumping","None"],correct:0,expl:"Mechanical shredding remelting, chemical depolymerization."},{q:"Synthetic polymers problem:",opts:["Non-biodegradable","Biodegradable","Soluble","Short life"],correct:0,expl:"Persist 1000 years, microplastics."},{q:"Which polymer is biodegradable?",opts:["Starch based","Polyethylene","PVC","Polystyrene"],correct:0,expl:"Starch cellulose natural."}],short:[{q:"26.1 Define polymer and monomer.",a:"Polymer large molecule (macro) made of repeating monomer units. Monomer small building block e.g., ethylene → polyethylene."},{q:"26.2 What is polymerization types?",a:"Addition: monomer adds without loss (polyethylene from ethylene). Condensation: monomers join with loss H2O HCl (PET, nylon)."},{q:"26.3 What is PET? Formula?",a:"Polyethylene terephthalate, polyester [–CO-C6H4-CO-O-CH2-CH2-O–]n, formed from terephthalic acid and ethylene glycol 260°C Sb2O3 catalyst."}],constructed:[{q:"26.1 Write equation of PET formation.",a:"n HOOC-C6H4-COOH + n HO-CH2-CH2-OH → [–CO-C6H4-CO-O-CH2-CH2-O–]n + 2n H2O, 260°C, vacuum, catalyst Sb2O3, ester linkage -COO-."},{q:"26.2 What are uses of PET?",a:"Bottles water soft drinks, textile fibers (polyester fleece), films, food trays, strapping, blister packs."},{q:"26.3 Why synthetic polymers cause pollution?",a:"Non-biodegradable, landfill 1000 years, ocean accumulation Great Pacific Garbage Patch, microplastics enter food chain, burning releases toxic HCl dioxins CO."}],descriptive:[{q:"26.1 Explain PET formation, recycling and effects of synthetic polymers [7 marks]",a:`PET FORMATION: Terephthalic acid HOOC-C6H4-COOH (M 166) + ethylene glycol HO-CH2-CH2-OH (62) condensation polymerization. Reaction: acid + alcohol → ester + H2O. At 260°C catalyst Sb2O3 vacuum removal H2O drives forward. Repeat n times → polymer chain ester linkage -CO-O-, M ~20,000-30,000. Properties: transparent, strong, barrier to gas, recyclable, melting 260°C.
RECYCLING: (1) Mechanical: collection → washing → shredding → flakes → melting 260°C → pellets → remaking bottles fibers fleece jackets. Reduces oil use 50%. (2) Chemical: depolymerization: hydrolysis: PET +2H2O→TPA+EG at high T pressure, methanolysis: PET+2MeOH→DMT+EG, glycolysis: PET+EG→BHET monomer. Monomers repolymerized to virgin quality. Advantages closed loop.
EFFECTS: Non-biodegradable landfill accumulation 1000 years, ocean Great Pacific Garbage Patch 1.6 million km², microplastics (<5mm) ingested fish → humans hormonal disruption, burning PVC releases HCl dioxins carcinogenic, CO toxic. SOLUTIONS: 3R Reduce Reuse Recycle, biodegradable polymers starch PLA cellulose, bans on single-use, extended producer responsibility. Book P-155-160
Preserved wording 'air freshner' typo as per original.`},{q:"26.2 Discuss biodegradable polymers and modern materials [5 marks]",a:"BIODEGRADABLE POLYMERS (Book P-161):\nPolymers that can be broken down by bacteria, fungi, enzymes into CO2, H2O, biomass within 60-180 days.\n\nTypes:\n1. Natural: Starch-based (from corn, potato), cellulose-based, chitin.\n2. Synthetic biodegradable: Polylactic acid PLA - made from corn starch lactic acid, used for packaging, cups. PHA (polyhydroxyalkanoate) - made by bacteria, used for medical sutures, bags.\n\nAdvantages: Eco-friendly, reduces pollution, compostable, renewable source.\nApplications: Shopping bags, food packaging, disposable plates, surgical stitches that dissolve.\n\nMODERN MATERIALS (Book P-162):\n1. Silicones: Polymers with Si-O-Si backbone. Water repellent, heat resistant, used in sealants, breast implants, lubricants.\n2. Epoxy resins: Strong adhesives, two parts mixed, used in coatings, electronics, aircraft.\n3. Kevlar: Aromatic polyamide, 5 times stronger than steel, lightweight, used for bulletproof jackets, helmets, ropes.\n4. Conductive polymers: Like polyacetylene, conduct electricity, used in LEDs, batteries, sensors.\n\nCOMPARISON:\nSynthetic (PET, PVC) = strong, cheap but pollution. Biodegradable = eco-friendly but costly and less strong. Future is green chemistry using biodegradable and recycling.\n\nThis is simple detailed answer from book, no extra fazool words."}]}];function ca(){let[e,t]=hr.useState(14),[n,r]=hr.useState(""),l=hr.useRef({}),o=ua.filter((a)=>{if(!n)return!0;let s=n.toLowerCase().trim();if(!s)return!0;return a.title.toLowerCase().includes(s)||a.subtitle.toLowerCase().includes(s)||a.n.toString().includes(s)||a.mcqs.some((c)=>c.q.toLowerCase().includes(s)||c.opts.some((opt)=>opt.toLowerCase().includes(s))||(c.expl&&c.expl.toLowerCase().includes(s)))||a.short.some((c)=>c.q.toLowerCase().includes(s)||(c.a&&c.a.toLowerCase().includes(s)))||a.constructed.some((c)=>c.q.toLowerCase().includ
