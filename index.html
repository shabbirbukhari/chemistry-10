vs boiling (5 points) and factors affecting evaporation","Define sublimation with examples: Iodine, Naphthalene, Dry Ice","State and explain Boyle's Law P1V1=P2V2, Charles Law V1/T1=V2/T2, Avogadro's Law","Explain diffusion, effusion and Graham's Law of diffusion","Calculate problems related to gas laws at STP and RTP"],thingsToKnow:["Kinetic Particle Theory","Internal Energy","Interconversion","Sublimation","Diffusion","Boyle's Law","Charles Law","Absolute Zero"],didYouKnow:[{title:"Absolute Zero",text:"At -273.15°C (0 K), all gases theoretically have zero volume. This is called Absolute Zero - the coldest possible temperature!"},{title:"Dry Ice Magic",text:"Dry ice (solid CO2) sublimates at -78.5°C directly to gas, creating fog effects in stage shows."}],interestingInfo:"Mount Everest pe pani 71°C par ubalta hai kyunki pressure kam hota hai! Boiling point pressure par depend karta hai.",notes:[{heading:"1. Kinetic Particle Theory (ذراتی نظریہ حرکت)",content:"According to Kinetic Particle Theory, all matter is made of tiny particles (atoms/molecules) that are in constant random motion. In solids, particles vibrate at fixed positions with strong forces. In liquids, particles slide over each other with moderate forces. In gases, particles move freely at high speed with negligible forces. The average kinetic energy of particles is directly proportional to temperature (Kelvin). This theory explains why gases exert pressure (collisions with walls) and why temperature increases kinetic energy. Urdu keyword: حرکی ذراتی نظریہ",urduKeywords:["Kinetic Particle Theory - حرکی ذراتی نظریہ"]},{heading:"2. Internal Energy & Enthalpy (اندرونی توانائی)",content:"Internal Energy (U) is total energy contained inside a system - sum of kinetic energy (motion of molecules) and potential energy (intermolecular forces). When we heat a substance, internal energy increases. Endothermic processes (برودگیر) absorb heat from surroundings e.g., melting of ice, ΔH = +ve. Exothermic processes (گرمی خارج) release heat e.g., condensation, freezing, ΔH = -ve. The heating curve (Figure 14.3) shows temperature vs heat added: plateau regions are latent heat of fusion and vaporization where temperature remains constant despite heating because energy breaks intermolecular forces. Cooling curve (Figure 14.4) is reverse - shows supercooling and release of latent heat.",quickCheck:{q:"Why does temperature remain constant during melting?",a:"Because heat energy is used to overcome intermolecular forces (latent heat) not to increase KE, so temperature stays at 0°C until all ice melts."}},{heading:"3. Interconversion of States & Heating/Cooling Curves",content:"Interconversion: Solid ↔ Liquid ↔ Gas. Terms: Melting (پگھلنا) solid to liquid at melting point, Freezing (جمنا) liquid to solid, Boiling (ابلنا) liquid to gas at boiling point throughout liquid, Condensation (تکثیف) gas to liquid, Evaporation (تبخیر) surface phenomenon liquid to gas below boiling point, Sublimation (تصعید) solid directly to gas, Deposition (ترسیب) gas directly to solid. Heating Curve Explanation (Fig 14.3): AB - solid heating, BC - melting (latent heat of fusion 6kJ/mol for water), CD - liquid heating, DE - boiling (latent heat of vaporization 40.7 kJ/mol), EF - gas heating. Cooling Curve (Fig 14.4) shows freezing point, supercooling dip, and heat released. Effect of Pressure: Higher pressure increases boiling point and melting point (except ice). Pressure cooker increases pressure to cook faster at 120°C.",quickCheck:{q:"Define sublimation with 3 examples",a:"Solid directly to gas without liquid: Iodine (violet gas), Naphthalene balls, Dry Ice (CO2), Ammonium chloride, Camphor."}},{heading:"4. Evaporation vs Boiling - 5 Differences Table",content:`This is most important for board exam (5 marks):
1. Evaporation: Surface phenomenon, Boiling: Bulk phenomenon
2. Evaporation: Occurs at all temperatures, Boiling: Occurs only at boiling point
3. Evaporation: Slow process, Boiling: Fast rapid bubbles
4. Evaporation: Cooling effect (absorbs latent heat), Boiling: Temperature constant during boiling
5. Evaporation: Depends on surface area, humidity, wind, Boiling: Depends on external pressure only. Factors affecting evaporation: Temperature ↑ evaporation ↑, Surface area ↑ evaporation ↑, Humidity ↑ evaporation ↓, Wind speed ↑ evaporation ↑, Nature of liquid (volatile ↑). Applications: Sweating cools body, Earthen pitcher (matka) cooling.`,urduKeywords:["Evaporation - تبخیر","Boiling - نقطہ ابال"]},{heading:"5. Diffusion, Effusion & Graham's Law",content:"Diffusion (نفوذ) is spontaneous mixing of gases due to random motion from high concentration to low. Effusion is escape of gas through tiny hole. Graham's Law: Rate of diffusion ∝ 1/√(density) or 1/√(molar mass). Formula: r1/r2 = √(M2/M1) = √(d2/d1). Lighter gases diffuse faster e.g., H2 diffuses 4 times faster than O2 because M O2=32, H2=2, √(32/2)=4. Applications: Separation of isotopes of uranium, smelling perfume across room. Factors: Temperature, molecular mass, pressure gradient.",quickCheck:{q:"Which diffuses faster: NH3 or HCl and why?",a:"NH3 (M=17) faster than HCl (M=36.5) because lighter. In classic experiment white ring of NH4Cl forms nearer HCl side."}},{heading:"6. Gas Laws - Complete with Derivations",content:"Boyle's Law (1662): At constant T, Volume inversely proportional to Pressure: P ∝ 1/V or P1V1=P2V2. Graph: P vs V = hyperbola, P vs 1/V = straight line, PV vs P = horizontal line. Example: If P1=2 atm, V1=3L, P2=6 atm, V2= P1V1/P2=1L. Charles Law (1787): At constant P, V ∝ T (Kelvin): V1/T1=V2/T2. Absolute zero = -273°C. Graph V vs T (K) straight line through origin, V vs T (°C) intercepts -273°C. Example: V1=300ml at 27°C (300K), at 127°C (400K), V2=400ml. Combined Gas Law: P1V1/T1=P2V2/T2. Avogadro's Law: At same T&P, equal volumes contain equal moles: V ∝ n, V1/n1=V2/n2. Molar volume at STP = 22.4 dm³, at RTP (25°C, 1 atm) = 24 dm³, at normal conditions 22.414. Ideal Gas Equation: PV=nRT, R=0.0821 atm·dm³/mol·K = 8.314 J/mol·K. Dalton's Law: Ptotal = P1+P2+...",quickCheck:{q:"Define RTP and its molar volume",a:"RTP = Room Temperature and Pressure: 25°C (298K) and 1 atm. Molar volume at RTP = 24 dm³/mol."}}],definitions:[{term:"Internal Energy",eng:"Total kinetic + potential energy of particles in a system",urdu:"نظام میں ذرات کی کل حرکی اور مخفی توانائی"},{term:"Sublimation",eng:"Direct change of solid to gas without passing through liquid state",urdu:"ٹھوس کا براہ راست گیس میں تبدیل ہونا"},{term:"Boyle's Law",eng:"At constant temperature, volume of gas is inversely proportional to pressure",urdu:"مستقل درجہ حرارت پر گیس کا حجم دباؤ کے بالعکس متناسب ہوتا ہے"},{term:"Charles Law",eng:"At constant pressure, volume of gas is directly proportional to absolute temperature",urdu:"مستقل دباؤ پر گیس کا حجم مطلق درجہ حرارت کے راست متناسب ہے"},{term:"Graham's Law",eng:"Rate of diffusion of gas is inversely proportional to square root of its molar mass",urdu:"گیس کے نفوذ کی شرح اس کے مالیکیولی وزن کے جزر کے بالعکس ہے"},{term:"Absolute Zero",eng:"Lowest possible temperature -273.15°C where gas volume becomes zero theoretically",urdu:"کم ترین ممکنہ درجہ حرارت جہاں گیس کا حجم صفر ہو جائے"}],examples:[{title:"Example 14.1 - Boyle's Law",problem:"A gas occupies 200 cm³ at 2 atm pressure. Calculate volume at 5 atm keeping temperature constant.",steps:["Given: P1=2 atm, V1=200 cm³, P2=5 atm","Boyle's Law: P1V1=P2V2","V2 = P1V1 / P2 = (2*200)/5","V2 = 80 cm³"],answer:"80 cm³"},{title:"Example 14.2 - Charles Law",problem:"400 cm³ gas at 27°C. Find volume at 127°C at same pressure.",steps:["T1=27+273=300K, T2=127+273=400K","V1/T1 = V2/T2 => V2=V1*T2/T1","V2=400*400/300=533.33 cm³"],answer:"533.33 cm³"},{title:"Example 14.3 - Combined Law",problem:"Gas at 2 atm, 300 cm³, 27°C to 3 atm, 127°C. Find new volume?",steps:["P1V1/T1=P2V2/T2","V2=P1V1T2/(P2T1)=2*300*400/(3*300)=266.67 cm³"],answer:"266.67 cm³"}],mcqs:[{q:"Absolute zero is equal to:",options:["-273°C","0°C","273°C","100°C"],correct:0,explanation:"0 K = -273.15°C where gas volume theoretically zero"},{q:"Which directly changes from solid to gas?",options:["Ice","Iodine","Water","Mercury"],correct:1,explanation:"Iodine shows sublimation"},{q:"Boyle's law is P1V1 = ?",options:["P2V2","V2/P2","T1/T2","nRT"],correct:0,explanation:"Boyle's law at constant T"},{q:"At RTP, 1 mole gas occupies:",options:["22.4 dm³","24 dm³","22.414 dm³","24.4 dm³"],correct:1,explanation:"RTP molar volume = 24 dm³ (25°C)"},{q:"Rate of diffusion depends on:",options:["Molar mass","Pressure only","Color","State"],correct:0,explanation:"Graham's law: inversely proportional to √M"},{q:"Evaporation is:",options:["Bulk phenomenon","Surface phenomenon","Only at 100°C","Exothermic"],correct:1,explanation:"Occurs at surface at all temps"},{q:"Heating curve plateau represents:",options:["Latent heat","Specific heat","Kinetic energy","Potential"],correct:0,explanation:"Temperature constant during phase change due to latent heat"},{q:"Which diffuses faster?",options:["H2","O2","CO2","SO2"],correct:0,explanation:"Lightest M=2 diffuses fastest per Graham"},{q:"Charles law graph V vs T(K) is:",options:["Hyperbola","Straight line through origin","Circle","Parabola"],correct:1,explanation:"V ∝ T"},{q:"Pressure cooker cooks faster because:",options:["High pressure increases boiling point","Low pressure","Vacuum","No effect"],correct:0,explanation:"Increased pressure raises boiling point to ~120°C"},{q:"Dry ice is:",options:["Solid H2O","Solid CO2","Solid N2","Solid O2"],correct:1,explanation:"Solid carbon dioxide sublimates at -78.5°C"},{q:"For ideal gas PV = ?",options:["nRT","PT","VN","RT/P"],correct:0,explanation:"Ideal gas equation"}],shortQuestions:[{q:"Define internal energy with example.",a:"Total KE+PE of particles. Example: Heating water increases internal energy as molecules move faster and break H-bonds."},{q:"Differentiate evaporation and boiling (5 points).",a:"Evaporation: surface, all temps, slow, cooling, depends on area/humidity. Boiling: bulk, at boiling point, fast with bubbles, temp constant, depends on pressure."},{q:"Explain heating curve (Figure 14.3).",a:"Graph temp vs heat: AB solid heating, BC melting plateau (latent fusion), CD liquid heating, DE boiling plateau (latent vaporization), EF gas heating. Plateaus show phase change."},{q:"State Boyle's Law and give mathematical form.",a:"At constant T, V ∝ 1/P. P1V1=P2V2. As pressure increases, volume decreases due to more collisions."},{q:"What is absolute zero? Why is it important?",a:"-273.15°C or 0K where gas volume becomes zero theoretically. It's basis of Kelvin scale, lowest possible temp."},{q:"Define sublimation and give 3 examples.",a:"Solid directly to gas: Iodine, Naphthalene balls, Dry Ice, Ammonium chloride, Camphor."},{q:"State Graham's Law and its application.",a:"Rate ∝ 1/√M. Lighter gases diffuse faster. Application: separation of U-235 and U-238, perfume spreading."},{q:"Why does evaporation cause cooling?",a:"High KE molecules escape from surface, average KE of remaining liquid decreases, temperature falls. Example: sweating, acetone on hand feels cool."}],longQuestions:[{q:"Explain Kinetic Particle Theory and interconversion of matter with heating and cooling curves (Fig 14.3, 14.4).",a:"Kinetic theory: matter made of particles in random motion, KE ∝ T. Interconversion: Solid (strong forces, fixed) → melt → Liquid (moderate forces) → boil → Gas (negligible forces). Heating curve detailed: AB - solid warms from -10 to 0°C, KE increases; BC - at 0°C ice melts, temp constant 0°C, heat breaks H-bonds (latent heat 6kJ/mol); CD - water heats 0-100°C; DE - at 100°C boiling, temp constant, latent vaporization 40.7kJ/mol breaks all H-bonds; EF - steam heats. Cooling curve reverse with supercooling. Effect of pressure: Higher pressure shifts equilibrium, increases boiling point (Le Chatelier)."},{q:"Derive and explain all gas laws: Boyle's, Charles, Avogadro's and ideal gas equation with graphs.",a:"Boyle: P∝1/V at constant T,n. Derivation: collisions increase with decreased volume so pressure up. Graphs: P-V hyperbola, P-1/V linear. Charles: V∝T(K) at constant P,n. Derivation: heating increases KE, particles push walls needing larger volume. Graph V-T(K) line through origin. Avogadro: V∝n at constant T,P. 1 mol = 22.4 dm³ at STP, 24 dm³ at RTP. Combined: P1V1/T1=P2V2/T2. Ideal: PV=nRT, R=0.0821 atm·dm³/mol·K. Real gases deviate at high P low T due to intermolecular forces. Applications in weather balloons, scuba diving (Boyle), hot air balloons (Charles)."},{q:"What is diffusion? Explain Graham's Law, factors affecting evaporation and sublimation with daily life examples.",a:"Diffusion: spontaneous intermixing due to random motion from high to low concentration. Types: diffusion in gases fastest, liquids slow, solids negligible. Effusion: gas escape through hole. Graham: r1/r2=√(M2/M1). Example: NH3 (17) and HCl (36.5) experiment white ring near HCl. Factors evaporation: 1) Temperature ↑ KE ↑ evaporation ↑ 2) Surface area ↑ ↑ 3) Humidity ↓ ↑ 4) Wind speed ↑ ↑ 5) Nature: volatile liquids (ether) evaporate faster. Sublimation: solids with weak van der Waals but strong vapor pressure sublime. Daily: naphthalene in cupboards, dry ice for ice cream, iodine purification. Importance in freeze-drying food."},{q:"Describe effect of temperature and pressure on interconversion and explain evaporation vs boiling in detail.",a:"Temperature effect: Heating increases KE, overcomes intermolecular forces, causes melting and boiling. Cooling decreases KE, causes condensation and freezing. Pressure effect: Increases boiling point and melting point (except ice which melts under pressure - skating). Phase diagram shows triple point. Evaporation vs Boiling detailed 5 points already listed. Evaporation applications: cooling of earthen pot (matka) due to evaporation through pores, sweating mechanism, acetone cooling. Boiling: requires nucleation sites, bubbling throughout, needs continuous heat. Boiling point depends on external pressure: at Murree (lower pressure) water boils below 100°C, in pressure cooker above 100°C."}],numericals:[{title:"Boyle's Law Numerical",statement:"A gas occupies 500 cm³ at 1.5 atm. What volume will it occupy at 3 atm?",solution:["P1=1.5 atm, V1=500, P2=3 atm","P1V1=P2V2 => V2=1.5*500/3","V2=250 cm³"],answer:"250 cm³"},{title:"Charles Law + Avogadro",statement:"2 moles gas at RTP occupies 48 dm³. What volume will 6 moles occupy at same conditions?",solution:["At RTP, V ∝ n","V1/n1=V2/n2 => 48/2=V2/6","V2=144 dm³","Alternatively 6*24=144 dm³"],answer:"144 dm³"},{title:"Combined Gas Law",statement:"Gas volume 300 cm³ at 27°C and 2 atm. Find volume at 127°C and 3 atm.",solution:["T1=300K, T2=400K","P1V1/T1=P2V2/T2 => V2=2*300*400/(3*300)=266.66 cm³"],answer:"266.66 cm³"}]},{id:"15",number:15,title:"Mole Concept & Stoichiometry",urduTitle:"مول کا تصور اور اسٹائیکیومیٹری",icon:"⚖️",mcqCount:14,learningOutcomes:["Calculate molar volume at RTP = 24 dm³ and STP = 22.4 dm³","Define limiting reactant, theoretical yield, percentage yield and purity","Solve problems of concentration: molarity, mass/volume","Calculate moles from volume at RTP using n = V/24","Explain Avogadro's Law and its applications"],thingsToKnow:["Mole","Avogadro's Number","Molar Volume","Limiting Reactant","Theoretical Yield","Percentage Yield","Percentage Purity","Molarity"],didYouKnow:[{title:"Avogadro's Number is Huge!",text:"6.02×10²³ - If you had this many one-rupee coins, you could cover entire Pakistan with 1km thick layer!"},{title:"RTP vs STP",text:"RTP (25°C, 1 atm) molar volume = 24 dm³, STP (0°C, 1 atm) = 22.4 dm³. Punjab Board uses RTP for calculations."}],interestingInfo:"1 mole pani = 18g = 18ml = 6.02×10²³ molecules! Itna chhota amount mein itne zyada molecules!",notes:[{heading:"1. Mole Concept & Molar Volume (مول کا تصور)",content:"Mole is amount of substance containing 6.02×10²³ particles (Avogadro's number). Molar mass = mass of 1 mole in grams equals atomic/molecular mass. Molar volume: At STP (0°C, 1 atm) = 22.4 dm³/mol, At RTP (25°C, 1 atm) = 24 dm³/mol - this is used in Punjab Board 2026. Formula: Number of moles = Volume of gas at RTP / 24 dm³. Example: 15 moles ammonia at RTP = 15×24 = 360 dm³ (MCQ Q1). For CH4, 18 dm³ at RTP moles = 18/24 = 0.75 moles (MCQ Q2). Concentration: Molarity = moles / volume(dm³), mass concentration = mass / volume. Example: KOH 2g in 100cm³ = moles KOH =2/56=0.0357 mol, volume=0.1 dm³, molarity=0.357≈0.36 mol/dm³ (MCQ Q3). NaCl 15 dm³ ×0.7g/dm³=10.5g (MCQ Q4).",quickCheck:{q:"Calculate moles in 48 dm³ CO2 at RTP",a:"Moles =48/24=2 moles"}},{heading:"2. Limiting Reactant & Theoretical Yield",content:"Limiting Reactant (محدود عامل) is reactant that is completely consumed and limits amount of product. Excess reactant remains leftover. Example: 2H2 + O2 →2H2O, if 4 mol H2 and 1 mol O2, O2 is limiting because needs 2 mol O2 for 4 mol H2. Theoretical Yield is maximum product calculated from balanced equation assuming 100% conversion. Actual Yield is experimentally obtained. Percentage Yield = (Actual/Theoretical)×100. Percentage Purity = (Pure mass/Impure sample mass)×100. Example: If limestone sample 80% pure CaCO3, 100g sample contains 80g pure. These concepts critical for industrial chemistry to reduce waste and cost. Formula: % yield tells efficiency, % purity tells quality.",quickCheck:{q:"Define limiting reactant with example",a:"Reactant that finishes first and stops reaction. Like in making sandwiches if 10 bread slices and 3 cheese slices (need 1 cheese per sandwich), cheese is limiting, only 3 sandwiches."}},{heading:"3. Concentration Terms - Molarity, Mass Concentration",content:"Molarity (M) = moles solute / volume solution in dm³ (mol/dm³). Mass concentration = mass solute (g) / volume (dm³) = g/dm³. Relationship: Molarity = mass concentration / molar mass. Example: H2SO4 concentration 0.1 mol/dm³ means 9.8g/dm³ because M H2SO4=98. Problems: 1) Find mass of NaOH needed to make 0.5 dm³ of 0.2M solution: moles=0.5×0.2=0.1 mol, mass=0.1×40=4g. 2) Molecular formula determination: Empirical formula mass vs molecular mass. If molecular formula C6H10O6? Actually C6H12O6 glucose? Example: Empirical CH2O (30) molecular 180, n=6 so C6H12O6. Calculation steps: % composition → moles ratio → empirical → molecular using molar mass. Avogadro's Law: Equal volumes equal moles at same T&P. So volume ratio = mole ratio for gases: N2 +3H2 →2NH3, volume ratio 1:3:2.",quickCheck:{q:"Formula for percentage yield?",a:"% Yield = Actual Yield / Theoretical Yield ×100"}},{heading:"4. Stoichiometry - Balancing & Calculations",content:"Stoichiometry (اسٹائیکیومیٹری) from Greek stoicheion=element, metron=measure. Steps: 1) Balance equation 2) Convert given mass/volume to moles 3) Use mole ratio from equation 4) Convert moles of required to mass/volume. Types: Mass-Mass, Mass-Volume, Volume-Volume. Example: How much O2 needed to burn 16g CH4? CH4+2O2→CO2+2H2O, moles CH4=16/16=1 mol, need 2 mol O2, mass O2=2×32=64g, volume at RTP=2×24=48 dm³. Limiting reactant problems: Calculate moles of each reactant, divide by coefficient, smallest value is limiting. Percentage purity problems: If impure sample, first find pure mass using % purity then calculate. All numericals in exercise solved with this method."}],definitions:[{term:"Mole",eng:"Amount containing 6.02×10²³ particles",urdu:"مقدار جس میں 6.02×10²³ ذرات ہوں"},{term:"Molar Volume at RTP",eng:"Volume of 1 mole gas at 25°C and 1 atm = 24 dm³",urdu:"ایک مول گیس کا حجم 25 ڈگری پر 24 ڈیسی میٹر کیوب"},{term:"Limiting Reactant",eng:"Reactant that is completely consumed and limits product formation",urdu:"وہ عامل جو مکمل استعمال ہو کر پیداوار کو محدود کرے"},{term:"Theoretical Yield",eng:"Maximum amount of product calculated from balanced equation",urdu:"مساوات سے حساب کردہ زیادہ سے زیادہ نظری پیداوار"},{term:"Percentage Yield",eng:"(Actual/Theoretical)×100, measures efficiency",urdu:"اصل اور نظری پیداوار کی نسبت"},{term:"Molarity",eng:"Moles of solute per dm³ of solution",urdu:"ایک ڈیسی میٹر کیوب میں حل شدہ مولز کی تعداد"}],examples:[{title:"Example 15.1 - RTP Volume",problem:"Calculate volume of 15 moles ammonia at RTP",steps:["At RTP 1 mole =24 dm³","15 moles =15×24","=360 dm³"],answer:"360 dm³ (MCQ Q1 answer)"},{title:"Example 15.2 - Moles from Volume",problem:"18 dm³ CH4 at RTP, how many moles?",steps:["Moles = Volume/24","=18/24=0.75"],answer:"0.75 moles (MCQ Q2)"},{title:"Example 15.3 - Molarity",problem:"2g KOH in 100cm³ solution, find molarity",steps:["Moles KOH=2/56=0.0357","Volume=100cm³=0.1 dm³","Molarity=0.0357/0.1=0.357≈0.36 mol/dm³"],answer:"0.36 mol/dm³ (MCQ Q3)"},{title:"Example 15.18 from book",problem:"15 dm³ solution contains 0.7g/dm³ NaCl, find total mass",steps:["Mass concentration=0.7g/dm³","Volume=15 dm³","Mass=0.7×15=10.5g"],answer:"10.5g (MCQ Q4)"}],mcqs:[{q:"Volume of 15 moles ammonia at RTP is:",options:["360 dm³","24 dm³","15 dm³","240 dm³"],correct:0,explanation:"15×24=360 dm³ at RTP"},{q:"18 dm³ CH4 at RTP contains how many moles?",options:["0.75","1.5","0.5","2"],correct:0,explanation:"18/24=0.75 mol"},{q:"2g KOH in 100cm³, molarity is:",options:["0.36 mol/dm³","3.6","0.036","0.0036"],correct:0,explanation:"Moles=2/56=0.0357, Vol=0.1dm³, M=0.357"},{q:"15 dm³ of 0.7g/dm³ NaCl contains:",options:["10.5g","7g","15g","0.7g"],correct:0,explanation:"Mass=conc×vol=0.7×15=10.5g"},{q:"H2SO4 conc. 9.8g/dm³, molarity =?",options:["0.1 mol/dm³","1","0.01","0.5"],correct:0,explanation:"Molar mass 98, 9.8/98=0.1"},{q:"Molecular formula of compound with empirical CH2O and molar mass 180 is:",options:["C6H12O6","C6H10O6","C2H4O2","CH2O"],correct:0,explanation:"Empirical mass 30, 180/30=6, so C6H12O6 glucose. Option C6H10O6 is close but correct is C6H12O6"},{q:"Percentage yield formula:",options:["Actual/Theoretical×100","Theoretical/Actual×100","Actual×Theoretical","Actual+Theoretical"],correct:0,explanation:"Efficiency measure"},{q:"Limiting reactant is:",options:["Fully consumed","In excess","Catalyst","Never consumed"],correct:0,explanation:"Limits product, finishes first"},{q:"Molar volume at STP:",options:["22.4 dm³","24 dm³","22.414 dm³","Both a and c"],correct:3,explanation:"At 0°C 22.4 dm³, more precisely 22.414"},{q:"Avogadro's number:",options:["6.02×10²³","6.02×10²⁴","3.01×10²³","1.6×10⁻¹⁹"],correct:0,explanation:"Particles per mole"},{q:"If actual yield 40g, theoretical 50g, % yield:",options:["80%","20%","90%","100%"],correct:0,explanation:"40/50×100=80%"},{q:"Molarity of solution with 58.5g NaCl in 1 dm³:",options:["1M","0.5M","2M","0.1M"],correct:0,explanation:"M NaCl=58.5, moles=1, vol=1 =>1M"},{q:"Which is excess reactant if 4 mol H2 and 2 mol O2 for 2H2+O2→2H2O?",options:["O2","H2","None","Both"],correct:1,explanation:"Need 2 H2 per O2, 2 O2 needs 4 H2 exactly stoichiometric, but if 4 H2 and 1 O2, H2 excess. For 4H2+2O2 exact."},{q:"Percentage purity = ",options:["Pure/Impure×100","Impure/Pure×100","Pure×Impure","Pure+Impure"],correct:0,explanation:"Quality measure"}],shortQuestions:[{q:"Define mole and Avogadro's number.",a:"Mole is amount with 6.02×10²³ particles. Avogadro's number N_A =6.02×10²³ is particles per mole, named after Amedeo Avogadro."},{q:"What is molar volume at RTP and STP?",a:"At RTP (25°C,1atm) 1 mol gas=24 dm³. At STP (0°C,1atm) =22.4 dm³. Punjab board uses RTP 24 dm³ for 10th."},{q:"Define limiting reactant with example (15.2).",a:"Reactant that consumes first and limits product. Example: If 10g H2 and 100g O2, H2 limiting. Analogy: If 10 bread and 2 cheese, cheese limiting for sandwiches."},{q:"What is theoretical yield vs actual yield?",a:"Theoretical is calculated max from equation (100% efficient). Actual is obtained experimentally, always less due to side reactions, incomplete, losses. %Yield = Actual/Theoretical×100."},{q:"Define molarity and mass concentration.",a:"Molarity = moles/dm³ solution (mol/dm³). Mass concentration = g/dm³. Relation: Molarity = mass conc / molar mass."},{q:"Calculate volume of 0.5 mol O2 at RTP.",a:"Volume = moles×24 =0.5×24=12 dm³."},{q:"Define percentage purity.",a:"% Purity = (mass pure / mass impure sample)×100. Example: 80g pure in 100g sample =>80% pure."},{q:"State Avogadro's Law.",a:"Equal volumes of gases at same T&P contain equal number of molecules. V∝n. Volume ratio = mole ratio for gaseous reactions."}],longQuestions:[{q:"Explain mole concept, molar volume at RTP/STP and solve problems 15.1-15.4.",a:"Mole: counting unit for atoms/molecules, like dozen for eggs. 1 mole =6.02×10²³ particles, mass = atomic mass in grams. Molar volume: At STP 22.4 dm³, RTP 24 dm³. Derivations: n=V/24 at RTP. Problems: Q1 15 mol NH3 at RTP=360 dm³, Q2 18 dm³ CH4=0.75 mol, Q3 KOH 2g/100cm³: moles=2/56=0.0357, vol=0.1 dm³, M=0.357, Q4 NaCl mass=10.5g, Q5 H2SO4 conc=0.1M. Steps shown in examples. Importance in stoichiometry for gas calculations without weighing."},{q:"What is limiting reactant, theoretical yield, percentage yield and purity? Explain with industrial importance.",a:"Limiting reactant: reactant completely consumed first, determines product amount. How to find: divide moles by coefficient, smallest is limiting. Theoretical yield: max product from balanced equation using limiting reactant. Actual yield: experimental. %Yield = Actual/Theoretical×100. %Purity = Pure/Impure×100. Industrial importance: Identify limiting to avoid waste, calculate efficiency, cost analysis, quality control. Example: Haber process N2+3H2→2NH3, if H2 limiting, production limited. Percentage yield <100% due to reversible reactions, side reactions, handling losses. High % yield means profitable industry."},{q:"Describe concentration terms and numericals based on molarity.",a:"Concentration: amount solute per volume solution. Molarity (M) = moles/dm³, Mass conc = g/dm³, %w/w, %w/v, ppm. Problems: 1) Find molarity if 4g NaOH in 0.5 dm³: moles=0.1, M=0.2M. 2) Mass needed for 0.1M H2SO4 1 dm³: moles=0.1, mass=9.8g. 3) Dilution law: M1V1=M2V2. 4) Molecular formula from empirical: Find empirical from % composition, find n = molecular mass/empirical mass. Example glucose: Empirical CH2O 30, molecular 180, n=6 => C6H12O6. All board numericals use these formulas."},{q:"Explain stoichiometry and its types with balanced equation calculations.",a:"Stoichiometry: quantitative relationship between reactants/products. Steps: balance equation, convert given to moles, use mole ratio, convert back. Types: Mass-Mass (both masses), Mass-Volume (mass to gas volume using 24 dm³), Volume-Volume (gas volumes ratio = mole ratio). Example: CaCO3→CaO+CO2, 100g CaCO3 (1 mol) gives 1 mol CaO 56g and 1 mol CO2 24 dm³ at RTP. Limiting reactant stoichiometry: first find limiting then calculate product. Percentage purity stoichiometry: find pure mass first then moles. Example: 80% pure limestone 100g contains 80g CaCO3 =0.8 mol produces 0.8 mol CO2 =19.2 dm³ at RTP. This chapter is most numerical-heavy for board."}],numericals:[{title:"RTP Volume",statement:"Calculate mass of 48 dm³ CO2 at RTP",solution:["Moles=48/24=2 mol","Molar mass CO2=44","Mass=2×44=88g"],answer:"88g"},{title:"Molarity Numerical",statement:"Find molarity if 8g NaOH in 200cm³ solution",solution:["Moles=8/40=0.2","Volume=0.2 dm³","Molarity=0.2/0.2=1M"],answer:"1 mol/dm³"},{title:"Limiting Reactant",statement:"4g H2 and 32g O2 react to form water. Find limiting and mass of water formed.",solution:["Moles H2=4/2=2 mol, O2=32/32=1 mol","Reaction: 2H2+O2→2H2O","Need 2 H2 per 1 O2, both exact stoichiometric","Water moles=2 mol, mass=2×18=36g","No limiting, both exact"],answer:"36g water"},{title:"Percentage Yield",statement:"Theoretical yield 50g, actual 40g, find % yield",solution:["%Yield=Actual/Theoretical×100","=40/50×100=80%"],answer:"80%"}]}],d1=[{id:"16",number:16,title:"Chemical Equilibrium",urduTitle:"کیمیائی توازن",icon:"⚖️",mcqCount:10,learningOutcomes:["Define reversible reactions","Explain dynamic equilibrium","Law of mass action","Le Chatelier principle"],thingsToKnow:["Reversible","Dynamic Equilibrium","Kc","Le Chatelier"],didYouKnow:[{title:"Equilibrium",text:"At equilibrium, forward and reverse rates equal, but concentrations constant not equal"}],interestingInfo:"Haber process uses high pressure to favor ammonia production - Le Chatelier!",notes:[{heading:"1. Reversible Reactions & Dynamic Equilibrium",content:"Reversible reactions can go both directions: N2+3H2⇌2NH3. In closed system, initially forward fast, reverse slow, eventually rates equal - dynamic equilibrium (متحرک توازن). At equilibrium, macroscopic properties constant but microscopic reactions continue both ways. Characteristics: occurs in closed system, constant temperature, forward and reverse rates equal, concentrations constant but not necessarily equal, equilibrium is dynamic not static.",quickCheck:{q:"What is dynamic equilibrium?",a:"State where forward and reverse rates equal, concentrations constant, but reactions continue both ways."}},{heading:"2. Law of Mass Action & Kc",content:"For aA+bB⇌cC+dD, Kc=[C]^c[D]^d/[A]^a[B]^b. Kc is equilibrium constant concentration. Large Kc>1 favors products, small Kc<1 favors reactants. Kc only changes with temperature. Example: For N2+3H2⇌2NH3, Kc=[NH3]²/[N2][H2]³. Units depend on Δn. At equilibrium, no net change but Kc expression holds."},{heading:"3. Le Chatelier's Principle",content:"If stress applied to equilibrium, system shifts to counteract stress. Effect of concentration: adding reactant shifts to product, removing product shifts to product. Effect of pressure: increase pressure favors side with fewer moles gas. N2+3H2⇌2NH3, 4 moles →2 moles, high pressure favors NH3. Effect of temperature: For exothermic forward, increase T favors reverse (endothermic). For N2+3H2→2NH3 ΔH=-92kJ, low T favors NH3 but slow rate, so optimum 400-500°C with catalyst iron. Effect of catalyst: does not shift equilibrium, only attains faster."}],definitions:[{term:"Reversible Reaction",eng:"Reaction that proceeds in both forward and backward directions",urdu:"وہ عمل جو دونوں سمتوں میں ہو"},{term:"Dynamic Equilibrium",eng:"State where forward and reverse rates equal",urdu:"متحرک توازن جہاں آگے اور پیچھے کی رفتار برابر"},{term:"Kc",eng:"Equilibrium constant in terms of concentration",urdu:"توازن مستقل ارتکاز کے لحاظ سے"}],examples:[{title:"Kc Calculation",problem:"For H2+I2⇌2HI, at equilibrium [H2]=0.1, [I2]=0.1, [HI]=0.8, find Kc",steps:["Kc=[HI]²/[H2][I2]","=(0.8)²/(0.1×0.1)=0.64/0.01=64"],answer:"64"}],mcqs:[{q:"At equilibrium, forward and reverse rates are:",options:["Equal","Zero","Different","Infinite"],correct:0,explanation:"Dynamic equilibrium definition"},{q:"Kc for N2+3H2⇌2NH3 is:",options:["[NH3]²/[N2][H2]³","[N2][H2]/[NH3]","[NH3]/[N2][H2]","[N2][H2]³/[NH3]²"],correct:0,explanation:"Law of mass action"},{q:"Increase in pressure favors:",options:["Fewer moles side","More moles side","No effect","Catalyst"],correct:0,explanation:"Le Chatelier"},{q:"Catalyst at equilibrium:",options:["No shift, only speed","Shifts to product","Shifts to reactant","Changes Kc"],correct:0,explanation:"Catalyst speeds both directions equally"},{q:"For exothermic forward, increase T favors:",options:["Reverse","Forward","No change","Both"],correct:0,explanation:"Le Chatelier: heat as product"},{q:"Equilibrium occurs in:",options:["Closed system","Open system","Both","Isolated only"],correct:0,explanation:"Must be closed"},{q:"Large Kc means:",options:["Products favored","Reactants favored","No reaction","Equal"],correct:0,explanation:"Kc>1 products more"},{q:"Haber process optimum conditions:",options:["High P low T catalyst","Low P high T","Low P low T","High P high T"],correct:0,explanation:"High P favors fewer moles, low T favors exothermic but need moderate T for rate"},{q:"Dynamic equilibrium is:",options:["Microscopically dynamic macroscopically static","Completely static","No reactions","Only forward"],correct:0,explanation:"Reactions continue both ways"},{q:"Effect of adding product at equilibrium:",options:["Shifts to reactant","Shifts to product","No effect","Stops"],correct:0,explanation:"Counteracts by consuming product"}],shortQuestions:[{q:"Define reversible reaction with example",a:"Can go both ways: N2+3H2⇌2NH3"},{q:"What is dynamic equilibrium?",a:"Forward and reverse rates equal, concentrations constant"},{q:"State law of mass action",a:"Rate ∝ product of active masses raised to stoichiometric coefficient"},{q:"Define Kc",a:"Equilibrium constant concentration ratio products/reactants"},{q:"State Le Chatelier principle",a:"If stress applied, system shifts to counteract stress"},{q:"Effect of pressure on N2+3H2⇌2NH3",a:"High pressure favors NH3 side (fewer moles)"},{q:"Effect of temperature on exothermic reaction",a:"Increase T favors endothermic direction (reverse for exothermic forward)"},{q:"Does catalyst affect Kc?",a:"No, only attains equilibrium faster, Kc depends only on T"}],longQuestions:[{q:"Explain reversible reactions and dynamic equilibrium with characteristics",a:"Reversible reactions proceed both ways, represented by ⇌. Initially forward rate high, reverse low, eventually equal - dynamic equilibrium. Characteristics: closed system, constant T, rates equal, concentrations constant, dynamic not static, can be approached from either side. Examples: evaporation/condensation in closed container, N2+3H2⇌2NH3. Graphs: concentration vs time plateaus, rate vs time equal at equilibrium."},{q:"Derive law of mass action and explain Kc with example",a:"Law: Rate ∝ [A]^a[B]^b. At equilibrium forward rate = reverse rate, so k_f[A]^a[B]^b = k_r[C]^c[D]^d => Kc=k_f/k_r=[C]^c[D]^d/[A]^a[B]^b. Kc constant at given T. Large Kc product favored. Example H2+I2⇌2HI Kc=64 product favored. Units depend on Δn. Kc only T dependent."},{q:"State and explain Le Chatelier's principle with Haber process application",a:"If stress applied (conc, P, T), system shifts to counteract. Concentration: add reactant shift product. Pressure: increase P favors fewer gas moles. Temperature: increase T favors endothermic direction. Catalyst no shift. Haber: N2+3H2⇌2NH3 ΔH=-92kJ, 4 mol→2 mol. High pressure (200-300 atm) favors NH3, low temperature favors NH3 but rate slow, so optimum 450°C with Fe catalyst. Removing NH3 by condensation shifts forward. Industrial conditions compromise."},{q:"Discuss industrial importance of equilibrium",a:"Contact process 2SO2+O2⇌2SO3, Haber process, esterification, etc. Understanding Kc helps optimize yield, conditions chosen via Le Chatelier, catalyst speeds attainment, removal of product drives forward. Equilibrium concept used in blood buffer, oxygen hemoglobin equilibrium."}],numericals:[{title:"Kc Numerical",statement:"Find Kc for 2SO2+O2⇌2SO3 if [SO2]=0.2, [O2]=0.1, [SO3]=0.4",solution:["Kc=[SO3]²/[SO2]²[O2]=0.16/(0.04×0.1)=40"],answer:"40"},{title:"Le Chatelier Volume",statement:"For N2+3H2⇌2NH3, Δn=-2, what happens if pressure doubled?",solution:["High pressure favors fewer moles side","Product side 2 moles vs 4 moles reactant","Equilibrium shifts to NH3 (product)"],answer:"Shifts to product"},{title:"Temperature Effect",statement:"Reaction exothermic forward, what happens if T increased?",solution:["Heat is product for exothermic","Increase T adds heat","Shifts to reactant side (reverse favored)"],answer:"Shifts to reactant"}]},{id:"17",number:17,title:"Acids, Bases and Salts",urduTitle:"تیزاب، اساس اور نمکیات",icon:"\uD83E\uDDEA",mcqCount:12,learningOutcomes:["Define acids, bases, salts theories","Explain pH and its importance","Salt preparation and types","Neutralization reactions"],thingsToKnow:["Acid","Base","pH","Salt","Neutralization"],didYouKnow:[{title:"Stomach Acid",text:"Stomach HCl pH ~1-2 strong enough to dissolve metal but mucus protects lining!"}],interestingInfo:"Lemon mein citric acid, imli mein tartaric acid, ant bite mein formic acid hota hai!",notes:[{heading:"1. Concepts of Acids and Bases",content:"Arrhenius: Acid gives H+ in water, Base gives OH-. Bronsted-Lowry: Acid proton donor, Base proton acceptor. Lewis: Acid electron pair acceptor, Base electron pair donor. Examples: HCl acid (H+ donor), NH3 base (H+ acceptor, lone pair donor). Conjugate acid-base pairs: HCl/Cl-, NH4+/NH3. Strong acids: HCl, H2SO4, HNO3 fully ionize. Weak acids: CH3COOH, H2CO3 partially ionize. Strong bases: NaOH, KOH fully ionize. Weak bases: NH4OH, organic amines. Properties: Acids sour, turn blue litmus red, pH<7, react with metals to give H2, with bases to give salt+water. Bases bitter, slippery, turn red litmus blue, pH>7."},{heading:"2. pH Scale and Importance",content:"pH = -log[H+], pOH=-log[OH-], pH+pOH=14. Scale 0-14: 0-6.9 acidic, 7 neutral, 7.1-14 basic. pH of common: gastric juice 1, lemon 2, vinegar 3, rain 5.6, blood 7.4, sea water 8, milk of magnesia 10. Importance: Blood pH 7.4 tightly controlled by bicarbonate buffer, slight change fatal. Soil pH affects crop growth, acidic soil needs lime, basic needs gypsum. Tooth decay if pH<5.5 in mouth, bacteria produce acids. pH of stomach for digestion. Industrial pH control in chemical industry."},{heading:"3. Salts - Types and Preparation",content:"Salt is ionic compound formed when acid H+ replaced by metal. Types: Normal salt (all H replaced) NaCl, Acidic salt (partial replacement) NaHSO4, Basic salt (with OH) Pb(OH)Cl, Double salt (two salts crystallize together) Mohr salt FeSO4.(NH4)2SO4.6H2O, Complex salt K4[Fe(CN)6], Mixed salt NaKSO4. Preparation: Acid+Base neutralization, Acid+Metal, Acid+Metal oxide, Acid+Metal carbonate. Example: HCl+NaOH→NaCl+H2O. Characteristics: ionic, high melting, water soluble (except some), electrolyte. Uses: NaCl table salt, Na2CO3 washing soda, NaHCO3 baking soda, CuSO4 fungicide."}],definitions:[{term:"Acid",eng:"Substance that gives H+ in water or proton donor",urdu:"تیزاب جو پانی میں H+ دے"},{term:"Base",eng:"Substance that gives OH- or proton acceptor",urdu:"اساس جو OH- دے"},{term:"pH",eng:"Negative log of hydrogen ion concentration",urdu:"ہائیڈروجن آئن ارتکاز کا منفی لاگ"},{term:"Salt",eng:"Ionic compound formed by replacement of acid H by metal",urdu:"نمک تیزاب کے H کی جگہ دھات آنے سے بنتا ہے"}],examples:[{title:"pH Calculation",problem:"[H+]=0.01M, find pH",steps:["pH=-log[H+]","=-log(0.01)= -log(10^-2)=2"],answer:"pH=2"}],mcqs:[{q:"pH of neutral solution is:",options:["7","0","14","1"],correct:0,explanation:"pH 7 neutral at 25°C"},{q:"Acid turns blue litmus:",options:["Red","Blue","Green","No change"],correct:0,explanation:"Acidic property"},{q:"Strongest acid pH:",options:["1","7","14","5"],correct:0,explanation:"Low pH strong acid"},{q:"Bronsted acid is:",options:["Proton donor","Proton acceptor","Electron donor","Electron acceptor"],correct:0,explanation:"Bronsted-Lowry definition"},{q:"Salt of strong acid strong base is:",options:["Neutral","Acidic","Basic","No salt"],correct:0,explanation:"NaCl neutral pH7"},{q:"Blood pH:",options:["7.4","1","14","0"],correct:0,explanation:"Tightly regulated 7.35-7.45"},{q:"Lewis acid is:",options:["Electron pair acceptor","Donor","Proton donor","OH- donor"],correct:0,explanation:"Lewis definition"},{q:"Baking soda is:",options:["NaHCO3","Na2CO3","NaCl","NaOH"],correct:0,explanation:"Sodium bicarbonate"},{q:"pH + pOH =",options:["14","7","0","1"],correct:0,explanation:"At 25°C Kw=10^-14"},{q:"Conjugate base of HCl is:",options:["Cl-","H2Cl+","HCl2","H+"],correct:0,explanation:"Remove H+"},{q:"Acidic salt example:",options:["NaHSO4","NaCl","KNO3","CaCO3"],correct:0,explanation:"Partial replacement"},{q:"Tooth decay starts when mouth pH <",options:["5.5","7","8","10"],correct:0,explanation:"Acid dissolves enamel"}],shortQuestions:[{q:"Define Arrhenius acid and base",a:"Acid gives H+ in water, Base gives OH- in water"},{q:"What is Bronsted-Lowry concept?",a:"Acid proton donor, Base proton acceptor, conjugate pairs formed"},{q:"Define Lewis acid-base",a:"Acid electron pair acceptor, Base electron pair donor"},{q:"What is pH? Importance?",a:"-log[H+], measures acidity, important in blood, soil, industry"},{q:"Define salt and its types",a:"Ionic compound from acid H replaced by metal. Types: normal, acidic, basic, double, complex"},{q:"What is neutralization?",a:"Acid+Base→Salt+Water, e.g., HCl+NaOH→NaCl+H2O"},{q:"pH of blood and stomach",a:"Blood 7.4, stomach 1-2"},{q:"Preparation of salts - 2 methods",a:"Acid+Base, Acid+Metal, Acid+Metal oxide, Acid+Carbonate"}],longQuestions:[{q:"Explain three concepts of acids and bases with examples",a:"Arrhenius: in water H+/OH-, limitation not explain NH3 basic, non-aqueous. Bronsted: proton donor/acceptor, explains conjugate pairs, e.g., NH3+H2O⇌NH4++OH-, NH3 base, H2O acid, NH4+ conjugate acid. Lewis: electron pair, explains BF3 acid (incomplete octet accepts pair), NH3 base donates lone pair. Lewis most general includes all. Strong/weak distinction based on ionization."},{q:"Explain pH scale, calculation and its importance in daily life",a:"pH=-log[H+], 0-14, <7 acidic, 7 neutral, >7 basic. Calculation examples. Importance: human blood buffer H2CO3/HCO3- maintains 7.4, soil pH affects nutrients availability, acidic soil Al toxicity, basic reduces Fe availability. Tooth decay pH<5.5 bacteria ferment sugar to acids. Acid rain pH 5.6→4 damages buildings, aquatic life. Industrial pH control in electroplating, tanning, textile. pH paper, universal indicator."},{q:"Describe salts, types, preparation, uses",a:"Salt formation replacing H of acid by metal. Types: normal NaCl (all H replaced), acidic NaHSO4 (partial), basic Pb(OH)Cl (with OH), double Mohr salt (two salts together), complex K4[Fe(CN)6], mixed NaKSO4. Preparation 4 methods with equations. Properties: ionic, high mp, soluble except AgCl, BaSO4, etc. Uses: NaCl food preservative, de-icing, chlor-alkali industry; Na2CO3 washing, glass; NaHCO3 baking, antacid; CuSO4 fungicide Bordeaux mixture; etc."},{q:"Explain neutralization and acid-base titrations",a:"Neutralization acid+base→salt+water, exothermic, pH 7 for strong-strong, acidic for strong acid weak base, basic for weak acid strong base. Titration determines concentration using indicator. Equivalence point where moles equal. Indicators: phenolphthalein pink in base, colorless in acid (pH 8-10), methyl orange red in acid yellow in base (pH 3-4.5). Applications: determine unknown concentration, antacid testing."}],numericals:[{title:"pH Numerical",statement:"Find pH if [H+]=1×10^-3 M",solution:["pH=-log(10^-3)=3"],answer:"3 (acidic)"},{title:"pOH",statement:"[OH-]=10^-5, find pH",solution:["pOH=5","pH=14-5=9"],answer:"9 (basic)"},{title:"Salt Mass",statement:"How much NaCl formed when 4g NaOH reacts with HCl?",solution:["Moles NaOH=4/40=0.1","1:1 ratio gives 0.1 mol NaCl","Mass=0.1×58.5=5.85g"],answer:"5.85g"}]},{id:"18",number:18,title:"Electrochemistry",urduTitle:"برقی کیمیا",icon:"\uD83D\uDD0B",mcqCount:10,learningOutcomes:["Define electrochemistry, oxidation, reduction","Galvanic and electrolytic cells","Electrolysis applications"],thingsToKnow:["Oxidation","Reduction","Anode","Cathode","Electrolysis"],didYouKnow:[{title:"Battery",text:"First battery Voltaic pile 1800 by Alessandro Volta"}],interestingInfo:"Electroplating se sasta metal par mehenga metal chadhaya jata hai jaise lohay par chromium!",notes:[{heading:"1. Oxidation-Reduction & Electrochemistry",content:"Oxidation: loss of electrons, increase oxidation number, e.g., Zn→Zn2++2e-. Reduction: gain electrons, decrease oxidation number, Cu2++2e-→Cu. Oxidizing agent gains electrons itself reduced, reducing agent loses electrons itself oxidized. Electrochemistry studies interconversion electrical and chemical energy. Galvanic cell converts chemical to electrical (battery), Electrolytic cell converts electrical to chemical (electrolysis).",quickCheck:{q:"Define oxidation in terms of electrons",a:"Loss of electrons"}},{heading:"2. Galvanic Cell - Daniel Cell",content:"Daniel cell: Zn electrode in ZnSO4, Cu electrode in CuSO4, salt bridge. Zn oxidizes at anode (negative): Zn→Zn2++2e-, electrons flow external circuit to Cu cathode (positive) where Cu2++2e-→Cu. Cell notation: Zn|Zn2+||Cu2+|Cu, E°cell = E°cathode - E°anode = 0.34-(-0.76)=1.10V. Salt bridge completes circuit via ions. Uses: batteries, fuel cells. Dry cell: Zn anode, MnO2 cathode, NH4Cl electrolyte, 1.5V. Lead-acid battery rechargeable, 2V per cell, 12V car battery."},{heading:"3. Electrolysis and Applications",content:"Electrolysis: passing electricity through electrolyte causes decomposition. At cathode reduction, anode oxidation. Example: molten NaCl electrolysis produces Na at cathode, Cl2 at anode. Aqueous NaCl gives H2 at cathode, Cl2 at anode, NaOH remains. Faraday's laws: mass deposited ∝ charge (Q=It), mass ∝ equivalent weight. Applications: Electroplating (silver on spoons, chromium on cars for corrosion resistance), refining of copper (impure Cu anode, pure Cu cathode), extraction of Al via Hall-Heroult, manufacturing of Na, Cl2, NaOH via chlor-alkali. Electrolytic refining gives 99.99% pure copper."}],definitions:[{term:"Oxidation",eng:"Loss of electrons",urdu:"الیکٹران کا خارج ہونا"},{term:"Galvanic Cell",eng:"Converts chemical energy to electrical",urdu:"کیمیائی توانائی کو برقی میں بدلتا ہے"},{term:"Electrolysis",eng:"Decomposition by electricity",urdu:"بجلی سے تحلیل"}],examples:[{title:"Cell EMF",problem:"Calculate E°cell for Zn-Cu",steps:["E°Cu=0.34, E°Zn=-0.76","E°cell=0.34-(-0.76)=1.10V"],answer:"1.10V"}],mcqs:[{q:"Oxidation is:",options:["Loss of e-","Gain of e-","Loss of proton","Gain of proton"],correct:0,explanation:"OIL RIG"},{q:"In galvanic cell anode is:",options:["Negative, oxidation","Positive, oxidation","Negative, reduction","Positive, reduction"],correct:0,explanation:"Anode negative oxidation"},{q:"Daniel cell voltage:",options:["1.10V","1.5V","2V","0V"],correct:0,explanation:"Zn-Cu 1.10V"},{q:"Electrolysis of molten NaCl gives at cathode:",options:["Na","Cl2","H2","O2"],correct:0,explanation:"Na+ + e- → Na"},{q:"Which is used for electroplating?",options:["Electrolytic cell","Galvanic","Daniel","Dry cell"],correct:0,explanation:"Needs external electricity"},{q:"Faraday's law relates mass to:",options:["Charge","Voltage only","Temperature","Pressure"],correct:0,explanation:"m ∝ Q = It"},{q:"Lead-acid battery voltage per cell:",options:["2V","1.5V","1.1V","3V"],correct:0,explanation:"2V per cell, 6 cells 12V"},{q:"Reducing agent:",options:["Loses e-, itself oxidized","Gains e-","No change","Catalyst"],correct:0,explanation:"Reduces other by losing electrons"},{q:"Salt bridge function:",options:["Completes circuit, maintains neutrality","Provides electrons","Increases voltage","No function"],correct:0,explanation:"Ion flow"},{q:"Pure copper obtained by:",options:["Electrolytic refining","Heating","Galvanic","No method"],correct:0,explanation:"Impure anode, pure cathode"}],shortQuestions:[{q:"Define oxidation and reduction",a:"Loss and gain of electrons respectively"},{q:"What is galvanic cell?",a:"Converts chemical to electrical spontaneously"},{q:"Define anode and cathode",a:"Anode oxidation, Cathode reduction"},{q:"What is salt bridge?",a:"U-tube with electrolyte connecting half cells, maintains neutrality"},{q:"Define electrolysis",a:"Decomposition by electricity"},{q:"What is electroplating?",a:"Coating cheaper metal with expensive via electrolysis"},{q:"State Faraday's first law",a:"Mass deposited ∝ charge passed"},{q:"Uses of electrolysis",a:"Electroplating, refining, extraction of metals, manufacturing chemicals"}],longQuestions:[{q:"Explain galvanic cell with Daniel cell construction",a:"Two half cells Zn/ZnSO4 and Cu/CuSO4, salt bridge, external wire. At anode Zn oxidizes releasing electrons, electrons flow to cathode where Cu2+ reduces to Cu. Salt bridge allows ion flow. Cell notation Zn|Zn2+||Cu2+|Cu. E°cell=1.10V. Spontaneous ΔG=-ve. Dry cell, lead-acid examples."},{q:"Describe electrolysis of molten and aqueous NaCl",a:"Molten: NaCl→Na+ + Cl-, cathode Na+ + e-→Na, anode 2Cl-→Cl2+2e-. Aqueous: water also electrolyzes, at cathode H2O+e-→H2+OH- favored over Na+ due to reduction potential, at anode Cl-→Cl2 (conc) or H2O→O2 (dilute). So aqueous NaCl gives H2, Cl2, NaOH. Chlor-alkali industry."},{q:"Explain Faraday's laws and applications of electrochemistry",a:"First law: m=ZQ=ZIt, Z=electrochemical equivalent =E/96500. Second law: masses deposited by same charge proportional to equivalent weights. Applications: electroplating for decoration and corrosion protection (Cr on car, Ag on cutlery), refining Cu to 99.99%, extraction Al from bauxite Hall-Heroult, production Na, Cl2, H2, NaOH, etc. Batteries, fuel cells."},{q:"Differentiate galvanic and electrolytic cells",a:"Galvanic: spontaneous, chemical→electrical, anode negative, cathode positive, ΔG -ve, E +ve. Electrolytic: non-spontaneous needs external voltage, electrical→chemical, anode positive, cathode negative, ΔG +ve, E -ve. Examples: Daniel vs electroplating cell."}],numericals:[{title:"Faraday",statement:"How much Cu deposited when 96500 C passed? E_Cu=31.75",solution:["m=EQ/F =31.75×96500/96500=31.75g"],answer:"31.75g"},{title:"Cell EMF",statement:"Calculate Ecell if E°(Ag+/Ag)=0.80, E°(Zn2+/Zn)=-0.76 for Zn+2Ag+→Zn2++2Ag",solution:["Cathode Ag, Anode Zn","E°=0.80-(-0.76)=1.56V"],answer:"1.56V"},{title:"Charge",statement:"Current 2A for 1 hour, find charge",solution:["Q=It=2×3600=7200 C"],answer:"7200 C"}]},{id:"19",number:19,title:"Organic Chemistry Basics",urduTitle:"نامیاتی کیمیا بنیادی",icon:"\uD83E\uDDEC",mcqCount:10,learningOutcomes:["Define organic chemistry","Catenation, isomerism","Functional groups","Homologous series"],thingsToKnow:["Catenation","Isomerism","Functional Group","Homologous Series"],didYouKnow:[{title:"Organic Compounds",text:"Millions of organic compounds exist due to catenation property of carbon!"}],interestingInfo:"Carbon ki catenation power sabse zyada hai - is liye lakhon organic compounds bante hain!",notes:[{heading:"1. Introduction to Organic Chemistry",content:"Organic chemistry is study of carbon compounds except CO, CO2, carbonates, bicarbonates. Carbon forms covalent bonds, tetravalent, catenation (self-linking) forms chains, branches, rings. Properties: low melting/boiling, soluble in non-polar, non-electrolyte, show isomerism. Sources: natural gas, petroleum, coal, plants, animals. Vital force theory rejected by Wohler who synthesized urea from inorganic ammonium cyanate. Classification: open chain (aliphatic) straight and branched, closed chain (alicyclic and aromatic).",quickCheck:{q:"Why so many organic compounds?",a:"Due to catenation, isomerism, multiple bonds, tetravalency of carbon"}},{heading:"2. Functional Groups & Homologous Series",content:"Functional group is atom/group that determines properties: -OH alcohol, -CHO aldehyde, -COOH carboxylic acid, -CO- ketone, -O- ether, -NH2 amine, -X haloalkane, C=C alkene, C≡C alkyne. Homologous series: family with same functional group, same general formula, successive members differ by CH2 (14 mass), similar chemical properties, gradation in physical properties. Example: alkanes CnH2n+2: methane CH4, ethane C2H6, propane C3H8. Alcohols CnH2n+1OH. Importance: predictable properties, naming systematic.",quickCheck:{q:"What is functional group?",a:"Group that gives characteristic properties to organic compound"}},{heading:"3. Isomerism & Naming",content:"Isomerism: compounds same molecular formula different structure/properties. Structural isomerism: chain isomerism (different carbon skeleton e.g., n-butane vs isobutane), position isomerism (functional group position differs e.g., 1-propanol vs 2-propanol), functional group isomerism (different functional groups e.g., ethanol vs dimethyl ether). Stereoisomerism: geometric (cis-trans) due to restricted rotation around C=C. IUPAC naming: identify longest chain containing functional group, number from nearest functional group, name substituents alphabetically, use di, tri for multiples. Example: CH3-CH(CH3)-CH2-OH is 2-methyl-1-propanol."}],definitions:[{term:"Catenation",eng:"Self-linking property of carbon to form chains",urdu:"کاربن کا آپس میں جڑ کر زنجیر بنانا"},{term:"Isomerism",eng:"Same formula different structure",urdu:"ایک ہی فارمولے سے مختلف ساختیں"},{term:"Functional Group",eng:"Group that determines chemical properties",urdu:"وہ گروہ جو کیمیائی خصوصیات متعین کرے"}],examples:[{title:"Isomers of Butane",problem:"Draw isomers of C4H10",steps:["n-butane CH3-CH2-CH2-CH3 straight","Isobutane CH3-CH(CH3)-CH3 branched","Same formula different structure"],answer:"2 isomers"}],mcqs:[{q:"Organic compounds mainly contain:",options:["Carbon","Silicon","Iron","Gold"],correct:0,explanation:"Organic = carbon compounds"},{q:"Catenation is property of:",options:["Carbon self-linking","Hydrogen bonding","Ionic bonding","Metallic"],correct:0,explanation:"Carbon forms chains"},{q:"General formula of alkanes:",options:["CnH2n+2","CnH2n","CnH2n-2","CnH2n+1"],correct:0,explanation:"Saturated hydrocarbons"},{q:"Functional group of alcohol:",options:["-OH","-COOH","-CHO","-CO-"],correct:0,explanation:"Alcohol hydroxyl"},{q:"Isomers have same:",options:["Molecular formula","Structural formula","Both same","No relation"],correct:0,explanation:"Same molecular, different structural"},{q:"Homologous series differ by:",options:["CH2","CH","C2H2","H2"],correct:0,explanation:"14 mass unit"},{q:"Urea was synthesized by:",options:["Wohler","Berzelius","Lavoisier","Dalton"],correct:0,explanation:"1828 rejected vital force"},{q:"Which shows functional isomerism with ethanol?",options:["Dimethyl ether","Methanol","Propane","Ethane"],correct:0,explanation:"C2H6O both: ethanol CH3CH2OH, ether CH3OCH3"},{q:"IUPAC name CH3-CH2-OH:",options:["Ethanol","Methanol","Propanol","Butanol"],correct:0,explanation:"2 carbons + OH"},{q:"Aromatic compounds contain:",options:["Benzene ring","Only straight chain","Only ionic","No carbon"],correct:0,explanation:"Benzene C6H6 ring"}],shortQuestions:[{q:"Define organic chemistry",a:"Study of carbon compounds except CO, CO2, carbonates"},{q:"What is catenation?",a:"Self-linking of carbon atoms to form chains"},{q:"Define functional group",a:"Group determining chemical properties"},{q:"What is homologous series?",a:"Family same functional group, differ by CH2, similar properties"},{q:"Define isomerism",a:"Same molecular formula different structure/properties"},{q:"Types of structural isomerism",a:"Chain, position, functional group isomerism"},{q:"General formula alkanes, alkenes, alkynes",a:"Alkanes CnH2n+2, alkenes CnH2n, alkynes CnH2n-2"},{q:"What is IUPAC?",a:"International Union of Pure and Applied Chemistry naming system"}],longQuestions:[{q:"Explain organic chemistry, its sources and reasons for large number of organic compounds",a:"Study of carbon compounds. Sources: fossil fuels, plants, animals. Reasons: catenation (carbon-carbon bonds strong, forms long chains, branches, rings), tetravalency (4 bonds can form many arrangements), isomerism (same formula different structure), multiple bonding (single double triple), strength of C-C and C-H bonds. Properties: covalent, low mp, soluble in organic solvents, non-electrolyte. Vital force theory rejected by Wohler urea synthesis."},{q:"Describe functional groups and homologous series with examples",a:"Functional group: reactive part determining properties. Table: -OH alcohol, -O- ether, -CHO aldehyde, -CO- ketone, -COOH carboxylic acid, -COOR ester, -NH2 amine, -X haloalkane, C=C alkene, C≡C alkyne. Homologous series: same functional group, general formula, CH2 difference, similar chemical properties, gradation physical. Examples: alkanes methane, ethane, propane; alcohols methanol, ethanol, propanol. Importance: systematic study, predictable properties, naming easy."},{q:"Explain isomerism and its types with examples",a:"Isomerism same molecular formula different properties. Structural: chain (n-butane vs isobutane), position (1-propanol vs 2-propanol), functional (ethanol vs dimethyl ether). Stereoisomerism: geometric cis-trans due to restricted rotation around double bond, e.g., 2-butene cis both CH3 same side, trans opposite. Properties differ: boiling points, reactivity. Importance in drugs: one isomer active other inactive."},{q:"Explain IUPAC naming of organic compounds",a:"Rules: select longest chain containing functional group, number from nearest functional group/double bond/branch, name substituents alphabetically with positions, use di tri tetra for multiples, suffix for functional group: -ane alkane, -ene alkene, -yne alkyne, -ol alcohol, -al aldehyde, -one ketone, -oic acid. Example: CH3-CH(CH3)-CH2-CH3 is 2-methylbutane. CH3-CH=CH2 is propene."}],numericals:[{title:"Homologous",statement:"If methane CH4 is first alkane, what is 5th alkane formula and mass?",solution:["Alkanes CnH2n+2","5th n=5 C5H12","Mass=5×12+12×1=72"],answer:"C5H12, 72g/mol"},{title:"Isomer Count",statement:"How many chain isomers for C5H12?",solution:["n-pentane straight","Isopentane 2-methylbutane","Neopentane 2,2-dimethylpropane"],answer:"3 isomers"},{title:"Functional Groups",statement:"Identify functional groups in CH3COOH and CH3CHO",solution:["CH3COOH has -COOH carboxylic acid","CH3CHO has -CHO aldehyde"],answer:"Carboxylic acid and aldehyde"}]},{id:"20",number:20,title:"Hydrocarbons",urduTitle:"ہائیڈرو کاربن",icon:"⛽",mcqCount:12,learningOutcomes:["Define hydrocarbons","Alkanes, alkenes, alkynes properties","Reactions of alkanes and alkenes"],thingsToKnow:["Alkane","Alkene","Alkyne","Cracking","Polymerization"],didYouKnow:[{title:"Natural Gas",text:"Natural gas is mainly methane CH4, cleanest fossil fuel!"}],interestingInfo:"LPG mein propane aur butane hota hai jisme badbu ke liye ethyl mercaptan milaya jata hai leak pata karne ke liye!",notes:[{heading:"1. Alkanes - Saturated Hydrocarbons",content:"Alkanes CnH2n+2, saturated with single bonds, sp3 hybridized, tetrahedral 109.5°. Sources: natural gas (methane 80%), petroleum. Preparation: hydrogenation of alkenes, from Grignard, decarboxylation of sodium salt of fatty acid (CH3COONa+NaOH→CH4+Na2CO3). Properties: non-polar, insoluble water, soluble organic solvents, low reactivity due to strong C-C and C-H bonds. Reactions: combustion (CH4+2O2→CO2+2H2O, exothermic, used as fuel), halogenation via free radical substitution (CH4+Cl2→CH3Cl+HCl in UV light, produces mixture CH2Cl2, CHCl3, CCl4), cracking (breaking larger alkanes to smaller alkanes+alkenes at high T with catalyst). Uses: fuels (C1-C4 gases, C5-C10 petrol, C10-C16 kerosene, C16+ diesel), solvents, lubricants.",quickCheck:{q:"Why alkanes are called paraffins?",a:"Parum affinis = little affinity, less reactive"}},{heading:"2. Alkenes and Alkynes - Unsaturated",content:"Alkenes CnH2n contain C=C double bond, sp2 hybridized, trigonal planar 120°, reactive due to pi bond. Preparation: dehydration of alcohols (C2H5OH→C2H4+H2O with conc H2SO4 at 170°C), dehydrohalogenation (R-CH2-CH2-X + KOH alc → alkene + HX), cracking. Properties: more reactive than alkanes, show addition reactions due to pi bond breaking. Reactions: hydrogenation (C2H4+H2→C2H6 with Ni catalyst), halogenation (C2H4+Br2→CH2Br-CH2Br, orange bromine color disappears - test for unsaturation), hydrohalogenation Markovnikov rule (CH3-CH=CH2+HBr→CH3-CHBr-CH3 major), hydration (C2H4+H2O→C2H5OH with H2SO4), polymerization (nC2H4→[CH2-CH2]n polythene). Alkynes CnH2n-2 contain C≡C triple bond, sp hybridized linear 180°, more reactive. Acetylene C2H2 preparation: CaC2+2H2O→C2H2+Ca(OH)2. Reactions: acidic nature (C2H2 + NaNH2 → HC≡C-Na+ + NH3 due to sp more electronegative), addition reactions (can add 2 moles), combustion very exothermic oxyacetylene flame 3000°C for welding.",quickCheck:{q:"Test for unsaturation?",a:"Bromine water test - orange color disappears with alkene/alkyne, Baeyer's test - pink KMnO4 color disappears"}},{heading:"3. Petroleum and Cracking",content:"Petroleum is mixture of hydrocarbons formed from marine organisms under high P/T over millions years. Fractional distillation separates based on boiling point: refinery gases C1-C4, petrol C5-C10, kerosene C10-C16, diesel C16-C20, lubricating oils C20-C30, bitumen. Cracking: breaking larger less useful alkanes to smaller more useful alkanes and alkenes. Thermal cracking high T 500°C, catalytic cracking with zeolite catalyst at 450°C. Example: C10H22→C5H12+C5H10. Reforming: converting straight chain to branched or aromatic for higher octane number. Octane number measures fuel quality, iso-octane (2,2,4-trimethylpentane) has 100 octane, n-heptane 0. High octane prevents knocking. LPG, CNG, petrol, diesel uses."}],definitions:[{term:"Hydrocarbon",eng:"Compounds of carbon and hydrogen only",urdu:"صرف کاربن اور ہائیڈروجن والے مرکبات"},{term:"Cracking",eng:"Breaking larger hydrocarbons to smaller",urdu:"بڑے ہائیڈرو کاربن کو چھوٹے میں توڑنا"},{term:"Markovnikov Rule",eng:"Negative part of addendum adds to double bonded carbon with fewer hydrogens",urdu:"منفی حصہ اس کاربن سے جڑے گا جس پر ہائیڈروجن کم ہوں"}],examples:[{title:"Combustion",problem:"Balance CH4 + O2 → CO2 + H2O",steps:["CH4+2O2→CO2+2H2O","1 mole CH4 needs 2 moles O2","Produces 2 moles water"],answer:"Balanced equation"}],mcqs:[{q:"General formula of alkenes:",options:["CnH2n","CnH2n+2","CnH2n-2","CnH2n+1"],correct:0,explanation:"Unsaturated with one double bond"},{q:"Alkanes are also called:",options:["Paraffins","Olefins","Acetylenes","Aromatics"],correct:0,explanation:"Less reactive"},{q:"Alkenes are also called:",options:["Olefins","Paraffins","Acetylenes","Alkanes"],correct:0,explanation:"Oil forming"},{q:"Bromine test for unsaturation:",options:["Orange disappears","No change","Blue appears","White ppt"],correct:0,explanation:"Addition of Br2"},{q:"Markovnikov rule applies to:",options:["Unsymmetrical alkene addition","Alkane substitution","Both","None"],correct:0,explanation:"HX addition to unsymmetrical alkene"},{q:"Cracking produces:",options:["Smaller alkanes + alkenes","Only alkanes","Only CO2","No products"],correct:0,explanation:"Breaking large molecules"},{q:"Natural gas mainly:",options:["CH4","C2H6","C3H8","C4H10"],correct:0,explanation:"Methane 80-90%"},{q:"Acetylene formula:",options:["C2H2","C2H4","C2H6","CH4"],correct:0,explanation:"HC≡CH"},{q:"Octane number 100 is for:",options:["Iso-octane","n-heptane","Methane","Ethane"],correct:0,explanation:"Best fuel, no knocking"},{q:"Polymerization of ethene gives:",options:["Polythene","PVC","Teflon","Nylon"],correct:0,explanation:"[CH2-CH2]n"},{q:"Oxyacetylene flame temp:",options:["3000°C","1000°C","500°C","100°C"],correct:0,explanation:"For welding"},{q:"LPG contains:",options:["Propane+Butane","Methane only","Only hydrogen","Only oxygen"],correct:0,explanation:"Liquefied petroleum gas"}],shortQuestions:[{q:"Define hydrocarbons and types",a:"C and H only, types: alkanes saturated, alkenes with double, alkynes with triple, aromatic with benzene ring"},{q:"What are alkanes? Properties",a:"CnH2n+2, saturated, less reactive, undergo combustion and substitution"},{q:"Define cracking",a:"Breaking larger hydrocarbons to smaller useful ones"},{q:"What is octane number?",a:"Measures fuel quality, resistance to knocking, iso-octane 100, n-heptane 0"},{q:"Test for unsaturation",a:"Bromine water (orange disappears) and Baeyer's test (pink KMnO4 disappears)"},{q:"State Markovnikov rule",a:"In HX addition to unsymmetrical alkene, H adds to carbon with more H, X to carbon with less H"},{q:"Preparation of ethene",a:"Dehydration of ethanol with conc H2SO4 at 170°C"},{q:"Uses of acetylene",a:"Welding oxyacetylene flame, ripening fruits (as CaC2 produces acetylene)"}],longQuestions:[{q:"Explain alkanes, preparation, properties and uses",a:"Alkanes CnH2n+2 saturated, sp3 tetrahedral, non-polar, low reactivity. Preparation: hydrogenation of alkenes, Grignard, decarboxylation. Properties: insoluble water, soluble organic, combustion exothermic CH4+2O2→CO2+2H2O, halogenation free radical substitution in UV light stepwise to CCl4, cracking to smaller alkanes+alkenes. Uses: fuels (natural gas, petrol, diesel, kerosene), solvents, lubricants, waxes. Octane number concept."},{q:"Describe alkenes and alkynes, preparation and addition reactions",a:"Alkenes C=C double bond sp2 planar, reactive pi bond, preparation dehydration of alcohols, dehydrohalogenation, cracking. Reactions: addition - hydrogenation to alkane with Ni, halogenation Br2 orange disappears, hydrohalogenation Markovnikov, hydration to alcohol, polymerization to polythene. Alkynes triple bond sp linear, acidic H due to more s-character electronegative, preparation CaC2+H2O→C2H2, reactions addition of 2 moles, combustion high temp, acidic reaction with NaNH2. Uses: polythene, PVC, welding."},{q:"Explain petroleum refining and cracking",a:"Petroleum mixture of hydrocarbons formed millions years. Fractional distillation separates: refinery gas, petrol, kerosene, diesel, lubricating oil, bitumen. Cracking converts heavy less useful fractions to lighter more useful petrol and alkenes for petrochemical industry. Thermal cracking high T, catalytic cracking zeolite catalyst lower T better yield. Reforming converts straight chain to branched/aromatic to increase octane. Octane number scale iso-octane 100 best, n-heptane 0 worst. High octane prevents knocking. LPG propane+butane, CNG compressed methane."},{q:"Discuss polymerization and its types",a:"Polymerization joining small monomers to large polymer. Addition polymerization: monomers with double bond join without losing atoms, e.g., ethene→polythene, propene→polypropylene, vinyl chloride→PVC, styrene→polystyrene. Condensation polymerization: monomers join with loss of small molecules like H2O, e.g., nylon, polyester, bakelite. Polythene types: LDPE low density branched flexible (bags), HDPE high density linear strong (bottles). Uses: packaging, insulation, pipes, etc. Environmental issue: non-biodegradable."}],numericals:[{title:"Combustion Volume",statement:"What volume O2 needed to burn 10 dm³ CH4 at RTP?",solution:["CH4+2O2→CO2+2H2O","1 vol CH4 needs 2 vol O2","10 dm³ needs 20 dm³ O2"],answer:"20 dm³ O2"},{title:"Bromine Test",statement:"How much Br2 needed to saturate 1 mol ethene?",solution:["C2H4+Br2→C2H4Br2","1:1 mole ratio","1 mol Br2 =160g"],answer:"160g Br2"},{title:"Polymer Mass",statement:"If 100 ethene molecules polymerize, what is molecular mass of polythene? M ethene=28",solution:["Mass =100×28=2800","Minus no loss in addition polymerization"],answer:"2800 g/mol"}]},{id:"21",number:21,title:"Biochemistry",urduTitle:"حیاتیاتی کیمیا",icon:"\uD83E\uDDEB",mcqCount:10,learningOutcomes:["Define biochemistry","Carbohydrates, proteins, lipids","Enzymes, vitamins, DNA"],thingsToKnow:["Carbohydrate","Protein","Lipid","Enzyme","DNA"],didYouKnow:[{title:"DNA Length",text:"If DNA from one cell stretched, 2 meters long! All cells DNA would go to sun and back!"}],interestingInfo:"Humare jism mein 100,000 se zyada proteins hain jo enzymes, hormones, antibodies ka kaam karte hain!",notes:[{heading:"1. Carbohydrates, Proteins, Lipids",content:"Carbohydrates: polyhydroxy aldehydes/ketones, general formula (CH2O)n, sources: sugars, starch, cellulose. Classification: monosaccharides (glucose C6H12O6, fructose, galactose), disaccharides (sucrose glucose+fructose, lactose glucose+galactose, maltose glucose+glucose), polysaccharides (starch α-glucose polymer, cellulose β-glucose, glycogen). Functions: energy source (glucose 4 kcal/g), storage, structural. Proteins: polymers of amino acids (20 types), peptide bond -CO-NH- linkage. Structure: primary sequence, secondary α-helix β-sheet, tertiary 3D folding, quaternary multiple subunits. Functions: enzymes, hormones (insulin), antibodies, structural (collagen, keratin), transport (hemoglobin). Lipids: fats and oils, esters of fatty acids and glycerol, hydrophobic. Types: simple triglycerides, compound phospholipids, derived cholesterol. Functions: energy storage (9 kcal/g), insulation, membrane structure, hormones. Fatty acids: saturated no double bonds (solid), unsaturated with double bonds (liquid).",quickCheck:{q:"Difference between starch and cellulose?",a:"Both glucose polymers but starch α-linkage digestible, cellulose β-linkage indigestible by humans, fiber"}},{heading:"2. Enzymes and Vitamins",content:"Enzymes are biocatalysts, proteins that speed reactions without consumed, specific (lock and key model), work at optimum T 37°C and pH 7.4, denatured at high T or extreme pH. Examples: amylase breaks starch to maltose in saliva, pepsin breaks proteins in stomach, catalase breaks H2O2. Vitamins: organic compounds needed small amounts, cannot be synthesized, coenzymes. Types: water soluble B-complex (B1 thiamine, B2 riboflavin, B3 niacin, etc.) and C ascorbic acid; fat soluble A retinol (vision), D calciferol (bones Ca absorption), E tocopherol (antioxidant), K phylloquinone (clotting). Deficiency diseases: scurvy (C), rickets (D), night blindness (A), beriberi (B1).",quickCheck:{q:"Why enzymes are specific?",a:"Due to active site shape complementary to substrate - lock and key model"}},{heading:"3. DNA, RNA and Biochemistry Importance",content:"DNA (Deoxyribonucleic acid) double helix, two strands, nucleotides: phosphate + deoxyribose sugar + nitrogenous base (A adenine, T thymine, G guanine, C cytosine). Base pairing: A=T (2 H-bonds), G≡C (3 H-bonds). Stores genetic information, replication, transcription to RNA. RNA (Ribonucleic acid) single strand, ribose sugar, bases A, U (uracil), G, C. Types: mRNA messenger carries code from DNA to ribosome, tRNA transfer brings amino acids, rRNA ribosomal makes ribosome. Central dogma: DNA→mRNA→Protein. Importance of biochemistry: understands diseases (diabetes insulin deficiency), nutrition, drug design, genetic engineering, forensic DNA fingerprinting.",quickCheck:{q:"Difference DNA vs RNA?",a:"DNA double helix deoxyribose A,T,G,C stores genetic; RNA single ribose A,U,G,C carries message"}}],definitions:[{term:"Carbohydrate",eng:"Polyhydroxy aldehydes or ketones",urdu:"کثیر ہائیڈروکسی الڈیہائیڈ یا کیٹون"},{term:"Protein",eng:"Polymer of amino acids",urdu:"امینو ایسڈ کا پولیمر"},{term:"Enzyme",eng:"Biocatalyst protein speeds reactions",urdu:"حیاتیاتی عامل جو تعامل تیز کرے"}],examples:[{title:"Peptide Bond",problem:"Formation of dipeptide from 2 amino acids",steps:["Amino acid 1: NH2-CH(R)-COOH","Amino acid 2: NH2-CH(R')-COOH","Condensation: -COOH + NH2- → -CO-NH- + H2O","Peptide bond formed"],answer:"Dipeptide + H2O"}],mcqs:[{q:"Glucose formula:",options:["C6H12O6","C12H22O11","C5H10O5","C6H10O5"],correct:0,explanation:"Monosaccharide"},{q:"Starch is polymer of:",options:["α-glucose","β-glucose","Fructose","Galactose"],correct:0,explanation:"α-linkage digestible"},{q:"Proteins made of:",options:["Amino acids","Glucose","Fatty acids","Nucleotides"],correct:0,explanation:"20 types amino acids"},{q:"Enzymes are:",options:["Proteins biocatalysts","Carbohydrates","Lipids","Inorganic"],correct:0,explanation:"Protein catalysts"},{q:"Water soluble vitamins:",options:["B and C","A and D","E and K","Only A"],correct:0,explanation:"B-complex and C"},{q:"Night blindness due to deficiency of:",options:["Vitamin A","Vitamin B","Vitamin C","Vitamin D"],correct:0,explanation:"Retinol needed for vision"},{q:"DNA bases:",options:["A,T,G,C","A,U,G,C","Only A,T","Only G,C"],correct:0,explanation:"Adenine Thymine Guanine Cytosine"},{q:"Base pairing in DNA:",options:["A=T, G≡C","A=G, T=C","A=C, T=G","All same"],correct:0,explanation:"Complementary pairing"},{q:"Energy from 1g fat:",options:["9 kcal","4 kcal","2 kcal","0 kcal"],correct:0,explanation:"Fats high energy"},{q:"Insulin is:",options:["Protein hormone","Carbohydrate","Lipid","Vitamin"],correct:0,explanation:"Protein controls blood sugar"}],shortQuestions:[{q:"Define carbohydrates and types",a:"Polyhydroxy aldehydes/ketones, types: mono, di, polysaccharides"},{q:"What are proteins?",a:"Polymers of amino acids linked by peptide bonds"},{q:"Define lipids",a:"Fats and oils esters of fatty acids and glycerol, hydrophobic"},{q:"What are enzymes?",a:"Biocatalysts proteins specific, work at optimum T and pH"},{q:"Define vitamins and types",a:"Organic needed small amounts, water soluble B,C fat soluble A,D,E,K"},{q:"What is DNA?",a:"Deoxyribonucleic acid double helix stores genetic info, bases A,T,G,C"},{q:"Difference starch and cellulose",a:"Starch α-glucose digestible, cellulose β-glucose indigestible fiber"},{q:"Functions of proteins",a:"Enzymes, hormones, antibodies, structural, transport"}],longQuestions:[{q:"Explain carbohydrates classification and functions",a:"Carbohydrates (CH2O)n polyhydroxy aldehydes/ketones. Monosaccharides: glucose (blood sugar), fructose (fruit), galactose. Disaccharides: sucrose (table sugar glucose+fructose), lactose (milk), maltose (malt). Polysaccharides: starch (plants storage α-glucose, amylose+amylopectin), glycogen (animals storage in liver/muscles), cellulose (plant cell wall β-glucose, fiber). Functions: energy source 4kcal/g, storage, structural. Digestion: starch→maltose by amylase, maltose→glucose by maltase. Glucose used in respiration C6H12O6+6O2→6CO2+6H2O+energy."},{q:"Describe proteins, structure and functions",a:"Proteins polymers of 20 amino acids linked by peptide bond -CO-NH- with loss of H2O. Amino acid structure: central C with NH2, COOH, H, R group. Structure levels: primary sequence of amino acids, secondary α-helix (hydrogen bonds) and β-sheet, tertiary 3D folding due to disulfide, ionic, hydrophobic interactions, quaternary multiple polypeptides. Functions: enzymes (amylase, pepsin), hormones (insulin regulates glucose), antibodies (defense), structural (collagen in skin, keratin in hair), transport (hemoglobin carries O2), contractile (actin myosin in muscles). Denaturation: high T, pH change breaks structure loses function."},{q:"Explain enzymes, vitamins and their importance",a:"Enzymes biocatalysts proteins, specific lock and key model, active site binds substrate forms enzyme-substrate complex lowers activation energy, optimum T 37°C and pH 7.4, denatured beyond. Examples: amylase, pepsin, catalase. Vitamins organic coenzymes needed small amounts: water soluble B-complex (B1 beriberi, B2, B3 pellagra, B6, B12 anemia) and C scurvy, fat soluble A night blindness, D rickets bones, E antioxidant sterility, K clotting. Balanced diet contains all. Deficiency diseases."},{q:"Explain DNA and RNA structure and functions",a:"DNA double helix two strands antiparallel, sugar-phosphate backbone, bases inside paired A=T 2 bonds, G≡C 3 bonds. Nucleotide = phosphate+deoxyribose+A/T/G/C. Stores genetic information, replication semi-conservative, transcription to mRNA. RNA single strand ribose sugar, bases A,U,G,C, types mRNA carries genetic code from DNA to ribosome (codons), tRNA brings amino acids (anticodon), rRNA makes ribosomes. Central dogma DNA→RNA→Protein. DNA fingerprinting uses variable regions for identification, genetic engineering inserts genes."}],numericals:[{title:"Energy",statement:"Calculate energy from 100g carbohydrate",solution:["1g carbohydrate=4 kcal","100g=400 kcal"],answer:"400 kcal"},{title:"Peptide Bonds",statement:"How many peptide bonds in tripeptide (3 amino acids)?",solution:["Peptide bonds = amino acids -1","=3-1=2"],answer:"2 bonds"},{title:"DNA Base Pairing",statement:"If DNA strand has 20% A, what % is T, G, C?",solution:["A=T so T=20%","G=C, total 100%, A+T=40%, so G+C=60%","G=30%, C=30%"],answer:"T 20%, G 30%, C 30%"}]},{id:"22",number:22,title:"Atmosphere & Environment",urduTitle:"فضا اور ماحول",icon:"\uD83C\uDF0D",mcqCount:10,learningOutcomes:["Layers of atmosphere","Air pollution, acid rain, ozone depletion","Global warming"],thingsToKnow:["Troposphere","Stratosphere","Ozone","Acid Rain","Global Warming"],didYouKnow:[{title:"Ozone Layer",text:"Ozone layer absorbs harmful UV rays, one O3 molecule can absorb many UV photons!"}],interestingInfo:"Har saal 7 million log air pollution se marte hain - WHO report!",notes:[{heading:"1. Atmosphere Layers",content:"Atmosphere envelope of gases around Earth: 78% N2, 21% O2, 0.04% CO2, 0.9% Ar, trace gases. Layers: Troposphere 0-12km, weather, temperature decreases with height, contains 75% mass, planes fly here. Stratosphere 12-50km, contains ozone layer 20-30km, temperature increases due to O3 absorbing UV, planes long flights here. Mesosphere 50-85km, temperature decreases, meteors burn. Thermosphere 85-120km, temperature increases, aurora, ISS orbits. Exosphere >120km, outermost, satellites. Importance: provides O2, CO2 for photosynthesis, protects from meteors and UV, maintains temperature via greenhouse effect.",quickCheck:{q:"Where is ozone layer?",a:"Stratosphere 20-30km"}},{heading:"2. Air Pollution and Acid Rain",content:"Air pollution: harmful substances in air. Primary pollutants directly emitted: CO from incomplete combustion, SO2 from burning sulfur coal, NOx from high temp combustion in vehicles, particulates PM2.5. Secondary pollutants formed in atmosphere: ozone (ground level harmful), PAN peroxyacetyl nitrate. Acid Rain: SO2+NOx react with water to form H2SO4 and HNO3, pH<5.6. Formation: SO2+H2O→H2SO3→H2SO4, 2NO2+H2O→HNO3+HNO2. Effects: damages buildings (Taj Mahal yellowing), corrodes metals, kills aquatic life (pH<5 fish die), damages crops, soil acidity. Prevention: use low sulfur fuel, catalytic converters in cars convert NOx to N2, scrubbers in factories, renewable energy.",quickCheck:{q:"What is acid rain pH?",a:"pH less than 5.6"}},{heading:"3. Ozone Depletion and Global Warming",content:"Ozone Depletion: O3 layer protects from UV-B which causes skin cancer, cataract, damages crops. Depletion due to CFCs chlorofluorocarbons used in refrigerators, AC. CFCs release Cl radicals: CFCl3→CFCl2+Cl, Cl+O3→ClO+O2, ClO+O→Cl+O2, one Cl destroys 100,000 O3. Ozone hole over Antarctica. Prevention: Montreal Protocol 1987 banned CFCs, replaced by HFCs. Global Warming: greenhouse gases CO2, CH4, N2O, H2O absorb IR radiation emitted by Earth, trap heat, maintain Earth temp 15°C (without  -18°C). Increase due to f
