<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BukhariTools - Chemistry 10th - Chapters 14-26</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:'Outfit',sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
.card{transition:all .35s cubic-bezier(.4,0,.2,1)}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 40px -12px rgba(0,0,0,.18)}
</style>
</head>
<body class="bg-[#f7f8fb] text-slate-900 min-h-screen">
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-slate-200">
<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
<div class="flex items-center gap-3.5">
<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-blue-600 flex items-center justify-center text-white font-black text-xl shadow-lg">B</div>
<div>
<div class="font-black text-[22px] leading-none tracking-tight">bukhari<span class="text-emerald-600">tools</span></div>
<div class="text-[11px] mono tracking-widest opacity-60 mt-1 font-bold">CHEMISTRY 10TH • PECTAA 2026 • CHAPTERS 14-26</div>
</div>
</div>
<div class="text-right hidden md:block">
<div class="font-bold text-sm">Shabbir Bukhari</div>
<div class="text-[11px] mono opacity-60">Last = Chapter 26 Polymers</div>
</div>
</div>
</header>

<div class="max-w-7xl mx-auto px-6 pt-10 pb-16">
<div class="flex flex-wrap items-center justify-between gap-4 mb-8">
<div>
<h1 class="text-[36px] md:text-[48px] font-black leading-[0.9] tracking-tight">Chemistry 10th<br><span class="text-emerald-600">Chapters 14-26</span></h1>
<div class="mt-3 flex gap-2">
<span class="text-[11px] mono font-bold px-3 py-1.5 rounded-full bg-slate-900 text-white">13 CHAPTERS</span>
<span class="text-[11px] mono font-bold px-3 py-1.5 rounded-full bg-emerald-600 text-white">PECTAA 2026</span>
<span class="text-[11px] mono font-bold px-3 py-1.5 rounded-full bg-violet-600 text-white">LAST = 26</span>
</div>
</div>
<div class="relative w-full md:w-[360px]">
<input id="search" placeholder="Search chapter..." class="w-full px-5 py-3.5 rounded-2xl bg-white border border-slate-200 outline-none text-sm focus:ring-2 focus:ring-emerald-500/20 shadow-sm">
</div>
</div>

<div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</div>

<footer class="border-t border-slate-200 py-6 text-center bg-white">
<div class="mono text-[11px] opacity-50 font-bold tracking-wide">BUKHARITOOLS • CHAPTERS 14-26 • SHABBIR BUKHARI</div>
</footer>

<script>
const data=[
{no:14,file:"Chapter 14.html",title:"States of Matter",icon:"🌡️",grad:"from-cyan-400 to-blue-500"},
{no:15,file:"Chapter 15.html",title:"Stoichiometry",icon:"⚖️",grad:"from-amber-400 to-orange-500"},
{no:16,file:"Chapter 16.html",title:"Electrochemistry",icon:"🔋",grad:"from-yellow-400 to-amber-500"},
{no:17,file:"Chapter 17.html",title:"Reaction Kinetics",icon:"⏱️",grad:"from-rose-400 to-pink-500"},
{no:18,file:"Chapter 18.html",title:"Salts",icon:"🧂",grad:"from-slate-400 to-slate-600"},
{no:19,file:"Chapter 19.html",title:"Nitrogen and Sulphur",icon:"🌋",grad:"from-orange-400 to-red-500"},
{no:20,file:"Chapter 20.html",title:"Water",icon:"💧",grad:"from-blue-400 to-cyan-500"},
{no:21,file:"Chapter 21.html",title:"Organic Chemistry",icon:"🧬",grad:"from-violet-400 to-purple-500"},
{no:22,file:"Chapter 22.html",title:"Hydrocarbons",icon:"⛽",grad:"from-emerald-400 to-teal-500"},
{no:23,file:"Chapter 23.html",title:"Alcohols",icon:"🧴",grad:"from-indigo-400 to-blue-500"},
{no:24,file:"Chapter 24.html",title:"Carboxylic Acids",icon:"🍋",grad:"from-lime-400 to-green-500"},
{no:25,file:"Chapter 25.html",title:"Biochemistry",icon:"🧠",grad:"from-pink-400 to-rose-500"},
{no:26,file:"Chapter 26.html",title:"Polymers",icon:"🧵",grad:"from-fuchsia-500 to-violet-600",last:true},
];
function render(f=""){
  const grid=document.getElementById('grid');
  grid.innerHTML="";
  const q=f.toLowerCase();
  data.filter(c=>!q||c.title.toLowerCase().includes(q)||String(c.no).includes(q)).forEach(c=>{
    const a=document.createElement('a');
    a.href=c.file;
    a.className=`card block bg-white rounded-[1.5rem] p-6 border ${c.last?'border-violet-300 ring-2 ring-violet-200':'border-slate-200'} shadow-sm`;
    a.innerHTML=`
      ${c.last?'<div class="flex justify-end mb-3"><span class="text-[10px] mono font-black px-3 py-1 rounded-full bg-violet-600 text-white">LAST • 26</span></div>':''}
      <div class="flex justify-between items-start mb-5">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${c.grad} flex items-center justify-center text-[24px] shadow-lg">${c.icon}</div>
        <div class="text-right"><div class="text-[10px] mono opacity-40 font-bold">CH</div><div class="text-[26px] font-black leading-none">${c.no}</div></div>
      </div>
      <h3 class="font-black text-[17px] leading-tight">Chapter ${c.no}<br>${c.title}</h3>
      <div class="mt-5 w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-[13px] text-center">Open Chapter ${c.no} →</div>
    `;
    grid.appendChild(a);
  });
}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
render();
</script>
</body>
</html>
