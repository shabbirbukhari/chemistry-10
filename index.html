ossil fuels, deforestation, agriculture. Effects: rise in sea level, melting glaciers, extreme weather, ocean acidification (CO2+H2O→H2CO3). Prevention: renewable energy solar/wind, afforestation, energy efficiency, reduce meat consumption (CH4 from livestock).",quickCheck:{q:"Which gas is main greenhouse?",a:"CO2, but CH4 25 times more potent per molecule"}}],definitions:[{term:"Atmosphere",eng:"Envelope of gases around Earth",urdu:"زمین کے گرد گیسوں کا غلاف"},{term:"Acid Rain",eng:"Rain with pH<5.6 due to H2SO4 and HNO3",urdu:"تیزابی بارش"},{term:"Ozone Depletion",eng:"Thinning of ozone layer due to CFCs",urdu:"اوزون کی تہہ کا پتلا ہونا"}],examples:[{title:"Acid Rain Formation",problem:"Write reaction of SO2 to H2SO4",steps:["SO2+H2O→H2SO3","2H2SO3+O2→2H2SO4","Acid rain"],answer:"H2SO4 formation"}],mcqs:[{q:"Ozone layer in:",options:["Stratosphere","Troposphere","Mesosphere","Thermosphere"],correct:0,explanation:"20-30km in stratosphere"},{q:"Main gas in air:",options:["N2 78%","O2 78%","CO2 78%","H2 78%"],correct:0,explanation:"Nitrogen most abundant"},{q:"Acid rain pH:",options:["<5.6",">7","7",">10"],correct:0,explanation:"Due to H2SO4 HNO3"},{q:"CFCs cause:",options:["Ozone depletion","Acid rain","Both","None"],correct:0,explanation:"Cl radicals destroy O3"},{q:"Greenhouse gas most potent per molecule:",options:["CH4","CO2","N2","O2"],correct:0,explanation:"CH4 25x more potent than CO2"},{q:"Global warming leads to:",options:["Sea level rise","Cooling","No effect","More O2"],correct:0,explanation:"Melting glaciers"},{q:"Catalytic converter converts:",options:["NOx to N2","O2 to O3","CO2 to CO","No conversion"],correct:0,explanation:"Reduces air pollution"},{q:"Troposphere height:",options:["0-12km","12-50km","50-85km",">100km"],correct:0,explanation:"Lowest layer weather"},{q:"Acid rain damages Taj Mahal due to:",options:["CaCO3 + H2SO4 reaction","No reaction","Cooling","Heating"],correct:0,explanation:"Marble CaCO3 reacts with acid"},{q:"Montreal Protocol bans:",options:["CFCs","O2","N2","H2O"],correct:0,explanation:"1987 to protect ozone"}],shortQuestions:[{q:"Layers of atmosphere",a:"Troposphere 0-12km, Stratosphere 12-50km with ozone, Mesosphere 50-85km, Thermosphere 85-120km, Exosphere >120km"},{q:"What is air pollution?",a:"Harmful substances in air: CO, SO2, NOx, particulates"},{q:"Define acid rain",a:"Rain pH<5.6 due to H2SO4 and HNO3 from SO2 NOx"},{q:"Causes of acid rain",a:"Burning fossil fuels containing S and N produces SO2 NOx which form acids with water"},{q:"What is ozone depletion?",a:"Thinning of O3 layer due to CFCs releasing Cl radicals"},{q:"What is global warming?",a:"Increase Earth temperature due to greenhouse gases trapping heat"},{q:"Greenhouse gases",a:"CO2, CH4, N2O, H2O vapor, CFCs absorb IR"},{q:"Prevention of air pollution",a:"Low sulfur fuel, catalytic converters, renewable energy, afforestation"}],longQuestions:[{q:"Explain atmosphere layers and their importance",a:"Atmosphere 78% N2 21% O2 0.04% CO2 etc. Layers: Troposphere weather, temp decreases, 75% mass, planes. Stratosphere ozone layer absorbs UV, temp increases, long flights. Mesosphere meteors burn temp decreases. Thermosphere aurora ISS temp increases. Exosphere satellites. Importance: O2 breathing, CO2 photosynthesis, N2 nitrogen cycle, ozone UV protection, greenhouse maintains 15°C, protects from meteors, communication via ionosphere."},{q:"Explain air pollution and acid rain causes effects prevention",a:"Air pollution primary (CO incomplete combustion, SO2 sulfur coal, NOx high T combustion, particulates) and secondary (ground ozone, PAN formed in photochemical smog). Acid rain SO2 NOx + H2O → H2SO4 HNO3 pH<5.6. Formation equations. Effects: buildings damage (Taj Mahal), metals corrosion, aquatic life death pH<5, crops damage, soil acidity, human respiratory. Prevention: low S fuel, scrubbers CaO+SO2→CaSO3, catalytic converters, renewable, public transport."},{q:"Explain ozone depletion and global warming",a:"Ozone layer 20-30km protects from UV-B. Depletion by CFCs: CFCl3→Cl, Cl+O3→ClO+O2 chain destroys 100k O3 per Cl. Ozone hole over Antarctica. Effects: skin cancer, cataract, crop damage, phytoplankton death. Prevention Montreal Protocol banned CFCs replaced HFCs. Global warming greenhouse gases trap IR: CO2 from fossil fuels, CH4 from livestock and rice, N2O fertilizers. Enhanced greenhouse increases temp, sea level rise, extreme weather, ocean acidification CO2+H2O→H2CO3 harms corals. Prevention renewable, afforestation, energy efficiency, reduce meat, carbon capture."},{q:"Discuss importance of air and its purification",a:"Air importance: O2 respiration, CO2 photosynthesis, N2 proteins, etc. Purification: plants absorb CO2 release O2, photosynthesis 6CO2+6H2O→C6H12O6+6O2, afforestation. Industrial: scrubbers, electrostatic precipitators remove particulates, catalytic converters. Personal: masks for PM2.5, indoor plants."}],numericals:[{title:"Air Composition",statement:"In 100L air, how much O2 and N2?",solution:["N2 78% =>78L","O2 21% =>21L","Others 1L"],answer:"78L N2, 21L O2"},{title:"Acid Rain pH",statement:"If [H+]=10^-4 M in rain, what is pH? Is it acid rain?",solution:["pH=4","<5.6 so acid rain"],answer:"pH 4, acid rain yes"},{title:"Ozone Destruction",statement:"If 1 Cl destroys 100,000 O3, how many O3 destroyed by 1 mol Cl?",solution:["1 mol Cl =6.02×10²³ atoms","O3 destroyed=6.02×10²³×10⁵=6.02×10²⁸ molecules"],answer:"6.02×10²⁸ O3 molecules"}]},{id:"23",number:23,title:"Water - Properties & Treatment",urduTitle:"پانی - خصوصیات اور صفائی",icon:"\uD83D\uDCA7",mcqCount:10,learningOutcomes:["Properties of water","Hard and soft water","Water treatment, water pollution"],thingsToKnow:["Hard Water","Soft Water","Water Pollution","Desalination"],didYouKnow:[{title:"Water Universal Solvent",text:"Water is universal solvent due to polar nature and hydrogen bonding!"}],interestingInfo:"Samundar ka pani peene ke qabil nahi - 3.5% salt! Desalination se meetha banaya jata hai!",notes:[{heading:"1. Properties and Hardness of Water",content:"Water H2O polar molecule, bent 104.5°, hydrogen bonding, high specific heat, high latent heat, surface tension, density max at 4°C (ice floats). Hard water contains Ca2+ and Mg2+ salts (Ca(HCO3)2, Mg(HCO3)2 temporary, CaSO4, MgSO4, CaCl2 permanent). Temporary hardness removed by boiling: Ca(HCO3)2→CaCO3+H2O+CO2 precipitate. Permanent hardness removed by washing soda Na2CO3: CaSO4+Na2CO3→CaCO3+Na2SO4, or ion exchange resins (zeolite). Hard water disadvantages: wastes soap (forms scum), boiler scale reduces efficiency, not good for textile. Advantages: provides Ca for bones. Soft water lathers easily with soap.",quickCheck:{q:"Types of hardness?",a:"Temporary due to bicarbonates removed by boiling, Permanent due to sulfates chlorides removed by washing soda or ion exchange"}},{heading:"2. Water Pollution and Treatment",content:"Water pollution: harmful substances in water. Causes: industrial waste (heavy metals Hg, Pb), sewage (bacteria), agricultural runoff (fertilizers nitrates, pesticides), oil spills, thermal pollution (hot water reduces O2). Effects: waterborne diseases cholera, typhoid, dysentery, eutrophication (algae bloom due to excess nutrients consumes O2 fish die), heavy metals bioaccumulation. Treatment: screening removes large debris, primary sedimentation, secondary biological treatment bacteria break organic, tertiary chemical treatment chlorination kills bacteria Cl2+H2O→HOCl+HCl, filtration through sand, activated carbon adsorption. Desalination: removal salt from seawater via distillation or reverse osmosis (RO) using semipermeable membrane high pressure. Pakistan faces water scarcity, need conservation.",quickCheck:{q:"What is eutrophication?",a:"Excess nutrients cause algae bloom, O2 depletion, aquatic death"}}],definitions:[{term:"Hard Water",eng:"Water containing Ca2+ Mg2+ salts",urdu:"وہ پانی جس میں کیلشیم میگنیشیم نمکیات ہوں"},{term:"Eutrophication",eng:"Excessive nutrients cause algal bloom and O2 depletion",urdu:"غذائی اجزاء کی زیادتی سے کائی کا پھیلاؤ"}],examples:[{title:"Hardness Removal",problem:"Remove temporary hardness Ca(HCO3)2 by boiling",steps:["Ca(HCO3)2 → CaCO3 ↓ + H2O + CO2 ↑","White ppt CaCO3 removed"],answer:"Temporary hardness removed"}],mcqs:[{q:"Temporary hardness due to:",options:["Ca(HCO3)2","CaSO4","NaCl","KCl"],correct:0,explanation:"Bicarbonates"},{q:"Permanent hardness removed by:",options:["Washing soda","Boiling only","No method","Filtration only"],correct:0,explanation:"Na2CO3 precipitates CaCO3"},{q:"Hard water wastes:",options:["Soap forms scum","No waste","Saves soap","No effect"],correct:0,explanation:"Ca2+ reacts with soap"},{q:"Eutrophication causes:",options:["Algal bloom O2 depletion","More O2","No effect","Clean water"],correct:0,explanation:"Excess nutrients"},{q:"Chlorination produces:",options:["HOCl disinfectant","No product","O2 only","H2 only"],correct:0,explanation:"HOCl kills bacteria"},{q:"Desalination is:",options:["Removal salt from seawater","Adding salt","No change","Adding sugar"],correct:0,explanation:"Makes seawater drinkable"},{q:"Water max density at:",options:["4°C","0°C","100°C","25°C"],correct:0,explanation:"Anomalous expansion"},{q:"Waterborne disease:",options:["Cholera","Scurvy","Rickets","Night blindness"],correct:0,explanation:"Due to polluted water"},{q:"Heavy metals cause:",options:["Bioaccumulation","No effect","More O2","Clean"],correct:0,explanation:"Accumulate in food chain"},{q:"RO stands for:",options:["Reverse Osmosis","Regular Osmosis","No meaning","Real Osmosis"],correct:0,explanation:"Desalination method"}],shortQuestions:[{q:"Properties of water",a:"Polar, H-bonding, high specific heat, high latent heat, surface tension, density max at 4°C"},{q:"Define hard and soft water",a:"Hard contains Ca2+ Mg2+, soft lathers easily no Ca/Mg"},{q:"Types of hardness",a:"Temporary bicarbonate removed by boiling, permanent sulfate chloride removed by washing soda or ion exchange"},{q:"Disadvantages of hard water",a:"Wastes soap scum, boiler scale, not good for textile"},{q:"What is water pollution?",a:"Harmful substances in water: industrial waste, sewage, fertilizers"},{q:"Define eutrophication",a:"Excess nutrients cause algae bloom O2 depletion fish die"},{q:"Water treatment steps",a:"Screening, sedimentation, biological, chlorination, filtration"},{q:"What is desalination?",a:"Removal salt from seawater via distillation or RO"}],longQuestions:[{q:"Explain hardness of water, types, removal, advantages/disadvantages",a:"Hard water contains Ca2+ Mg2+ salts. Temporary due to Ca(HCO3)2 Mg(HCO3)2 removed by boiling Ca(HCO3)2→CaCO3+H2O+CO2. Permanent due to CaSO4 MgSO4 CaCl2 removed by washing soda Na2CO3→CaCO3 ppt or ion exchange zeolite Na2Ze+Ca2+→CaZe+2Na+. Disadvantages wastes soap forms insoluble scum Ca(stearate)2, boiler scale reduces heat transfer, not good for dyeing. Advantages provides Ca for bones teeth, taste better. Soft water good for washing but corrosive. Methods to distinguish: soap test."},{q:"Describe water pollution causes effects prevention",a:"Causes: industrial waste heavy metals, sewage pathogens, agricultural fertilizers nitrates pesticides, oil spills, thermal hot water reduces dissolved O2. Effects: waterborne diseases cholera typhoid dysentery, eutrophication algae bloom due to excess PO4 NO3 consumes O2, heavy metals bioaccumulation Hg causes Minamata, Pb causes brain damage. Prevention: treat industrial waste, sewage treatment, use organic fertilizers, oil spill cleanup, laws. Treatment: screening, primary sedimentation, secondary biological bacteria break organic, tertiary chlorination Cl2+H2O→HOCl kills bacteria, filtration sand carbon."},{q:"Explain water treatment and desalination",a:"Treatment municipal: screening large debris, primary settling, secondary aeration bacteria, tertiary chlorination disinfection, filtration. Desalination for seawater 3.5% salt: distillation boil and condense, expensive energy; reverse osmosis RO high pressure forces water through semipermeable membrane leaving salts, more efficient. Pakistan water scarcity due to population, climate change, need conservation, drip irrigation, rainwater harvesting, dams."},{q:"Discuss importance of water and its conservation",a:"Importance: universal solvent, 70% body, photosynthesis, industry, agriculture, transport, high specific heat regulates climate, ice floats insulates aquatic life. Conservation: close taps, fix leaks, drip irrigation, rainwater harvesting, treat wastewater reuse, awareness. Pakistan per capita water decreasing, need urgent action."}],numericals:[{title:"Hardness",statement:"If water contains 162g Ca(HCO3)2 per m³, how much CaCO3 precipitates on boiling 1m³?",solution:["Moles Ca(HCO3)2=162/162=1 mol","1 mol gives 1 mol CaCO3 100g"],answer:"100g CaCO3"},{title:"Soap Waste",statement:"Why hard water wastes soap? Reaction",solution:["2C17H35COONa + Ca2+ → (C17H35COO)2Ca ↓ + 2Na+","Scum insoluble"],answer:"Scum formation"},{title:"Chlorination",statement:"Write reaction of Cl2 with water",solution:["Cl2+H2O→HOCl+HCl","HOCl disinfectant"],answer:"HOCl formation"}]},{id:"24",number:24,title:"Chemical Industries",urduTitle:"کیمیائی صنعتیں",icon:"\uD83C\uDFED",mcqCount:10,learningOutcomes:["Important industries: urea, cement, glass","Safety measures"],thingsToKnow:["Urea Manufacturing","Cement","Glass"],didYouKnow:[{title:"Urea Production",text:"Pakistan is 5th largest urea producer!"}],interestingInfo:"Cement mein limestone aur clay ko 1500°C par garam karke clinker banaya jata hai!",notes:[{heading:"1. Urea and Fertilizer Industry",content:"Urea NH2CONH2 contains 46% nitrogen highest among fertilizers. Manufacturing: 2NH3+CO2→NH2COONH4 (ammonium carbamate) at 200 atm 200°C, then NH2COONH4→NH2CONH2+H2O dehydration. Raw materials NH3 from Haber process, CO2 from same. Steps: ammonia and CO2 compressed, reacted in autoclave, unreacted gases recycled, urea solution concentrated, prilled in prilling tower (sprayed from top solidifies as droplets fall). Uses: fertilizer provides N for proteins chlorophyll, raw material for urea-formaldehyde resin. Pakistan has large fertilizer industry at Daudkhel, Multan. Other fertilizers: DAP diammonium phosphate, CAN calcium ammonium nitrate.",quickCheck:{q:"Urea N%?",a:"46% nitrogen highest"}},{heading:"2. Cement and Glass Industries",content:"Cement: binding material, Portland cement invented 1824 Joseph Aspdin. Raw materials: limestone CaCO3 75%, clay (Al2O3, SiO2, Fe2O3) 25%. Manufacturing: crushing, grinding, mixing, heating in rotary kiln at 1500°C to form clinker (3CaO.SiO2, 2CaO.SiO2, 3CaO.Al2O3, 4CaO.Al2O3.Fe2O3), grinding clinker with gypsum CaSO4.2H2O to control setting time. Setting: hydration reactions form gel hardens. Types: ordinary Portland, white cement, etc. Glass: supercooled liquid, amorphous. Raw materials: sand SiO2 75%, soda ash Na2CO3 15%, limestone CaCO3 10%, cullet broken glass. Heating at 1500°C in furnace, molten glass shaped by blowing, pressing, floating. Types: soda lime glass (windows, bottles), borosilicate (lab glass, Pyrex, thermal resistant), lead crystal (cut glass, high refractive index).",quickCheck:{q:"Why gypsum added to cement?",a:"To control setting time, prevents quick setting"}}],definitions:[{term:"Fertilizer",eng:"Substance providing nutrients to plants",urdu:"پودوں کو غذائی اجزاء دینے والا"},{term:"Clinker",eng:"Nodules formed at high temp in cement kiln",urdu:"سیمنٹ بھٹے میں بننے والے ڈلے"}],examples:[{title:"Urea Formation",problem:"2NH3+CO2→urea+H2O",steps:["2NH3+CO2→NH2COONH4","NH2COONH4→NH2CONH2+H2O"],answer:"Urea formation"}],mcqs:[{q:"Urea contains N%:",options:["46%","26%","16%","6%"],correct:0,explanation:"Highest N fertilizer"},{q:"Raw materials for urea:",options:["NH3+CO2","N2+O2","H2+O2","CO+ H2"],correct:0,explanation:"Ammonia and carbon dioxide"},{q:"Cement raw materials:",options:["Limestone+clay","Only sand","Only water","Only gypsum"],correct:0,explanation:"CaCO3 and clay"},{q:"Kiln temp for cement:",options:["1500°C","100°C","500°C","50°C"],correct:0,explanation:"High temperature for clinker"},{q:"Gypsum added to cement to:",options:["Control setting","Increase setting","No function","Color"],correct:0,explanation:"Prevents quick setting"},{q:"Glass is:",options:["Supercooled liquid","Crystal","Gas","Plasma"],correct:0,explanation:"Amorphous solid"},{q:"Borosilicate glass used for:",options:["Lab glassware","Windows only","No use","Food only"],correct:0,explanation:"Thermal resistant Pyrex"},{q:"Soda lime glass contains:",options:["SiO2+Na2CO3+CaCO3","Only SiO2","Only Na2CO3","Only CaCO3"],correct:0,explanation:"75% sand 15% soda 10% limestone"},{q:"Prilling tower in:",options:["Urea manufacturing","Cement","Glass","Water"],correct:0,explanation:"Urea droplets solidify"},{q:"White cement is:",options:["No Fe2O3","With Fe2O3","No CaCO3","No clay"],correct:0,explanation:"Iron gives gray color"}],shortQuestions:[{q:"What is urea?",a:"NH2CONH2 46% N fertilizer"},{q:"Manufacturing of urea",a:"2NH3+CO2→NH2COONH4→NH2CONH2+H2O at 200 atm 200°C, prilling tower"},{q:"Raw materials for cement",a:"Limestone CaCO3 75% and clay Al2O3 SiO2 Fe2O3 25%"},{q:"What is clinker?",a:"Nodules formed at 1500°C in kiln: C3S C2S C3A C4AF"},{q:"Why gypsum added?",a:"Control setting time prevents quick setting"},{q:"What is glass?",a:"Supercooled liquid amorphous mixture of silicates"},{q:"Types of glass",a:"Soda lime windows bottles, borosilicate lab Pyrex, lead crystal cut glass"},{q:"Importance of chemical industries",a:"Provide fertilizers for food, cement for construction, glass for housing lab etc."}],longQuestions:[{q:"Describe urea manufacturing with diagram",a:"Urea NH2CONH2 46% N. Manufacturing: raw NH3 from Haber N2+3H2→2NH3, CO2 from flue gases. Reaction in autoclave at 200 atm 200°C: 2NH3+CO2⇌NH2COONH4 ammonium carbamate exothermic, then dehydration NH2COONH4→NH2CONH2+H2O endothermic high T low P favors? Actually equilibrium. Unreacted NH3 CO2 recycled. Urea solution 70% concentrated in evaporator to 99%, sprayed from prilling tower 50m high, droplets solidify as fall by air cooling, collected. Uses fertilizer, resin, etc. Pakistan plants."},{q:"Explain cement manufacturing",a:"Portland cement binding material. Raw limestone 75% clay 25% crushed ground mixed (dry/wet process). Heated rotary kiln 1500°C reactions: CaCO3→CaO+CO2, CaO+SiO2→C2S C3S, CaO+Al2O3→C3A, etc. Clinker nodules formed. Cooled ground with 2-3% gypsum to control setting. Setting: hydration C3S+ H2O→ C-S-H gel + Ca(OH)2, gel hardens binds aggregates. Concrete = cement+sand+gravel+water. Types: ordinary, white (no Fe), rapid hardening, etc."},{q:"Describe glass manufacturing and types",a:"Glass supercooled liquid amorphous, no sharp melting point. Raw sand SiO2 75% soda ash Na2CO3 15% limestone CaCO3 10% cullet. Mixed heated furnace 1500°C: Na2CO3+SiO2→Na2SiO3+CO2, CaCO3+SiO2→CaSiO3+CO2, molten mass. Shaped: blowing (bottles), pressing (plates), floating (windows on molten tin), drawing (tubes). Annealing slow cooling to remove stress. Types: soda lime (windows bottles cheap), borosilicate (Pyrex B2O3 replaces some SiO2 thermal shock resistant lab), lead crystal (PbO replaces CaO high refractive index cut glass, radiation shielding), silica glass (pure SiO2 high temp)."},{q:"Discuss safety measures in chemical industries",a:"Hazards: toxic gases, high T/P, corrosive acids alkalis, flammable. Safety: protective clothing gloves goggles, ventilation, gas detectors, fire extinguishers, training, first aid, effluent treatment before disposal, waste management, emergency exits, MSDS material safety data sheets. Environmental: scrubbers, filters, ETP effluent treatment plant."}],numericals:[{title:"Urea N Content",statement:"Calculate N% in urea NH2CONH2",solution:["Molar mass=60","N mass=28","N%=28/60×100=46.66%"],answer:"46.66%"},{title:"Cement Composition",statement:"If cement contains 65% CaO, calculate CaCO3 needed for 1000kg CaO",solution:["CaCO3→CaO+CO2","100g CaCO3 gives 56g CaO","For 65kg CaO need 65×100/56=116kg CaCO3 per 100kg cement"],answer:"~1160kg per ton"},{title:"Glass Batch",statement:"For 100kg glass batch 75% SiO2 how much sand needed?",solution:["75% of 100kg=75kg SiO2","Sand is ~100% SiO2 so 75kg sand"],answer:"75kg sand"}]},{id:"25",number:25,title:"Analytical Chemistry",urduTitle:"تجزیاتی کیمیا",icon:"\uD83D\uDD2C",mcqCount:10,learningOutcomes:["Qualitative and quantitative analysis","Chromatography, spectroscopy","Laboratory techniques"],thingsToKnow:["Qualitative","Quantitative","Chromatography","Spectroscopy"],didYouKnow:[{title:"Paper Chromatography",text:"Used by police for forensic analysis of inks and drugs!"}],interestingInfo:"Chromatography se rangon ko alag kiya jata hai - is liye naam chroma = color!",notes:[{heading:"1. Analytical Chemistry Basics",content:"Analytical chemistry deals with identification and quantification of substances. Qualitative analysis: what is present? Identification of ions, functional groups. Quantitative: how much? Amount determination via titration, gravimetry. Techniques: classical (wet chemistry) and instrumental. Importance: quality control in industry, medical diagnosis (blood test), environmental monitoring, forensic. Lab safety: wear goggles gloves lab coat, no eating, handle acids bases carefully, know first aid, fire extinguisher types, fume hood for toxic gases.",quickCheck:{q:"Difference qualitative vs quantitative?",a:"Qualitative what present, Quantitative how much"}},{heading:"2. Chromatography and Spectroscopy",content:"Chromatography separation technique based on differential distribution between stationary and mobile phases. Types: paper chromatography (stationary paper, mobile solvent, Rf = distance solute / distance solvent), thin layer chromatography TLC (stationary silica on plate), column chromatography, gas chromatography GC, HPLC high performance liquid chromatography. Applications: separation of inks, amino acids, drugs. Spectroscopy: interaction of matter with electromagnetic radiation. Types: UV-Vis (electronic transitions, concentration via Beer-Lambert A=εcl), IR (vibrational, functional groups), atomic absorption AAS (metal detection). Uses: identify functional groups, determine concentration, metal analysis in blood.",quickCheck:{q:"What is Rf value?",a:"Retention factor = distance traveled by solute / distance traveled by solvent"}}],definitions:[{term:"Analytical Chemistry",eng:"Study of identification and quantification",urdu:"شناخت اور مقدار کا مطالعہ"},{term:"Chromatography",eng:"Separation based on distribution between phases",urdu:"مرحلوں کے درمیان تقسیم کی بنیاد پر علیحدگی"}],examples:[{title:"Rf Calculation",problem:"Solute travels 3cm, solvent 6cm, find Rf",steps:["Rf=3/6=0.5"],answer:"0.5"}],mcqs:[{q:"Qualitative analysis determines:",options:["What is present","How much","Both","None"],correct:0,explanation:"Identification"},{q:"Rf formula:",options:["Distance solute/solvent","Solvent/solute","No formula","Random"],correct:0,explanation:"Retention factor"},{q:"Paper chromatography stationary phase:",options:["Paper","Solvent","Air","Water only"],correct:0,explanation:"Cellulose paper"},{q:"Beer-Lambert law A=",options:["εcl","cl/ε","ε/c","No relation"],correct:0,explanation:"Absorbance ∝ conc"},{q:"IR spectroscopy detects:",options:["Functional groups","Metals only","No detection","Only gases"],correct:0,explanation:"Vibrational transitions"},{q:"AAS used for:",options:["Metal detection","Non-metals only","No use","Only organics"],correct:0,explanation:"Atomic absorption spectroscopy"},{q:"Chromatography name from:",options:["Color","No color","Chromium","Chlorine"],correct:0,explanation:"Chroma=color, first separated plant pigments"},{q:"Lab safety goggles protect:",options:["Eyes","Hands","Feet","No protection"],correct:0,explanation:"Eye protection"},{q:"Quantitative analysis determines:",options:["How much","What","No","Random"],correct:0,explanation:"Amount"},{q:"TLC stationary phase:",options:["Silica gel","Paper only","Gas","Liquid only"],correct:0,explanation:"Silica on aluminum plate"}],shortQuestions:[{q:"Define analytical chemistry",a:"Identification and quantification of substances"},{q:"Qualitative vs quantitative",a:"What vs how much"},{q:"What is chromatography?",a:"Separation based on distribution between stationary and mobile phases"},{q:"Define Rf",a:"Distance solute / distance solvent"},{q:"Types of chromatography",a:"Paper, TLC, column, GC, HPLC"},{q:"What is spectroscopy?",a:"Interaction matter with EM radiation"},{q:"Beer-Lambert law",a:"A=εcl absorbance ∝ concentration"},{q:"Lab safety measures",a:"Goggles gloves coat, no eating, fume hood, first aid, fire extinguisher"}],longQuestions:[{q:"Explain analytical chemistry and its importance",a:"Analytical chemistry qualitative (what) and quantitative (how much). Classical wet chemistry titrations, gravimetry; instrumental spectroscopy chromatography. Importance: industry quality control, medicine blood urine analysis, environment pollution monitoring, forensic crime detection, food adulteration. Lab safety: PPE, handling acids bases, gas cylinders, fire extinguisher types (water for wood paper, CO2 for electrical, foam for oil), fume hood, waste disposal."},{q:"Describe chromatography with paper chromatography",a:"Separation based on distribution between stationary (paper silica) and mobile (solvent). Principle: different solubilities and adsorption. Types: paper (cellulose paper), TLC (silica plate), column (silica column), GC (gas mobile), HPLC high pressure. Paper chromatography procedure: spot mixture on paper, dip in solvent in chamber, solvent rises via capillary action carries components different distances based on solubility, dry spray reagent, calculate Rf = solute distance / solvent distance. Applications: separate inks, amino acids, sugars, drugs, forensic."},{q:"Explain spectroscopy and its types",a:"Spectroscopy interaction EM radiation with matter. Types: UV-Vis electronic transitions, Beer-Lambert A=εcl determines concentration (colorimeter). IR vibrational transitions identifies functional groups (O-H 3200-3600, C=O 1700, C-H 2900). AAS atomic absorption metal detection: sample atomized flame, light from hollow cathode lamp absorbed proportional to metal concentration. Applications: blood lead, water analysis. NMR, mass spec also."},{q:"Discuss laboratory techniques and safety",a:"Techniques: weighing electronic balance, volume measurement pipette burette, titration, filtration, distillation, crystallization, sublimation. Safety: wear goggles gloves coat, tie hair, no eating drinking, handle corrosive with care, use fume hood for toxic gases, know fire extinguisher, first aid for acid spill wash with water, alkali spill wash with water then boric acid, cuts, fire. Waste disposal separate organic inorganic, neutralize acids before disposal."}],numericals:[{title:"Rf",statement:"Solute 4cm solvent 8cm find Rf",solution:["Rf=4/8=0.5"],answer:"0.5"},{title:"Beer-Lambert",statement:"If ε=100, c=0.01M, l=1cm, find A",solution:["A=100×0.01×1=1"],answer:"Absorbance 1"},{title:"Concentration from A",statement:"If A=0.5, ε=100, l=1, find c",solution:["c=A/εl=0.5/100=0.005M"],answer:"0.005M"}]},{id:"26",number:26,title:"Nuclear & Environmental Chemistry",urduTitle:"نیوکلیئر اور ماحولیاتی کیمیا",icon:"☢️",mcqCount:10,learningOutcomes:["Nuclear reactions, radioactivity","Nuclear power, hazards","Environmental chemistry"],thingsToKnow:["Radioactivity","Nuclear Fission","Nuclear Fusion","Half-life"],didYouKnow:[{title:"Nuclear Power",text:"1kg uranium gives energy equal to 20,000 tons coal!"}],interestingInfo:"Pakistan ka pehla nuclear power plant KANUPP 1972 mein Karachi mein laga tha!",notes:[{heading:"1. Radioactivity and Nuclear Reactions",content:"Radioactivity discovered by Becquerel 1896, spontaneous emission of radiation from unstable nuclei. Types: α (He nucleus 4He2, stopped by paper), β (electron, stopped by Al sheet), γ (EM wave high energy, needs lead). Nuclear reactions: Fission breaking heavy nucleus to smaller + energy, e.g., U-235 + n → Ba-141 + Kr-92 +3n +200MeV. Fusion joining light nuclei to heavier + more energy, e.g., 2H+3H→4He+n+17.6MeV, occurs in sun. Half-life: time for half nuclei to decay, t½=0.693/k. Uses: medical treatment cancer Co-60 γ, diagnosis I-131 thyroid, carbon dating C-14, smoke detectors Am-241 α, thickness gauges, sterilization, agriculture mutation breeding.",quickCheck:{q:"Difference fission vs fusion?",a:"Fission breaking heavy to small, fusion joining light to heavy, both release energy, fusion more energy"}},{heading:"2. Nuclear Power and Hazards",content:"Nuclear reactor: fission controlled chain reaction. Components: fuel U-235 enriched, moderator graphite or heavy water slows neutrons, control rods Cd or B absorb neutrons control rate, coolant water carries heat, shielding concrete+lead blocks radiation. Working: fission releases neutrons cause further fission chain reaction controlled by control rods, heat produces steam drives turbine generates electricity. Hazards: radiation damages DNA causes cancer, genetic mutations, nuclear waste long half-life thousands years storage problem, accidents Chernobyl 1986, Fukushima 2011. Safety: shielding, remote handling, waste vitrification, disposal deep geological repositories. Pakistan nuclear plants: KANUPP Karachi, CHASNUPP Chashma 4 plants.",quickCheck:{q:"What is half-life?",a:"Time for half radioactive nuclei to decay"}},{heading:"3. Environmental Chemistry and Green Chemistry",content:"Environmental chemistry studies chemical processes in environment: air, water, soil. Green chemistry: design products and processes that minimize hazardous substances, 12 principles: prevent waste, atom economy, less hazardous synthesis, design safer chemicals, safer solvents, energy efficiency, renewable feedstock, reduce derivatives, catalysis, design for degradation, real-time analysis, inherently safer chemistry. Applications: biodegradable plastics, biofuels, supercritical CO2 as solvent, ionic liquids, solar cells. Sustainable development meets present needs without compromising future. Pakistan environmental issues: air pollution smog in Lahore, water pollution, solid waste, need green chemistry solutions.",quickCheck:{q:"What is green chemistry?",a:"Design that reduces hazardous substances"}}],definitions:[{term:"Radioactivity",eng:"Spontaneous emission of radiation from unstable nuclei",urdu:"غیر مستحکم نیوکلیائی سے شعاعوں کا اخراج"},{term:"Half-life",eng:"Time for half nuclei to decay",urdu:"نصف نیوکلیائی کے ختم ہونے کا وقت"},{term:"Fission",eng:"Breaking heavy nucleus to smaller",urdu:"بھاری نیوکلیئس کا چھوٹے میں ٹوٹنا"}],examples:[{title:"Half-life",problem:"If 100g radioactive sample half-life 10 years, how much remains after 30 years?",steps:["After 10y: 50g","After 20y: 25g","After 30y: 12.5g"],answer:"12.5g"}],mcqs:[{q:"α particle is:",options:["He nucleus","Electron","EM wave","Proton"],correct:0,explanation:"4He2"},{q:"β particle is:",options:["Electron","He nucleus","EM wave","Neutron"],correct:0,explanation:"Fast electron"},{q:"γ rays are:",options:["EM wave high energy","Particles","No energy","Sound"],correct:0,explanation:"Electromagnetic"},{q:"Fission is:",options:["Breaking heavy nucleus","Joining light","No change","Chemical"],correct:0,explanation:"Heavy to smaller + energy"},{q:"Fusion occurs in:",options:["Sun","Earth core","No where","Only lab"],correct:0,explanation:"Light nuclei join in sun"},{q:"Half-life formula:",options:["0.693/k","k/0.693","No formula","k×0.693"],correct:0,explanation:"First order decay"},{q:"Nuclear reactor moderator:",options:["Slows neutrons","Speeds neutrons","No function","Absorbs all"],correct:0,explanation:"Graphite or heavy water"},{q:"Control rods made of:",options:["Cd or B","Fe","Al","Cu"],correct:0,explanation:"Absorb neutrons"},{q:"Green chemistry aims to:",options:["Reduce hazardous substances","Increase hazards","No aim","Only profit"],correct:0,explanation:"Sustainable chemistry"},{q:"KANUPP located:",options:["Karachi","Lahore","Islamabad","Multan"],correct:0,explanation:"First nuclear plant 1972"}],shortQuestions:[{q:"Define radioactivity",a:"Spontaneous emission of radiation from unstable nuclei"},{q:"Types of radiations",a:"α He nucleus stopped by paper, β electron stopped by Al, γ EM wave needs lead"},{q:"Define fission and fusion",a:"Fission breaking heavy to small + energy, fusion joining light to heavy + more energy"},{q:"What is half-life?",a:"Time for half nuclei to decay"},{q:"Components of nuclear reactor",a:"Fuel U-235, moderator graphite/heavy water, control rods Cd/B, coolant water, shielding concrete"},{q:"Uses of radioactivity",a:"Medical treatment Co-60, diagnosis I-131, carbon dating C-14, smoke detectors, thickness gauges"},{q:"Hazards of nuclear",a:"Radiation causes cancer mutations, waste long half-life, accidents"},{q:"What is green chemistry?",a:"Design products processes that minimize hazardous substances, 12 principles"}],longQuestions:[{q:"Explain radioactivity, types and nuclear reactions",a:"Radioactivity spontaneous emission from unstable nuclei discovered Becquerel. α: He nucleus 4He2 mass 4 charge +2 low penetration stopped paper, high ionizing. β: electron 0e-1 mass negligible charge -1 moderate penetration stopped Al, ionizing less. γ: EM wave no mass no charge high penetration needs lead concrete, low ionizing. Nuclear reactions: fission heavy nucleus breaks to smaller plus neutrons and 200MeV energy e.g., U-235+n→Ba+Kr+3n, chain reaction. Fusion light joins to heavier plus more energy e.g., D+T→He+n+17.6MeV requires high T 10^7K occurs in sun stars, more energy per mass than fission. Half-life t½=0.693/k, first order."},{q:"Describe nuclear reactor working and hazards",a:"Reactor controlled fission chain reaction. Components: fuel enriched U-235 (3-4%), moderator graphite or D2O slows fast neutrons to thermal for fission, control rods Cd B absorb excess neutrons control rate, coolant water or gas carries heat to steam turbine generates electricity, shielding concrete+lead blocks radiation. Working: fission releases heat and neutrons, neutrons slowed by moderator cause further fission, controlled by inserting control rods, heat makes steam drives turbine. Hazards: radiation damages DNA cancer genetic mutations, nuclear waste long half-life thousands years storage deep geological, accidents Chernobyl explosion, Fukushima tsunami. Safety: shielding, remote handling, waste vitrification, emergency plans. Pakistan plants KANUPP Karachi, CHASNUPP 4 units."},{q:"Explain uses of radioisotopes",a:"Medical: Co-60 γ for cancer treatment, I-131 for thyroid diagnosis and treatment, P-32 for leukemia, Tc-99m for imaging. Industry: thickness gauges β measures paper metal thickness, smoke detectors Am-241 α ionizes air, sterilization γ kills bacteria, food preservation, leak detection. Agriculture: mutation breeding via γ, fertilizer uptake studies P-32. Research: C-14 dating fossils up to 50,000 years, tracer studies. Carbon dating: living organisms have C-14/C-12 constant, after death C-14 decays with half-life 5730 years, measure remaining to find age."},{q:"Discuss environmental chemistry and green chemistry",a:"Environmental chemistry studies chemical processes air water soil, pollution causes effects prevention. Air pollution, water pollution, soil pollution. Green chemistry 12 principles: prevent waste, atom economy, less hazardous synthesis, design safer chemicals, safer solvents (water, supercritical CO2), energy efficiency, renewable feedstock, reduce derivatives, catalysis, design for degradation, real-time analysis, inherently safer. Applications: biodegradable plastics PLA, biofuels ethanol biodiesel, solar cells, ionic liquids, green solvents. Sustainable development meets present without compromising future. Pakistan issues smog Lahore, water scarcity pollution, solid waste
