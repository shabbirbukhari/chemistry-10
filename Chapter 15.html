ct:2,expl:"Moles NaOH=0.1×0.02=0.002 mol. Ratio 2:1 so H₂SO₄ moles=0.001 in 0.01 dm³. Conc=0.001/0.01=0.1 mol/dm³. Answer (c).",formula:"M₁V₁/n₁ = M₂V₂/n₂"},{q:"Mr=178, empirical C₃H₅O₃ (mass 89). Molecular formula?",options:["C₃H₅O₃","C₆H₁₀O₆","C₉H₁₅O₉","C₆H₅O₃"],correct:1,expl:"n= Mr/Empirical mass =178/89=2. So molecular =2×C₃H₅O₃=C₆H₁₀O₆. Answer (b).",formula:"n = Mr / Er"},{q:"When natural gas burns in limited air, which is limiting reactant?",options:["Oxygen","Carbon dioxide","Water","Natural gas (methane)"],correct:3,expl:"In burning, oxygen from air is usually excess when air is limited? Actually natural gas is fuel - question asks limiting in incomplete combustion? As per book answer is Natural gas (d) - the fuel controls product when air limited in that context.",formula:"Limiting = less product"},{q:"Actual yield 0.198g, theoretical 0.217g. % yield?",options:["100%","91.2%","9%","109%"],correct:1,expl:"%Yield =Actual/Theoretical×100 =0.198/0.217×100=91.24%≈91.2%. Answer (b).",formula:"%Yield = Actual/Theo×100"}],Bm=[{id:"15.1",q:"What is molar volume at RTP?",a:"At RTP (Room Temperature and Pressure), conditions are 25°C or 298 K and 1 atmosphere pressure. At these conditions, 1 mole of ANY gas occupies exactly 24 dm³. This volume is called molar volume. It is same for all gases like H₂, O₂, N₂, CO₂. It helps us to convert between gas volume and moles easily."},{id:"15.2",q:"How is molar gas volume useful?",a:"It is very useful in lab and calculations. If we know volume of gas at RTP, we can find moles using n=V/24. If we know moles, we can find volume using V=n×24. From moles we can also find mass (mass=moles×Mr) and number of molecules. So it connects volume, mass and molecules."},{id:"15.3",q:"Relation of molar volume to Avogadro's Law?",a:"Avogadro's Law says: equal volumes of all gases contain equal number of molecules at same temperature and pressure. Molar volume is the practical use of this law. Since 1 mole contains Avogadro number (6.02×10²³) molecules, so 24 dm³ at RTP contains same number of molecules for any gas. So molar volume is based on Avogadro law."},{id:"15.4",q:"Why two different compounds can have same empirical formula?",a:"Empirical formula shows only SIMPLEST whole number ratio of atoms, not actual number. Molecular formula shows actual atoms. So different molecules can have same simplest ratio. Example: Acetylene C₂H₂ and Benzene C₆H₆ both have empirical CH. Acetic acid CH₃COOH (C₂H₄O₂) and Glucose C₆H₁₂O₆ both have empirical CH₂O. Their molecular masses are different."},{id:"15.5",q:"Method to find molecular mass without knowing formula?",a:"There are 3 simple methods: (1) For gases - Take a known volume at RTP, weigh it, find moles by n=V/24, then Mr=mass/moles. (2) Mass Spectrometer - This instrument gives exact molecular mass directly by measuring weight of molecule. (3) Colligative properties - Like elevation of boiling point or depression of freezing point can be used to find molar mass in lab."},{id:"15.6",q:"Find concentration of 49g H₂SO₄ in 1 dm³ solution?",a:"First find Mr of H₂SO₄ =2+32+64=98. Moles= mass/Mr =49/98=0.5 mol. Volume is already 1 dm³. Concentration (mol/dm³)= moles/volume =0.5/1=0.5 mol/dm³. So concentration is 0.5 mol per dm³. In g/dm³ it is 49 g/dm³."}],Qm=[{id:"15.1",q:"4g CH₄ at RTP: find moles, volume, molecules.",steps:["Given mass=4g, Mr CH₄=16","Moles =mass/Mr =4/16=0.25 mol","Volume at RTP =moles×24 =0.25×24=6 dm³","Molecules =moles×6.02×10²³ =0.25×6.02×10²³ =1.505×10²³ molecules"],ans:"0.25 mol, 6 dm³, 1.505×10²³ molecules"},{id:"15.2",q:"NaCl solution 150 cm³, 0.4 mol/dm³. Find mass of NaCl.",steps:["Volume 150cm³ =150/1000=0.15 dm³","Moles =Conc×Vol =0.4×0.15=0.06 mol","Mr NaCl=23+35.5=58.5","Mass =moles×Mr =0.06×58.5=3.51 g"],ans:"3.51 g NaCl"},{id:"15.3",q:"% of Na in NaHCO₃?",steps:["Mr NaHCO₃=23+1+12+48=84","Mass of Na=23","%Na =23/84×100","=27.38%"],ans:"27.38% Na"},{id:"15.4",q:"Compound has Fe 2.333g and S 1.926g. Find empirical formula.",steps:["Moles Fe =2.333/56=0.04166 mol","Moles S =1.926/32=0.06018 mol","Divide by smallest: Fe 0.04166/0.04166=1, S 0.06018/0.04166=1.44","To get whole number multiply by? 1.44×2=2.88≈3, so multiply both by 2 => Fe₂S₂.₈₈≈Fe₂S₃","So empirical Fe₂S₃ (Iron(III) sulfide)"],ans:"Fe₂S₃"},{id:"15.5",q:"Compound C 40%, H 6.71%, O 53.3%. 0.32 mol weighs 28.8g. Find molecular formula.",steps:["Mr =mass/moles =28.8/0.32=90","Empirical: C 40/12=3.33, H 6.71/1=6.71, O 53.3/16=3.33","Divide by smallest 3.33: C=1, H≈2, O=1 => CH₂O","Empirical mass =12+2+16=30","n=90/30=3","Molecular =3×CH₂O =C₃H₆O₃"],ans:"C₃H₆O₃ (lactic acid)"},{id:"15.6",q:"Ammonia: 12g H₂ (6 mol) + 64g N₂ (2.285 mol). Find limiting.",steps:["Reaction: N₂+3H₂→2NH₃","Need 3 mol H₂ for 1 mol N₂","For 2.285 mol N₂, need H₂=2.285×3=6.857 mol","We have only 6 mol H₂, so H₂ is less than required","Therefore H₂ is limiting reactant, N₂ excess"],ans:"H₂ limiting"},{id:"15.7",q:"AgNO₃ 305g → Mg(NO₃)₂. Theoretical 132.8g, actual 23.7g. Find % yield.",steps:["Theoretical yield given =132.8g (from calculation)","Actual yield =23.7g","%Yield =Actual/Theoretical×100","=23.7/132.8×100","=17.84% ≈17.8%"],ans:"17.8% yield"},{id:"15.8",q:"Gold bar 3.66g impure, pure gold 2.45g. Find purity %.",steps:["Purity% =mass pure / total mass ×100","=2.45/3.66×100","=66.939%","≈66.94% pure"],ans:"66.94% pure gold"}],Wm=[{id:"15.1",q:"How to identify limiting reactant? Explain with steps.",a:["First, find moles of each reactant from given mass using moles = mass/Mr.","Second, look at balanced chemical equation to see mole ratio. Use that ratio to calculate how much product each reactant can make if it reacts completely.","Third, compare product amounts. The reactant that produces LEAST amount of product is limiting reactant because it will finish first and reaction will stop.","The other reactant that is left behind is called excess reactant.","Example: Glucose 25g (0.138 mol) and O₂ 40g (1.25 mol) for C₆H₁₂O₆+6O₂→6CO₂. Glucose makes 0.848 mol CO₂, O₂ makes 1.25 mol CO₂. Since glucose makes less, it is limiting. So only 36.96g CO₂ forms."]},{id:"15.2",q:"Why is purity important for medicine?",a:["Medicines need exact dose to cure disease. If medicine is impure, it contains less active drug than written on label, so it will not work properly and patient will not get better.","Impurities can be harmful or even poisonous. They can cause side effects, allergies, or damage to body organs.","Checking purity ensures medicine is safe, effective, and gives correct dose. It is part of quality control in pharmaceutical companies. Without purity test, medicine can be dangerous.","Example: If a tablet should have 500mg paracetamol but due to impurity only 400mg pure, patient gets low dose and fever not controlled."]},{id:"15.3",q:"Will there be limiting reactant in reversible reaction?",a:["No, in reversible reaction there is usually no limiting reactant in the strict sense.","In reversible reaction, reaction goes both forward and backward at same time. Reactants never fully finish; they reach equilibrium where both reactants and products remain in mixture.","Limiting reactant concept is for reactions that go to completion in one direction only, where one reactant is completely consumed.","In reversible reactions like N₂+3H₂ ⇌ 2NH₃, both N₂ and H₂ remain at equilibrium, so we cannot say one fully consumed. So limiting reactant idea does not apply clearly."]},{id:"15.4",q:"How to know if formula is empirical or molecular?",a:["Look at subscripts in formula. Try to divide all subscripts by same whole number (2,3,4 etc).","If you can divide and still get whole numbers, then it is molecular formula, not empirical. If you cannot simplify further, it is empirical.","Example: C₆H₆ can be divided by 6 to get CH. So CH is empirical, C₆H₆ is molecular. C₂H₄ divides by 2 to CH₂, so CH₂ empirical.","Example of empirical: NaCl, H₂O, CH₄, C₆H₁₂O₆? No, C₆H₁₂O₆ divides by 6 to CH₂O so it is molecular, CH₂O is empirical."]},{id:"15.5",q:"Method to find molecular mass without knowing formula?",a:["Method 1 - Using gas volume at RTP: Take a known volume of gas at RTP, weigh it accurately. Find moles using moles = Volume/24. Then Mr = mass/moles. This works only for gases.","Method 2 - Mass Spectrometer: This is best modern method. Instrument ionizes molecule and measures its mass directly from how it moves in magnetic field. Gives exact molecular mass even for solids/liquids.","Method 3 - Colligative properties: In lab we can use elevation in boiling point or depression in freezing point. When solute is dissolved, boiling point increases. From change in temperature we can calculate molar mass."]},{id:"15.6",q:"Why is percentage yield important?",a:["Percentage yield tells how efficient a chemical reaction is in real life compared to theory.","100% yield means all reactants became desired product with no waste. Less than 100% means some material wasted due to side reactions, incomplete reaction, or loss during filtering, washing, transferring.","In industry, low yield means loss of money and materials. Companies want high yield to save cost and make more profit, so they improve temperature, pressure, catalysts.","It also helps to find errors in experiment. If yield is very low, it shows mistake in procedure or conditions need improvement."]}];function wu(){let[e,t]=$t.useState("light"),[n,r]=$t.useState("syllabus"),[l,i]=$t.useState({}),[o,u]=$t.useState({}),[a,p]=$t.useState({"15.1":!0}),[h,v]=$t.useState(0),d=e==="dark",k=Object.keys(l).filter((c)=>l[Number(c)]===Gl[Number(c)].correct).length,x=Object.keys(l).length,N=()=>t(d?"light":"dark"),I=(c,s)=>{if(s?.currentTarget)s.currentTarget.setAttribute("data-clicked",Date.now().toString());r(c),v((f)=>f+1)};return w("div",{className:`min-h-screen font-sans transition-colors duration-300 ${d?"bg-[#0f1117] text-zinc-100":"bg-[#fafaf9] text-zinc-900"}`,children:[m("style",{children:"@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500
