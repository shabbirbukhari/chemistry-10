limited to polyamides from dicarboxylic acid and diamine, polyesters from dicarboxylic acid and diol","Describe differences between addition and condensation polymerization","State that plastics are made from polymers","Describe how properties of plastics have implications for their disposal","Describe environmental challenges caused by plastics limited to disposal in landfill sites, accumulation in oceans, formation of toxic gases from burning","Describe structure of nylon a polyamide, PET a polyester (full name PET polyethylene terephthalate not required)","State that PET can be converted back into monomers and repolymerised","Outline importance of polymers in textile industry. Examples of polymers being used may be given along with specific properties"],Ut=[{q:"Which polymer is synthetic polymer?",options:["(a) Starch","(b) Cellulose","(c) Animal fat","(d) Polyester"],ans:3,exp:"Starch, cellulose and animal fat are natural polymers. Polyester (PET) is man-made synthetic polymer formed by condensation of diol and dicarboxylic acid."},{q:"Which polymer has amide linkage?",options:["(a) Polyester","(b) Polyamide","(c) Polyethene","(d) Polystyrene"],ans:1,exp:"Polyamide (nylon) contains -CO-NH- amide linkage formed between -COOH of dicarboxylic acid and -NH2 of diamine. Polyester contains ester linkage -CO-O-."},{q:"Identify ester linkage:",options:["(a) R-C(=O)-O-R","(b) R-C(=O)-O-NH-R","(c) R-C(=O)-R","(d) R-C(=O)-NH-R"],ans:0,exp:"Ester linkage is -C(=O)-O- formed when -COOH reacts with -OH with loss of water. Amide linkage is -C(=O)-NH-."},{q:"The structure of monomer of polymer [ -CH2-CH(OCOCH3)- ]n is:",options:["(a) CH2=CH2","(b) CH2=CH-CH3","(c) CH2=CH-OCOCH3","(d) CH2=CH-CO-O-CH3"],ans:2,exp:"For addition polymers, change single bond in repeat unit to double bond. -[CH2-CH(OCOCH3)]-  =>  CH2=CH-OCOCH3 vinyl acetate. Breaking the backbone C-C gives C=C."},{q:"Which polymer can be recycled?",options:["(a) PET","(b) Polystyrene","(c) PVC","(d) Epoxy"],ans:0,exp:"PET can be chemically recycled by heating in absence of oxygen to break ester linkages back to monomers (terephthalic acid + ethylene glycol) and then repolymerised. Others are difficult to recycle."},{q:"Which polymer is biodegradable?",options:["(a) Polyamide","(b) Polyester","(c) Starch","(d) PET"],ans:2,exp:"Starch is natural polymer (polysaccharide) made by plants, microorganisms can break it down. Synthetic polymers like polyamide, polyester, PET are not biodegradable and take up to 1000 years."},{q:"Which polymer is obtained by condensation polymerization?",options:["(a) Polyvinyl chloride","(b) Polystyrene","(c) Polyamide","(d) Polyethene"],ans:2,exp:"Polyamide (nylon) is condensation polymer formed from dicarboxylic acid + diamine with elimination of H2O and amide linkage. PVC, polystyrene, polyethene are addition polymers from alkenes."}],A0=[{q:"26.1 Give two examples each of addition polymers and condensation polymers.",a:`Addition polymers are formed by addition of monomers containing C=C without loss of small molecule.
Examples:
1. Polyethene (Polythene): -[CH2-CH2]-n from ethene CH2=CH2, used in shopping bags, bottles.
2. Polypropylene: -[CH2-CH(CH3)]-n from propene CH2=CH-CH3, used in ropes, containers.

Condensation polymers are formed by reaction of two bifunctional monomers with elimination of H2O/HCl/NH3 and contain ester or amide linkage.
Examples:
1. PET Polyester: -[O-CH2-CH2-O-CO-C6H4-CO]-n from ethylene glycol HO-CH2-CH2-OH + terephthalic acid HOOC-C6H4-COOH, used in bottles, fibers.
2. Polyamide Nylon: -[CO-CH2-CH2-CO-NH-(CH2)4-NH]-n from butanedioic acid HOOC-CH2-CH2-COOH + butane-1,4-diamine H2N-(CH2)4-NH2, used in clothing, ropes.`},{q:"26.2 How polymers are useful for us?",a:`Polymers are extremely useful due to high strength, flexibility, resistance to heat and chemicals, lightweight and ability to be moulded into any shape:
1. Plastics: PE, PP, PS used for carry bags, food containers, bottles, buckets, chairs, pipes, wrappers, cups, plates.
2. Textile: Nylon, polyester, acrylic, rayon used for clothes, sportswear, hosiery, sweaters - cheaper, stronger, no shrinkage, wrinkle resistant, quick drying.
3. Natural polymers: Carbohydrates (starch, cellulose) provide energy and structure, proteins build body, nucleic acids store genetic information.
4. Special uses: Teflon non-stick coating, 3D printing objects layer-by-layer, natural rubber for tyres, bakelite for electrical switches.
One of most significant changes in world is replacement of metals, wood, cotton with synthetic polymers.`},{q:"26.3 How synthetic fibers are different from natural fibers?",a:`Natural fibers: Obtained from nature e.g. cotton from plants, silk and wool from animals. They are biodegradable, absorb water, shrink on washing, wrinkle easily, attacked by moths, expensive.

Synthetic fibers: Man-made polymers e.g. nylon, polyester, rayon, acrylic made by polymerization in factory.

Differences:
1. Cost: Synthetic cheaper than natural silk/cotton.
2. Strength: Synthetic stronger, more durable.
3. Shrinkage: Natural shrinks, synthetic does not shrink.
4. Wrinkle: Synthetic resist wrinkling, natural wrinkles.
5. Drying: Synthetic lightweight and quick drying, natural heavy and slow drying.
6. Moth resistant: Synthetic moth/insect resistant, natural attacked by insects.
7. Biodegradability: Natural biodegradable, synthetic non-biodegradable (environment problem).`},{q:"26.4 Are natural polymers hazardous for environment? Explain why?",a:`No, natural polymers are NOT hazardous for environment. They are biodegradable.

Examples: Starch, cellulose, proteins, natural rubber, nucleic acids. When discarded, microorganisms (bacteria, fungi) break them down into simple molecules like CO2, H2O, NH3 within weeks/months. They become part of natural cycle.

Synthetic polymers are hazardous because they do NOT undergo biodegradation. They take up to 1000 years to break down. They accumulate in landfill, oceans, release toxic gases on burning causing pollution, harming marine life and human health.

So natural polymers are eco-friendly, synthetic polymers cause plastic pollution if not properly recycled.`},{q:"26.5 Draw structures of following polymers (a) Polypropylene (b) Polystyrene",a:`(a) Polypropylene (PP): Addition polymer of propene CH2=CH-CH3

Monomer: CH2 = CH
               |
              CH3

Polymerization: n CH2=CH-CH3  --high pressure, catalyst-->  -[CH2-CH(CH3)]-n

Structure: 
      CH3   CH3   CH3
       |     |     |
   -[ CH2-CH - CH2-CH - CH2-CH ]-n
Repeat unit: -[CH2-CH(CH3)]-

(b) Polystyrene (PS): Addition polymer of styrene

Monomer: CH2=CH-Ph   where Ph = C6H5 benzene ring

Monomer structure: CH2=CH-C6H5

Polymerization: n CH2=CH-C6H5 --> -[CH2-CH(C6H5)]-n

Structure:
      Ph    Ph    Ph
       |     |     |
   -[ CH2-CH - CH2-CH - CH2-CH ]-n
   Ph = phenyl ring

Repeat unit: -[CH2-CH(C6H5)]-  or -[CH2-CH(Ph)]-n

Both are addition polymers, contain only C-C single bonds in backbone, no by-product.`}],$0=[{title:"DESCRIPTIVE",items:[{q:"26.1 How is PET formed? Can you recycle this polymer?",a:`PET means Polyethylene Terephthalate, a polyester condensation polymer.

Formation:
Monomers: Ethane-1,2-diol (ethylene glycol) HO-CH2-CH2-OH (a diol) and Terephthalic acid HOOC-C6H4-COOH (a dicarboxylic acid, benzene-1,4-dicarboxylic acid).

Reaction: Carboxyl group -COOH of acid reacts with hydroxyl group -OH of diol forming ester linkage -CO-O- with elimination of water molecule.

Equation:
n HO-CH2-CH2-OH  +  n HOOC-C6H4-COOH  --acid, heat-->  
-[O-CH2-CH2-O-CO-C6H4-CO]-n  +  2n H2O

Structure of repeat unit: -[O-CH2-CH2-O-C(=O)-Ph-C(=O)]- where Ph = benzene ring. Contains ester linkage -C(=O)-O-.

Polymerization continues both ends because both monomers have two functional groups.

Recycling: YES, PET can be recycled.
It is unique because ester linkage can be broken by chemical recycling. By heating polymer in absence of oxygen (or with water/methanol at high temperature), PET breaks down back to monomers: ethylene glycol and terephthalic acid. These monomers are purified and repolymerised to make new PET bottles/fibers. This reduces plastic waste and saves raw materials. This is why PET coded as 1 and widely recycled.`},{q:"26.2 Differentiate between addition and condensation polymerizations.",a:`Difference Table from book:

| Addition Polymerization | Condensation Polymerization |
| Single monomer used, must have double or triple bond e.g. CH2=CH2 | Two different monomers, each has two functional groups on both ends e.g. diol + dicarboxylic acid, diamine + dicarboxylic acid |
| Involves addition reaction only, no by-product, C=C breaks to C-C | Involves condensation reaction with elimination of small molecule H2O, HCl, NH3 etc |
| Molecular mass of polymer = sum of masses of monomers used | Molecular mass of polymer != sum of masses because small molecules eliminated |
| Polymer backbone contains only C-C single bonds | Polymer contains specific linkage: ester -CO-O- in polyester, amide -CO-NH- in polyamide |
| Examples: Polyethene PE, Polypropene PP, Polystyrene PS, PVC -[CH2-CHCl]-, Polyvinyl acetate, PAN | Examples: PET polyester, Nylon polyamide, Bakelite |

Addition: n CH2=CH2 -> -[CH2-CH2]-n
Condensation: n HO-CH2-CH2-OH + n HOOC-Ph-COOH -> -[O-CH2-CH2-O-CO-Ph-CO]-n + H2O`},{q:"26.3 Write down reactions along with conditions to prepare polyamide and polyester.",a:`1) POLYESTER (PET) Preparation:

Monomers: Ethylene glycol HO-CH2-CH2-OH + Terephthalic acid HOOC-Ph-COOH
Condition: Acid catalyst, heat, high temperature, removal of water.

Reaction:
n HO-CH2-CH2-OH + n HOOC-Ph-COOH  --H+, Δ-->  -[O-CH2-CH2-O-CO-Ph-CO]-n  + 2n H2O

Mechanism: -OH attacks -COOH, forms ester -CO-O- and H2O lost. Both ends have -OH and -COOH so chain grows long. Repeat unit contains ester linkage.

2) POLYAMIDE (Nylon) Preparation:

Example from book: Butanedioic acid (succinic acid) HOOC-CH2-CH2-COOH + Butane-1,4-diamine H2N-CH2-CH2-CH2-CH2-NH2

Condition: Heat, acid or base catalyst, removal of water.

Reaction:
n HOOC-CH2-CH2-COOH + n H2N-(CH2)4-NH2  --Δ-->  -[CO-CH2-CH2-CO-NH-(CH2)4-NH]-n  + 2n H2O

Mechanism: Each -COOH reacts with -NH2 forming amide linkage -CO-NH- and H2O lost.
Repeat unit: -[CO-CH2-CH2-CO-NH-CH2-CH2-CH2-CH2-NH]-
Linkage: -CO-NH- amide linkage.
If longer chain used e.g. hexanedioic acid + hexamethylene diamine gives Nylon-6,6.

Both are condensation polymers because H2O eliminated.`},{q:"26.4 Describe role of synthetic polymers in textile industry.",a:`Polymers used in textile industry are called synthetic fibers. Most important are polyester and nylon which account for 69% of all material used in clothing worldwide.

Examples:
- Nylon (polyamide): strong, elastic
- Polyester (PET): strong, wrinkle resistant
- Rayon: made from cellulose, soft
- Acrylic: lightweight, warm, wool-like

Importance / Properties that make them useful in textile:

1. Cheaper cost than natural fibers like cotton, silk, wool.
2. Stronger and more durable than natural fibers, long lasting, high tensile strength.
3. Do not shrink on washing unlike cotton.
4. Resist wrinkling, keep shape, easy to maintain.
5. Lightweight and quick drying, good for sportswear.
6. Moth and insect resistant, not attacked by bacteria.
7. Can be blended with natural fibers to improve properties.
8. Can be made into different textures, colors, water proof.

Uses:
- Polyester: sportswear, shirts, hosiery, sarees, curtains because strong, resists shrinking.
- Nylon: socks, stockings, parachutes, ropes, carpets due to high strength and elasticity.
- Acrylic: sweaters, blankets because lightweight, soft, provides warmth, wool-like.
- Figure 26.2 shows plastic fibers.

Overall synthetic polymers revolutionized textile industry by providing cheap, durable, easy-care clothing.`},{q:"26.5 Describe effects of synthetic polymers on environment.",a:`Synthetic polymers (plastics) are extremely useful but cause serious environmental pollution because they are non-biodegradable.

Adverse Effects:

1. Non-biodegradable: Unlike natural polymers, plastics do not undergo biodegradation by microorganisms. When discarded they can take up to 1000 years to break down. Leads to build up of huge amounts of plastic waste everywhere.

2. Landfill problem: Discarded articles put in bins and dumped in landfill sites. They remain for centuries, occupy large space, prevent water percolation, make soil infertile, block drains.

3. Ocean accumulation: Plastic thrown in drains goes to rivers, seas, oceans. Forms huge garbage patches. Marine animals (fish, turtles, whales) eat plastic or get entangled, die. Microplastics enter food chain, cause health problems. Plastic pollution found everywhere - land, air, rivers, ponds, lakes, seas, oceans - alarming level Fig 26.3.

4. Burning toxic gases: Burning discarded plastics in towns releases dangerous gases like CO, HCl, dioxins, phosgene, furans. Creates hazardous environmental condition, air pollution, respiratory diseases, cancer, acid rain.

5. Properties implication: Plastics are lightweight, durable, cheap so used excessively and thrown away, making disposal difficult. Flexible and durable means they persist.

Solutions: Reduce, reuse, recycle (especially PET which can be converted back to monomers), use biodegradable alternatives, proper collection, avoid burning.

Properties can be changed by controlling chemical structure e.g. Teflon non-stick coating, 3D printing polymers.`}]},{title:"CONSTRUCTED RESPONSE",items:[{q:"26.1 Why dangerous to burn discarded articles made of plastics?",a:`Burning plastics is dangerous because:

1. Releases toxic gases: Plastics are made of carbon, hydrogen, chlorine (PVC). On burning they produce CO (poisonous), CO2 (greenhouse), HCl (acid gas), dioxins, furans, phosgene - very hazardous.

2. Air pollution: These gases create smog, irritate eyes, lungs, cause asthma, bronchitis, cancer.

3. Dioxins are persistent organic pollutants, cause hormonal problems, birth defects.

4. Incomplete combustion in towns at low temperature produces more toxins.

5. Acid gases cause acid rain damaging buildings, crops.

So burning plastics creates hazardous environmental condition for humans and environment. Better to recycle or landfill than burn in open.`},{q:"26.2 Why not advisable to dump discarded synthetic articles in oceans?",a:`Not advisable to dump synthetic articles in oceans because:

1. Non-biodegradable: Take up to 1000 years, accumulate, form huge floating garbage islands.

2. Harm marine life: Fish, turtles, sea birds, whales mistake plastic for food, eat it, block stomach, die. Animals get entangled in nets/bags, suffocate.

3. Microplastics: Large plastics break into tiny microplastics (<5mm) that enter food chain, reach human food (fish, salt), cause health problems.

4. Pollution of water: Blocks sunlight, reduces oxygen, kills coral reefs.

5. Economic loss: Spoils beaches, affects fishing, tourism.

6. Transport: From oceans spreads everywhere, found even in Arctic.

So ocean dumping causes widespread plastic pollution alarming level. Must prevent, collect and recycle.`},{q:"26.3 What is role of catalyst in addition polymerization?",a:`Role of catalyst in addition polymerization:

Addition polymerization: n CH2=CH2 -> -[CH2-CH2]-n

- C=C double bond is strong, does not break easily at room temperature.
- High pressure and high temperature needed, but still slow.
- Catalyst (e.g. Ziegler-Natta catalyst TiCl4 + Al(C2H5)3, or benzoyl peroxide, or traces of oxygen) speeds up reaction by lowering activation energy.
- Catalyst helps break pi bond of C=C and allows monomers to join quickly in proper orientation.
- Gives control over structure, branching, molecular mass.
- Allows reaction at lower pressure/temperature, saves energy, gives better quality polymer (e.g. HDPE vs LDPE).
- Without catalyst polymerization would be very slow or need extreme conditions.

So catalyst makes addition polymerization fast, economical, and gives desired polymer properties.`},{q:"26.4 Deduce monomer from following addition polymers (i) [-CH2-CHCl-]n (ii) [-CH2-CH(CN)-]n",a:`Rule for addition polymer to monomer: Identify repeat unit -[CH2-CHX]-n, remove brackets and n, change backbone single bond to double bond: CH2=CHX.
