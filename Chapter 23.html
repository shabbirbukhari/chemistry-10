.","Discuss applications of alcohols as fuels including advantages and disadvantages over fossil fuels.","Explain role of alcohols in various industries such as pharmaceuticals, cosmetics and fuel production.","Discuss impact of alcohols in daily life including use as solvents and disinfectants."],Sr=[{q:"Which conditions are best for fermentation of glucose?",options:["35°C, fresh yeast, absence of oxygen","100°C, yeast, presence of oxygen","0°C, yeast, absence of oxygen","35°C, yeast, presence of oxygen"],ans:0,exp:"Fermentation needs around 35°C, fresh yeast (enzyme zymase) and anaerobic conditions. Oxygen converts ethanol to ethanoic acid."},{q:"Which catalyst other than H₃PO₄ can also be used for hydration of alkenes?",options:["NaOH","H₂SO₄","Al₂O₃","Ni"],ans:1,exp:"Concentrated H₂SO₄ is also an acid catalyst for hydration of ethene to ethanol."},{q:"Alcohol which has maximum heat of combustion:",options:["CH₃OH","CH₃CH₂OH","CH₃CH₂CH₂OH","CH₃CH₂CH₂CH₂OH (Butanol)"],ans:3,exp:"Heat evolved increases with number of -CH₂- groups. Butanol has most C-H bonds to break and forms most C=O and O-H bonds, so ΔH is most negative (-2676 kJ/mol)."},{q:"Most environment friendly fuel:",options:["Petrol","Diesel","Ethanol","Coal"],ans:2,exp:"Ethanol is carbon-neutral, does not produce SOx, reduces greenhouse gases by 44-52% and produces less CO, NOx, particulate matter."},{q:"Which properties of ethanol make it suitable for cosmetic industry?",options:["High boiling point","Highly volatile and deodorizing / antimicrobial","Toxic nature","Non-soluble"],ans:1,exp:"Highly volatile (evaporates quickly), deodorizing, anti-inflammatory, refreshing and antimicrobial properties."},{q:"Which is correct IUPAC name for CH₃-CH(OH)-CH₂-CH(CH₃)-CH₃ ?",options:["2-Methylpentan-4-ol","4-Methylpentan-2-ol","4-Methylpentan-3-ol","2-Methylpentan-3-ol"],ans:1,exp:"Longest chain 5 carbons, OH at C2, methyl at C4. So 4-methylpentan-2-ol."},{q:"Which property of ethanol makes it suitable for cleaning wounds?",options:["Fuel","Solvent only","Antiseptic / bactericidal","Colour"],ans:2,exp:"Ethanol has bactericidal activity, used as disinfectant, antiseptic in methylated spirit and hand sanitizer."},{q:"Which alcohol is added to petrol to improve combustion, feedstock for vinegar and many organic compounds?",options:["Methanol","Propanol","Ethanol","Butanol"],ans:2,exp:"Ethanol is used as fuel additive, solvent in perfumes, antiseptic, and to prepare ethanoic acid (vinegar) and many organics."}],$m=[{q:"Q23.1 What is the role of yeast in fermentation of glucose?",a:"Yeast contains enzymes (zymase) which act as biological catalyst. In anaerobic conditions at around 35°C, these enzymes break down glucose (C₆H₁₂O₆) into ethanol and carbon dioxide: C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂. Yeast does not take part chemically but speeds up reaction."},{q:"Q23.2 At what temperature enzymes of yeast become inactive? Why does fermentation stop at 15% ethanol?",a:"Lower than 35°C → rate very slow. Around 35°C is optimum for maximum yield. Higher than 40-45°C → enzymes become denatured/inactive and reaction stops. Also when concentration of ethanol exceeds 15% in mixture, ethanol is toxic to yeast and yeast becomes inactive, so fermentation stops automatically. Further distillation is needed to get higher concentration."},{q:"Q23.3 Why is oxygen excluded during fermentation?",a:"Fermentation must be carried out in absence of air (anaerobic conditions). If oxygen is present, it oxidizes the produced ethanol into ethanoic acid (CH₃COOH) and yield of ethanol decreases. Also anaerobic condition favours action of yeast enzymes to produce ethanol."},{q:"Q23.4 Why does amount of heat evolved increase from methanol to butanol?",a:"During combustion, weaker C-H and C-C bonds in -CH₂- groups are broken and stronger C=O bonds in CO₂ and O-H bonds in H₂O are formed. Energy released in forming strong bonds is more than energy needed to break weak bonds. As we go from lower to higher alcohol, number of -CH₂- groups increases, more bonds are broken and formed, so more heat is evolved. Butanol (-CH₂CH₂CH₂CH₃) gives more heat than propanol."},{q:"Q23.5 Why burning of alcohols does not produce oxides of sulphur unlike fossil fuels?",a:"Alcohols contain only carbon, hydrogen and oxygen (C, H, O). They have no sulphur atoms. Fossil fuels like petrol, diesel and coal contain sulphur compounds as impurities, which on burning produce SO₂ and SO₃ causing acid rain. Burning alcohols gives only CO₂ and H₂O, so they are more environment friendly."},{q:"Q23.6 Give two uses of ethanol in daily life as solvent and disinfectant.",a:`1. As Solvent: Ethanol is relatively safe, can dissolve many organic compounds insoluble in water. Widely used as solvent in perfumes, after-shave lotions, deodorants, inks and medicines.
2. As Disinfectant/Antiseptic: Due to bactericidal activity, methylated spirit (ethanol + methanol) is kept in first aid kit to clean wounds, sterilize skin, as hand sanitizer and antidote for snake bites in many areas.`}],Um=[{q:"Q23.1 Explain manufacture of ethanol by two methods: Fermentation and Hydration of ethene with equations and conditions.",a:`Ethanol is monohydroxy alkane CH₃-CH₂-OH, very important alcohol manufactured on large scale by two methods:

A) FERMENTATION OF GLUCOSE BY YEAST:
Definition: Fermentation is a reaction in which a complex substance breaks into simpler substances in presence of enzymes present in yeast. Examples: making yogurt, bread and ethanol.

Process: Glucose solution is mixed with fresh yeast. Temperature is kept around 25-35°C (optimum 35°C) and neutral or slightly acidic medium. Fermentation is carried out in absence of air (anaerobic) in closed vessel with outlet for CO₂.

Equation: C₆H₁₂O₆ --(35°C, yeast enzymes)--> 2 C₂H₅OH + 2 CO₂
Glucose → Ethanol + Carbon dioxide

Points:
- CO₂ gas bubbles out, leaving mixture of ethanol and water.
- Lower temperature decreases rate, higher temperature makes enzymes inactive.
- When ethanol concentration exceeds 15%, ethanol becomes toxic to yeast and yeast stops working.
- 15% alcohol is obtained, needs fractional distillation to increase concentration (needs energy).

B) HYDRATION OF ETHENE (ETHYLENE):
Definition: Hydration is addition reaction where water is added across double bond of ethene.

Process: Mixture of ethene (CH₂=CH₂) and steam (H₂O) is passed over hot phosphoric acid H₃PO₄ (or H₂SO₄) which acts as catalyst at 300°C and 60 atm (6000 kPa).

Equation: CH₂=CH₂ + H₂O --(300°C, 60 atm, H₃PO₄)--> CH₃CH₂OH
Ethene + Water → Ethanol

- H from H₂O attaches to one carbon, OH to other carbon, double bond breaks to single.
- Gaseous ethanol obtained, then condensed to liquid.
- Important industrial process because ethene from crude oil gives versatile ethanol for drinks, fuels, solvent.`},{q:"Q23.2 Describe combustion of alcohols with balanced equations. Why heat increases in homologous series?",a:`Alcohols are flammable and burn in air (excess O₂) to produce CO₂ and H₂O and evolve large amount of heat (exothermic).

Balanced Equations:
1. Methanol: 2CH₃OH + 3O₂ → 2CO₂ + 4H₂O   ΔH = -726 kJ/mol
2. Ethanol: C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O   ΔH = -1367 kJ/mol
3. 1-Propanol: 2C₃H₇OH + 9O₂ → 6CO₂ + 8H₂O   ΔH = -2017 kJ/mol
4. Butanol: 2C₄H₉OH + 12O₂ → 8CO₂ + 10H₂O   ΔH = -2676 kJ/mol

Explanation of Heat Trend:
During combustion, weaker C-H bonds in -CH₂- groups and C-C and C-O bonds are broken, and much stronger C=O bonds in CO₂ and O-H bonds in H₂O are formed. Formation of strong bonds releases more energy than needed to break weak bonds.

As we go down the series, number of -CH₂- groups increases, more bonds are broken and more strong bonds are formed, so amount of heat evolved increases. That is why butanol evolves higher heat (-2676) than propanol (-2017). This is general trend in homologous series.`},{q:"Q23.3 Discuss advantages and disadvantages of alcohols as fuels compared to fossil fuels.",a:`Alcohols, especially first four aliphatic alcohols (methanol, ethanol, propanol, butanol) are suitable for internal combustion engines and used as fuels instead of petrol/diesel.

ADVANTAGES:
1. Renewable Source: Alcohols can be obtained from renewable sources like cane-sugar, corn, plant materials (fermentation). Fossil fuels are non-renewable.
2. Environment Friendly - No SOx: Burning alcohols does not produce oxides of sulphur (SO₂/SO₃) because alcohols have only C, H, O. Fossil fuels contain sulphur and cause acid rain.
3. Higher Fuel Efficiency & Less Pollution: Alcohols have higher octane number and fuel efficiency. Ethanol as fuel reduces greenhouse gas emissions by 44-52% compared to petrol, and cuts down CO, NOx and particulate matter.
4. Carbon Neutral: Alcohols produced from plant materials by photosynthesis using CO₂ of atmosphere. Same CO₂ is generated when bio-alcohol burns in engine. Overall process is considered carbon neutral because it does not increase net CO₂ concentration in atmosphere.

DISADVANTAGES:
1. Less Energy per Volume: Alcohols have less energy per litre than gasoline. More fuel needed to travel same distance (lower mileage per litre).
2. Engine Wear: Alcohols are corrosive and can increase wear and tear of engine components, seals and fuel lines if engine not modified.
3. Food vs Fuel Issue: Land utilized to grow crops (sugarcane, corn) for alcohols affects cultivation of food crops, can increase food prices and reduce food supply.`},{q:"Q23.4 Explain role of ethanol in pharmaceutical, cosmetic and fuel industries.",a:`PHARMACEUTICAL INDUSTRY:
- Ethyl alcohol is very common ingredient in manufacturing processes.
- Possesses bactericidal activity, often used as disinfectant, hand sanitizer and methylated spirit.
- Commonly used as solvent and preservative in many pharmaceutical preparations including vaccines.
- Ethanol and isopropanol are found as active ingredient in certain oral and topical drug products to help solubilize many drugs which are insoluble in water.
- Used to sterilize equipment.

COSMETIC INDUSTRY:
Ethyl alcohol plays important role because of its properties:
1. Highly Volatile: Evaporates in very short time, gives quick drying effect in products.
2. Deodorizing and Anti-inflammatory properties.
3. Refreshing and Antimicrobial properties.

It is important part of: hair styling products, foundation creams, perfumes, deodorants, after-shave lotions, mouth washes.

FUEL PRODUCTION INDUSTRY:
- Ethanol widely used as high efficiency fuel to drive vehicles, blended with petrol (E10, E85).
- Used as alternative to petrol/diesel to reduce pollution.
- Important feedstock for preparing many organic compounds like ethanoic acid (vinegar), ethene etc.

Note: Ethyl alcohol as drink can cause hangover, alcohol poisoning, accidents, risky behaviour. Long-term use known to cause more than 200 different diseases.`},{q:"Q23.5 Discuss impact of alcohols in daily life including use as solvents and disinfectants.",a:`Ethyl alcohol is essential part of life:

1. AS ANTISEPTIC / FIRST AID:
- Methylated spirit (ethanol + small methanol) is kept in first aid kit of every home.
- Used as antiseptic for dressing wounds, cleaning skin, preventing infection due to bactericidal nature.
- Used as antidote for snake bites in many parts of world.

2. AS SOLVENT:
- Ethanol is relatively safe solvent, can dissolve many organic compounds which are insoluble in water.
- Widely used as solvent in perfumes (dissolves fragrance oils), inks, varnishes, paints, medicines, tinctures.

3. AS FUEL:
- Ethanol used as high efficiency fuel, additive in petrol improves combustion.
- Cleaner burning, reduces greenhouse emissions.

4. AS DISINFECTANT / SANITIZER:
- Due to antimicrobial property, ethanol (70%) kills bacteria and many viruses, used in hand sanitizers, hospital disinfectants, to clean surfaces.

5. IN COSMETICS:
- As explained, used in deodorants, perfumes, lotions because volatile and refreshing.

6. IN BEVERAGES AND INDUSTRY:
- Important part of alcoholic drinks (though harmful in excess), and industrial solvent for manufacturing.

Overall alcohols make life easier as fuel, medicine, cleaning agent and chemical feedstock.`},{q:"Q23.6 Compare fermentation and hydration of ethene methods (Table 23.1).",a:`COMPARISON TABLE - MANUFACTURE OF ETHANOL:

| Property | Fermentation of Glucose | Hydration of Ethene |
|---|---|---|
| Conditions | Takes place around 35°C and atmospheric pressure, anaerobic | Reaction performed at high temp 300°C and high pressure 60 atm / 6000 kPa |
| Starting Material | Renewable source such as cane-sugar, corn, biomass | Obtained from crude oil (ethene), non-renewable source |
| Catalyst | Enzymes in yeast (biological catalyst) | Phosphoric acid H₃PO₄ or conc. H₂SO₄ (acid catalyst) |
| Rate of Reaction | Low, may take days to complete | High, fast continuous process |
| Purity / Concentration | Produces 15% alcohol only, needs further distillation which requires energy | Produces relatively pure alcohol directly, no 15% limit |
| Cost | Ethanol produced is cheap (raw material cheap) but distillation cost extra | Ethanol produced is expensive (needs high T, P, crude oil) but pure |
| Environmental Impact | More eco-friendly, carbon neutral, renewable | Less eco-friendly, depends on fossil fuels |
| Equation | C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂ | CH₂=CH₂ + H₂O → CH₃CH₂OH |

Advantages of fermentation: low temp, renewable, cheap raw material.
Disadvantages: slow, 15% limit, needs distillation energy, batch process.

Advantages of hydration: fast, pure product, continuous.
Disadvantages: high temp/pressure (energy costly), non-renewable ethene, expensive.`},{q:"Q23.7 Why ethanol is considered carbon-neutral fuel? Explain.",a:`Carbon neutral means net addition of CO₂ to atmosphere is zero.

Process:
1. Plants grow by photosynthesis: they take CO₂ from atmosphere + water + sunlight → produce glucose and oxygen: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂
2. Glucose is fermented to ethanol (bioethanol).
3. This ethanol is burnt as biofuel in vehicle: C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O

The CO₂ produced in step 3 is same CO₂ which was taken from atmosphere in step 1 to make plants.
