"5"],ans:1,exp:"Pentane has 3 isomers: n-pentane, 2-methylbutane, 2,2-dimethylpropane."},{q:"Which ester is called ethyl propanoate?",options:["CH₃COOCH₃","CH₃COOC₂H₅","HCOOC₂H₅","CH₃CH₂COOC₂H₅"],ans:3,exp:"Ethyl propanoate = CH₃-CH₂-C(=O)-O-C₂H₅, acid part propanoate (3 carbons) alcohol part ethyl (2 carbons)."},{q:"Which functional group is present in alkenes?",options:["C-C single","C≡C triple","C=C double","-OH"],ans:2,exp:"Alkenes contain at least one C=C double bond as functional group."}],A0=[{q:"21.1 Difference between saturated and unsaturated hydrocarbons?",a:`Saturated hydrocarbons have all carbon-carbon single bonds only. Example: Alkanes like methane CH₄, ethane CH₃-CH₃. They are saturated because each carbon uses four single bonds.

Unsaturated hydrocarbons have one or more carbon-carbon bonds that are not single. They have double bond or triple bond. Example: Alkenes CH₂=CH₂ have C=C, Alkynes HC≡CH have C≡C.`},{q:"21.2 Write structural formula of Butan-2-ol?",a:`Butan-2-ol means 4 carbons, OH at carbon 2.
Structural formula: CH₃-CH(OH)-CH₂-CH₃
Displayed: CH₃ - CH(OH) - CH₂ - CH₃ with OH attached to second carbon.`},{q:"21.3 Why ethylamine CH₃CH₂NH₂ called organic compound?",a:"Organic compounds are primarily composed of carbon atoms covalently bonded to each other or to hydrogen. Ethylamine has formula CH₃-CH₂-NH₂. It contains carbon and hydrogen as main chain, derived from hydrocarbon ethane by replacing one H with NH₂. So it is organic derivative, though it contains nitrogen. Any compound with carbon-hydrogen framework is considered organic."},{q:"21.4 Formula of ester called ethyl methanoate?",a:`Ethyl methanoate is HCOOC₂H₅.

Methanoate part = HCOO- (1 carbon acid), Ethyl part = -C₂H₅ alcohol.`},{q:"21.5 Define structural isomerism?",a:`When two or more compounds have same molecular formula but different structural formulae and different properties, they are called isomers and the phenomenon is called structural isomerism.
Example: C₄H₁₀ has two isomers: n-butane CH₃-CH₂-CH₂-CH₃ and 2-methylpropane CH₃-CH(CH₃)-CH₃.`},{q:"21.6 Give IUPAC name of CH₃CH₂CH₂CH₃?",a:"CH₃-CH₂-CH₂-CH₃ has 4 carbons in continuous chain, all single bonds, no functional group. Root But- for 4 carbons, suffix -ane for alkane. So name is Butane (n-butane)."},{q:"21.7 What is common in carboxyl, amide, ester functional groups?",a:`All three contain carbonyl group C=O.
- Carboxyl: -C(=O)-OH
- Amide: -C(=O)-NH₂
- Ester: -C(=O)-OR
Common part is C=O (carbon double bonded to oxygen). Difference is second atom attached: OH in carboxyl, NH₂ in amide, OR in ester.`}],B0=[{type:"Constructed Response",q:"21.1 Why members of homologous series have similar chemical properties?",a:"Homologous series is family of organic compounds with same functional group and same general formula. Functional group determines chemical properties of a compound. Since all members of a homologous series have same functional group, they show almost identical chemical reactions. For example all alcohols contain -OH group, so all react similarly with sodium, with carboxylic acids etc. Difference of CH₂ only changes physical properties like boiling point, not chemical behaviour."},{type:"Constructed Response",q:"21.2 How properties of 2-methylpropane different from n-butane both same number of carbons?",a:`Both have same molecular formula C₄H₁₀ but different structural formulae, so they are structural isomers.

n-butane: CH₃-CH₂-CH₂-CH₃ straight chain.
2-methylpropane: CH₃-CH(CH₃)-CH₃ branched chain.

Due to different structure, physical properties differ:
- Boiling point of n-butane is higher (-0.5°C) than 2-methylpropane (-11.7°C) because straight chain has larger surface area.
- Melting point, density, solubility also differ.
- Chemical properties are similar because both are alkanes, but branched is more compact, more volatile.
This proves same formula can give different compounds.`},{type:"Constructed Response",q:"21.3 Write structural formulae of isomers of saturated hydrocarbon containing five carbons?",a:`C₅H₁₂ has 3 structural isomers:

1. Pentane (n-pentane):
CH₃-CH₂-CH₂-CH₂-CH₃ straight chain.

2. 2-Methylbutane (Isopentane):
CH₃-CH(CH₃)-CH₂-CH₃
One CH₃ branch on carbon 2.

3. 2,2-Dimethylpropane (Neopentane):
C(CH₃)₄ or CH₃-C(CH₃)₂-CH₃
Central carbon attached to four CH₃ groups, highly branched.
All have same formula C₅H₁₂ but different arrangement.`},{type:"Constructed Response",q:"21.4 Write structural formulae of isomers shown by butene?",a:`Butene C₄H₈ shows two positional isomers due to different position of double bond:

1. But-1-ene:
CH₂=CH-CH₂-CH₃
Double bond at carbon 1.
Displayed: H₂C=CH-CH₂-CH₃

2. But-2-ene:
CH₃-CH=CH-CH₃
Double bond at carbon 2.
Displayed: CH₃-CH=CH-CH₃

But-2-ene also shows cis-trans (geometric) isomerism but at simple level these two are structural isomers.`},{type:"Constructed Response",q:"21.5 Explain difference among functional groups aldehyde, ketone, carboxylic acid?",a:`All contain carbonyl C=O but position and other group differ:

1. Aldehyde: -C(=O)-H or -CHO. Carbonyl at end of chain, one side H, one side alkyl. Example Methanal H-C(=O)-H, Ethanal CH₃-C(=O)-H. They are at terminal position.

2. Ketone: -C(=O)- where R is alkyl on both sides. Structure R-C(=O)-R'. Carbonyl in middle. Example Propanone CH₃-C(=O)-CH₃, Butanone CH₃-CH₂-C(=O)-CH₃.

3. Carboxylic acid: -C(=O)-OH or -COOH. Carbonyl with OH attached. Acidic. Example Methanoic acid H-C(=O)-OH, Ethanoic acid CH₃-C(=O)-OH.

Difference: Aldehyde has H, ketone has two alkyls, acid has OH which makes it acidic.`},{type:"Descriptive",q:"21.1 What is organic compound? How classified based on type of carbon chain present?",a:`Organic compound: Chemical compound primarily composed of carbon atoms covalently bonded to each other or to other elements. Majority also contain hydrogen. Other elements present: oxygen, nitrogen, sulphur, halogens etc. Few carbon compounds like oxides, carbonates, hydrogen carbonates are studied as inorganic. Organic chemistry is branch studying compounds of carbon and hydrogen (hydrocarbons) and their derivatives.

Classification based on carbon chain:

(i) Open chain or Acyclic / Aliphatic: Carbon atoms in open chain, may be straight or branched.
- Straight chain examples: Butane CH₃-CH₂-CH₂-CH₃, But-1-ene CH₂=CH-CH₂-CH₃, Butan-1-ol CH₃-CH₂-CH₂-CH₂-OH
- Branched examples: 2-Methylpropane CH₃-CH(CH₃)-CH₃, 2,2-Dimethylpropane C(CH₃)₄

(ii) Closed chain or Cyclic: One or more closed rings.
- Carbocyclic: ring contains carbon only.
   * Alicyclic: ring of 3 or more carbons, resemble aliphatic, general formula CₙH₂ₙ. Examples cyclopropane, cyclobutane, cyclohexane, cyclohexene.
   * Aromatic: simplest contain one benzene ring - six carbons with three alternate double and single bonds shown as circle. Other cyclic having alternate double bonds also aromatic. Example Benzene C₆H₆.
- Heterocyclic: ring contains other atoms like O, N, S besides carbon.

Interesting: Ability of carbon to form four bonds creates almost infinite variety.
Difference cyclohexane vs benzene: Cyclohexane is saturated alicyclic with single bonds, benzene is aromatic unsaturated with alternate double bonds represented by circle.`},{type:"Descriptive",q:"21.2 Explain structural formula giving examples?",a:`Structural formula shows arrangement of atoms and bonds present in a molecule. It gives enough information to understand structure clearly. Usually most single covalent bonds are omitted, only important double and triple bonds shown. Identical groups bracketed.

Types:
- Displayed / Full Structural Formula: Detailed structure showing relative position of atoms and number and type of bonds represented by lines. Example Ethene displayed as H₂C=CH₂ with all bonds.
- Condensed Structural Formula: Still uses lines for bonded atoms but omits carbon to hydrogen bonds. Example CH₃-CH₃ for ethane.

Table 21.1 Examples:
- Ethene: CH₂=CH₂ displayed H₂C=CH₂
- Ethyne: HC≡CH
- Ethane: CH₃-CH₃
- Propane: CH₃-CH₂-CH₃
- But-1-ene: CH₂=CH-CH₂-CH₃
- But-2-ene: CH₃-CH=CH-CH₃
- Butane: CH₃-CH₂-CH₂-CH₃
- Butan-1-ol: CH₃-CH₂-CH₂-CH₂-OH
- Butan-2-ol: CH₃-CH(OH)-CH₂-CH₃
- Propanol isomers: Propan-1-ol CH₃-CH₂-CH₂-OH and Propan-2-ol CH₃-CH(OH)-CH₃
- Ethanoic acid: CH₃-C(=O)-OH
- Propanoic acid: CH₃-CH₂-C(=O)-OH
- Methyl ethanoate: CH₃-C(=O)-O-CH₃

Students should familiarize all ways of writing same compound.`},{type:"Descriptive",q:"21.3 Write five characteristics of homologous series?",a:`Homologous series are families of closely related compounds similar in structure and chemical properties. Characteristics:

(i) All members represented by general formula: e.g. alkanes CₙH₂ₙ₊₂, alkenes CₙH₂ₙ, alkynes CₙH₂ₙ₋₂, alcohols CₙH₂ₙ₊₁OH, carboxylic acids CₙH₂ₙ₊₁COOH

(ii) Successive members differ by CH₂ group and 14 units of molecular mass. Example CH₄ (16) and C₂H₆ (30) differ by 14.

(iii) Different members have common functional group. Example all carboxylic acids contain -COOH.

(iv) Members have almost identical chemical properties due to same functional group.

(v) Physical properties like melting point, boiling point, density, solubility show regular change with increase in molecular masses. Boiling point increases as carbon chain increases.

(vi) All members can be prepared by similar general methods.

These show that chemistry is systematic, not random.`},{type:"Descriptive",q:"21.4 Give IUPAC rules for naming alcohols?",a:`Alcohols are monohydroxy derivatives of alkanes, general formula R-OH. Functional group -OH.

Rules for IUPAC naming:

1. Select longest continuous carbon chain containing OH group as parent hydrocarbon. Change ending 'e' of alkane to 'ol'. Example methane to methanol.

2. Number the longest chain starting from end where carbon attached to OH gets lowest possible number. This gives position of OH.

3. Position of OH indicated by number placed before '-ol'. Example CH₃-CH₂-CH₂-OH is Propan-1-ol, CH₃-CH(OH)-CH₃ is Propan-2-ol.

Table 21.4 Examples:
- Methanol CH₃OH Methyl alcohol
- Ethanol CH₃CH₂OH Ethyl alcohol
- Propan-1-ol CH₃CH₂CH₂OH Propyl alcohol (common name n-propyl alcohol)
- Propan-2-ol CH₃CH(OH)CH₃ Isopropyl alcohol
- Butan-1-ol CH₃CH₂CH₂CH₂OH n-Butyl alcohol
- Butan-2-ol CH₃CH(OH)CH₂CH₃ Sec-Butyl alcohol

If more OH groups, diol, triol etc used, but in this chapter only one OH.`},{type:"Descriptive",q:"21.5 Name following compounds? (a) CH₃CH₂CH₂OH (b) CH₃CH₂CHO (c) CH₃CH₂CH₂COOH (d) CH₃CH₂COOCH₃",a:`(a) CH₃CH₂CH₂OH: 3 carbons, OH at carbon 1, alkane propane -> propan-1-ol. Common name n-propyl alcohol. Structure: CH₃-CH₂-CH₂-OH
