"}],["path",{d:"m3 7 2 2 4-4",key:"1obspn"}],["path",{d:"M13 6h8",key:"15sg57"}],["path",{d:"M13 12h8",key:"h98zly"}],["path",{d:"M13 18h8",key:"oe0vm4"}]]);var vr=W("Moon",[["path",{d:"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z",key:"a7tn18"}]]);var gr=W("Sun",[["circle",{cx:"12",cy:"12",r:"4",key:"4exip2"}],["path",{d:"M12 2v2",key:"tus03m"}],["path",{d:"M12 20v2",key:"1lh1kg"}],["path",{d:"m4.93 4.93 1.41 1.41",key:"149t6j"}],["path",{d:"m17.66 17.66 1.41 1.41",key:"ptbguv"}],["path",{d:"M2 12h2",key:"1t8f8n"}],["path",{d:"M20 12h2",key:"1q8mjw"}],["path",{d:"m6.34 17.66-1.41 1.41",key:"1m8zz5"}],["path",{d:"m19.07 4.93-1.41 1.41",key:"1shlcs"}]]);var xr=W("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]);var td=Ie(yt(),1),Rm=Symbol.for("react.element");var Fm=Object.prototype.hasOwnProperty,Lm=td.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Am={key:!0,ref:!0,__self:!0,__source:!0};function nd(e,t,n){var r,i={},l=null,o=null;n!==void 0&&(l=""+n),t.key!==void 0&&(l=""+t.key),t.ref!==void 0&&(o=t.ref);for(r in t)Fm.call(t,r)&&!Am.hasOwnProperty(r)&&(i[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)i[r]===void 0&&(i[r]=t[r]);return{$$typeof:Rm,type:e,key:l,ref:o,props:i,_owner:Lm.current}}var C=nd,H=nd;var Im=["Describe reactions of carboxylic acids with metals, bases and carbonates including names and formulae of salts produced.","Describe formation of ethanoic acid by oxidation of ethanol with acidified aqueous potassium manganate(VII) and by bacterial oxidation during vinegar production.","Describe reaction of carboxylic acid with alcohol using acid catalyst to form ester (esterification).","Describe industrial applications of carboxylic acids and esters including use as solvents, flavours, fragrances and plastics.","Explain role of carboxylic acids and esters in daily life including use in food preservation, cosmetics and pharmaceuticals."],Dm=[{id:1,title:"1. Preparation of Ethanoic Acid (Acetic Acid)",content:"Carboxylic acids are organic compounds containing carboxyl group -COOH attached to alkyl group or hydrogen. They are generally weak acids compared to mineral acids because they do not give proton easily. They occur naturally in living organisms and can also be synthesized.",subsections:[{heading:"A) Oxidation of Ethanol by Acidified KMnO4",text:"Ethanol is oxidized by hot acidified potassium manganate(VII) to first ethanal which then further undergoes oxidation under reaction conditions to give ethanoic acid. Hot acidified KMnO4 is a very efficient oxidizing agent. During reaction purple colour of reagent changes to colourless because Mn is reduced from +7 to +2.",equations:["CH3CH2OH + [O] —KMnO4/H+→ CH3CHO + H2O","Ethanol → Ethanal","CH3CHO + [O] —KMnO4/H+→ CH3COOH","Ethanal → Ethanoic Acid","Overall: CH3CH2OH + 2[O] → CH3COOH + H2O"]},{heading:"B) Preparation by Oxidative Fermentation (Commercial Method)",text:"Alcoholic foodstuffs like grain, malt, rice, potato mesh are converted to vinegar when they undergo fermentation in presence of acetic acid bacteria. If sufficient oxygen is provided, bacteria oxidize ethanol to acetic acid.",equations:["CH3CH2OH + O2 —bacteria→ CH3COOH + H2O"],points:["In this process alcohol is fermented in vinegar tank provided with continuous supply of oxygen.","Liquid present in tank is stirred continuously when oxygen is bubbled through it.","In this method vinegar containing 15% ethanoic acid can be prepared in only 24 hours.","Why sufficient oxygen? Oxygen is needed to oxidize ethanol to ethanoic acid. Bacteria need oxygen for this oxidation.","Can methanol be oxidized by KMnO4 like ethanol? Yes, methanol oxidizes to methanoic acid and then further to CO2 and water.","Difference: Chemical oxidation uses KMnO4 (inorganic reagent). Fermentation uses living organisms and enzymes."]}]},{id:2,title:"2. Reactions of Carboxylic Acids as Acids",content:"Carboxylic acids are generally much weaker acids than mineral acids. However they react with more reactive metals, bases and carbonates to give salts.",subsections:[{heading:"A) Reaction with Metals",text:"Carboxylic acids react with reactive metals rather slowly to give salt and hydrogen gas.",equations:["2CH3COOH + Mg → (CH3COO)2Mg + H2↑","Ethanoic acid + Magnesium → Magnesium ethanoate + Hydrogen","Salt: Magnesium ethanoate, Formula: (CH3COO)2Mg"]},{heading:"B) Reaction with Bases (Alkalis)",text:"Simple neutralization reaction. Carboxylic acid reacts with metal hydroxides to give salt and water.",equations:["CH3COOH + NaOH → CH3COONa + H2O","Ethanoic acid + Sodium hydroxide → Sodium ethanoate + Water","Salt: Sodium ethanoate, Formula: CH3COONa"]},{heading:"C) Reaction with Carbonates and Bicarbonates",text:"When solid sodium carbonate is mixed with aqueous ethanoic acid, effervescence is observed due to evolution of CO2 gas and sodium ethanoate is formed. Reaction with calcium carbonate (marble chips) proceeds slowly.",equations:["2CH3COOH + Na2CO3 → 2CH3COONa + CO2↑ + H2O","Sodium ethanoate produced","2CH3COOH + CaCO3 → (CH3COO)2Ca + CO2↑ + H2O","Calcium ethanoate produced, Formula: (CH3COO)2Ca","General: 2RCOOH + Na2CO3 → 2RCOONa + CO2 + H2O"]}]},{id:3,title:"3. Reaction with Alcohols – Esterification",content:"Carboxylic acids form esters when heated with excess alcohols in presence of concentrated H2SO4 as catalyst. Reaction is called esterification. It is a reversible reaction with water as by-product.",subsections:[{heading:"General Equation",text:"Carboxylic acid + Alcohol —conc. H2SO4, heat→ Ester + Water",equations:["R-COOH + R'-OH ⇌ R-COOR' + H2O"]},{heading:"Important Examples",text:"",equations:["CH3COOH + CH3CH2OH —H2SO4→ CH3COOC2H5 + H2O","Ethanoic acid + Ethanol → Ethyl ethanoate (sweet fruity smell)","CH3COOH + CH3OH —H2SO4→ CH3COOCH3 + H2O","Ethanoic acid + Methanol → Methyl ethanoate","CH3CH2COOH + C2H5OH —H2SO4→ CH3CH2COOC2H5 + H2O","Propanoic acid + Ethanol → Ethyl propanoate"]}]},{id:4,title:"4. Industrial Applications of Carboxylic Acids and Esters",content:"",subsections:[{heading:"A) As Flavouring Agents",text:"Flavouring agents are substances added to give additional taste and flavour to a substance. They help in masking unpleasant tastes of drugs especially for children. Organic acids like tartaric acid, citric acid, malic acid are very commonly used as flavour enhancers in food industry. Sour taste of foods is largely due to these acids. They improve taste of food and beverage products especially soft drinks. Esters have pleasant odours and flavours and are added to food products to improve smell and taste.",equations:[]},{heading:"B) As Solvents",text:"Acetic acid dissolves many compounds like oils, sulphur, iodine and is miscible with water. In industry acetic acid is used as solvent for resins, paints and lacquers. Esters are also commonly used as solvents. Ethyl acetate is used to extract caffeine from coffee and also used as nail polish and paint remover. Some volatile esters are used as solvents for coatings, paints, varnishes, plastics, resins and lacquers. Pure acetic acid is also called glacial acetic acid. It is corrosive, colourless solid/liquid completely miscible with water.",equations:[]},{heading:"C) As Synthetic Fibres and Plastics",text:"Esters play important role in production of synthetic polymers. Very important polymer polyester is made by reacting diols and dicarboxylic acids. Esters are also important in manufacture of soaps and detergents. Carboxylic acids and derivatives are very commonly used to give different types of plastics e.g. acetic acid is used in production of cellulose acetate plastic. Palmitic and stearic acids are extensively used in production of soaps, cosmetics, pharmaceuticals, candles and protective coatings. Oleic acid is used in manufacture of soaps and detergents. Acrylic acid is starting reagent to prepare many long-chain polymers called acrylates. Polymethyl methacrylate is used as substitute for glass named Plexiglass.",equations:[]}]},{id:5,title:"5. Carboxylic Acids and Esters in Daily Life",content:"",subsections:[{heading:"Household Acids (Table 24.1)",text:"",equations:["Vitamin C → Ascorbic acid","Lemons → Citric acid","Vinegar → Acetic acid (CH3COOH)","Apple, grapes, carrots → Malic acid"]},{heading:"Esters and Flavours (Table 24.2)",text:"",equations:["Methyl butyrate → Apple flavour","Ethyl butyrate → Pineapple flavour","n-Amyl acetate (CH3COOC5H11) → Pears / Bananas","n-Octyl acetate → Orange flavour","Methyl salicylate → Apricot flavour"]},{heading:"Food Preservation",text:"Food preservatives are chemical compounds added to food stuff to prevent or retard growth of microorganisms. e.g. benzoic acid, acetic acid, propionic acid and methyl/ethyl esters of 4-hydroxy benzoic acid. Presence of preservatives helps to maintain quality of food and extend shelf-life. Foods preserved include jams, juices, fruit juices, milk and many drinks. Acetic acid is very widely used as preservative in pickles.",equations:[]},{heading:"Medicines, Cosmetics, Soaps",text:"Carboxylic acids and compounds obtained from them are very commonly used as medicines - aspirin and ibuprofen are carboxylic acid derivatives. Addition of some carboxylic acids during preparation of medicines helps improve drug delivery, absorption and overall performance. Citric acid esters are primarily plasticizers used in many industries. Carboxylic acids are used in soaps, cosmetics and pharmaceuticals.",equations:[]}]}],Qi=[{q:"Identify the ester functional group:",options:["-COOR","-COOH","-OH","-CHO"],ans:0,exp:"Ester functional group is -COOR. -COOH is carboxylic acid, -OH is alcohol, -CHO is aldehyde."},{q:"During oxidation of ethanol by acidified KMnO4, which element is reduced?",options:["Potassium (K)","Carbon (C)","Manganese (Mn)","Oxygen (O)"],ans:2,exp:"Mn is reduced from +7 (purple MnO4-) to +2 (colourless Mn2+). Purple colour changes to colourless."},{q:"Fermentation of foodstuffs in presence of acetic acid bacteria needs sufficient oxygen. Role of oxygen is:",options:["It reduces ethanol","It oxidizes ethanol to ethanoic acid","It kills bacteria","It prevents fermentation"],ans:1,exp:"Oxygen oxidizes ethanol which is formed during reaction to acetic acid. Bacteria need oxygen to produce vinegar. Reaction: CH3CH2OH + O2 → CH3COOH + H2O"},{q:"Which organic acid is used as component of food?",options:["Hydrochloric acid","Sulphuric acid","Nitric acid","Acetic acid"],ans:3,exp:"Acetic acid (vinegar) is used in food. Mineral acids like HCl, H2SO4, HNO3 are not used as food components."},{q:"Which acid is present in apples?",options:["Citric acid","Acetic acid","Tartaric acid","Malic acid"],ans:3,exp:"Apples, grapes and carrots contain Malic acid. Lemons contain citric acid, vinegar contains acetic acid."},{q:"Which substances react to produce CH3CH2CH2COOC2H5 (Ethyl butanoate)?",options:["Methanoic acid + Propanol","Ethanoic acid + Methanol","Butanoic acid + Ethanol : CH3CH2CH2COOH + CH3CH2OH","Propanoic acid + Ethanol"],ans:2,exp:"Butanoic acid (CH3CH2CH2COOH) + Ethanol (CH3CH2OH) → Ethyl butanoate (CH3CH2CH2COOC2H5) + H2O. Acid gives CH3CH2CH2COO- part, alcohol gives -C2H5 part."},{q:"Formula of ester formed by reaction of methanol with propanoic acid:",options:["CH3COOCH3","HCOOCH3","CH3CH2COOCH3","CH3CH2COOC2H5"],ans:2,exp:"Propanoic acid CH3CH2COOH + Methanol CH3OH → Methyl propanoate CH3CH2COOCH3 + H2O. Acid part propanoate, alcohol part methyl."},{q:"Which polymer is made by reacting diol and dicarboxylic acid?",options:["Polythene","Polyester","PVC","Polypropene"],ans:1,exp:"Polyester is made by reacting diols (two -OH) and dicarboxylic acids (two -COOH). Very important industrial polymer for fibres and plastics."},{q:"Which compound is used as synthetic fibre?",options:["Ethyl acetate","Polyester","Citric acid","Methyl butyrate"],ans:1,exp:"Polyester is used as synthetic fibre. Ethyl acetate is solvent, citric acid is flavouring, methyl butyrate is apple flavour ester."}],$m=[{q:"24.1 What is esterification reaction?",a:`When carboxylic acid is heated with excess alcohol in presence of concentrated H2SO4 as catalyst, it forms ester and water. Reaction is called esterification.

General: R-COOH + R'-OH ⇌ R-COOR' + H2O (conc. H2SO4, heat)

Example: CH3COOH + C2H5OH → CH3COOC2H5 (Ethyl ethanoate) + H2O

It is a reversible reaction. Conc. H2SO4 acts as catalyst and dehydrating agent.`},{q:"24.2 Name oxidizing agent used to oxidize alcohols?",a:`The oxidizing agent used to oxidize alcohols to carboxylic acids is acidified aqueous potassium manganate(VII) i.e. acidified KMnO4.

Ethanol → Ethanal → Ethanoic acid
CH3CH2OH + [O] → CH3CHO + H2O
CH3CHO + [O] → CH3COOH

During reaction purple colour of KMnO4 changes to colourless because Mn(+7) is reduced to Mn(+2).

For commercial preparation by fermentation, oxygen in presence of acetic acid bacteria acts as oxidizing agent: CH3CH2OH + O2 → CH3COOH + H2O.`},{q:"24.3 Why sufficient oxygen is provided during fermentation to prepare acetic acid from ethanol?",a:`Sufficient oxygen is provided during fermentation because:
1. Oxygen oxidizes ethanol to ethanoic acid (acetic acid).
2. Acetic acid bacteria need oxygen for this oxidation process.
3. Reaction is: CH3CH2OH + O2 —bacteria→ CH3COOH + H2O
4. In vinegar tank continuous supply of oxygen is bubbled and liquid is stirred continuously to ensure complete oxidation.
5. With sufficient oxygen, vinegar containing 15% ethanoic acid can be prepared in only 24 hours.`},{q:"24.4 What is role of carboxylic acids in preparation of beverages?",a:`Role of carboxylic acids in beverages:
1. Used as flavour enhancers. Sour taste of foods and drinks is largely due to these acids.
2. They improve taste of some food and beverage products especially soft drinks.
3. Commonly used acids are tartaric acid, citric acid and malic acid.
4. They also act as preservatives and help maintain quality.
5. Example: Citric acid in lemons and soft drinks gives sour taste and enhances flavour.`},{q:"24.5 Give practical example of acid or ester used as flavouring agent?",a:`Examples of acids as flavouring agents:
- Citric acid in soft drinks and lemons
- Tartaric acid in foods
- Malic acid in apples

Examples of esters as flavouring agents (Table 24.2):
- Methyl butyrate → Apple flavour
- Ethyl butyrate → Pineapple flavour
- n-Amyl acetate → Pears / Bananas flavour
- n-Octyl acetate → Orange flavour
- Methyl salicylate → Apricot flavour

Esters have pleasant odours and are added to food products to improve smell and taste. They also mask unpleasant tastes of drugs especially for children.`},{q:"24.6 Which carboxylic acids are very often used as flavour enhancers?",a:`The carboxylic acids very often used as flavour enhancers in food industry are:
1. Tartaric acid
2. Citric acid
3. Malic acid

These acids are responsible for sour taste of foods. They improve taste of food and beverage products especially soft drinks. They are organic acids that occur naturally in fruits.`},{q:"24.7 Which property of acetic acid makes it suitable to act as preservative in pickle?",a:`Acetic acid is suitable as preservative in pickle because:
1. Food preservative is chemical compound added to food to prevent or retard growth of microorganisms.
2. Acetic acid is acidic, it creates acidic medium which kills bacteria and prevents growth of microorganisms.
3. Presence of preservative helps maintain quality of food and extends shelf-life.
4. Acetic acid is very widely used as preservative in pickles, jams, juices and many drinks.
5. It prevents spoilage and keeps pickle safe for long time.`}],Um=[{q:"24.1 How does ethanol react with propanoic acid? (Constructed Response)",a:`Reaction of ethanol with propanoic acid is esterification reaction.

When propanoic acid is heated with excess ethanol in presence of concentrated H2SO4 as catalyst, it forms ester ethyl propanoate and water.

Equation:
CH3CH2COOH + CH3CH2OH —conc. H2SO4, heat→ CH3CH2COOC2H5 + H2O
Propanoic acid + Ethanol → Ethyl propanoate + Water

Mechanism:
1. Carboxylic acid provides acyl part CH3CH2CO- 
2. Alcohol provides alkoxy part -OC2H5
3. -OH from acid and -H from alcohol combine to form H2O
4. Conc. H2SO4 acts as catalyst and absorbs water to shift equilibrium towards ester formation.

Ethyl propanoate has fruity smell and is used as flavouring agent. This reaction is reversible.`,marks:"4 marks"},{q:"24.2 How does acetic acid react with Mg and MgCO3? (Constructed Response)",a:`Acetic acid is weak acid but shows typical acid reactions with metals and carbonates.

1) Reaction with Magnesium Metal:
2CH3COOH + Mg → (CH3COO)2Mg + H2↑
Ethanoic acid + Magnesium → Magnesium ethanoate + Hydrogen gas

- Salt formed: Magnesium ethanoate
- Formula: (CH3COO)2Mg
- Hydrogen gas evolves, test with pop sound.
- Reaction is rather slow compared to mineral acids because acetic acid is weak acid.

2) Reaction with Magnesium Carbonate (or Sodium / Calcium Carbonate):
General: 2CH3COOH + MCO3 → (CH3COO)2M + CO2↑ + H2O

With Sodium Carbonate:
2CH3COOH + Na2CO3 → 2CH3COONa + CO2↑ + H2O
Sodium ethanoate formed, Formula CH3COONa, effervescence due to CO2.

With Calcium Carbonate (marble chips):
2CH3COOH + CaCO3 → (CH3COO)2Ca + CO2↑ + H2O
Calcium ethanoate, Formula (CH3COO)2Ca, reaction proceeds slowly.

With Magnesium Carbonate:
2CH3COOH + MgCO3 → (CH3COO)2Mg + CO2 + H2O

All these reactions produce salt, carbon dioxide and water.`,marks:"5 marks"},{q:"24.3 How are carboxylic acids used as solvents? (Constructed Response)",a:`Carboxylic acids and esters are widely used as solvents in industry.

Acetic Acid as Solvent:
1. Acetic acid dissolves many compounds like oils, sulphur, iodine and is completely miscible with water.
2. In industry acetic acid is used as solvent for resins, paints and lacquers.
3. Pure acetic acid is called glacial acetic acid. It is corrosive colourless liquid completely miscible with water.
4. It is good solvent because it is polar and can dissolve both polar and some non-polar compounds.

Esters as Solvents:
1. Esters are commonly used as solvents because they are volatile and have pleasant smell.
2. Ethyl acetate is very important solvent: used to extract caffeine from coffee, used as nail polish remover and paint remover.
3. Some volatile esters are used as solvents for coatings, paints, varnishes, plastics, resins and lacquers.
4. Esters evaporate quickly, leaving no residue, so ideal for paints and coatings.

Overall both acids and esters are important industrial solvents.`,marks:"4 marks"},{q:"24.4 How is carboxylic acid used in daily life? (Constructed Response)",a:`Carboxylic acids are very common in daily life:

1) Food Preservation:
- Food preservatives are compounds added to food to prevent/retard growth of microorganisms, maintain quality and extend shelf-life.
- Benzoic acid, acetic acid, propionic acid and esters of 4-hydroxy benzoic acid are used as preservatives.
- Foods preserved: jams, juices, fruit juices, milk, drinks, pickles.
- Acetic acid widely used in pickles.

2) Household Items (Table 24.1):
- Vitamin C → Ascorbic acid
- Lemons → Citric acid
- Vinegar → Acetic acid
- Apples, grapes, carrots → Malic acid

3) Flavouring Agents:
- Tartaric, citric, malic acids give sour taste and enhance flavour of soft drinks.
- Esters give pleasant odours: Methyl butyrate Apple, Ethyl butyrate Pineapple etc.

4) Medicines:
- Aspirin and ibuprofen are carboxylic acid derivatives used as painkillers.
- Addition of carboxylic acids during medicine preparation helps improve drug delivery, absorption and overall performance.

5) Soaps, Cosmetics, Plastics:
- Palmitic, stearic acids used in soaps, cosmetics, candles, protective coatings.
- Oleic acid in soaps, detergents.
- Acetic acid used to make cellulose acetate plastic.
- Polymethyl methacrylate (Plexiglass) used as glass substitute.`,marks:"6 marks"},{q:"24.1 Explain fermentation reaction used to prepare acetic acid on commercial scale. (Descriptive)",a:`Commercial Preparation of Acetic Acid by Oxidative Fermentation:

Principle:
Alcoholic foodstuffs like grain, malt, rice, potato mesh contain ethanol. When they undergo fermentation in presence of acetic acid bacteria and sufficient oxygen, ethanol is oxidized to ethanoic acid (vinegar).

Chemical Reaction:
CH3CH2OH + O2 —Acetic acid bacteria→ CH3COOH + H2O
Ethanol + Oxygen → Ethanoic acid + Water

Process Details (Vinegar Production):
1. Alcoholic foodstuffs are taken in large vinegar tank / fermenter.
2. Acetic acid bacteria are added.
3. Continuous supply of oxygen is provided by bubbling oxygen through liquid.
4. Liquid present in tank is stirred continuously to ensure uniform oxygen supply.
5. Bacteria oxidize ethanol to acetic acid using enzymes.
6. In this method vinegar containing 15% ethanoic acid can be prepared in only 24 hours. This is much faster than traditional methods.

Why Sufficient Oxygen is Needed?
- Oxygen is the oxidizing agent that oxidizes ethanol to acetic acid.
- Bacteria need oxygen for respiration and for oxidation process.
- Without oxygen, ethanol will not be converted to acetic acid.

Difference between Chemical and Fermentation Methods:
- Chemical method: Uses hot acidified KMnO4, inorganic reagent, purple to colourless.
- Fermentation: Uses living organisms (bacteria), enzymes, needs oxygen, occurs at moderate temperature.

This method is used to produce vinegar on commercial scale for food industry.`,marks:"7 marks"},{q:"24.2 Describe industrial applications of carboxylic acids and esters. (Descriptive)",a:`Industrial Applications of Carboxylic Acids and Esters:

1) As Flavouring Agents:
- Flavouring agents are substances added to give additional taste and flavour to a substance and help mask unpleasant tastes of drugs especially for children.
- Organic acids like tartaric acid, citric acid, malic acid are very commonly used as flavour enhancers in food industry. Sour taste of foods is largely due to these acids. They improve taste of food and beverage products especially soft drinks.
- Esters have pleasant odours and flavours and are added to food products to improve smell and taste. Table 24.2: Methyl butyrate Apple, Ethyl butyrate Pineapple, n-Amyl acetate Pears/Bananas, n-Octyl acetate Orange, Methyl salicylate Apricot.

2) As Solvents:
- Acetic acid dissolves many compounds like oils, sulphur, iodine and water. Industry uses acetic acid as solvent for resins, paints, lacquers.
- Pure acetic acid is called glacial acetic acid, corrosive colourless liquid completely miscible with water.
- Esters also commonly used as solvents. Ethyl acetate used to extract caffeine from coffee and also used as nail polish and paint remover. Some volatile esters used as solvents for coatings, paints, varnishes, plastics, resins, lacquers.

3) As Synthetic Fibres and Plastics:
- Esters play important role in production of synthetic polymers. Very important polymer polyester is made by reacting diols and dicarboxylic acids.
- Esters are also important in manufacture of soaps and detergents.
- Carboxylic acids and derivatives very commonly used to give different types of plastics e.g. acetic acid used in production of cellulose acetate plastic.
- Palmitic and stearic acids extensively used in production of soaps, cosmetics, pharmaceuticals, candles, protective coatings.
- Oleic acid used in manufacture of soaps and detergents.
- Acrylic acid is starting reagent to prepare many long-chain polymers called acrylates.
- Citric acid esters primarily plasticizers used in many industries. Polymethyl methacrylate used as substitute for glass named Plexiglass.

4) In Daily Life: Food preservation, medicines, cosmetics etc as explained in next question.`,marks:"8 marks"},{q:"24.3 What are flavouring agents? Which carboxylic acids are used as flavouring agents? (Descriptive)",a:`Flavouring Agents:
Definition: Flavouring agents are substances added to give additional taste and flavour to a substance. They help in masking unpleasant tastes of drugs especially for children.

Carboxylic Acids as Flavour Enhancers:
Organic acids like tartaric acid, citric acid, malic acid are very commonly used as flavour enhancers in food industry. Sour taste of foods is largely due to these acids. They are responsible to improve taste of some food and beverage products especially soft drinks.

Details:
1. Tartaric Acid: Found in grapes, used in soft drinks, jams, gives sour taste.
2. Citric Acid: Found in lemons and citrus fruits, widely used in soft drinks, candies, food products. Gives sharp sour taste.
3. Malic Acid: Found in apples, grapes, carrots, used as flavour enhancer.
4. Acetic Acid: Found in vinegar, used in pickles, gives sour taste.
5. Ascorbic Acid (Vitamin C): Used as preservative and flavouring.

Esters as Flavouring Agents:
Esters have pleasant odours and flavours. They are added to food products to improve smell and taste.
- Methyl butyrate → Apple flavour
- Ethyl butyrate → Pineapple flavour
- n-Amyl acetate → Pears and Bananas flavour
- n-Octyl acetate → Orange flavour
- Methyl salicylate → Apricot flavour (also used in medicines)

These esters are artificially added to foods, drinks, ice creams, sweets to give natural fruit flavours.

Role in Drugs:
Flavouring agents mask bitter taste of medicines, making them palatable for children. Citric acid, malic acid and esters are used for this purpose.`,marks:"6 marks"},{q:"24.4 Explain reactions of carboxylic acids with metals and carbonates. (Descriptive)",a:`Carboxylic acids are much weaker acids than mineral acids but they show all typical acid reactions.

1) Reaction with Metals:
Carboxylic acids react with more reactive metals rather slowly to give salt and hydrogen gas.
General: 2RCOOH + M → (RCOO)2M + H2
Example with Magnesium:
2CH3COOH + Mg → (CH3COO)2Mg + H2↑
Ethanoic acid + Magnesium → Magnesium ethanoate + Hydrogen
Salt: Magnesium ethanoate
Formula: (CH3COO)2Mg
Observation: Slow effervescence of H2 gas, which burns with pop sound.
Why slow? Because ethanoic acid is weak acid, gives H+ slowly.
Other metals: Zn, Fe also react similarly but slowly.

2) Reaction with Bases (Alkalis):
Simple neutralization reaction gives salt and water.
CH3COOH + NaOH → CH3COONa + H2O
Ethanoic acid + Sodium hydroxide → Sodium ethanoate + Water
Salt: Sodium ethanoate, Formula CH3COONa
CH3COOH + KOH → CH3COOK + H2O (Potassium ethanoate)

3) Reaction with Carbonates and Bicarbonates:
Carboxylic acids react with carbonates to give salt, carbon dioxide and water. Effervescence due to CO2 is observed.
General: 2RCOOH + Na2CO3 → 2RCOONa + CO2↑ + H2O

Examples:
(a) With Sodium Carbonate:
2CH3COOH + Na2CO3 → 2CH3COONa + CO2↑ + H2O
Ethanoic acid + Sodium carbonate → Sodium ethanoate + Carbon dioxide + Water
Salt: Sodium ethanoate, CH3COONa
Observation: Brisk effervescence, CO2 turns lime water milky.

(b) With Calcium Carbonate (Marble chips):
2CH3COOH + CaCO3 → (CH3COO)2Ca + CO2↑ + H2O
Ethanoic acid + Calcium carbonate → Calcium ethanoate + CO2 + Water
Salt: Calcium ethanoate, Formula (CH3COO)2Ca
Observation: Reaction proceeds slowly.

(c) With Sodium Bicarbonate:
CH3COOH + NaHCO3 → CH3COONa + CO2 + H2O

These reactions prove acidic nature of carboxylic acids. Names and formulae of salts must be remembered: Sodium ethanoate CH3COONa, Magnesium ethanoate (CH3COO)2Mg, Calcium ethanoate (CH3COO)2Ca.`,marks:"8 marks"},{q:"24.5 Describe applications of esters in daily life. (Descriptive)",a:`Applications of Esters in Daily Life:

Esters are very important compounds with pleasant fruity smells. They have many daily life applications:

1) Food Flavours and Fragrances:
Esters are important component of many fruits and are responsible for their flavours. They have generally pleasant smell and are commonly used as fragrances in many food products in daily life.
Table 24.2:
- Methyl butyrate → Apple flavour
- Ethyl butyrate → Pineapple flavour
- n-Amyl acetate → Pears / Bananas flavour
- n-Octyl acetate → Orange flavour
- Methyl salicylate → Apricot flavour
They are added to ice creams, sweets, soft drinks, perfumes, cosmetics to give fruity smells.

2) As Solvents:
- Esters are commonly used as solvents.
- Ethyl acetate is used to extract caffeine from coffee.
- Also used as nail polish remover and paint remover.
- Some volatile esters used as solvents for coatings, paints, varnishes, plastics, resins, lacquers because they evaporate quickly.

3) Synthetic Fibres and Plastics:
- Esters play important role in production of synthetic polymers.
- Polyester is very important polymer made by reacting diols and dicarboxylic acids. Used as synthetic fibre for clothes, bottles, films.
- Esters also important in manufacture of soaps and detergents.
- Polymethyl methacrylate is used as substitute for glass named Plexiglass.
- Cellulose acetate plastic is made from acetic acid.
- Citric acid esters are primarily plasticizers used in many industries to make plastics flexible.

4) Food Preservation (Indirect):
- While carboxylic acids themselves (benzoic acid, acetic acid) are preservatives, their esters (methyl and ethyl esters of 4-hydroxy benzoic acid) are also used as preservatives to prevent growth of microorganisms in jams, juices, pickles.

5) Medicines and Cosmetics:
- Methyl salicylate is used in pain relief balms (wintergreen oil).
- Esters used in cosmetics and perfumes due to pleasant smell.
- Carboxylic acid esters used as plasticizers in pharmaceutical coatings.

6) Soaps and Detergents:
- Esters are important in manufacture of soaps and detergents. Oils and fats are esters of fatty acids and glycerol, which on hydrolysis give soaps.

Thus esters are part of food we eat, clothes we wear, perfumes we use and plastics around us.`,marks:"8 marks"}];function ma(){let[e,t]=Rt.useState("light"),[n,r]=Rt.useState("syllabus"),[i,l]=Rt.useState({}),[o,a]=Rt.useState(!1),[u,d]=Rt.useState(0),[m,y]=Rt.useState(0),f=e==="dark",x=Qi.reduce((h,E,c)=>h+(i[c]===E.ans?1:0),0),w=Object.keys(i).length;return H("div",{className:`min-h-screen font-sans antialiased transition-colors duration-300 ${f?"bg-[#0f1115] text-zinc-100":"bg-[#fafaf7] text-zinc-900"}`,children:[C("style",{children:`
