:"M7 18h1",key:"1neino"}]]);var wn=I("FlaskConical",[["path",{d:"M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2",key:"18mbvz"}],["path",{d:"M6.453 15h11.094",key:"3shlmq"}],["path",{d:"M8.5 2h7",key:"csnxdl"}]]);var Xe=I("Layers",[["path",{d:"M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z",key:"zw3jo"}],["path",{d:"M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12",key:"1wduqc"}],["path",{d:"M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17",key:"kqbvx6"}]]);var wr=I("Moon",[["path",{d:"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z",key:"a7tn18"}]]);var Sr=I("Sun",[["circle",{cx:"12",cy:"12",r:"4",key:"4exip2"}],["path",{d:"M12 2v2",key:"tus03m"}],["path",{d:"M12 20v2",key:"1lh1kg"}],["path",{d:"m4.93 4.93 1.41 1.41",key:"149t6j"}],["path",{d:"m17.66 17.66 1.41 1.41",key:"ptbguv"}],["path",{d:"M2 12h2",key:"1t8f8n"}],["path",{d:"M20 12h2",key:"1q8mjw"}],["path",{d:"m6.34 17.66-1.41 1.41",key:"1m8zz5"}],["path",{d:"m19.07 4.93-1.41 1.41",key:"1shlcs"}]]);var nd=Ie(St(),1),Fm=Symbol.for("react.element");var Lm=Object.prototype.hasOwnProperty,Dm=nd.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Im={key:!0,ref:!0,__self:!0,__source:!0};function rd(e,t,n){var r,l={},i=null,o=null;n!==void 0&&(i=""+n),t.key!==void 0&&(i=""+t.key),t.ref!==void 0&&(o=t.ref);for(r in t)Lm.call(t,r)&&!Im.hasOwnProperty(r)&&(l[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)l[r]===void 0&&(l[r]=t[r]);return{$$typeof:Fm,type:e,key:i,ref:o,props:l,_owner:Dm.current}}var E=rd,P=rd;var Am=["Recognize that atmospheric oxides of nitrogen NO and NO₂ can react with unburned hydrocarbons to form peroxyacetyl nitrate (PAN) – a component of photochemical smog.","Describe the role of NO and NO₂ in formation of acid rain – directly and catalytic role in oxidation of atmospheric SO₂.","Symbol equation for production of ammonia by Haber process: N₂ + 3H₂ → 2NH₃.","Sources of hydrogen (methane/natural gas) and nitrogen (air) in Haber process.","Typical conditions for Haber process: 400–500 °C, 200 atm (20000 kPa), Fe / Fe-Al₂O₃ catalyst.","Symbol equation for conversion of SO₂ to SO₃ in Contact process: 2SO₂ + O₂ → 2SO₃.","Sources of SO₂ (burning sulphur or roasting sulphide ores) and oxygen (air).","Typical conditions for conversion of SO₂ to SO₃: 450 °C, 2–3 atm (200 kPa), Vanadium(V) oxide V₂O₅ catalyst.","Describe amphoteric oxides that react with both acids and bases to produce salt and water.","Classify oxides as acidic (including SO₂, CO₂) basic (including CuO, CaO) or amphoteric (limited to Al₂O₃, ZnO) related to metallic/non-metallic character.","Identify general chemical properties of metals: reactions with dilute acids, cold water, steam, oxygen.","Arrange metals in order of reactivity given information about reactions."],Um=[{id:1,title:"1. Ammonia – Haber Process",icon:gr,color:"bg-blue-500",content:[{h:"Importance",p:"Ammonia is a very important chemical. 80% is used to make fertilizers – urea, ammonium nitrate, ammonium sulphate etc. Also used for plastics, pharmaceuticals, explosives, and as refrigerant."},{h:"Principle & Discovery",p:"Discovered by Fritz Haber. It is a reversible reaction. A mixture of nitrogen and hydrogen in 1:3 by volume is heated at 400-500 °C under 200 atm pressure in presence of iron catalyst promoted with Al₂O₃ to give ammonia."},{h:"Equation",p:"N₂(g) + 3H₂(g) ⇌ 2NH₃(g)   ΔH = -92 kJ  [400-500 °C, 200 atm, Fe/Al₂O₃]",mono:!0},{h:"Industrial Plant Flow (Figure 19.1)",p:"The equilibrium mixture contains about 35% ammonia by volume. This mixture is cooled by refrigeration coils. Ammonia liquefies at -33.4 °C and is removed as liquid. Unreacted N₂ and H₂ are recycled."},{h:"Source of Nitrogen",p:"Nitrogen is obtained from air by fractional distillation of liquid air. Steps: (i) CO₂ is removed from air. (ii) Air is subjected to 200 atm pressure and cooled. It is passed through a spiral jet – sudden expansion lowers temperature. Compression-expansion is repeated till air liquefies. (iii) Liquid air is fractionally distilled. Nitrogen boils at -196 °C which is lower than oxygen (-183 °C). So nitrogen evaporates first, separated and re-liquefied in steel cylinders."},{h:"Source of Hydrogen",p:`Hydrogen is obtained from methane (natural gas). Methane is heated with limited oxygen (not enough to make CO₂) and steam:
CH₄ + H₂O → CO + 3H₂  (steam reforming)
CO + H₂O → CO₂ + H₂  (water-gas shift)
So CO reacts with more steam to give CO₂ and more H₂. Thus methane is the main source.`},{h:"Why High Pressure?",p:"According to Le Chatelier's Principle, high pressure favours the side with less gaseous moles. Reactants = 4 moles, product = 2 moles. So high pressure gives more ammonia."},{h:"Why Low Temperature Liquefaction?",p:"Ammonia has relatively high boiling point -33.4 °C, so on cooling it becomes liquid and can be easily separated. Unreacted N₂ (-196 °C) and H₂ (-253 °C) remain gases."}]},{id:2,title:"2. Sulphuric Acid – Contact Process (King of Chemicals)",icon:yn,color:"bg-amber-500",content:[{h:"Importance",p:"Called king of chemicals because used in almost every industry – fertilizers, paints, detergents, batteries."},{h:"Step 1: Preparation of SO₂",p:`By burning elemental sulphur: S + O₂ → SO₂
Or by roasting sulphide ores like iron pyrite:
4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂`,mono:!0},{h:"Step 2: Purification",p:"SO₂ is passed through purifying chambers sprayed with steam to remove dust and impurities especially arsenic compounds. Arsenic poisons the V₂O₅ catalyst. Then moist gases are dried by passing through drying tower where concentrated H₂SO₄ is sprayed. Oxygen is obtained from fractional distillation of air."},{h:"Step 3: Oxidation to SO₃ (Contact Chamber)",p:`Clean dry SO₂ and O₂ are passed over vanadium(V) oxide V₂O₅ catalyst at 450 °C and 2-3 atm pressure. Reversible reaction but 98% SO₂ is converted:
2SO₂ + O₂ ⇌ 2SO₃`,mono:!0},{h:"Step 4: Formation of Oleum",p:`SO₃ is NOT directly absorbed in water. It is absorbed in 98% sulphuric acid to give oleum (fuming sulphuric acid):
SO₃ + H₂SO₄ → H₂S₂O₇ (oleum)`},{h:"Step 5: Dilution to Acid",p:`Oleum is mixed with calculated amount of water to produce acid of desired concentration:
H₂S₂O₇ + H₂O → 2H₂SO₄`},{h:"Why H₂SO₄ not water for absorption?",p:"Reaction SO₃ + H₂O is highly exothermic. It produces mist of H₂SO₄ which is difficult to condense and causes loss. Absorption in 98% H₂SO₄ gives better yield and controls heat."}]},{id:3,title:"3. Oxides – Types and Properties",icon:It,color:"bg-emerald-500",content:[{h:"Definition",p:"Oxides are binary compounds of an element with oxygen where oxygen has -2 oxidation state. Metal oxides are usually ionic (electrons transferred). Non-metal oxides are covalent (shared)."},{h:"Basic Oxides",p:`Formed when oxygen reacts with metals. They dissolve in water to give hydroxides (alkalis) – turn red litmus blue. They react with acids to give salt + water.
Examples:
4Na + O₂ → 2Na₂O ; Na₂O + H₂O → 2NaOH
Ca + ½O₂ → CaO ; CaO + 2HCl → CaCl₂ + H₂O
2Cu + O₂ → 2CuO ; CuO + 2HCl → CuCl₂ + H₂O`,mono:!1},{h:"Acidic Oxides",p:`Formed when oxygen combines with non-metals S, C, N, P. They dissolve in water to give acids – turn blue litmus red. They react with bases to give salt + water.
Examples:
S + O₂ → SO₂ ; SO₂ + H₂O → H₂SO₃ (sulphurous acid)
C + O₂ → CO₂ ; CO₂ + H₂O → H₂CO₃ (carbonic acid)
SO₂ + 2NaOH → Na₂SO₃ + H₂O
CO₂ + Ca(OH)₂ → CaCO₃ + H₂O`},{h:"Neutral Oxides",p:`Oxides which on contact with water produce neither acid nor base – no effect on litmus.
Examples: Carbon monoxide CO, Nitric oxide NO, Nitrous oxide N₂O.`},{h:"Amphoteric Oxides",p:`Usually formed when oxygen reacts with less electropositive metals (Al, Zn, Pb, Be). They behave both as acid and base. Insoluble in water, no effect on litmus.
As base with acid:
ZnO + 2HCl → ZnCl₂ + H₂O
Al₂O₃ + 6HCl → 2AlCl₃ + 3H₂O
As acid with alkali:
ZnO + 2NaOH + H₂O → Na₂[Zn(OH)₄] sodium zincate
Al₂O₃ + 2NaOH + 3H₂O → 2Na[Al(OH)₄] sodium aluminate
Water itself is amphoteric – can act as acid and base.`},{h:"Summary Rule",p:"Metallic character increases basic nature. Non-metallic character increases acidic nature. Middle – amphoteric."}]},{id:4,title:"4. General Properties of Metals",icon:Xe,color:"bg-zinc-500",content:[{h:"Occurrence",p:"Nearly 3/4 elements are metals. Mostly found as oxides, hydroxides, carbonates, sulphides in earth's crust. Tendency to lose electrons to form cations (ionic bonds)."},{h:"Reaction with Cold Water",p:`Most reactive Group 1 and Group 2 (K, Na, Ca) react vigorously with cold water to give hydroxides + H₂:
2Na + 2H₂O → 2NaOH + H₂
2K + 2H₂O → 2KOH + H₂
Mg reacts very slowly with cold water: Mg + 2H₂O → Mg(OH)₂ + H₂. Others below Mg do not react with cold water.`},{h:"Reaction with Steam",p:`More reactive metal reacts more readily with steam.
K, Na, Ca react violently with steam – dangerous.
Be and Al react with steam at high temp ~700 °C: Be + H₂O → BeO + H₂
Mg, Zn, Fe react moderately with steam to give oxides + H₂: Mg + H₂O (steam) → MgO + H₂, Zn + H₂O → ZnO + H₂, 3Fe + 4H₂O → Fe₃O₄ + 4H₂`},{h:"Reaction with Oxygen",p:`Metals burn in oxygen to give oxides. Reactivity depends on metal.
4Na + O₂ → 2Na₂O and 2Na + O₂ → Na₂O₂ (sodium burns yellow flame)
Mg burns with intense white flame: 2Mg + O₂ → 2MgO
Ca – white tinged red, Sr – crimson, Ba – pale green: 2Ca + O₂ → 2CaO`},{h:"Reaction with Dilute Acids",p:`Metals above hydrogen in reactivity series give salt + H₂. More reactive = more vigorous.
2Na + 2HCl → 2NaCl + H₂ (very dangerous)
Mg + 2HCl → MgCl₂ + H₂
Zn + 2HCl → ZnCl₂ + H₂
Reactivity increases down Group 2.`}]},{id:5,title:"5. Reactivity Series & Displacement",icon:wn,color:"bg-red-500",content:[{h:"Table 19.1 Reactivity Series (Most to Least)",p:`K > Na > Li > Ba > Sr > Ca > Mg > Al > C > Mn > Zn > Fe > H > Cu > Ag > Au
(Hydrogen included for reference, Carbon included)`},{h:"Rules",p:`1. Ca and above – react with cold water to give hydroxides + H₂.
2. Below Ca to H – do not react with cold water, but react with steam to give oxides + H₂.
3. Only metals above H liberate H₂ from dilute acids.
4. Metals below H (Cu, Ag, Au) do NOT react with dilute HCl or H₂SO₄.
5. More reactive metals react more easily with oxygen; less reactive like Ag, Cu, Fe react slowly.`},{h:"Reducing Power",p:"Metals at top of series are powerful reducing agents – easily oxidized (lose electrons). Reducing power decreases down the series."},{h:"Displacement Example",p:`More reactive metal displaces less reactive from its salt solution:
Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s)
Zinc is above copper, so zinc displaces copper.`}]},{id:6,title:"6. Role of Nitrogen Oxides in Air Pollution",icon:yr,color:"bg-sky-500",content:[{h:"Primary Pollutants",p:"Include oxides of nitrogen (NO, NO₂ collectively NOx), SO₂, CO, unburned hydrocarbons etc. They convert into secondary pollutants in atmosphere."},{h:"Sources of NOx",p:`Natural: Lightning – high temp electric arc makes N₂ + O₂ → 2NO, then 2NO + O₂ → 2NO₂.
Man-made: Combustion of fossil fuels in vehicles, power plants, industries. High temp in car engines causes N₂ + O₂ to combine. Agricultural fertilizers also contribute. Heavy traffic emits huge NOx and VOCs (volatile organic compounds).`},{h:"Formation of PAN & Photochemical Smog",p:"UV from sunlight interacts with NOx and VOCs (unburned hydrocarbons) in complex reactions to produce secondary pollutants: ozone (O₃), aldehydes, and peroxyacetyl nitrate PAN (CH₃COOONO₂). PAN is a component of photochemical smog, very harmful to eyes and plants."},{h:"Acid Rain – Direct Formation",p:`NO₂ reacts with water and other chemicals to produce nitric acid and nitrous acid vapours:
2NO₂ + H₂O → HNO₃ + HNO₂
These acidic vapours mix with rain water – fall as acid rain (pH < 5.6). Damages ecosystem, corrodes buildings, causes respiratory problems.`},{h:"Acid Rain – Catalytic Role in SO₂ Oxidation",p:`NOx acts as catalyst to convert SO₂ (primary pollutant) to SO₃, which forms sulphuric acid:
2SO₂ + O₂ → 2SO₃ [catalyst NOx]
SO₃ + H₂O → H₂SO₄
Thus major components of acid rain are H₂SO₄ and HNO₃.`},{h:"Secondary Pollutants Summary",p:"Main secondary pollutants formed due to NOx: Ozone, PAN, HNO₃, H₂SO₄. Must be controlled."}]}],mu=[{q:"Reason for maintaining higher temperature in ammonia production (Haber) is:",opts:["Activation energy is very high (needs high temp to overcome)","To increase yield","To liquefy ammonia","To decompose ammonia"],ans:0,exp:"Reaction rate is very slow at low temp because activation energy is high. High temp increases rate though it decreases yield. Optimum 400-500 °C chosen."},{q:"Contact process is sensitive to impurities in SO₂ and O₂ because impurities:",opts:["Affect capability of catalyst / poison catalyst","Increase pressure","React with SO₃","Produce oleum directly"],ans:0,exp:"Arsenic compounds etc poison V₂O₅ catalyst, reducing its efficiency. Hence purification is essential."},{q:"Which of the following oxide is neutral?",opts:["Al₂O₃","SO₂","CO","NO"],ans:3,exp:"Neutral oxides: CO, NO, N₂O. They show no acidic or basic behavior. Al₂O₃ is amphoteric, SO₂ acidic. Both CO and NO are neutral – in book option is NO (also CO). Answer: NO (and CO)."},{q:"Sodium is more reactive than magnesium because:",opts:["More electropositive than magnesium","More electronegative","Has smaller size","Has higher ionization energy"],ans:0,exp:"Sodium is more electropositive, easily loses electron, more reactive than Mg. Reactivity decreases across period and increases down group."},{q:"Secondary pollutants present in atmosphere are:",opts:["SO₂ and NO₂","CO and CO₂","Ozone and PAN","H₂S and CH₄"],ans:2,exp:"Secondary pollutants are formed from primary pollutants in air – Ozone (O₃) and peroxyacetyl nitrate (PAN) are main secondary pollutants of photochemical smog."},{q:"SO₃ is absorbed in H₂SO₄ rather than H₂O because:",opts:["Water is expensive","Reaction of SO₃ with H₂O is highly exothermic producing mist of H₂SO₄ difficult to condense","SO₃ does not react with water","H₂SO₄ is catalyst"],ans:1,exp:"Direct absorption in water gives acid mist, difficult to handle, yield loss. In 98% H₂SO₄ it gives oleum efficiently."},{q:"Oxides formed when oxygen reacts with metals are:",opts:["Only acidic","Only basic","Both basic and amphoteric","Only neutral"],ans:2,exp:"Metals give basic oxides (Na₂O, CaO, CuO) and less electropositive metals give amphoteric (Al₂O₃, ZnO). Non-metals give acidic."},{q:"Major components of acid rain are:",opts:["H₂SO₄ and HNO₃","HCl and HF","CO₂ and SO₂","NaOH and KOH"],ans:0,exp:"Acid rain contains mainly sulphuric acid H₂SO₄ from SO₂ oxidation and nitric acid HNO₃ from NO₂ reaction. pH <5.6."}],Vm=[{q:"19.1 How is nitrogen obtained from air?",a:`Nitrogen is obtained by fractional distillation of liquid air.
Steps:
1. CO₂ is removed from air.
2. Air is compressed to 200 atm and cooled by repeated compression-expansion through spiral jet until it liquefies.
3. Liquid air is fractionally distilled. Boiling point of nitrogen (-196 °C) is less than oxygen (-183 °C), so nitrogen evaporates first, separated and stored in cylinders as liquid.`},{q:"19.2 How is hydrogen produced from methane?",a:`Hydrogen is produced by heating methane with limited oxygen/steam:
CH₄ + H₂O → CO + 3H₂ (steam reforming)
Then water-gas shift:
CO + H₂O → CO₂ + H₂
Thus CO reacts with water to give more H₂. Methane (natural gas) is main source. Limited oxygen prevents full oxidation to CO₂ directly.`},{q:"19.3 What are conditions to oxidize SO₂ to SO₃?",a:`In Contact Process, SO₂ is oxidized in contact chamber:
2SO₂ + O₂ ⇌ 2SO₃
Conditions:
Temperature = 450 °C
Pressure = 2-3 atm (200 kPa)
Catalyst = Vanadium(V) oxide V₂O₅
Yield = 98% SO₃. Gases must be pure and dry because arsenic poisons catalyst.`},{q:"19.4 Why CO₂ is acidic oxide while CO is neutral oxide?",a:`CO₂ is acidic because:
- Reacts with water: CO₂ + H₂O → H₂CO₃ (carbonic acid) – turns blue litmus red.
- Reacts with bases: CO₂ + Ca(OH)₂ → CaCO₃ + H₂O (salt formation).
CO is neutral because:
- Does not react with water, does not form acid or base.
- No effect on litmus.
- Does not react with acids or bases to give salt. Hence neutral.`},{q:"19.5 How Mg and Ca differ in reactions with water?",a:`Mg reacts very slowly with cold water: Mg + 2H₂O(cold) → Mg(OH)₂ + H₂ (slow).
Ca reacts vigorously with cold water: Ca + 2H₂O(cold) → Ca(OH)₂ + H₂ (fast).
Reason: Reactivity increases down Group 2, Ca is below Mg, more electropositive, more reactive. Mg reacts moderately with steam: Mg + H₂O(steam) → MgO + H₂.`}],Bm=[{q:"19.1 Why is ammonia important chemical? (Constructed Response)",a:`Ammonia is very important:
1. 80% used for fertilizers – urea NH₂CONH₂, ammonium nitrate NH₄NO₃, ammonium sulphate (NH₄)₂SO₄, diammonium phosphate.
2. Used to make plastics, synthetic fibres (nylon), dyes.
3. Used in pharmaceuticals and cleaning agents.
4. Used as refrigerant because easy to liquefy at -33.4 °C.
5. Used to make nitric acid (Ostwald process) and explosives.
Hence it is backbone of fertilizer industry and feeds world.`},{q:"19.2 How is SO₂ converted to SO₃ in atmosphere? (Catalytic role of NOx)",a:`In atmosphere, NOx acts as catalyst for oxidation of SO₂:
2SO₂ + O₂ → 2SO₃ [catalyst NO, NO₂]
Then SO₃ reacts with water vapours:
SO₃ + H₂O → H₂SO₄
This H₂SO₄ is major component of acid rain. Reaction is similar to Contact Process but in air NOx catalyzes it. NOx comes from vehicles and power plants.`},{q:"19.3 How burning fossil fuels in car engine produces oxides of nitrogen?",a:`Car engine temperature is very high (~2000 °C). At this high temp, nitrogen and oxygen of air (which normally don't react) combine:
N₂ + O₂ → 2NO (inside engine – electric arc like lightning)
2NO + O₂ → 2NO₂ (in air after exhaust)
Heavy traffic emits huge NOx. In presence of sunlight and VOCs (unburned hydrocarbons), NOx forms PAN and ozone – photochemical smog. Also NO₂ forms acid rain.`},{q:"19.4 Metals at top of reactivity series are more reactive than bottom – comment.",a:`Top metals (K, Na, Ca) are more electropositive, have low ionization energy, easily lose electrons – powerful reducing agents, easily oxidized.
They react vigorously with cold water, steam, dilute acids, oxygen.
Reactivity decreases down series.
Bottom metals (Cu, Ag, Au) have high ionization energy, less tendency to lose electrons, less reducing power.
They do not react with cold water or dilute acids, react slowly with oxygen.
Example: Na reacts explosively with water, Cu does not. Zn + CuSO₄ → ZnSO₄ + Cu shows Zn more reactive than Cu.`},{q:"19.5 How do fossil fuels produce SO₂?",a:`Fossil fuels (coal, oil) contain sulphur compounds as impurity. On burning, sulphur oxidizes:
S + O₂ → SO₂
Also sulphide ores on roasting:
4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂
Power plants burning coal emit large SO₂. SO₂ is primary pollutant, leads to acid rain after conversion to SO₃ and H₂SO₄.`},{q:"19.6 How reactivities of metals are determined?",a:`Reactivities determined by observing reactions with:
1. Cold water: Most reactive give hydroxide + H₂.
2. Steam: Less reactive give oxide + H₂.
3. Dilute HCl/H₂SO₄: Metals above H give salt + H₂.
4. Oxygen: Speed of oxide formation.
Based on these observations, metals are arranged in decreasing order – reactivity series. Example: K reacts violently with cold water, Mg slowly, Zn only with steam, Fe slowly with steam, Cu no reaction with water or dilute acid. So order: K > Na > Ca > Mg > Zn > Fe > Cu.`},{q:"19.7 Which secondary pollutants are produced by oxides of nitrogen?",a:`Secondary pollutants produced:
1. Ozone O₃ – from photochemical reactions of NOx + VOCs + UV.
2. Peroxyacetyl nitrate PAN (CH₃COOONO₂) – component of photochemical smog, irritant.
3. Aldehydes.
4. Nitric acid HNO₃ and nitrous acid HNO₂ – from 2NO₂ + H₂O → HNO₃ + HNO₂ – cause acid rain.
5. Sulphuric acid H₂SO₄ – because NOx catalyzes 2SO₂ + O₂ → 2SO₃ → H₂SO₄.
These are more toxic than primary pollutants.`},{q:"19.1 Explain production of ammonia on industrial scale – Haber Process (Descriptive)",a:`HABER PROCESS – Detailed:
Aim: Produce ammonia for fertilizers.
Raw materials: N₂ from fractional distillation of air, H₂ from methane + steam.
Reaction: N₂(g) + 3H₂(g) ⇌ 2NH₃(g) ΔH = -92 kJ (exothermic, reversible).
Conditions:
- Temp: 400-500 °C (optimum – high rate but moderate yield, too low temp rate slow).
- Pressure: 200 atm (20000 kPa) – high pressure favours product (Le Chatelier, 4 moles → 2 moles).
- Catalyst: Iron (Fe) promoted with Al₂O₃ to increase surface area.
Process Steps:
1. Purified N₂ and H₂ in 1:3 ratio compressed.
2. Passed through catalyst bed at 400-500 °C.
3. Equilibrium mixture contains 35% NH₃.
4. Cooled in refrigeration coils – ammonia liquefies at -33.4 °C, collected as liquid.
5. Unreacted N₂ + H₂ recycled.
Sources detailed as in notes.
Why high pressure? Le Chatelier – less gas moles on product side.`},{q:"19.2 Describe Contact Process for production of sulphuric acid (Descriptive)",a:`CONTACT PROCESS – 5 Steps:
1. Preparation of SO₂:
S + O₂ → SO₂ (burning sulphur)
or 4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂ (roasting pyrite).
2. Purification:
SO₂ + O₂ gases washed with steam to remove dust, arsenic (catalyst poison). Then dried in drying tower with conc. H₂SO₄ spray.
3. Oxidation to SO₃ (Contact chamber):
2SO₂ + O₂ ⇌ 2SO₃
Conditions: 450 °C, 2-3 atm, V₂O₅ catalyst – 98% conversion.
4. Oleum formation:
SO₃ absorbed in 98% H₂SO₄ (not water): SO₃ + H₂SO₄ → H₂S₂O₇ (oleum)
Reason: SO₃ + H₂O is too exothermic, gives mist, hard to condense.
5. Dilution:
H₂S₂O₇ + H₂O → 2H₂SO₄ of required concentration.
Product called king of chemicals.`},{q:"19.3 Explain formation and properties of acidic and basic oxides with examples.",a:`BASIC OXIDES:
Formation: Metal + O₂ → metal oxide. Example 4Na + O₂ → 2Na₂O, 2Ca + O₂ → 2CaO.
Properties:
- Ionic in nature.
- React with water to give hydroxides (alkalis): Na₂O + H₂O → 2NaOH – turns red litmus blue.
- React with acids to give salt + water: CaO + 2HCl → CaCl₂ + H₂O, CuO + 2HCl → CuCl₂ + H₂O.

ACIDIC OXIDES:
Formation: Non-metal + O₂ → oxide. S + O₂ → SO₂, C + O₂ → CO₂.
Properties:
- Covalent.
- React with water to give acids: SO₂ + H₂O → H₂SO₃, CO₂ + H₂O → H₂CO₃ – turns blue litmus red.
- React with bases to give salt + water: SO₂ + 2NaOH → Na₂SO₃ + H₂O, CO₂ + Ca(OH)₂ → CaCO₃ + H₂O.

Difference due to electronegativity and bonding.`},{q:"19.4 Differentiate first and second group metals based on reactivities with oxygen and water.",a:`Group 1 (Li, Na, K):
- Water: React vigorously with cold water: 2Na + 2H₂O → 2NaOH + H₂. K more vigorous, may catch fire. Li less vigorous than Na/K.
- Oxygen: Easily tarnish, burn with characteristic flames: 4Na + O₂ → 2Na₂O (yellow flame). Form oxides and peroxides.

Group 2 (Be, Mg, Ca, Sr, Ba):
- Water: Be does not react cold water, Mg very slow, Ca vigorous but less than Na: Ca + 2H₂O → Ca(OH)₂ + H₂. Reactivity increases down group.
- Steam: Be + H₂O → BeO + H₂ at 700 °C, Mg + H₂O(steam) → MgO + H₂ moderately.
- Oxygen: Mg burns intense white: 2Mg + O₂ → 2MgO, Ca white tinged red, Sr crimson, Ba pale green. Oxides are basic.
Overall Group 1 more reactive than Group 2 in same period due to lower ionization energy.`},{q:"19.5 Describe role of oxides of nitrogen in formation of PAN and acid rain (Descriptive)",a:`Role of NOx (NO + NO₂):
1. Formation of PAN & Photochemical Smog:
Sources: Lightning (N₂+O₂→2NO), car engines, power plants, fertilizers – emit NOx + VOCs (unburned hydrocarbons).
In sunlight, UV causes: NO₂ → NO + O, O + O₂ → O₃. O₃ + hydrocarbons + NOx → complex reactions produce secondary pollutants: ozone, aldehydes, peroxyacetyl nitrate PAN (CH₃COOONO₂). PAN is eye irritant, component of smog.

2. Formation of Acid Rain – Direct:
2NO₂ + H₂O → HNO₃ + HNO₂. These acids fall as rain pH<5.6.

3. Catalytic role for SO₂:
NOx catalyzes: 2SO₂ + O₂ → 2SO₃, then SO₃ + H₂O → H₂SO₄ – major acid rain component.

Thus NOx responsible for both photochemical smog (PAN, O₃) and acid rain (HNO₃, H₂SO₄). Control by reducing vehicle emissions.`}];function hu(){let[e,t]=wt.useState(!1),[n,r]=wt.useState("syllabus"),[l,i]=wt.useState({}),[o,u]=wt.useState(!1),[a,f]=wt.useState({}),[p,h]=wt.useState({}),[m,g]=wt.useState({1:!0}),w=(C)=>g((c)=>({...c,[C]:!c[C]})),O=Object.entries(l).filter(([C,c])=>mu[Number(C)].ans===c).length;return E("div",{className:e?"dark":"",children:P("div",{className:`min-h-screen font-[Inter,sans-serif] transition-colors ${e?"bg-[#0a0a0f] text-zinc-100":"bg-[#fcfcf9] text-zinc-900"}`,children:[P("header",{className:`sticky top-0 z-50 border-b backdrop-blur-xl ${e?"bg-zinc-900/80 border-zinc-800":"bg-white/80 border-zinc-200"}`,children:[P("div",{className:"mx-auto max-w-6xl px-4 md:px-6 py-3 flex items-center justify-between",children:[P("div",{className:"flex items-center gap-3",children:[E("div",{className:"h-9 w-9 rounded-xl bg-gradient-to-br from-blue-600 to-violet-600 flex items-center justify-center text-white shadow-lg",children:E(It,{size:18})}),P("div",{children:[E("h1",{className:"text-[13px] md:text-[15px] font-bold tracking-tight leading-none",children:"CHEMISTRY X • CHAPTER 19"}),E("p",{className:"text-[11px] md:text-xs font-semibold tracking-widest opacity-70",children:"NITROGEN AND SULPHUR • PECTAA 2026"})]})]}),E("button",{onClick:()=>t(!e),className:`h-9 w-9 rounded-full grid place-items-center border transition ${e?"bg-zinc-800 border-zinc-700":"bg-zinc-50 border-zinc-200"}`,children:e?E(Sr,{size:16}):E(wr,{size:16})})]}),E("div",{className:"mx-auto max-w-6xl px-2 md:px-6",children:E("div",{className:"flex gap-1 overflow-x-auto no-scrollbar py-2",children:[{id:"syllabus",label:"Syllabus",icon:gn},{id:"notes",label:"Notes & Examples",icon:It},{id:"mcqs",label:"MCQs Test",icon:Ze},{id:"short",label:"Short Q",icon:Xe},{id:"long",label:"Long Q",icon:wn}].map((C)=>{let c=C.icon,s=n===C.id;return P("button",{onClick:()=>r(C.id),className:`flex it
