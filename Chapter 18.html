STP salts are solids with high melting points due to very strong electrostatic forces in crystal lattice.","Describe that under normal conditions ionic compounds are usually solids with lattice structures — regular 3D repeating pattern.","Explain why molten and aqueous solutions of salts are good conductors of electricity — due to mobile free ions, serve as strong electrolytes.","Describe general solubility rules: (a) Sodium, potassium, ammonium salts are soluble (b) Chlorides soluble except lead and silver (c) Carbonates insoluble except sodium, potassium, ammonium (d) Hydroxides insoluble except sodium, potassium, ammonium and calcium partially soluble.","Describe preparation, separation and purification of soluble salts by reactions of acids with: alkali (titration), excess metal, excess insoluble base, excess insoluble carbonate."],ld=[{q:"1. Which base is NOT soluble in water?",options:["(a) KOH","(b) Mg(OH)2","(c) NaOH","(d) NH4OH"],correct:1,exp:"KOH, NaOH and NH4OH are soluble. Mg(OH)2 is insoluble. Most hydroxides are insoluble except Na, K, NH4 and Ca partially."},{q:"2. What is the shape of NaCl crystal?",options:["(a) Cubic","(b) Hexagonal","(c) Tetrahedral","(d) Octahedral"],correct:0,exp:"NaCl has face-centered cubic lattice. Each Na+ surrounded by 6 Cl- and each Cl- surrounded by 6 Na+. Bigger Cl- at corners and face centre, smaller Na+ at edges."},{q:"3. Which salts are always soluble in water?",options:["(a) Carbonates","(b) Hydroxides","(c) Nitrates","(d) Sulphates of barium"],correct:2,exp:"All metallic nitrates are soluble. Also all salts of Na, K, NH4 are soluble. This is the most important solubility rule."},{q:"4. Which salt is formed when marble pieces (CaCO3) react with dilute nitric acid?",options:["(a) Calcium chloride","(b) Calcium nitrate","(c) Calcium sulphate","(d) Calcium hydroxide"],correct:1,exp:"CaCO3 + 2HNO3 → Ca(NO3)2 + CO2 + H2O. Calcium nitrate is formed. General reaction: Carbonate + Acid → Salt + CO2 + Water."},{q:"5. Which is a water insoluble salt?",options:["(a) Calcium sulphate","(b) Sodium sulphate","(c) Potassium sulphate","(d) Magnesium sulphate"],correct:0,exp:"Most sulphates are soluble except barium, lead and calcium. Calcium sulphate is sparingly soluble / insoluble. Sodium, potassium, magnesium sulphates are soluble."}],Am=[{q:"18.1 What factors are responsible for strength of electrostatic forces between ions?",a:`Two factors are responsible:
1. Magnitude of charges: Higher charge on ions = stronger attraction. Mg2+ attracts more strongly than Na+.
2. Distance between ions (size of ions): Smaller ions = closer distance = stronger attraction. Smaller size = higher melting point.
Due to these factors, melting points depend on charges and sizes of ions.`},{q:"18.2 Is lead(II) chloride soluble in water? Give comments.",a:`Lead(II) chloride is sparingly soluble. It is insoluble in cold water but soluble in hot water.
General rule: Chlorides are soluble except silver chloride and lead(II) chloride. So PbCl2 is an exception — it dissolves in hot water, forms precipitate in cold water.`},{q:"18.3 Which lead salts are insoluble in water?",a:`Following lead salts are insoluble:
1. Lead(II) chloride PbCl2 - sparingly soluble in cold, soluble in hot.
2. Lead(II) sulphate PbSO4 - insoluble.
3. Lead(II) carbonate PbCO3 - insoluble (most carbonates insoluble except Na, K, NH4).
Reason: Sulphates of Ba, Pb, Ca insoluble. Chlorides of Ag, Pb insoluble. Carbonates most insoluble.`},{q:"18.4 Name two insoluble carbonates.",a:`Most carbonates are insoluble except sodium, potassium and ammonium carbonates.
Any two from:
1. Calcium carbonate CaCO3 (marble, limestone)
2. Magnesium carbonate MgCO3
3. Barium carbonate BaCO3
4. Lead carbonate PbCO3
5. Copper carbonate CuCO3
These are insoluble in water.`},{q:"18.5 What is crystal lattice?",a:`Crystal lattice is regular repeating three-dimensional arrangement of oppositely charged ions forming an ordered network structure.
Properties of ionic compounds are due to this ordered structure.
Example: In NaCl, each Na+ ion is surrounded by 6 Cl- ions and each Cl- ion is surrounded by 6 Na+ ions. This forms face-centered cube. Bigger Cl- ions are at corners and centre of faces, smaller Na+ ions are at edges. Figure 18.1 in book.`}],Um=[{title:"Constructed Response",items:[{q:"18.1 Why melting points of ionic salts are generally very high?",a:`Ionic salts have very high melting points because of very strong electrostatic forces of attraction between oppositely charged ions within the crystal lattice.
In solid state, ions are held in regular 3D lattice with strong attraction. To melt the solid, we must break these strong forces so ions can move freely.
Significant energy is needed to overcome these forces. So melting points are very high.
Melting points also depend on charges and sizes: Higher charges and smaller ionic sizes = stronger attractions = even higher melting points. When melting occurs, attractive forces break down and ions move freely.`},{q:"18.2 Why ionic salts exist in solid state at STP?",a:`Ionic salts exist as solids at STP (Standard Temperature and Pressure) because of strong electrostatic attraction between oppositely charged ions.
Positive ions (from bases) and negative ions (from acids) attract each other strongly and arrange in a regular repeating pattern called crystal lattice - a three-dimensional network.
This ordered structure makes them crystalline solids under ordinary temperature and pressure. Properties of ionic compounds are due to this ordered structure.
Example: NaCl lattice where each Na+ surrounded by 6 Cl- and each Cl- surrounded by 6 Na+.`},{q:"18.3 How can you prepare calcium sulphate in laboratory?",a:`Calcium sulphate is sparingly soluble / insoluble, so it is prepared by precipitation method (not by titration or excess method).
Method: Mix a soluble calcium salt with a soluble sulphate salt.
Example: Calcium chloride + Sodium sulphate → Calcium sulphate + Sodium chloride
CaCl2(aq) + Na2SO4(aq) → CaSO4(s) + 2NaCl(aq)
Procedure:
1. Take aqueous solutions of calcium chloride and sodium sulphate in beakers.
2. Mix them together with stirring.
3. White precipitate of calcium sulphate appears.
4. Filter the precipitate.
5. Wash with distilled water to remove soluble NaCl impurity.
6. Dry between folds of filter paper.
Alternative (less good): CaCO3 + H2SO4 → CaSO4 + CO2 + H2O but CaSO4 coats marble and stops reaction.`},{q:"18.4 Compare melting points of NaCl and MgCl2. Which is higher and why?",a:`Both are ionic compounds but MgCl2 should have higher melting point in theory because Mg2+ has higher charge than Na+.
Theory:
- NaCl: Na+ (1+ charge) and Cl- (1- charge)
- MgCl2: Mg2+ (2+ charge) and 2Cl- (1- each)
Higher charge = stronger electrostatic attraction = higher melting point. Smaller ion size also increases strength.
Mg2+ is smaller and has 2+ charge, so attraction in MgCl2 lattice is stronger than in NaCl.
Actually experimental values: NaCl 801°C, MgCl2 714°C. NaCl is slightly higher because of crystal packing and lattice structure differences, but according to simple charge rule, MgCl2 is expected to have stronger forces.
Main point: Melting points depend on magnitude of charges and distance (size) between ions. Higher charges, smaller sizes = higher melting point.`},{q:"18.5 How to prepare pure crystals of copper sulphate in lab?",a:`Copper sulphate is soluble salt, prepared by reaction of acid with insoluble base (excess method).
Chemical: Copper oxide + Sulphuric acid → Copper sulphate + Water
CuO + H2SO4 → CuSO4 + H2O
OR Copper hydroxide + Sulphuric acid →
Cu(OH)2 + H2SO4 → CuSO4 + 2H2O
OR Copper carbonate + Sulphuric acid →
CuCO3 + H2SO4 → CuSO4 + CO2 + H2O
Procedure:
1. Take 25 cm3 dilute H2SO4 in beaker and warm gently.
2. Add small amount of copper oxide (black powder) slowly with constant stirring.
3. Continue adding until some CuO remains undissolved at bottom (excess) — this ensures all acid reacted.
4. Filter to remove excess CuO.
5. Collect blue filtrate (CuSO4 solution) in evaporating dish.
6. Heat gently to concentrate until one-third left. Check with glass rod — if immersed end turns cloudy, solution is saturated.
7. Cool slowly for crystallization. Blue crystals of CuSO4 appear.
8. Filter crystals, wash with little cold distilled water, dry between filter papers.`}]},{title:"Descriptive Questions",items:[{q:"18.1 Explain formation of sodium chloride crystal.",a:`Formation: When acid neutralizes base, salt and water are formed (neutralization).
NaOH (base) + HCl (acid) → NaCl (salt) + H2O
Salt is chemical combination of positive and negative ions bonded by electrostatic attraction. Strength depends on magnitude of charges and distance between ions.
Na+ is positive ion from base NaOH, Cl- is negative ion from acid HCl.
Arrangement:
Oppositely charged ions arrange in regular repeating pattern called crystal lattice — three-dimensional network. Properties due to ordered structure.
Under ordinary T and P, ionic compounds are crystalline solids.
In NaCl crystal (Figure 18.1): Face-centered cube structure. Bigger Cl- ions are at corners and centre of faces. Smaller Na+ ions are at edges. Each Na+ surrounded by 6 Cl- ions and each Cl- surrounded by 6 Na+ ions.`},{q:"18.2 Explain methods of preparation of two soluble salts with examples.",a:`Two main methods for soluble salts:

METHOD A: Reaction of water soluble acid with water soluble base - TITRATION METHOD:
Used when both acid and base are soluble.
Example: Potassium nitrate KNO3
KOH + HNO3 → KNO3 + H2O
Steps:
1. Pipette alkali (KOH) into conical flask, add few drops indicator.
2. Run acid (HNO3) from burette until neutralisation (colour change).
3. Note volume. Repeat without indicator using same volumes.
4. Transfer neutralized solution to evaporating dish.
5. If salt stable to heat, evaporate to dryness OR heat gently until thin film of crystals on surface, cool slowly, saturated solution forms crystals. Filter and dry between filter papers.
Activity 18.1: Na2SO4 preparation: 50cm3 1M NaOH + phenolphthalein (pink) + 1M H2SO4 from burette till pink to colourless. Reaction 2NaOH+H2SO4→Na2SO4+2H2O. Transfer, heat till one-third left, glass rod test cloudy, cool, crystallize, wash, dry.

METHOD B: Reaction of acid with insoluble base - EXCESS METHOD:
Used when base/metal/carbonate is insoluble. Acid must be soluble.
Examples:
Mg + H2SO4 → MgSO4 + H2
CaCO3 + 2HCl → CaCl2 + CO2 + H2O
Cu(OH)2 + 2HCl → CuCl2 + 2H2O
Steps:
1. Take dilute acid in beaker, warm gently.
2. Add small amounts of insoluble base/metal/carbonate with constant stirring.
3. Add in excess until some settles at bottom — ensures all acid reacted.
4. Filter to remove excess base/metal.
5. Evaporate filtrate gently to get saturated solution.
6. Cool slowly, pure crystals appear. Filter and dry.
Activity 18.2: Zinc sulphate: Take 25cm3 dil H2SO4 warm, add zinc granules slowly with stirring till metal settles bottom, filter, evaporate filtrate gentle heating concentrate without boiling, cool slowly crystals appear, filter dry.`},{q:"18.3 How following salts are prepared? K2SO4, CuCl2, CaCl2",a:`1. Potassium sulphate K2SO4 - TITRATION METHOD (soluble acid + soluble base):
2KOH + H2SO4 → K2SO4 + 2H2O
Procedure: Titrate KOH with H2SO4 using phenolphthalein or methyl orange, note volume, repeat without indicator, evaporate neutral solution to get crystals.

2. Copper(II) chloride CuCl2 - EXCESS INSOLUBLE BASE METHOD:
Cu(OH)2 + 2HCl → CuCl2 + 2H2O
OR CuO + 2HCl → CuCl2 + H2O
OR CuCO3 + 2HCl → CuCl2 + CO2 + H2O
Procedure: Take dil HCl warm, add excess CuO/Cu(OH)2/CuCO3 with stirring till excess settles, filter excess, evaporate filtrate to saturation, cool to get green-blue crystals.

3. Calcium chloride CaCl2 - EXCESS INSOLUBLE CARBONATE METHOD:
CaCO3 + 2HCl → CaCl2 + CO2 + H2O
Procedure: Take dil HCl, add excess marble chips CaCO3 slowly with stirring, CO2 effervescence, when no more CO2 and excess remains, filter, evaporate filtrate, cool to get crystals.`},{q:"18.4 Describe which salts are soluble and which are insoluble?",a:`Solubility depends on nature of salt and temperature. General rules from Table 18.1:

1. Salts of Sodium, Potassium, Ammonium and all Nitrates:
SOLUBLE: All Na, K, NH4 salts are soluble. All nitrates are soluble.
INSOLUBLE: None.

2. Chlorides, Bromides, Iodides:
MOST SOLUBLE: Most chlorides soluble.
INSOLUBLE: Silver chloride AgCl, Lead(II) chloride PbCl2 (sparingly soluble - soluble in hot water, insoluble in cold).

3. Sulphates:
MOST SOLUBLE: Most sulphates soluble.
INSOLUBLE: Barium sulphate BaSO4, Lead(II) sulphate PbSO4, Calcium sulphate CaSO4 (sparingly soluble).

4. Carbonates:
SOLUBLE: Sodium carbonate Na2CO3, Potassium carbonate K2CO3, Ammonium carbonate (NH4)2CO3 only.
MOST INSOLUBLE: All other carbonates insoluble - e.g. CaCO3, MgCO3, BaCO3, PbCO3, CuCO3 etc.

5. Hydroxides:
SOLUBLE: Sodium hydroxide NaOH, Potassium hydroxide KOH, Ammonium hydroxide NH4OH are soluble. Calcium hydroxide Ca(OH)2 partially soluble.
