. Answer (a) +7.",formula:"K +1, O -2 each"},{q:"In reaction 4HBr + MnO₂ → MnBr₂ + Br₂ + 2H₂O, Mn is:",options:["Oxidized +2 to +4","Reduced +4 to +2","Oxidized +4 to +7","Reduced +7 to +2"],correct:1,expl:"In MnO₂, Mn is +4 (O2=-4). In MnBr₂, Br -1 each so Mn +2. So +4 → +2, gain of electrons, reduction. Answer (b).",formula:"Mn +4 → +2 reduction"},{q:"During electrolysis of dilute H₂SO₄ with Pt electrodes, what reaction at cathode?",options:["2H⁺ + 2e⁻ → H₂ (reduction)","4OH⁻ → O₂ + 2H₂O +4e⁻","SO₄²⁻ → SO₃ + O","Pt → Pt²⁺ +2e⁻"],correct:0,expl:"At cathode reduction happens. H⁺ is discharged to H₂ gas. 2H⁺ +2e⁻ → H₂. Answer (a).",formula:"Cathode = reduction H+ to H2"},{q:"Electrolysis of aqueous CuSO₄ with copper electrodes, what at anode?",options:["O₂ gas evolved","H₂ gas evolved","SO₂ gas evolved","Cu dissolves as Cu²⁺, no gas"],correct:3,expl:"Copper anode is active. Instead of water, Cu itself oxidizes: Cu → Cu²⁺ +2e⁻ and goes into solution. So no gas at anode, copper dissolves. Answer (d).",formula:"Active anode dissolves"},{q:"Which statement about Zn-Cu galvanic cell is WRONG?",options:["Zn is anode negative","Reduction at anode","Cu is cathode positive","Electrons flow Zn to Cu"],correct:1,expl:"Reduction always at cathode, oxidation at anode. So 'reduction at anode' is wrong. Correct is oxidation at anode Zn→Zn²⁺. Answer (b) is wrong statement.",formula:"Anode=oxidation, Cathode=reduction"},{q:"Electrolysis of concentrated aqueous NaCl, product at anode?",options:["Cl₂ gas","O₂ gas","H₂ gas","Na metal"],correct:0,expl:"In concentrated NaCl, Cl⁻ concentration very high, so Cl⁻ loses electrons easily at anode: 2Cl⁻ → Cl₂ +2e⁻. So Cl₂ gas. Answer (a).",formula:"Conc. Cl⁻ → Cl₂"},{q:"Electrolysis of dilute ZnCl₂ solution, product at cathode?",options:["H₂ gas","Zn metal","Cl₂ gas","O₂ gas"],correct:0,expl:"Zn is above H in electrochemical series, more reactive, so H⁺ discharges easier than Zn²⁺. So at cathode H₂ gas forms, not Zn. Answer (a) H₂.",formula:"Zn above H → H2 at cathode"},{q:"In hydrogen-oxygen fuel cell, what product formed at cathode?",options:["H₂O","H₂","O²⁻","OH⁻"],correct:3,expl:"At cathode O₂ reacts with water and electrons to make OH⁻ ions: O₂+2H₂O+4e⁻ →4OH⁻. So cathode product is OH⁻. Answer (d).",formula:"Cathode: O2 → OH⁻"},{q:"Which element is highest (most reactive) in electrochemical series?",options:["Cu","Ag","Mg","Au"],correct:2,expl:"Mg has E° = -2.37V very negative, most reactive among given. Higher (more negative) = stronger reducing agent, gives electrons easily. So Mg (c).",formula:"More -ve = more reactive"}],Ym=[{id:"16.1",q:"What happens when electricity is passed through aqueous NaCl?",a:"When electricity passes through aqueous NaCl, both water and NaCl give ions: Na⁺, Cl⁻, H⁺, OH⁻. At cathode (negative) H⁺ gains electrons and becomes H₂ gas. At anode (positive) Cl⁻ loses electrons and becomes Cl₂ gas. Na⁺ and OH⁻ remain and make NaOH. So solution becomes alkaline. This is called chlor-alkali process."},{id:"16.2",q:"What are main objectives of electroplating?",a:"Electroplating has three main purposes: 1) Decoration - coat cheap metals with gold, silver for beauty and shine. 2) Protection - protect iron from rust, corrosion and acids by coating with less reactive metal like chromium, nickel. 3) Repair - fill broken or worn parts of machines by depositing metal to make them usable again."},{id:"16.3",q:"What is difference between electrolytic and galvanic cell?",a:"Electrolytic cell uses electricity to do a non-spontaneous chemical reaction. It needs a battery. Anode is positive, cathode is negative. Galvanic cell produces electricity from spontaneous redox reaction. It works like a battery. Anode is negative, cathode is positive. One uses electricity, other makes electricity."},{id:"16.4",q:"Through which electrode electrons leave the electrolytic cell?",a:"In electrolytic cell, electrons leave from cathode (negative electrode) where reduction happens. They travel through external wire and enter at anode (positive) where oxidation happens. Actually inside solution ions carry current. In external circuit electrons flow from anode to cathode through battery, but conventionally we say they leave cathode."},{id:"16.5",q:"How does an electrolyte conduct electricity?",a:"Electrolyte has free moving ions. When solid, ions cannot move. When melted or dissolved in water, ions become free. Positive ions (cations) move to cathode, negative ions (anions) move to anode. Movement of these charged ions conducts electricity through solution."},{id:"16.6",q:"What happens when Cu strip is dipped in FeSO₄ solution?",a:"No reaction happens. Because Cu is below Fe in reactivity series. Cu is less reactive than Fe. Only a more reactive metal can displace a less reactive metal from its salt. Fe is above Cu, so Cu cannot displace Fe from FeSO₄. Solution remains green, no change."},{id:"16.7",q:"Why are fuel cells considered environment friendly?",a:"Fuel cells are environment friendly because they produce only water as waste product. They do not produce CO₂, nitrogen oxides, sulfur oxides or smoke. So no air pollution. No greenhouse gas. That is why they are called zero-emission cells, unlike petrol engines which make harmful gases."}],Gm=[{id:"16.1",q:"Calculate oxidation number of Cl in Ca(ClO₃)₂. (Short Long)",a:["We know rule: Sum of oxidation numbers in neutral compound is zero.","In Ca(ClO₃)₂, Ca is group 2, so oxidation number +2.","Oxygen is always -2. There are 6 oxygens (3×2), so total O = 6×(-2)= -12.","Let oxidation number of Cl be x. There are 2 Cl atoms, so 2x.","Write equation: Ca + 2Cl + 6O =0 => +2 +2x + (-12)=0 => 2x -10=0 => 2x=10 => x=+5.","So oxidation number of Cl is +5 in Ca(ClO₃)₂.","Reason: Cl is in +5 state because it is bonded with 3 oxygens, it has lost electrons to oxygen."]},{id:"16.2",q:"How does H₂O₂ behave as oxidizing agent? Explain.",a:["In H₂O₂, oxygen has oxidation number -1, not normal -2. This is unusual.","Because -1 is in middle, it can go to -2 by gaining 1 electron per O. Gaining electrons means reduction.","When H₂O₂ itself is reduced (from -1 to -2), it makes other substance oxidized. So it acts as oxidizing agent.","As oxidizing agent, H₂O₂ gives nascent oxygen [O] to other compound and itself becomes H₂O.","Example: H₂O₂ → H₂O, O goes from -1 to -2. It gains electrons, reduction happens to H₂O₂.","In that process, other substance loses electrons and gets oxidized. So H₂O₂ oxidizes others.","Thus H₂O₂ is good oxidizer because its O is ready to gain electrons to reach stable -2 state."]},{id:"16.3",q:"Why do we get different products during electrolysis of dilute and concentrated NaCl?",a:["In aqueous NaCl, we have four ions: from NaCl Na⁺, Cl⁻ and from water H⁺, OH⁻.","Which ion discharges at electrode depends on concentration and position in series.","In dilute NaCl solution, Cl⁻ concentration is very low, OH⁻ from water is more. OH⁻ loses electrons easier than Cl⁻ when Cl⁻ is low.","So at anode in dilute: 4OH⁻ → O₂ +2H₂O +4e⁻, O₂ gas comes, not Cl₂.","At cathode in both cases H⁺ gives H₂: 2H⁺ +2e⁻ → H₂.","In concentrated NaCl solution, Cl⁻ concentration is very high, much more than OH⁻.","So Cl⁻ goes to anode preferentially: 2Cl⁻ → Cl₂ +2e⁻, Cl₂ gas forms instead of O₂.","Thus product changes with concentration - which ion is more decides the gas."]},{id:"16.4",q:"Why is corrosion fast during rainy season?",a:["Corrosion (rusting) needs both oxygen and water to happen.","Chemical reaction: Iron loses electrons (oxidation) and oxygen gains electrons (reduction) in presence of water.","In rainy season, there is much more water, moisture, humidity in air.","Rain water acts as electrolyte. It helps flow of electrons between anodic and cathodic areas on iron surface.","Water also dissolves oxygen and brings it in contact with iron.","More moisture means iron surface stays wet for long time, continuous contact with O₂ and water.","So reaction speed increases, rust forms faster in rainy season than dry season."]},{id:"16.5",q:"If galvanic cell is made of Cu and Ag, what reactions at electrodes?",a:["First see electrochemical series: Cu is above Ag, more reactive. Cu E° = +0.34V, Ag E°=+0.80V? Actually Cu more negative than Ag, so Cu more reactive.","More reactive metal becomes anode, loses electrons (oxidation).","So Cu will be anode (negative electrode): Cu(s) → Cu²⁺ +2e⁻, oxidation. Cu dissolves.","Less reactive Ag will be cathode (positive electrode), gains electrons (reduction): Ag⁺ + e⁻ → Ag(s).","Electrons flow from Cu anode to Ag cathode through external wire, producing current.","At cathode Ag⁺ ions from solution deposit as shiny silver metal on electrode.","Salt bridge or porous partition keeps solutions separate but allows ion flow to balance charge."]},{id:"16.6",q:"What is function of porous partition in galvanic cell?",a:["Galvanic cell has two half-cells: Zn in ZnSO₄ and Cu in CuSO₄. Solutions must not mix directly.","Porous partition (or salt bridge) is placed between them.","Function 1: It keeps two solutions separate so they don't mix and react directly without producing electricity.","Function 2: It allows ions to pass slowly to complete the circuit and maintain electrical neutrality.","When Zn gives Zn²⁺ to solution, positive charge increases, SO₄²⁻ moves through partition to balance.","Without partition, solutions would mix, no potential difference, no current, and Cu²⁺ would directly react with Zn.","So partition is essential for steady flow of electricity and to keep cell working."]},{id:"16.7",q:"How do fuel cells produce electricity? Explain with reactions.",a:["Fuel cell has two porous carbon electrodes coated with platinum catalyst, and KOH as electrolyte.","Fuel is hydrogen at anode, oxygen at cathode, supplied continuously.","At anode, hydrogen reacts with OH⁻ ions: H₂ +2OH⁻ → 2H₂O +2e⁻. This is oxidation, releases 2 electrons.","Electrons travel through external wire from anode to cathode, this flow is electric current we use.","At cathode, oxygen reacts with water and incoming electrons: O₂ +2H₂O +4e⁻ → 4OH⁻. This is reduction.","OH⁻ ions formed at cathode travel through electrolyte back to anode to repeat cycle.","Overall reaction: 2H₂ + O₂ → 2H₂O + electricity + heat. Only water produced, 70-75% efficient, much better than petrol."]},{id:"16.8",q:"How chemical reactivity is compared using electrochemical series?",a:["Electrochemical series is list of metals arranged by their standard electrode potentials.","Method: Make galvanic cells with different metal pairs, measure voltage produced.","Metal that loses electrons easily (oxidized) is more reactive, becomes anode (negative).","If voltage is high, difference in reactivity between two metals is high.","Top metals like Li, K, Ba, Mg have very negative E° (-3.04V to -2.37V) - most reactive, best reducing agents.","Bottom metals like Cu, Ag, Au, Pt have positive E° - least reactive, noble metals, best oxidizing agents.","So by arranging metals by E° values we get reactivity order. Higher up = more reactive, displaces metals below it from solutions."]},{id:"D16.1",q:"Explain method of writing formulae using oxidation numbers. (Descriptive)",a:["Oxidation number tells charge of atom if electrons are counted by rules. It helps to write correct formula.","Rule: Sum of oxidation numbers in neutral compound is zero. Positive and negative must balance.","Example CaCl₂: Ca is group 2, so +2. Cl is group 17, so -1. Need two Cl to balance +2: +2 + 2×(-1)=0 => CaCl₂.","Example Al₂O₃: Al is group 13, +3. O is -2. To make sum zero, need LCM 6: 2×(+3)=+6, 3×(-2)=-6, +6-6=0 => Al₂O₃.","Steps: 1) Write oxidation numbers above symbols, 2) Criss-cross numbers to get subscripts, 3) Simplify if needed.","This method works for ionic and covalent compounds. It ensures total charge zero.","If oxidation numbers have common factor, divide to simplest ratio for empirical formula."]},{id:"D16.2",q:"Find oxidation numbers of elements in: Al(NO₃)₃, H₂S₂O₇, Na₂S₂O₃",a:["Al(NO₃)₃: Al is +3 fixed. NO₃⁻ ion has -1 charge. In NO₃⁻, O is -2×3=-6, so N + (-6)= -1 => N=+5. So Al +3, N +5, O -2.","H₂S₂O₇: H is +1 each, so +2 total. O7 is 7×(-2)= -14. Let S be x, 2x. Equation +2+2x-14=0 =>2x=12 => x=+6. So each S average +6. In this acid both S are +6.","Na₂S₂O₃: Na is +1 each, +2 total. O3 is -6 total. Let S be average y. +2+2y-6=0 =>2y=4 => y=+2 average.","But in Na₂S₂O₃ (thiosulfate) two sulfurs have different oxidation states: one central S is +6 (like sulfate), other outer S is -2 (like sulfide). Average (6-2)/2=2, matches +2 average.","So calculation shows average, but structure shows two different states. Important concept.","Method is always: sum of all oxidation numbers =0 for neutral, = charge for ion."]},{id:"D16.3",q:"Write formulae using ionic charges: Sodium hypochlorite, Calcium oxalate, Ammonium phosphate, Calcium nitrite",a:["Sodium hypochlorite: Na⁺ and ClO⁻ (hypochlorite ion -1). One +1 needs one -1 => NaClO. Criss-cross: Na⁺ ClO⁻ => NaClO.","Calcium oxalate: Ca²⁺ and C₂O₄²⁻ (oxalate -2). Both have 2 charge, so 1:1 => CaC₂O₄. +2-2=0.","Ammonium phosphate: NH₄⁺ (+1) and PO₄³⁻ (-3). Need 3 NH₄⁺ to balance -3: (+1)×3=+3, -3=0 => (NH₄)₃PO₄. Brackets because polyatomic.","Calcium nitrite: Ca²⁺ and NO₂⁻ (-1). Need 2 nitrites for +2 calcium: Ca²⁺ +2×(-1)=0 => Ca(NO₂)₂.","General rule: Write ions with charges, balance total to zero by taking LCM, write subscripts.","If polyatomic ion needs more than one, put in brackets."]},{id:"D16.4",q:"Explain working of fuel cell in detail with diagram idea (Descriptive)",a:["Construction: Two porous carbon electrodes (anode and cathode) coated with platinum catalyst for fast reaction. In middle KOH electrolyte. Outer circuit with wire.","Fuel: Hydrogen gas pumped to anode side, oxygen (or air) to cathode side, continuously supplied.","At anode: H₂ +2OH⁻ → 2H₂O +2e⁻ (oxidation). Hydrogen splits, gives electrons to electrode.","Electrons cannot go through electrolyte, so they travel through external wire to cathode - this is electricity we use for car, house.","At cathode: O₂ +2H₂O +4e⁻ →4OH⁻ (reduction). Oxygen takes electrons and makes OH⁻.","OH⁻ ions travel back through KOH electrolyte to anode to continue reaction.","Overall 2H₂+O₂ →2H₂O + energy. No smoke, only water and heat. Efficiency 70-75%, 3 times better than petrol engine. Used in spaceships, cars."]},{id:"D16.5",q:"What are products of electrolysis of concentrated metal halides? Explain.",a:["Concentrated metal halides mean high amount of metal ion and halide ion Cl⁻ Br⁻ I⁻ in water.","At cathode: Two possibilities. If metal is above hydrogen in series (Na, K, Mg, Al) - very reactive - then H⁺ discharges easier, so H₂ gas forms, not metal. If metal is below hydrogen (Cu, Ag, Au) less reactive, metal deposits.","At anode: Halide concentration is very high, so halide oxidizes, not OH⁻. 2Cl⁻ → Cl₂ +2e⁻, 2Br⁻ → Br₂ +2e⁻, 2I⁻ → I₂ +2e⁻. So halogen gas forms.","Example concentrated NaCl: Cathode H₂ (because Na above H), anode Cl₂ (because Cl⁻ high). So products H₂ + Cl₂ + NaOH left.","Example concentrated CuCl₂: Cathode Cu metal deposits (Cu below H), anode Cl₂ gas. So copper coating and chlorine gas.","Thus rule: Conc. halide anode always halogen. Cathode depends on position vs hydrogen."]},{id:"D16.6",q:"Explain electroplating with examples (Descriptive)",a:["Electroplating is coating of expensive or protective metal on cheap object using electrolysis.","Setup: Object to be plated = cathode (negative). Pure metal to be coated = anode (positive). Electrolyte contains ions of coating metal.","Silver plating: Electrolyte K[Ag(CN)₂] (potassium silver cyanide), silver rod anode, object cathode. Ag⁺ moves to object, coats shiny silver. Used for jewelry, cutlery.","Copper plating: Electrolyte CuSO₄, copper anode, object cathode. Cu²⁺ goes to cathode, copper coats. Used for decoration and protection.","Chromium plating: Iron first plated with copper and nickel, then chromium. Electrolyte chromic acid. Gives hard shiny rust-proof surface for cars, bikes.","Conditions for good plating: High current density, low temperature, high metal ion concentration, clean object surface, stir electrolyte."]},{id:"D16.7",q:"What is corrosion? Explain rusting reactions.",a:["Corrosion is natural slow decay of metals by reaction with environment - oxygen, water, CO₂, sulfur gases. Metals change into oxides, sulfides, carbonates.","Rusting is corrosion of iron only. Needs both O₂ and H₂O. Dry iron does not rust.","Mechanism: Iron acts as anode, loses electrons: Fe(s) → Fe²⁺ +2e⁻ (oxidation).","At other spot cathode: O₂ +2H₂O +4e⁻ →4OH⁻ (reduction) - oxygen gains electrons.","Fe²⁺ and OH⁻ meet: Fe²⁺ +2OH⁻ → Fe(OH)₂, iron(II) hydroxide (greenish).","Fe(OH)₂ further oxidized by O₂ and water: 4Fe(OH)₂ + O₂ +2H₂O → 4Fe(OH)₃, iron(III) hydroxide, reddish brown rust Fe₂O₃·xH₂O.","Rust is porous, not protective. It allows air and moisture to reach fresh iron below, so rusting continues until all iron gone. That is why painting or galvanizing needed."]}],Xm=[{icon:Ut,title:"Oxidation Numbers",desc:"Define and calculate oxidation number from formulae using rules. Sum zero for neutral, equal charge for ion.",grad:"from-violet-600 to-indigo-600"},{icon:Ae,title:"Writing Formulae",desc:"Use oxidation numbers and ionic charges to write formulae: criss-cross method, balance to zero.",grad:"from-emerald-500 to-teal-600"},{icon:Wt,title:"Redox by Oxidation No.",desc:"Identify oxidation and reduction by increase/decrease of oxidation number, oxidizing/reducing agents.",grad:"from-blue-600 to-cyan-600"},{icon:$t,title:"Electrolysis Concept",desc:"Define electrolysis, electrolyte, electrodes, conduction by ions, factors affecting discharge.",grad:"from-fuchsia-600 to-pink-600"},{icon:kr,title:"Electrolysis of Water",desc:"Dilute H₂SO₄ with Pt electrodes: cathode H₂, anode O₂. Reactions at each electrode.",grad:"from-amber-500 to-orange-600"},{icon:Nr,title:"Aqueous Solutions",desc:"Conc. vs dilute NaCl, CuSO₄ with Cu electrodes, ZnCl₂ etc - products depend on concentration & series.",grad:"from-rose-600 to-red-600"},{icon:At,title:"Galvanic Cells",desc:"Construction of Zn-Cu Daniell cell, porous partition, electron flow, anode -ve oxidation, cathode +ve reduction.",grad:"from-violet-600 to-purple-600"},{icon:Sr,title:"Electrolytic vs Galvanic",desc:"Compare: electrolytic uses electricity for non-spontaneous, galvanic makes electricity spontaneous. Anode/cathode signs opposite.",grad:"from-green-600 to-emerald-600"},{icon:Ut,title:"Electrochemical Series",desc:"Arrange elements by E° values, reactivity comparison, predict displacement reactions, oxidizing/reducing strength.",grad:"from-blue-600 to-indigo-600"},{icon:At,title:"Fuel Cells",desc:"H₂-O₂ fuel cell with KOH, porous carbon Pt electrodes, reactions at anode/cathode, advantages 75% efficient zero emission.",grad:"from-teal-600 to-cyan-600"},{icon:Pr,title:"Electroplating",desc:"Definition, objectives (decoration, protection, repair), process, examples: silver, copper, chromium plating conditions.",grad:"from-orange-500 to-amber-500"},{icon:Cn,title:"Corrosion & Rusting",desc:"Define corrosion, rusting needs O₂+H₂O, electrochemical mechanism, prevention: paint, galvanizing, alloy.",grad:"from-slate-600 to-zinc-600"},{icon:Ae,title:"Oxidation Number Rules",desc:"Free element 0, monoatomic ion = charge, O -2 (except peroxide -1), H +1, sum rules, peroxides, superoxides.",grad:"from-pink-600 to-rose-600"},{icon:Wt,title:"Conduction Mechanism",desc:"Why electrolytes conduct in molten/aqueous but not solid - free ions, movement to opposite electrodes.",grad:"from-indigo-600 to-violet-600"},{icon:$t,title:"Factors at Electrodes",desc:"Position in electrochemical series, concentration, nature of electrode (active vs inert) decides product.",grad:"from-cyan-600 to-blue-600"},{icon:At,title:"Salt Bridge / Partition",desc:"Function: keep solutions separate, allow ion migration, maintain neutrality, compl
