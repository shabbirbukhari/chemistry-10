er:Im.current}}var m=rd,w=rd;var $m=["Define biochemistry and explain the importance of carbohydrates, proteins, lipids, nucleic acids in living organisms.","Classify carbohydrates as monosaccharides (glucose, fructose), disaccharides (maltose, lactose, sucrose) and polysaccharides (starch, cellulose, glycogen).","Describe proteins as polymers of amino acids, formation of peptide linkage (-CO-NH-) and structure of polypeptide chains.","Define denaturation of proteins with examples like boiling of egg and curdling of milk.","Classify lipids as triglycerides (fats and oils), discuss fatty acids as building blocks and formation of ester linkage.","Explain enzymes as biological catalysts, their specificity and role in digestion, metabolism and lowering activation energy.","Describe vitamins, their types, sources, functions and diseases caused by their deficiency (A, B1, C, D, K).","Compare nucleic acids DNA and RNA - structure, location, molecular mass and their role in storing and transferring genetic information.","Discuss applications of biochemistry - Galleri test for cancer detection, commercial products from oils and fats, and daily requirements of nutrients."],ld=[{q:"Functional groups present in fructose are:",options:["(a) Hydroxyl and aldehyde","(b) Hydroxyl and Ketone","(c) Hydroxyl and ester","(d) Hydroxyl and amide"],correct:1,answerText:"(b) Hydroxyl and Ketone",explain:"Fructose is a ketohexose. It contains one ketonic group C=O at C-2 and five hydroxyl -OH groups. Glucose contains aldehyde -CHO at C-1. Both have formula C6H12O6."},{q:"Which functional group is present in a fat?",options:["(a) Carboxyl group","(b) Ester group","(c) Carbonyl group","(d) Hydroxyl group"],correct:1,answerText:"(b) Ester group because fat is triester of glycerol",explain:"Fat is triglyceride. Glycerol (CH2OH-CHOH-CH2OH) reacts with 3 fatty acids (long chain carboxylic acids) to form 3 ester linkages -COO-. So fat contains ester group."},{q:"Which function is not performed by proteins in our body?",options:["(a) They serve as chemical messengers","(b) They serve as storage of energy-rich fuel","(c) They store genetic information","(d) They serve as catalysts for biochemical reactions"],correct:2,answerText:"(c) They store genetic information (that's DNA/RNA). Note (b) also mainly done by lipids.",explain:"Proteins form skin, hair, muscle, enzymes, hormones like insulin, hemoglobin. They act as catalysts and chemical messengers. They do NOT store genetic information - DNA and RNA do. Energy storage is mainly lipids (fats), not proteins."},{q:"Which functional groups react to produce a peptide linkage in proteins?",options:["(a) Carboxyl and hydroxyl","(b) Carboxyl and amino group","(c) Hydroxyl and amino","(d) Ester and amino"],correct:1,answerText:"(b) Carboxyl and amino group",explain:"H2N-CH(R1)-COOH + H2N-CH(R2)-COOH → H2N-CH(R1)-CO-NH-CH(R2)-COOH + H2O. -COOH of one amino acid and -NH2 of other eliminate water to form peptide bond -CO-NH-."},{q:"The test performed to detect cancer in early stages is:",options:["(a) Genetic test","(b) Urine test","(c) Galleri test","(d) Electrolyte test"],correct:2,answerText:"(c) Galleri test uses DNA sequencing",explain:"Galleri test is a modern blood test that uses DNA sequencing technology to detect more than 50 types of cancer in early stages by finding cancer signals in blood."},{q:"Fatigue and depression are caused by deficiency of:",options:["(a) Vitamin A","(b) Vitamin C","(c) Vitamin D","(d) Vitamin B1"],correct:3,answerText:"(d) Vitamin B1 (Thiamine)",explain:"Vitamin B1 deficiency causes beri-beri, fatigue, depression, muscle weakness. Vitamin A deficiency causes night blindness, C causes scurvy, D causes rickets."}],Um=[{q:"25.1 What is the difference between glucose and fructose?",a:`Both have same molecular formula C6H12O6 but different functional groups.
• Glucose is an aldose (aldehydic sugar). It contains aldehyde group -CHO at C-1. Formula: H-C(=O)-CH(OH)-CH(OH)-CH(OH)-CH(OH)-CH2OH. It is aldohexose.
• Fructose is a ketose (ketonic sugar). It contains ketone group C=O at C-2. Formula: CH2OH-C(=O)-CH(OH)-CH(OH)-CH(OH)-CH2OH. It is ketohexose.
Glucose is found in grapes, honey, blood, urine and is main source of energy. Fructose is sweeter, found in fruit juices and honey. Both are monosaccharides.`},{q:"25.2 Give two examples of denaturation of proteins.",a:`Denaturation means loss of 3D structure of protein due to heat, change in pH, acids, bases, oxidizing or reducing agents.
1. Boiling or frying an egg: Egg white contains albumin protein. On heating, it changes from transparent liquid to white solid. The structure is destroyed and cannot be reversed.
2. Curdling of milk: When milk becomes sour or acid is added, casein protein denatures and separates as curd.
Other examples: Hair straightening with heat, milk boiling.`},{q:"25.3 What are the sources of vitamin D?",a:`Sources of Vitamin D:
• Butter, fish liver oils (cod liver oil), egg yolk, milk
• Skin can prepare Vitamin D directly in presence of sunlight (UV rays convert cholesterol in skin to Vitamin D)
• Fortified foods
Function: Helps absorption of calcium and phosphorus, for bones and teeth. Deficiency causes rickets in children and osteomalacia in adults.`},{q:"25.4 What is the role of enzymes in our body?",a:`Enzymes are biological catalysts made of proteins. They speed up biochemical reactions taking place in our body.
• They lower activation energy of reactions.
• They are specific - one enzyme for one reaction.
• Help in digestion (amylase digests starch, pepsin digests protein), protein synthesis, metabolism, respiration.
• Without enzymes, reactions would be too slow to sustain life. They work at body temperature and pH.`},{q:"25.5 Which commercial products are obtained from oils and fats?",a:`Oils and fats are triglycerides. Their hydrolysis gives useful products:
• Soaps: Sodium salts of long chain fatty acids. Made by hydrolysis of animal fat with alkali (NaOH). Known since 600 BC from goat fat and wood ash.
• Detergents, candles, cosmetics, lubricants, paints, varnishes
• Food products: Ghee, butter, cooking oil, margarine
• Glycerol obtained as by-product used in medicines and explosives.`},{q:"25.6 Which vitamin helps in blood clotting?",a:`Vitamin K helps in blood clotting.
It is found in leafy green vegetables like spinach, cabbage, cauliflower, and also synthesized by bacteria in intestine.
It is necessary for formation of prothrombin which helps clotting. Deficiency causes excessive bleeding from wounds.`}],Bm=[{q:"25.1 What is the function of DNA?",a:`DNA = Deoxyribonucleic Acid.
Function:
• Stores all genetic information of a living organism.
• Passes this information to RNA at proper time.
• Responsible for existence, development and reproduction of all forms of life.
• DNA molecules are very large. Molecular mass up to 660 million daltons and lengths up to 12 cm when stretched (uncoiled).
• Found mostly in nucleus of cells. It controls all activities of cell through proteins.`},{q:"25.2 Write down three important functions played by proteins in our body.",a:`Proteins are very large molecules made of C, H, O, N, S. Thousands of types.
1. Structural: Form skin, hair, muscle, blood, nails, connective tissues. Fibrous proteins give strength. Adult needs 60g protein daily to build and repair cells.
2. As hormones and enzymes: Insulin is a protein hormone that controls sugar in blood. Enzymes are proteins that act as catalysts and speed up biochemical reactions (digestion, metabolism).
3. Transport and messenger: Hemoglobin is a protein in blood that carries oxygen and delivers to different parts of body. Some proteins act as chemical messengers.`},{q:"25.3 Fatty acids serve as building blocks of lipids just like amino acids are for proteins. Comment on this statement.",a:`Yes, this statement is true.
• Proteins are polymers made by linking about 20 different amino acids through peptide linkage -CO-NH-. Long chain is called polypeptide which twists to form 3D protein.
• Similarly, lipids (fats and oils) are made from simpler fatty acids. Fatty acids are long chain carboxylic acids with 12-28 carbons e.g. stearic acid C17H35COOH.
• Glycerol + 3 fatty acids → Triglyceride (fat) + 3 H2O with 3 ester linkages. Example tristearin.
• So fatty acids are building blocks of lipids like amino acids are building blocks of proteins. Both form macromolecules.`},{q:"25.4 Write down about the sources of vitamin C. Which diseases are caused by its deficiency?",a:`Vitamin C is also called Ascorbic Acid. It is water soluble.
Sources: Citrus fruits - lemon, orange, grapefruit, green pepper, tomatoes, amla, guava, green vegetables.
Functions: Helps in healing wounds, keeps gums healthy, increases resistance to infection, helps absorption of iron.
Deficiency causes:
• Scurvy - bleeding gums, loose teeth, painful swollen joints, wounds do not heal quickly
• Weakness, fatigue, poor immunity
Daily requirement is about 60-90 mg.`},{q:"25.5 Write down the names of two polymeric carbohydrates.",a:`Polymeric carbohydrates are polysaccharides with formula (C6H10O5)n where n is hundreds to thousands.
1. Starch: Found in potatoes, rice, wheat, grains. It is energy storage in plants. Made of many glucose units joined together. White powder, gives blue colour with iodine.
2. Cellulose: Found in plant cell walls, wood, cotton. Most abundant organic compound on earth. Also made of glucose but different linkage. Humans cannot digest it but it provides roughage.
3. Third example is Glycogen: Energy storage in animals (in liver and muscles), like starch in plants.`}],Vm=[{q:"25.1 What are the sources of fructose, maltose and lactose?",a:`• Fructose: Sweetest sugar. Found in sweet fruit juices, honey, apples, mangoes. Also called fruit sugar. Used in sweets and syrups.
• Maltose: Called malt sugar. Found in breads, other cereals, germinating barley. Formed when starch is broken by amylase. Made of two glucose units.
• Lactose: Called milk sugar. Present in milk of mammals (4-6% in human milk, 4% in cow milk). Widely used in baking, commercial milk for infants and pharmaceuticals. Made of glucose + galactose.`},{q:"25.2 Draw open chain structures of glucose and fructose.",a:`Open chain structures (Fischer projection):

Glucose (Aldohexose - aldehyde at C1):
      O
     //
H - C
     |
HO - C - H   (C2)
     |
 H - C - OH  (C3)
     |
HO - C - H   (C4)
     |
HO - C - H   (C5)
     |
    CH2OH    (C6)
Simplified: H-C(=O)-(CHOH)4-CH2OH

Fructose (Ketohexose - ketone at C2):
    CH2OH    (C1)
     |
     C=O    (C2)
     |
HO - C - H   (C3)
     |
 H - C - OH  (C4)
     |
HO - C - H   (C5)
     |
    CH2OH    (C6)
Simplified: CH2OH-C(=O)-(CHOH)3-CH2OH

In solution they mostly exist as cyclic ring forms (pyranose/furanose), but open chain shows functional group clearly.`},{q:"25.3 Construct peptide linkage and explain the structure of a polypeptide.",a:`Peptide linkage formation:
Amino acid has both -NH2 and -COOH. Two amino acids join by elimination of water.

H2N-CH(R1)-COOH + H2N-CH(R2)-COOH → H2N-CH(R1)-CO-NH-CH(R2)-COOH + H2O
        Amino acid 1      Amino acid 2              Dipeptide

The bond -CO-NH- is called peptide linkage.

Polypeptide structure:
• This dipeptide still has free -NH2 at one end and -COOH at other end, so it can react with third amino acid to form tripeptide.
• Repeated many times gives long chain called polypeptide (10 to thousands of amino acids).
• Chain undergoes twists, turns and folds due to hydrogen bonding to assume a specific 3D shape (secondary, tertiary structure). Ball and stick model shows coiling.
• Only 20 different amino acids make thousands of proteins by different sequence. Protein properties depend on sequence of R groups.`},{q:"25.4 What are DNA and RNA? Describe the role played by them in our body.",a:`DNA = Deoxyribonucleic Acid, RNA = Ribonucleic Acid. Both are nucleic acids made of nucleotides.

Structure difference:
• DNA: Very large molecule, molecular mass up to 660 million daltons, length up to 12 cm when stretched. Double helical structure (double strand). Found mostly in nucleus of cell. Sugar is deoxyribose.
• RNA: Smaller, molecular mass about 340 daltons, single strand, found mostly outside nucleus in cytoplasm. Sugar is ribose. Types: mRNA, tRNA, rRNA.

Roles:
• DNA stores genetic information and passes it to RNA at proper time. It is responsible for existence, development and reproduction of all forms of life. It controls all cell activities.
• RNA reads, decodes and uses the information from DNA to make proteins. mRNA carries message from nucleus to ribosome, tRNA brings amino acids, rRNA makes ribosome. Without RNA, proteins cannot be made.
Together they control heredity and protein synthesis.`},{q:"25.5 Compare the roles played by carbohydrates, proteins and lipids in our body.",a:`1. Carbohydrates:
• Main source of energy. Most abundant naturally occurring organic compounds.
• Daily requirement 225-325g. Provide 4 kcal/g.
• Help body use protein and fat efficiently. Glucose is immediate energy for brain and muscles.
• Prevent diseases: fiber helps prevent heart disease, diabetes, cancer.
• Examples: glucose, starch, cellulose.

2. Proteins:
• Build and repair: Very large molecules C,H,O,N,S. Form skin, hair, muscle, blood, almost all organs. Fibrous proteins in muscles, hair, nails, skin.
• As biocatalysts and hormones: Enzymes speed up reactions, insulin controls blood sugar, hemoglobin carries oxygen.
• Chemical messengers and immunity (antibodies).
• Daily requirement ~60g adult. Provide 4 kcal/g but mainly used for building, not energy.

3. Lipids (Fats and Oils):
• Energy rich: Provide twice energy than carbs/proteins (9 kcal/g). Main energy reserve.
• Insulation and protection: Adipose tissue under skin keeps warm, protects vital organs.
• Building blocks are fatty acids. Daily requirement 44-78g.
