2. Ethene + Hydrogen → Ethane (Catalytic hydrogenation):
CH2=CH2 + H2 --150°C, 2 atm, Ni--> CH3-CH3

Other examples: CH2=CH2 + HBr → CH3-CH2Br (Bromoethane), CH2=CH2 + H2O --H2SO4, 300°C--> CH3CH2OH (Ethanol).`},{id:"s2",q:"22.2 Names of compounds obtained from coal tar and petroleum?",a:`Coal is major source of aromatic hydrocarbons. From coal tar we get benzene, toluene, phenol, naphthalene etc.
Petroleum and natural gas are chief sources of aliphatic hydrocarbons - mainly alkanes (methane to higher alkanes), alkenes (ethene, propene obtained by cracking) and useful fractions used to make plastics and other chemicals.`},{id:"s3",q:"22.3 How is ethene oxidized by cold aqueous alkaline KMnO4?",a:`Alkenes react with cold, dilute, alkaline KMnO4 to give diols. This is called hydroxylation.

CH2=CH2 + H2O + [O] --cold dil. KMnO4--> CH2OH-CH2OH
Ethane-1,2-diol (Ethylene glycol)

Purple colour of KMnO4 is rapidly discharged. Alkanes do not give this reaction, so it is used to distinguish saturated and unsaturated hydrocarbons.`},{id:"s4",q:"22.4 Differentiate elimination and addition reactions?",a:`Elimination: A small molecule is removed from a saturated compound to produce an unsaturated compound.
Example: Dehydration of ethanol:
CH3CH2OH --conc. H2SO4, 180°C--> CH2=CH2 + H2O
One water molecule is removed.

Addition: Two reactants combine to form a single new product, across C=C bond.
Example: CH2=CH2 + Br2 → CH2Br-CH2Br
No atom is removed, double bond becomes single bond.`},{id:"s5",q:"22.5 Name starting materials used to generate oxy-acetylene flame?",a:`Ethyne (Acetylene) CH≡CH and oxygen O2.

2CH≡CH + 5O2 → 4CO2 + 2H2O + Heat
In acetylene torch, acetylene burns in oxygen to produce very high temperature flame (~3000°C) used for welding and cutting metals.`},{id:"s6",q:"22.6 How can an alkene be identified? (Bromine test)",a:`1. Bromine Test: Add aqueous bromine (orange-brown) to alkene. Reddish brown colour is rapidly discharged and colourless dibromo compound forms. Alkane does not decolourize.

2. KMnO4 Test: Add cold dilute alkaline KMnO4 (purple). Purple colour discharged and brown MnO2 formed with alkene to give glycol. Alkane no reaction.

3. Iodine Test: Violet colour of iodine is also discharged by alkenes.`},{id:"s7",q:"Difference between dehydration and dehydrohalogenation?",a:`Dehydration: Removal of water molecule from alcohol with dehydrating agent conc. H2SO4. 
CH3CH2OH --180°C H2SO4--> CH2=CH2 + H2O

Dehydrohalogenation: Removal of hydrogen halide HX from alkyl halide with alcoholic KOH.
CH3CH2Cl + KOH(alc) --180°C--> CH2=CH2 + KCl + H2O
Both are elimination reactions producing alkenes.`},{id:"s8",q:"You have two test tubes A and B containing saturated and unsaturated compound (alkene). How identify?",a:`Take both samples and add 2-3 drops of bromine water or cold dilute KMnO4 solution.
- Test tube in which orange colour of bromine or purple colour of KMnO4 is quickly discharged contains unsaturated compound (alkene).
- Test tube where colour remains contains saturated compound (alkane).`},{id:"s9",q:"Why is oxy-acetylene flame so hot?",a:`Acetylene (ethyne) contains triple bond with high energy. When it burns in pure oxygen, complete combustion occurs:
2C2H2 + 5O2 → 4CO2 + 2H2O + large amount of heat
Temperature reaches about 3000°C. This high heat speeds cutting and welding of metals.`},{id:"s10",q:"Do you expect ethyne to decolourize cold KMnO4? How do Cl2 and HCl add to ethene?",a:`Yes, ethyne is unsaturated with triple bond (-C≡C-), so like alkenes it decolourizes cold KMnO4 and bromine water.

Addition to ethene:
1. With chlorine: CH2=CH2 + Cl2 --CCl4--> CH2Cl-CH2Cl (1,2-Dichloroethane)
2. With HCl: CH2=CH2 + HCl → CH3-CH2Cl (Chloroethane)
Both are addition reactions across double bond.`}],km=[{id:"l1",q:"22.1 Describe two methods of preparation of ethene?",a:`Two methods for ethene preparation are:

METHOD 1 - BY DEHYDRATION OF ALCOHOLS:
Dehydration means removal of water molecule. Ethanol is heated with concentrated sulphuric acid (dehydrating agent) at 180°C.
CH3CH2OH --conc. H2SO4, 180°C--> CH2=CH2 + H2O
Ethanol → Ethene + Water. This is elimination reaction.

METHOD 2 - BY DEHYDROHALOGENATION OF ALKYL HALIDES:
Alkyl halide heated with alcoholic potassium hydroxide (KOH dissolved in ethanol).
CH3CH2Cl + KOH(alc) --180°C--> CH2=CH2 + KCl + H2O
Chloroethane → Ethene + KCl + Water. Molecule of HX (HBr, HCl) is removed.

Both methods produce ethene, simplest alkene, widely used.`},{id:"l2",q:"22.2 Describe fractional distillation of petroleum?",a:`Petroleum in crude state is mixture of many hydrocarbons and does not burn easily. It must be separated into useful fractions by refining. Refining involves fractional distillation.

STEPS:
1. NEUTRALIZATION: Crude oil is washed with acidic or basic solution as required.
2. HEATING: Neutralized oil is heated in electric furnace above 400°C. It becomes mixture of gases and vapours.
3. FRACTIONATING COLUMN: Vapours pass into tall fractionating column with many compartments divided by shelves with holes covered by bubble caps. Temperature decreases from bottom to top.
   - Refinery gases (C1-C4, below 0°C) go to top and escape, liquified for heating/cooking.
   - Gasoline/petrol (C5-C6, 0-65°C) collected near top at ~20°C, used for cars.
   - Naphtha (C6-C10, 65-170°C) at ~120°C, chemical feedstock.
   - Kerosene (C10-C14, 170-250°C) at ~200°C, jet fuel.
   - Diesel oil (C14-C19, 250-340°C) at ~300°C, diesel engines.
   - Fuel oil (C19-C35, 340-500°C) at ~370°C, ships, power plants, home heating.
   - Lubricating oil (>C20, 340-500°C) at ~400°C, lubricants, waxes, polishes.
   - Bitumen (>C35, above 500°C) remains at bottom, used for roads.

Fractions are not pure, redistilled for better separation. Each fraction contains mixture of hydrocarbons with similar boiling range.`},{id:"l3",q:"22.3 Which properties of petroleum fractions change with boiling points?",a:`Physical properties depend on number of carbon atoms, molecular mass and intermolecular forces.

As chain length (number of carbon and hydrogen atoms) increases:
- Molecular mass increases
- Intermolecular forces become stronger
- Volatility decreases
- Boiling point increases
- Viscosity increases (becomes thicker)
- Flammability decreases

So in fractionating column from TOP to BOTTOM:
- Top fractions: low carbon number (C1-C4), high volatility, low boiling point (<0-65°C), low viscosity, highly inflammable.
- Bottom fractions: high carbon number (>C35), low volatility, high boiling point (>500°C), high viscosity, less flammable.

Example: Refinery gas is gas highly volatile, bitumen is thick solid used for roads.`},{id:"l4",q:"22.4 Explain with examples cracking of alkanes?",a:`Cracking is process carried out to convert high molecular mass alkanes to lower alkanes and alkenes by heating at high temperature (about 500°C) in absence of oxygen and in presence of zeolites as catalyst.

IMPORTANCE: Large alkanes from kerosene and diesel are less useful. Cracking is important commercially because it produces smaller alkanes useful as fuel (petrol) as well as alkenes like ethene and propene useful as starting materials to produce many commercially important chemicals and plastics.

EXAMPLES:
General: C15H32 (kerosene oil, large alkane) --500°C, zeolite--> petrol + alkenes + hydrogen gas

Specific: C15H32 → 2C2H4 (ethene) + C3H6 (propene) + C8H18 (octane)

Kerosene oil and diesel oil which contain higher molecular mass alkanes are often cracked to give petrol, alkenes and hydrogen gas.`},{id:"l5",q:"22.5 Give uses of acetylene (ethyne)?",a:`Ethyne (CH≡CH) also called acetylene is simplest alkyne. Two main uses from book:

1. WELDING AND CUTTING (Oxy-acetylene flame):
Acetylene burns in oxygen/air to produce large amount of heat:
2CH≡CH + 5O2 → 4CO2 + 2H2O + Heat
In acetylene torch, oxy-acetylene flame has temperature about 3000°C. This high temperature speeds cutting and welding processes. Figure 22.1 shows torch.

2. ARTIFICIALLY RIPENING OF FRUITS:
Solid calcium carbide (CaC2) reacts with moisture in air to produce acetylene gas which accelerates ripening of green fruits and induces colour change. Reaction: CaC2 + 2H2O → C2H2 + Ca(OH)2
Use of calcium carbide in country is prohibited because it is known to cause serious health problems - dizziness, vomiting, skin ulcer.
