The extra energy is released to the surroundings as heat. This released hidden heat is called latent heat of condensation.`},{id:"14.3",q:"Why naphthalene balls disappear after some time?",a:`This happens due to sublimation. Naphthalene has weak inter-particle forces and high vapour pressure at room temperature.

Its solid directly changes into vapours without melting. The vapours mix in the air and go away. So balls become smaller day by day and finally disappear.

That is why naphthalene balls are used to keep moths away from clothes.`},{id:"14.4",q:"Why does temperature remain constant during phase change?",a:`During melting (B-C at 0°C) and boiling (D-E at 100°C) temperature does not rise. The heat we give is not used to increase kinetic energy.

All heat is used as latent heat to break the attraction between particles. So average kinetic energy stays same and temperature stays constant until whole solid melts or whole liquid boils.

Same happens in freezing and condensation. Latent heat is released but temperature remains constant.`},{id:"14.5",q:"Is it possible to compress a liquid like a gas?",a:`No, liquids cannot be compressed like gases.

In liquids particles are very close to each other and there is almost no empty space. So applying pressure makes very little difference.

In gases particles are far apart with lot of empty space. They can be compressed easily. This is Boyle's Law. That is why gases can be filled in cylinders but liquids are almost incompressible.`},{id:"14.6",q:"Can you change temperature at which water boils in lab?",a:`Yes, we can change boiling point by changing external pressure. Boiling starts when vapour pressure becomes equal to external pressure.

If we decrease external pressure with a vacuum pump, vapour pressure equals external pressure early, so water boils below 100°C. In Murree hills pressure is low, water boils at about 98°C.

If we increase external pressure like in a pressure cooker, more heat is needed for vapour pressure to equal external pressure. So water boils above 100°C, about 120°C, and food cooks faster.`},{id:"14.7",q:"In which season wet clothes get dry after relatively longer time?",a:`In winter or rainy or humid season, clothes take longer to dry.

In winter temperature is low, so kinetic energy of water molecules is low and evaporation is slow.

In rainy season air already has lot of water vapours. Air is saturated, so it cannot take more vapours. Rate of evaporation decreases.

In hot dry summer, temperature is high and air is dry, so evaporation is fast and clothes dry quickly.`},{id:"14.8",q:"When solid is heated what happens to its particles?",a:`In a solid particles only vibrate at fixed positions due to strong inter-particle forces.

When we heat, particles get more kinetic energy. They vibrate faster and with larger amplitude.

The forces between them become weaker. At melting point particles get enough energy to slide over each other, so solid becomes liquid. On more heating they move freely and become gas.`},{id:"14.9",q:"Do solids and liquids also diffuse just like gases?",a:`Yes, but they diffuse much slower than gases.

In solids particles cannot move freely, they only vibrate at fixed places, so diffusion is very very slow. Example: two metals in alloys mix after many years.

In liquids particles are closer but can slide over each other, so diffusion is faster than solids but slower than gases. Example: ink spreads in water.

Gases diffuse fastest because particles have free translational motion, large empty spaces and continuous collisions.`},{id:"14.10",q:"Why is dew formed in early hours of morning?",a:`Dew is formed by condensation.

At night temperature falls and air becomes cold. When air cools to dew point, water vapours in air lose kinetic energy.

They change into tiny liquid drops and collect on cold surfaces like leaves and grass. This is dew.

If temperature goes below 0°C, vapours directly change into solid ice by deposition and frost is formed.`}],Em=[{id:"C-14.1",q:"Differentiate evaporation and boiling (detailed).",a:`EVAPORATION:
1) Surface phenomenon - occurs only at surface of liquid.
2) Slow process, happens at all temperatures.
3) No bubbles are formed.
4) It causes cooling because fast molecules take kinetic energy from surroundings.
5) Depends on surface area, temperature, humidity and wind.
6) Example: water evaporates from a pond at 25°C.

BOILING:
1) Bulk phenomenon - occurs throughout the liquid.
2) Fast process with bubbles inside liquid.
3) Occurs only at a fixed boiling point when vapour pressure = external pressure.
4) Temperature remains constant during boiling. All heat is used as latent heat.
5) Needs continuous heat from outside.
6) Example: water boils at 100°C at sea level in Karachi.`},{id:"C-14.2",q:"Describe how boiling is related to external pressure.",a:`Boiling point is the temperature when vapour pressure of liquid becomes equal to external pressure. This is the main rule from book.

When external pressure increases, vapour pressure needs more heat to become equal to it. So boiling point increases. Example: pressure cooker has pressure about 2 atm, water boils at about 120°C. Food cooks faster because temperature is higher.

When external pressure decreases, boiling point decreases. Example: In Murree hills atmospheric pressure is low (about 0.9 atm), water boils at about 98°C. On Mount Everest it boils at about 71°C, so food takes longer to cook.

Effect on evaporation: When external pressure decreases, rate of evaporation increases because molecules escape more easily.`},{id:"C-14.3",q:"Why does evaporation not need input of energy from heater? Where does energy come?",a:`Evaporation does not need a heater. It happens on its own at any temperature because molecules have different kinetic energy.

Some molecules near surface have high kinetic energy, more than inter-particle forces. They escape into air. When they escape, average kinetic energy of remaining liquid becomes low, so liquid becomes cool.

To keep temperature, liquid takes heat from surroundings. The surroundings provide the latent heat of vaporization. That is why we feel cool when sweat evaporates and when we put ether or spirit on palm it feels very cold.`},{id:"C-14.4",q:"Why do heating and cooling curves adopt same path?",a:`Because phase changes are reversible physical changes. The energy changes are equal and opposite.

When we heat, we give energy. At melting (B-C) energy is used as latent heat of fusion to break inter-particle forces. At boiling (D-E) energy is used as latent heat of vaporization. Temperature stays constant.

When we cool, the reverse happens. At condensation (E-D) same latent heat of vaporization is released when forces form again. At freezing (C-B) same latent heat of fusion is released.

So melting point is same as freezing point (0°C for water) and boiling point is same as condensation point (100°C). Therefore cooling curve F-E-D-C-B-A is exact reverse of heating curve A-B-C-D-E-F, with same flat portions.`},{id:"C-14.5",q:"Why does ice melt when pressure is exerted on it?",a:`Ice has a special property. When water freezes to ice, it expands. So volume of ice is more than volume of water.

According to Le Chatelier's principle, when pressure is increased, system moves to side with smaller volume. So high pressure favours liquid water, not ice.

That means increasing pressure lowers melting point of ice. When we press ice like with skate blade, ice melts into a thin water layer. This water works as lubricant and skate moves easily.

When pressure is removed, water freezes again. This refreezing is called regelation. It is book concept of anomalous expansion of water.`},{id:"C-14.6",q:"Why do phase changes occur?",a:`Phase changes occur due to competition between kinetic energy of particles and inter-particle attractive forces. This is main idea of kinetic particle theory from book.

On heating, particles get more kinetic energy. When kinetic energy becomes greater than attractive forces, solid changes to liquid and liquid to gas. Heat given is used as latent heat to overcome forces, not to raise temperature during change.

On cooling, particles lose kinetic energy. Attractive forces become stronger than kinetic energy. So gas changes to liquid by condensation and liquid to solid by freezing. Latent heat is released.

So temperature and pressure control phase changes. Melting, boiling, freezing, condensation, sublimation and deposition all happen due to change in balance between kinetic energy and forces.`}],zm=[{id:"D-14.1",q:"Explain difference in rates of diffusion of two gases based on kinetic theory.",a:`Kinetic particle theory says all gases at same temperature have same average kinetic energy. KE = 1/2 m v². So if mass m is small, velocity v will be high to keep same KE.

Therefore lighter gases move faster and diffuse faster. Heavier gases move slower and diffuse slower. This is Graham's Law: rate of diffusion ∝ 1/√M (M is molecular mass).

Book Activity 14.2: Glass tube 100 cm long. Cotton with conc. HCl (M=36.5) at one end and conc. NH3 (M=17) at other end. Both vapours diffuse and meet inside. White ring of NH4Cl forms at 59.5 cm from NH3 side and only 40.5 cm from HCl side. This proves NH3 travelled more distance, so it diffuses faster because it is lighter.

Similarly H2 (M=2) diffuses 4 times faster than O2 (M=32). Factors: Temperature - on increasing T, kinetic energy increases, collisions increase, diffusion becomes faster. Molecular mass - lighter gas diffuses faster.`},{id:"D-14.2",q:"How is sublimation helpful in printing and air fresheners?",a:`(a) Solid Air Fresheners: Air freshener block contains scented solid that sublimes at room temperature. Solid slowly changes into fragrant vapours without melting.

These vapours spread by diffusion and mix in air of room or washroom. They mask bad odours and give pleasant smell. Because sublimation is slow and controlled, one block works for many weeks. There is no liquid to spill. This is direct use of sublimation and diffusion.

(b) Sublimation Printing (Dye Sublimation / 3D Printing): First design is printed on special transfer paper with sublimation inks. Then this paper is placed on fabric (polyester), ceramic mug, wood or metal sheet that has polymer coating.

It is pressed in heat press at 180-200°C with pressure. At high temperature ink sublimes - solid ink becomes gas. This gas goes into pores of material and then becomes solid again inside fibres. The colour becomes permanent part of material. It does not fade, crack or wash away. Used for t-shirts, mugs, phone covers, sportswear. Advantages: high resolution, full colours, durable prints.`},{id:"D-14.3",q:"Draw heating curve for physical changes of water and explain.",a:`Heating Curve has 5 parts A-B-C-D-E-F (book page 10 figure):

A-B: Solid ice heating. Ice at -10°C heated to 0°C. Particles get kinetic energy, vibrate faster, temperature rises steeply.

B-C: Melting at 0°C. Flat line. Temperature stays constant. Heat given is used as latent heat of fusion (80 cal/g) to break inter-particle forces between ice molecules. Solid and liquid both exist together.

C-D: Liquid water heating. Water from 0°C to 100°C. Kinetic energy increases, temperature rises again.

D-E: Boiling at 100°C. Flat line. Temperature constant. Heat is used as latent heat of vaporization (540 cal/g) to overcome forces and change liquid to vapours. Liquid and vapours coexist.

E-F: Steam heating above 100°C. Vapour particles get more kinetic energy, temperature rises again.

Cooling curve F-E-D-C-B-A is exact reverse. E-D is condensation releasing latent heat, C-B is freezing releasing latent heat. Internal energy keeps increasing during heating even when temperature is flat, because potential energy increases when forces break.`}],Tm=[{id:"14.1",q:"Q14.1: What type of motion in gas? Is KE same in solid/liquid/gas?",a:`In gases particles have mainly translational motion, they move freely in straight lines, collide with each other and with walls. They also have rotational and vibrational motion but translational is most important for pressure and diffusion.

At same temperature, average translational kinetic energy is same for all gases. But total kinetic energy is different because in solids particles only vibrate, in liquids they vibrate and slide, in gases they have all types of motion. So energy order is Solid < Liquid < Gas.`},{id:"14.2",q:"Why water vapour at 100°C causes more severe burn than liquid water at 100°C? Why cotton comfortable in summer?",a:`Steam at 100°C has extra hidden heat - latent heat of vaporization (540 cal/g). When steam touches skin, it condenses to water and releases this large heat to skin. So steam gives both 100°C heat plus extra latent heat. That causes more severe burn than liquid water at same temperature.

Cotton is comfortable in summer because it is porous. It absorbs sweat from body. Sweat evaporates from cotton surface, taking kinetic energy and causing cooling. Air can pass through cotton. Synthetic clothes trap heat and do not absorb sweat, so feel hot.`},{id:"14.3",q:"Does temp change during evaporation? Does ice sublime? Give examples.",a:`During evaporation temperature of remaining liquid may fall slightly because high kinetic energy molecules escape. But surroundings provide heat, so temperature of liquid may stay almost same, while surroundings become cool.

Yes, ice can sublime. In very dry and cold winds, snow or ice directly changes into water vapours without melting. Example: snow disappears from mountains without becoming water.

Sublimation examples: naphthalene balls, dry ice (solid CO2), iodine crystals, camphor. Deposition examples: frost on window in winter, snowflake formation in clouds (vapour directly to ice), iodine vapours forming crystals on cold lid.`},{id:"14.4",q:"How gas exerts pressure? What happens to volume when temp decreased at constant P?",a:`Gas exerts pressure by continuous collisions of particles with walls of container. Each collision changes momentum of particle and creates a small force. Sum of all forces per unit area is pressure. This is kinetic theory explanation from book.

When temperature is decreased at constant pressure, volume decreases. This is Charles' Law: V ∝ T (Kelvin). On cooling, particles lose kinetic energy, move slower, need less space. So piston comes down and volume becomes smaller.`},{id:"14.5",q:"NO2 (46), SO2 (64), H2S (34) - which diffuses fastest? Why ammonia faster than HCl?",a:`Diffusion depends on mass. Lighter gas diffuses faster by Graham's Law: rate ∝ 1/√M.
