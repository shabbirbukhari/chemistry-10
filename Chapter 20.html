v2",key:"tus03m"}],["path",{d:"M12 20v2",key:"1lh1kg"}],["path",{d:"m4.93 4.93 1.41 1.41",key:"149t6j"}],["path",{d:"m17.66 17.66 1.41 1.41",key:"ptbguv"}],["path",{d:"M2 12h2",key:"1t8f8n"}],["path",{d:"M20 12h2",key:"1q8mjw"}],["path",{d:"m6.34 17.66-1.41 1.41",key:"1m8zz5"}],["path",{d:"m19.07 4.93-1.41 1.41",key:"1shlcs"}]]);var gr=X("Waves",[["path",{d:"M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1",key:"knzxuh"}],["path",{d:"M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1",key:"2jd2cc"}],["path",{d:"M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1",key:"rd2r6e"}]]);var bc=He(gt(),1),Om=Symbol.for("react.element");var Dm=Object.prototype.hasOwnProperty,Lm=bc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Mm={key:!0,ref:!0,__self:!0,__source:!0};function jc(e,t,n){var r,l={},i=null,o=null;n!==void 0&&(i=""+n),t.key!==void 0&&(i=""+t.key),t.ref!==void 0&&(o=t.ref);for(r in t)Dm.call(t,r)&&!Mm.hasOwnProperty(r)&&(l[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)l[r]===void 0&&(l[r]=t[r]);return{$$typeof:Om,type:e,key:i,ref:o,props:l,_owner:Lm.current}}var E=jc,P=jc;var Fm=["Investigate chemical tests for presence of water using anhydrous copper(II) sulphate","Explain how to test purity of water using melting point and boiling point","Distinguish between distilled water and tap water with applications in practical chemistry","State water from natural sources may contain useful and harmful substances: Dissolved oxygen, metal compounds, plastics, sewage, harmful microbes, nitrates from fertilizers, phosphates from fertilizers & detergents","Recognize some naturally occurring substances are potentially harmful: some metal compounds toxic, some plastics harm aquatic life, sewage contains harmful microbes causing disease, nitrates & phosphates lead to deoxygenation damaging aquatic life (details of eutrophication not required)","Explain treatment of domestic water supply: sedimentation & filtration to remove solids, use of carbon to remove tastes & odours, chlorination to kill microbes","Describe various water-borne diseases and steps taken to avoid them","Identify negative effects of water pollutants on life and ways to avoid them","Explain water scarcity is an important issue in Pakistan and ways it can be resolved","State urea, ammonium salts and nitrates are used as fertilizers","Explain use of NPK fertilizers to provide elements nitrogen, phosphorus, potassium for improved plant growth"],Im=[{id:1,title:"1. Test for Water – Anhydrous Copper(II) Sulphate",points:["Water is essential for all life. Identifying presence of water is important for determining purity and analyzing reactions.","Hydrated copper(II) sulphate is CuSO4.5H2O and it is blue. When heated it loses water and becomes anhydrous copper(II) sulphate which is white.","Test: Put a drop of water on white anhydrous CuSO4 – it turns from white to blue.","Reaction: CuSO4 (white) + 5H2O → CuSO4.5H2O (blue)","This is a very sensitive test – it can detect even a very small amount of water.","Important in food and pharmaceutical industries where presence of water can affect product quality and safety."]},{id:2,title:"2. Purity of Water – Boiling Point & Melting Point",points:["Pure water boils at 100°C and freezes/melts at 0°C at STP (standard temperature and pressure).","Impurities change these constants.","Boiling point test: At STP, if sample boils at 100°C it is pure. Presence of impurities slightly increases boiling point.","Melting point test: Cool sample until it freezes, then observe temperature when ice begins to melt. If it melts at 0°C it is pure. If melting point is below 0°C, impurities are present.","Conclusion: Impurities raise boiling point but lower melting point.","Both constants are specific only at standard conditions – at high altitudes where pressure is lower, values change."]},{id:3,title:"3. Distilled Water vs Tap Water",points:["Tap Water: Supplied to homes, shops, offices from rivers, lakes, ponds and underground sources. Contains minerals and salts like calcium and magnesium depending on source. Contains chlorine and fluoride added during treatment. Conductor of electricity due to free ions from dissolved minerals. pH range 6.5 to 8.5.","Distilled Water: Obtained by distillation – heating water to get steam and condensing steam back to liquid. This effectively removes all dissolved minerals, microorganisms and contaminants, leaving only pure water.","Distilled water contains only water molecules without bacteria, ions, gases or contaminants. pH = 7. Safe to drink but may not have necessary minerals needed by body. Bad conductor of electricity due to absence of ions.","Uses: Ideal for laboratories, medical procedures, pharmaceutical industry – ensures accurate scientific measurements, sterilization of medical equipment and prevents corrosion.","Why tap conducts and distilled does not? Tap has ions and minerals which conduct electricity, distilled has no ions."]},{id:4,title:"4. Substances in Natural Water",points:["Useful Substance: Dissolved Oxygen – enters natural water from atmosphere through diffusion and also produced by aquatic plants and algae during photosynthesis. Aquatic organisms like fish use this oxygen to breathe and survive. Health and diversity of ecosystem directly depends on amount of dissolved oxygen.","Harmful – Microbes: Bacteria, viruses, parasites enter through human and animal wastes, landfills, agricultural runoff, industrial wastewater, sewage and faulty septic tanks. Cause infectious diseases like dysentery, typhoid, hepatitis, cholera.","Harmful – Heavy Metals: Lead, mercury, cadmium, chromium compounds enter through wastewater from factories, mining operations, fertilizers and pesticides. Contaminate ground and surface water. Damage vital organs like liver and kidney, cause neurological problems. Arsenic and cadmium increase risk of cancers.","Harmful – Plastics: Very small particles called microplastics present in tap and bottled water. Enter through wastewater, rainwater carries plastic debris, degradation of plastic waste. Found in human organs, lungs, blood and disturb immune and reproductive systems. Also harm aquatic life.","Harmful – Nitrates and Phosphates: Enter natural waters from weathering of rocks and human sources like agriculture fertilizers, detergents, industrial wastewater. Essential nutrients in small amount but excess causes eutrophication. Eutrophication: excess nitrogen and phosphorus cause algae and aquatic plants to grow excessively, overgrowth of algae decreases dissolved oxygen level, harmful to aquatic life and disrupts entire ecosystem."]},{id:5,title:"5. Treatment of Domestic Water Supply",points:["Three types of impurities mostly present: dissolved impurities, suspended impurities and microorganisms.","(i) Sedimentation: Removes insoluble impurities of bigger size like soil, pieces of plants, organic matter, sand. Water pumped into sedimentation tanks where water is allowed to stand for few hours. Suspended particles settle down at bottom due to gravity forming sludge. Cleaner water from top is taken to next stage. Scum at top also removed.","(ii) Filtration: Removes suspended particles of smaller size which are not removed by sedimentation. Water is allowed to trickle through layer of sand and gravel. Filters trap solid particles.","(iii) Chlorination: Water must be sterilized before human use. All harmful bacteria and microbes must be killed. Small amount of liquid chlorine is added which has power to kill all germs.","(iv) Removal of tastes and odours: Water is passed through powdered activated carbon (charcoal). Activated carbon removes wide range of organic compounds responsible for taste and odour through absorption. Odour can also be removed by exposing water to air – process called aeration."]},{id:6,title:"6. Effects of Pollutants & Water-borne Diseases",points:["Water pollution affects human health, ecosystems, aquatic organisms and industries dependent on good water quality.","Control of negative effects: 1) Sewage and industrial wastewater should be treated before discharged into water bodies. 2) Plastics must be reused and recycled to minimize production. 3) Chemical cleaners, fats, oils, grease never thrown down drain. 4) Minimize use of pesticides and fertilizers in agriculture. 5) Make general public aware of harmful effects through public campaigns. 6) Implement and enforce laws for strict control of all types of water pollution.","WHO estimated 80% of sickness and diseases in world caused by polluted water and lack of sanitation. Diseases include cholera, typhoid, malaria, nausea, leprosy. Nearly 500 million suffer water-borne diseases every year.","Trachoma: Disease often causes blindness, particularly prevalent in babies and children in developing countries.","Liver diseases like viral hepatitis also caused by drinking contaminated water.","Prevention: 1) Drink clean water after removing impurities and boiling to kill germs. 2) Practice hygiene – keeping body especially hands clean and ensure proper sanitation facilities available."]},{id:7,title:"7. Water Scarcity in Pakistan",points:["World divided into different regions depending on annual rainfall. Pakistan is included in semi-arid region which receives low rainfall annually.","Northern Pakistan including Punjab generally receives rainfall 250-600 mm per year mostly in monsoon season. Southern Pakistan precipitation is scarce below 200 mm per year.","Pakistan at present facing severe water scarcity crisis due to: less rainfall, growth of population, flood irrigation, climate change, depleting aquifers, poor water management.","If current situation continues, Pakistan could face very serious challenges.","Solutions: 1) Collecting rain water especially in monsoon season and constructing water reservoirs and other water storage facilities. 2) Using better crop irrigation techniques (drip irrigation instead of flood irrigation). 3) Taking appropriate measures to face effects of climate change. 4) Effective management of water resources. 5) Conserve water at home – avoid wastage."]},{id:8,title:"8. Elements Essential for Plant Growth & Fertilizers",points:["Micro-nutrients (trace elements): Required in very small amount – boron, copper, iron, manganese, zinc, molybdenum, chlorine. Minute amounts needed for healthy growth, dangerous if too much added (poisonous in larger quantities). Generally required 6 grams to 200 grams per acre.","Macro-nutrients: Required in large amount – nitrogen, phosphorus, potassium, calcium, magnesium, sulphur, carbon, hydrogen, oxygen. Generally required 5 Kg to 200 Kg per acre.","Fertilizers: Substances added to soil to make up deficiency of essential elements like N, P, K required for proper growth of plants. Enhance natural fertility of soil and provide chemical elements taken up from soil by previous crops.","Every compound containing desired elements cannot be a fertilizer. Desired elements should be present in water soluble form readily available to plants. Compound should be stable in soil as well as storage – should not absorb moisture or set to hard stony material. Above all should be cheap to manufacture.","Essential qualities of good fertilizer: (i) Nutrient elements must be readily available to plants. (ii) Must be fairly soluble in water and thoroughly mixes with soil. (iii) Should not be injurious to plants. (iv) Should be inexpensive. (v) Must be stable and available for longer time for growing plants. (vi) Should not alter pH of soil. (vii) By rain or water should be converted to form which plant can absorb easily.","Types: (i) Nitrogenous fertilizers (ii) Phosphatic fertilizers (iii) Potassium fertilizers.","Nitrogenous: Supply nitrogen, required in early stage for growth of stem and leaves, main constituent of proteins, imparts green colour to leaves, enhances yield and quality. Examples: ammonium sulphate, calcium cyanamide, ammonia, ammonium nitrate, ammonium phosphate, ammonium chloride, urea.","Urea: High quality nitrogenous fertilizer contains about 46% nitrogen – most concentrated solid nitrogen fertilizer, most widely used nitrogen fertilizer in Pakistan.","Ammonium nitrate: Useful for many crops except paddy rice because microbial bacteria in flooded fields decompose it to nitrogen gas. Also used in combination with limestone due to hygroscopic nature.","Phosphatic: Provide phosphorus, required to stimulate early growth, accelerate seed and fruit formation in later stages, increases resistance to diseases. Two most important water soluble fertilizers: super phosphate / calcium super phosphate Ca(H2PO4)2 and triple phosphate / diammonium phosphate (NH4)2HPO4.","Potassium: Provide potassium required for formation of starch, sugar, fibrous material, increase resistance to diseases, make plants strong helping healthy root development, help ripening of seeds and fruits, cereals especially useful for tobacco, coffee, potato, corn. Examples: potassium chloride, potassium sulphate, potassium nitrate.","Biofertilizers: Environment friendly, provide soil essential nutrients as well as microbes required for growth, improve soil health and structure, increase biodiversity, reduce need for harmful chemicals, prevent soil degradation."]}],ed=[{q:"What is pH of distilled water?",options:["6.0","6.5","7","8.5"],answer:2,explain:"Distilled water is pure with only water molecules, pH is exactly 7 (neutral). Tap water pH is 6.5-8.5."},{q:"Unpleasant odours in domestic water supply are removed by treating with:",options:["Chlorine","Activated charcoal / carbon","Sand filter","Sedimentation"],answer:1,explain:"Activated carbon removes organic compounds responsible for taste and odour through absorption. Aeration also helps."},{q:"Main source of harmful microbes in natural water is:",options:["Human and animal wastes","Dissolved oxygen","Calcium minerals","Rain"],answer:0,explain:"Bacteria, viruses, parasites enter through human and animal wastes, landfills, agricultural runoff, faulty septic tanks."},{q:"Which gases are dissolved in natural water through diffusion from atmosphere?",options:["O2 and CO2","N2 and H2","Cl2 and NH3","SO2 and NO2"],answer:0,explain:"Oxygen enters natural water from atmosphere through diffusion and from photosynthesis of aquatic plants. CO2 also dissolves."},{q:"Which fertilizer is harmful to paddy rice crop?",options:["Urea","Ammonium nitrate","Potassium sulphate","Super phosphate"],answer:1,explain:"Ammonium nitrate is not useful for paddy rice because microbial bacteria in flooded fields decompose it to nitrogen gas."},{q:"Fertilizers which increase resistance of plants towards diseases and make strong healthy root development are:",options:["Nitrogenous fertilizers","Phosphatic fertilizers","Potassium fertilizers","All of these"],answer:2,explain:"Potassium fertilizers help formation of starch, sugar, fibrous material, increase resistance to diseases and help healthy root development and ripening."}],Hm=[{q:"20.1 Name two methods to check purity of water?",a:"Two methods: (1) Boiling point test – Pure water boils at 100°C at STP. If boils at 100°C it is pure, impurities increase boiling point. (2) Melting point test – Pure ice melts at 0°C. If melting point is below 0°C impurities present. Also chemical test – anhydrous copper(II) sulphate white turns blue with water, very sensitive test for presence of water."},{q:"20.2 What is main difference between tap water and distilled water?",a:"Tap water contains minerals and salts like calcium, magnesium and ions of chlorine, fluoride. It is conductor of electricity due to ions. pH 6.5 to 8.5. Supplied from rivers, lakes. Distilled water is pure water obtained by distillation (heating to steam and condensing). Contains only water molecules, no minerals, no bacteria, no ions. Bad conductor of electricity. pH 7. Used in labs, medical procedures, pharmaceutical industry for accurate measurements and sterilization."},{q:"20.3 How is water distilled in laboratory?",a:"In laboratory, water is distilled by heating water to get steam (water vapours). Then steam is cooled and condensed back to liquid in condenser. This process effectively removes all dissolved minerals, microorganisms and contaminants leaving only pure water."},{q:"20.4 Name useful and harmful substances present in natural water?",a:"Useful: Dissolved oxygen – enters through diffusion and photosynthesis, used by fish and aquatic organisms to breathe. Harmful: (i) Metal compounds – lead, mercury, cadmium, chromium – toxic, damage liver, kidney. (ii) Plastics – microplastics present in tap and bottled water, disturb immune and reproductive systems, harm aquatic life. (iii) Sewage – contains harmful microbes causing dysentery, typhoid, hepatitis, cholera. (iv) Nitrates and phosphates from fertilizers and detergents – cause eutrophication, decrease dissolved oxygen."},{q:"20.5 How can harmful bacteria and microbes be removed from water?",a:"Harmful bacteria and microbes are removed by chlorination. Small amount of liquid chlorine is added to water which has power to kill all germs. Water must be sterilized before human use. Also boiling water kills germs."},{q:"20.6 What is difference between sedimentation and filtration?",a:"Sedimentation: Removes insoluble impurities of bigger size like soil, sand, pieces of plants. Water is pumped into sedimentation tanks and allowed to stand for few hours. Particles settle down due to gravity forming sludge at bottom. Cleaner water from top is taken to next stage. Filtration: Removes suspended particles of smaller size which are not removed by sedimentation. Water is allowed to trickle through layer of sand and gravel. Filters trap solid particles."},{q:"20.7 Name three water-borne diseases?",a:"Three water-borne diseases are: (1) Cholera (2) Typhoid (3) Hepatitis (viral hepatitis). Other examples: dysentery, malaria, nausea, leprosy, trachoma. WHO says 80% sickness caused by polluted water."},{q:"20.8 Why are fertilizers containing nitrogen added to soil?",a:"Nitrogen is required in early stage of plant growth for development of stem and leaves. Nitrogen is main constituent of proteins, imparts green colour to leaves and enhances yield and quality of plants. When soil is deficient in nitrogen, nitrogenous fertilizers like urea are added to make up deficiency."},{q:"20.9 What is trachoma disease?",a:"Trachoma is a water-borne disease which often causes blindness. It is particularly prevalent in babies and children in developing countries. It is caused by polluted water and lack of sanitation."}],Wm=[{q:"20.1 (CRQ) Describe negative effects of using plastics in everyday life?",a:"Plastics cause many negative effects: Very small particles called microplastics are present in tap and bottled water. Tiny particles enter through wastewater, rainwater carries plastic debris and degradation of plastic waste. These microplastics are found in human organs, lungs and blood. They disturb immune and reproductive systems of humans. Plastics also harm aquatic life – plastics harm aquatic organisms and damage ecosystems. Plastics must be reused and recycled to minimize production and pollution."},{q:"20.2 (CRQ) Explain one method to remove dissolved impurities from water?",a:"Method to remove dissolved impurities is distillation. Distillation removes all dissolved minerals, ions and contaminants. Process: Water is heated to get steam. All dissolved minerals remain behind because they do not evaporate. Then steam is condensed back to liquid in condenser. The condensed water is pure distilled water containing only water molecules. This water has no bacteria, no ions, no gases. Sedimentation and filtration only remove suspended impurities, not dissolved. Distillation is best for dissolved impurities. Also activated carbon can remove dissolved organic compounds causing taste and odour through absorption."},{q:"20.3 (CRQ) Why is urea regarded as good nitrogenous fertilizer?",a:"Urea is regarded as good nitrogenous fertilizer because: It contains about 46% nitrogen – it is the most concentrated solid nitrogen fertilizer. It is most widely used nitrogen fertilizer in Pakistan. Qualities of good fertilizer present in urea: (i) Nutrient nitrogen is readily available to plants. (ii) Fairly soluble in water and thoroughly mixes with soil. (iii) Not injurious to plants. (iv) Inexpensive and cheap to manufacture. (v) Stable and available for longer time. (vi) Does not alter pH of soil much. (vii) By rain or water converted to form which plant can absorb easily."},{q:"20.4 (CRQ) Why is Pakistan facing severe shortage of water?",a:"Pakistan is facing severe water scarcity because: Pakistan is in semi-arid region which receives low rainfall. Northern Pakistan including Punjab receives only 250-600 mm per year mostly in monsoon. Southern Pakistan receives below 200 mm per year. Reasons for scarcity: (1) Less rainfall due to climate (2) Growth of population – more demand (3) Flood irrigation – wastes water (4) Climate change (5) Depleting aquifers – underground water decreasing (6) Poor water management. If current situation continues Pakistan could face very serious challenges. Solutions: collecting rain water in monsoon, constructing reservoirs, using better irrigation techniques like drip irrigation, taking measures for climate change, effective management of water resources."},{q:"20.1 (Descriptive) How is domestic water supply made fit for drinking? Describe steps.",a:"Domestic water supply is made fit for drinking by four main steps: (1) Sedimentation: Water from rivers/lakes pumped into sedimentation tanks. Allowed to stand few hours. Insoluble bigger impurities like soil, sand, plant pieces settle down due to gravity forming sludge at bottom. Scum at top removed. Cleaner water from top taken to next stage. (2) Filtration: Removes smaller suspended particles not removed by sedimentation. Water allowed to trickle through layers of sand and gravel. Filters trap solid particles. (3) Chlorination: Water must be sterilized to kill harmful bacteria and microbes. Small amount of liquid chlorine added which kills all germs. (4) Removal of tastes and odours: Water passed through powdered activated carbon (charcoal) which removes organic compounds responsible for taste and odour through absorption. Odour can also be removed by aeration – exposing water to air. After these steps water becomes clean and safe for drinking."},{q:"20.2 (Descriptive) What measures should be taken to avoid water-borne diseases?",a:"Water-borne diseases include cholera, typhoid, hepatitis, dysentery, malaria, trachoma. WHO says 80% sickness caused by polluted water. Measures to avoid: (1) Drink clean water after removing impurities – boil water to kill germs, or use treated/filtered water. Do not drink contaminated water. (2) Practice hygiene – keep body especially hands clean. Wash hands before eating and after toilet. (3) Ensure proper sanitation facilities are available. Sewage should be treated before discharge. (4) Keep surroundings clean, avoid human and animal wastes entering water sources. (5) Public awareness campaigns about harmful effects of polluted water."},{q:"20.3 (Descriptive) What are fertilizers? What are essential qualities of good fertilizer?",a:"Fertilizers are substances added to soil to make up deficiency of essential elements like nitrogen, phosphorus, potassium (NPK) required for proper growth of plants. They enhance natural fertility of soil and provide chemical elements taken up from soil by previous crops. Not every compound can be fertilizer – element must be in water soluble form readily available, compound should be stable and cheap. Essential qualities of good fertilizer: (i) Nutrient elements must be readily available to plants. (ii) Must be fairly soluble in water and thoroughly mixes with soil. (iii) Should not be injurious to plants. (iv) Should be inexpensive. (v) Must be stable and available for longer time for growing plants. (vi) Should not alter pH of soil. (vii) By rain or water should be converted to form which plant can absorb easily."},{q:"20.4 (Descriptive) What are main functions of nitrogenous, phosphatic and potassium fertilizers?",a:"Nitrogenous fertilizers: Supply nitrogen. Function – nitrogen required in early stage for growth and development of stem and leaves. Main constituent of proteins, imparts green colour to leaves, enhances yield and quality. Examples: urea (46% N), ammonium sulphate, ammonium nitrate. Phosphatic fertilizers: Provide phosphorus. Function – phosphorus required to stimulate early growth, accelerate seed and fruit formation in later stages, increases resistance to diseases. Examples: super phosphate Ca(H2PO4)2, diammonium phosphate (NH4)2HPO4. Potassium fertilizers: Provide potassium. Function – potassium required for formation of starch, sugar, fibrous material in plants, increase resistance to diseases, make plants strong helping healthy root development, help ripening of seeds and fruits, especially useful for tobacco, coffee, potato, corn. Examples: potassium chloride, potassium sulphate, potassium nitrate."},{q:"20.5 (Descriptive) How can negative effects of water pollutants be avoided?",a:"Water pollution affects human health, ecosystems, aquatic organisms and industries. To avoid negative effects: (1) Sewage and industrial wastewater should be treated before discharged into water bodies. (2) Plastics must be reused and recycled to minimize production and pollution. (3) Chemical cleaners, fats, oils, grease never thrown down drain. (4) Minimize use of pesticides and fertilizers in agriculture – use biofertilizers which are environment friendly. (5) General public should be made aware of harmful effects through public campaigns. (6) Implement and enforce laws for strict control of all types of water pollution. Also conserve water, collect rain water, use better irrigation techniques."}];function da(){let[e,t]=Mt.useState("syllabus"),[n,r]=Mt.useState(!1),[l,i]=Mt.useState({}),[o,a]=Mt.useState(!1),[u,d]=Mt.useState(0),[p,h]=Mt.useState(0),m=Object.entries(l).filter(([v,w])=>ed[Number(v)].answer===w).length;return E("div",{className:n?"dark":"",children:P("div",{className:"min-h-screen bg-[#fbf9f6] dark:bg-[#0f1210] text-zinc-800 dark:text-zinc-100 font-[Inter,system-ui] transition-colors",children:[E("style",{children:"@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');"}),P("header",{className:"sticky top-0 z-30 border-b border-zinc-200/80 dark:border-zinc-800 bg-white/90 dark:bg-[#161a18]/90 backdrop-blur",children:[P("div",{className:"mx-auto max-w-6xl px-4 sm:px-6 py-3 flex items-center justify-between",children:[P("div",{className:"flex items-center gap-3",children:[E("div",{className:"h-9 w-9 rounded-xl bg-[#0f5b4a] dark:bg-[#1a7a64] grid place-items-center text-white",children:E(pr,{size:18})}),P("div",{children:[P("h1",{className:"font-[Fraunces] text-[17px] sm:text-[19px] leading-none font-bold tracking-tight",children:["Chemistry X • Chapter 20 ",E("span",{className:"text-[#0f5b4a] dark:text-emerald-300",children:"Water"})]}),E("p",{className:"text-[11px] tracking-[0.18em] uppercase text-zinc-500 dark:text-zinc-400 font-medium",children:"PECTAA 2026 • Simple Final"})]})]}),E("div",{className:"flex items-center gap-2",children:E("button",{onClick:()=>r(!n),className:"h-9 w-9 grid place-items-center rounded-full border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:bg-zinc-50 transition","aria-label":"Toggle theme",children:n?E(vr,{size:16}):E(hr,{size:16})})})]}),E("div",{className:"mx-auto max-w-6xl px-2 sm:px-6 pb-2",children:E("div",{className:"flex gap-1.5 overflow-x-auto scrollbar-none p-1 bg-zinc-100 dark:bg-zinc-900 rounded-full w-fit max-w-full",children:
